  type: data
  description: |
    Fine-binned TreeCorr ξ_±(θ) for GLASS realisation `00001` on the
    1000-bin integration grid. No response correction and no leakage
    subtraction — these are Gaussian mocks.
  inputs:
  - glass_mock_catalogs
  - decision_values_script
  decisions:
  - mock_suite
  - integration_grid
