id: mock_xi_scan
version: '1.0'
name: GLASS mock fine-ξ scatter
description: |
  The campaign's expensive stage, one realisation per member: TreeCorr
  ξ_±(θ) on exactly the data's integration grid — geomspace 0.5'–300',
  1000 bins — for each of the 350 GLASS realisations, 60 M galaxies
  apiece. Ruled by Cail 2026-08-31: mock and data measurements must
  share range and binning, node for node. The earlier [0.5', 500'] grid
  capped at 300' left node placement mismatched. Both the COSEBI and
  the pure-E/B filters integrate over θ and need this grid, which the
  delivered suite does not ship — only 20-bin reporting vectors.

  A member is one mock's measurement and nothing else, which is what
  makes the fan-out worth its size: a realisation that fails or is
  re-run costs one member, not the suite. The gather is the artifact
  everything downstream actually wants — the realisation axis made
  explicit as a single stacked array.
tags:
- sweep
- generated
- glass
- mocks
inputs:
- id: glass_mock_catalogs
  from: ../glass_mock_catalogs
- id: decision_values_script
  from: ../decision_values_script
decisions:
  mock_suite:
    from: ../mock_suite
  integration_grid:
    from: ../integration_grid
