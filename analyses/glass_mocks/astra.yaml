      variant — ADOPTED (baseline) — bundled as
      `averaged_uniform_fixedop__data.npz` and
      `averaged_uniform_fixedop__mockmatched.npz`. The first is the twin of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      and also carries the data's own pure-mode vectors, which is what
      the variant's data PTE is computed from downstream; the second is
      the twin of
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      One output per variant rather than one looped output, so the four
      run in parallel on separate nodes. Per variant rather than shared,
      because the transform that propagates the draws *is* the thing
      under scan: the `dqags` quadrature error is noise per draw and
      inflates the propagated variance (ξ_-^B bin 0 by ×3.3, ξ_-^amb by
      ×17), so one shared covariance would compare each variant's data
      vector against another variant's error bars. Seeds are identical
      across variants (42 + chunk/batch id, same block sizes), so the
      variant-to-variant difference carries no Monte-Carlo noise of its
      own.

      **500 draws, not the fiducial 2000.** The scan compares variants
      against each other rather than reporting an absolute error bar,
      and 500 draws give ≈0.4% per-element noise against the 10–30%
      differences being resolved. At 2000 this variant alone would run
      four times as long. The paper's fiducial 2000-draw covariance is a
      separate artifact and is untouched. The Hartlap correction
      downstream is read from this bundle's provenance, so it tracks the
      draw count rather than the pipeline's 2000.

      Cost: the fixed-quadrature operator, a matvec per draw once the operator is assembled. Measured at 54 s per transform on 4 cores, so
      500 draws × 2 covariances is ≈60 core-hours, ≈2.5 h on 24.
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # The geometry override reaches each chain through the flag it already
      # carries: --geometry on run_pure_eb_semianalytic.sh (forwarded to
      # precompute_pure_eb_chunk) and --transform-averaged on the mock-matched
      # twin. Both are omitted for a variant running in its method's default
      # geometry, so those calls stay byte-for-byte the single-variant ones.
      # mc_samples is deliberately NOT a decision here: that decision names the
      # fiducial covariance's 2000, and the scan's 500 is a scan parameter.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant averaged_uniform_fixedop
        --n-samples 500 --seed 42
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_scan_covariance_averaged_npairs_fixedop
    type: data
    format: tar.gz
    description: |
      Both MC-propagated pure-mode covariances for the `averaged_npairs_fixedop`
      variant — the adopted selection since 2026-09-07 — bundled as
      `averaged_npairs_fixedop__data.npz` and
      `averaged_npairs_fixedop__mockmatched.npz`. The first is the twin of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      and also carries the data's own pure-mode vectors, which is what
      the variant's data PTE is computed from downstream; the second is
      the twin of
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      One output per variant rather than one looped output, so the four
      run in parallel on separate nodes. Per variant rather than shared,
      because the transform that propagates the draws *is* the thing
      under scan: the `dqags` quadrature error is noise per draw and
      inflates the propagated variance (ξ_-^B bin 0 by ×3.3, ξ_-^amb by
      ×17), so one shared covariance would compare each variant's data
      vector against another variant's error bars. Seeds are identical
      across variants (42 + chunk/batch id, same block sizes), so the
      variant-to-variant difference carries no Monte-Carlo noise of its
      own.

      **500 draws, not the fiducial 2000.** The scan compares variants
      against each other rather than reporting an absolute error bar,
      and 500 draws give ≈0.4% per-element noise against the 10–30%
      differences being resolved. At 2000 this variant alone would run
      four times as long. The paper's fiducial 2000-draw covariance is a
      separate artifact and is untouched. The Hartlap correction
      downstream is read from this bundle's provenance, so it tracks the
      draw count rather than the pipeline's 2000.

      Cost: the same operator and window under pair-count weights; the weighting changes the average, not the transform cost. Measured at 54 s per transform on 4 cores, so
      500 draws × 2 covariances is ≈60 core-hours, ≈2.5 h on 24.
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # The geometry override reaches each chain through the flag it already
      # carries: --geometry on run_pure_eb_semianalytic.sh (forwarded to
      # precompute_pure_eb_chunk) and --transform-averaged on the mock-matched
      # twin. Both are omitted for a variant running in its method's default
      # geometry, so those calls stay byte-for-byte the single-variant ones.
      # mc_samples is deliberately NOT a decision here: that decision names the
      # fiducial covariance's 2000, and the scan's 500 is a scan parameter.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant averaged_npairs_fixedop
        --n-samples 500 --seed 42
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: mock_pure_eb_modes_scan
    type: data
    format: npz
    description: |
      Pure-mode ξ_±^{E,B,amb} for every realisation under every variant,
      keyed `<variant>__<block>` — the scan's twin of
      [mock_pure_eb_modes](#outputs.mock_pure_eb_modes), through the same
      `compute_ensemble` call, so a variant that also exists as a
      universe selection is bit-identical to that universe's product.

      This is the artifact that makes the decisions measurable. The
      realisations carry no B power by construction, so the
      across-realisation mean of ξ_±^B is the variant's own
      rectification bias and its scatter is the variant's noise —
      neither of which a single data vector can separate.
    inputs: [mock_xi_fine, mock_xi_reporting, pure_eb_scan_variants_script]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_pure_eb_modes_scan.py
        --fine-ensemble {inputs.mock_xi_fine}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --out-file {output}
      # 19 + 209 + 0 + 0 + 54 + 54 + 54 = 390 s of 4-core wall per realisation
      # across the seven variants (both pointwise operator corners are matvecs
      # and cost nothing),
      # so 200 realisations is ~75 core-hours, ~3.1 h on 24.
      # 12h is 4x margin for a stage whose cost is dominated by the one
      # adaptive-quadrature variant.
      resources: { cpus: 24, memory: "32GB" }

  - id: pure_eb_scan_statistics
    type: metric
    format: json
    description: |
      The scan's one computed table, and the artifact the re-decision is
      read from. Per variant:

      - **Mock bias** — per-realisation χ²/PTE for ξ_+^B, ξ_-^B and
        ξ_tot^B against the selected reference covariance, and the
        χ²/PTE of the *mean* vector against σ_emp/√N. At N ≈ 200 the
        error on the mean is ≈ σ/14, so a rectification bias well below
        one data error bar is still resolvable.
      - **Calibration** — σ_emp/σ_ana per reporting bin, and the KS
        p-value of the across-realisation PTE distribution against
        uniform. A variant can be unbiased and still mis-calibrated if
        its propagated covariance has the wrong amplitude.
      - **The data** — the real catalogue's PTE for the same three
        statistics at the adopted 12'–83' window, computed through that
        variant's own covariance by the same `calculate_pure_eb_ptes`
        call the paper's single-variant output makes.

      Reuses
      [mock_campaign_analysis](#outputs.mock_per_mock_statistics)'s
      covariance slicing and scale-cut constants rather than restating
      them, and reuses `calculate_pure_eb_ptes` for the data side; this
      stage adds the variant loop and one correction.

      **The Hartlap factor is 500, not the pipeline's 2000.** The scan's
      covariances are 500-draw, so the correction on their inverse has
      to match. The count is read out of each bundle's own provenance
      rather than restated here, so it tracks whatever the covariance
      stage actually ran and cannot silently drift — which it would have
      done had this stage kept the pipeline's `HARTLAP_N_PURE`.
    inputs: [pure_eb_scan_covariance_pointwise_dqags, pure_eb_scan_covariance_pointwise_fixedop, pure_eb_scan_covariance_pointwise_fixedop_reporting, pure_eb_scan_covariance_averaged_uniform_dqags, pure_eb_scan_covariance_averaged_uniform_fixedop, pure_eb_scan_covariance_averaged_npairs_fixedop, mock_pure_eb_modes_scan, cov_integration_g, xi_reporting, xi_integration, pure_eb_scan_variants_script, scale_cuts_script]
    decisions: [reference_covariance, scale_cut_convention, mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/workflow/scripts/pure_eb_scan_statistics.py
        --covariance-bundle {inputs.pure_eb_scan_covariance_pointwise_dqags} {inputs.pure_eb_scan_covariance_pointwise_fixedop} {inputs.pure_eb_scan_covariance_pointwise_fixedop_reporting} {inputs.pure_eb_scan_covariance_averaged_uniform_dqags} {inputs.pure_eb_scan_covariance_averaged_uniform_fixedop} {inputs.pure_eb_scan_covariance_averaged_npairs_fixedop}
        --mock-modes {inputs.mock_pure_eb_modes_scan}
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --reference-covariance {decisions.reference_covariance}
        --scale-cut-convention {decisions.scale_cut_convention}
        --config src/papers/bmodes/config/config.yaml
        --npatch 1
        --out-file {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: pure_eb_decision_comparison_figure
    type: figure
    format: png
    description: |
      The scan as one paper figure: two rows over one column per
      variant. The top row is the across-realisation mean ξ_±^B in units
      of the analytic (data) σ with σ_emp/(σ_ana√N) error bars — the
      variant's rectification bias, on mocks that contain no B mode; the
      bottom row is σ_emp/σ_ana with the 1/√(2(N−1)) sampling error —
      whether its propagated covariance has the right amplitude. Each
      column is annotated with the DATA's PTE under that variant, so the
      mock verdict and the number the paper would report sit on the same
      axes. Adopted scale cuts shaded, adopted and submitted columns
      marked.

      The paper-format twin of
      [mock_campaign_figure](#outputs.mock_campaign_figure), sharing its
      style and row structure: A&A double-column width, the paper
      matplotlib style, no suptitle. A function of
      [pure_eb_scan_statistics](#outputs.pure_eb_scan_statistics) alone,
      so re-cutting it never re-runs a transform.
    inputs: [pure_eb_scan_statistics, pure_eb_decision_comparison_figure_script, plotting_utils_script, pure_eb_scan_variants_script]
    recipe:
      command: >
        python src/workflow/scripts/pure_eb_decision_comparison_figure.py
        --stats {inputs.pure_eb_scan_statistics}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: pure_eb_scan_scatter_figure
    type: figure
    format: png
    description: |
      What the ratio panels cannot show: how noisy each variant is.
      [pure_eb_decision_comparison_figure](#outputs.pure_eb_decision_comparison_figure)
      reads everything in units of the variant's own σ_ana, which answers
      "is it biased, is its covariance calibrated" and says nothing about
      "which variant would you rather measure with" — a variant can sit at
      mean/σ = 0.1 because its error bar is twice everyone else's. So this
      one plots the scatter itself: per variant and per reporting bin, the
      across-realisation standard deviation of the mock pure-B vector,
      times θ in arcmin so that seven curves flatten enough to share one
      pair of axes.

      Two panels, ξ_+^B and ξ_−^B, seven lines each in the data-viz
      categorical order with a dash pattern apiece — adopted heavy and
      solid, submitted dashed — over the adopted variant's analytic θσ in
      thin grey, so every variant's spread is read against the one error
      bar the paper quotes. The [12, 83]′ window is shaded. Units are
      arcmin, quoted in 1e-6. A function of the mock ensemble and one
      covariance bundle alone.
    inputs: [mock_pure_eb_modes_scan, pure_eb_scan_covariance_averaged_uniform_fixedop, pure_eb_scan_scatter_figure_script, pure_eb_scan_variants_script, mock_campaign_analysis_script, plotting_utils_script]
    recipe:
      command: >
        python src/workflow/scripts/pure_eb_scan_scatter_figure.py
        --mock-modes {inputs.mock_pure_eb_modes_scan}
        --covariance-bundle {inputs.pure_eb_scan_covariance_averaged_uniform_fixedop}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

