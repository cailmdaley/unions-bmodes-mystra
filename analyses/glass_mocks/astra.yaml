decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  pte_threshold:
    from: ../pte_threshold

  pure_eb_integration_method:
    from: ../pure_eb_integration_method

  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights

  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits

  mc_samples:
    from: ../mc_samples

  pure_eb_covariance_method:
    from: ../pure_eb_covariance_method

  reference_covariance:
    label: "Analytic covariance the mock scatter is compared against"
    tags: [glass, covariance]
    rationale: |
      Which analytic covariance the mocks' empirical scatter is held
      against. The realisations carry 17% more galaxies than the data
      ([mocks_are_over_constraining](#findings.mocks_are_over_constraining)),
      so against the data covariance they would measure that count
      mismatch rather than the covariance's accuracy. The campaign
      therefore tests the covariance *machinery*: the same code that
      builds the fiducial covariance, run at the mocks' own noise, held
      against scatter known by construction. Mock-matching is two
      rebuilds of the fiducial primitives:

      | statistic | mock-matched reference | traces to |
      |---|---|---|
      | COSEBIs | the ξ_± covariance transformed by `cosebis_covariance_from_xipm_covariance` | the CosmoCov run |
      | ξ_+^B, ξ_-^B, ξ_tot^B | [pure_cov_mockmatched](#outputs.pure_cov_mockmatched), the 2000-sample MC propagation | the CosmoCov run |
      | C_ℓ^BB | [cl_cov_mockmatched](#inputs.cl_cov_mockmatched), NaMaster iNKA on a mock catalogue | itself |

      Five of the six statistics trace to one artifact, the
      [CosmoCov ξ_± run at the mocks' noise](#inputs.cov_integration_mockmatched),
      transformed for COSEBIs and MC-propagated through the Schneider
      (2022) filters for the pure modes. C_ℓ^BB needs no density
      parameter: NaMaster reads the mock catalogue's weighted count map
      and noise bias directly.

      The CosmoCov rebuild changes only the count: it keeps the data's
      `area = 2894.03` deg² and sets `source_n_gal = 60 423 575 /
      2894.03 deg² = 5.793 arcmin⁻²`. Shot noise depends on n_gal × A,
      so the area convention cancels there, and f_sky enters the
      cosmic-variance term identically on both sides of the mock
      comparison. Mock and data occupy one footprint (data 2750.65 deg²,
      mock 2709.91 deg², overlap 2703.17 deg²), so the count ratio —
      51.65 M weight-effective data galaxies against 60 423 575 mock
      galaxies, σ_e agreeing to 0.2% (0.26757 vs 0.26822) — sets the
      noise difference: mock BB variance 0.726 of the data's from the
      machinery, 0.716 empirically
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)).

      The data covariance keeps the 2894.03 deg² footprint convention
      shared with Papers III and IV rather than the 2750.65 deg² the
      galaxies occupy, a choice worth about 5% of the sample-variance
      term and outside this campaign.

      `mockmatched` is the default. `fiducial` is a diagnostic: it is
      the only place mock scatter meets the data covariance, and the
      ratio between the two runs' σ ratios recovers the count ratio.
    default: mockmatched
    options:
      mockmatched:
        label: "Mock-matched"
        description: |
          The fiducial covariance machinery rerun at the mocks' own
          noise (the CosmoCov run, its MC propagation, and the
          mock-catalogue NaMaster covariance).
      fiducial:
        label: "Fiducial data covariance"
        description: |
          The fiducial v1.4.6.3 leak-corrected covariances at blind A,
          unmodified; diagnostic only, since it measures the
          galaxy-count difference rather than the covariance's
          accuracy.

  mock_suite:
    label: "GLASS realisation suite"
    tags: [glass]
    rationale: |
      Which suite of 350 GLASS lognormal realisations to validate on.
      The v1.4.6.3_v2 suite is generated on the fiducial catalog's
      footprint and backs every product here. The v1.4.6 suite is
      excluded: it sits on a 1600 deg² mask that is not the data's
      footprint and carries a third fewer galaxies than the catalog.
    default: v1_4_6_3_v2
    options:
      v1_4_6_3_v2:
        label: "v1.4.6.3_v2 suite"
        insights: [tessore23_glass_lognormal_mocks]
        description: |
          350 realisations of 60 423 575 unit-weight galaxies on the
          fiducial footprint, 17% more than the data's 51.65 M
          weight-effective galaxies; ships catalogues, 20-bin ξ_± and
          per-mock Cℓ, with a directly computed mock C_ℓ^BB covariance
          ([cl_cov_mockmatched](#inputs.cl_cov_mockmatched)). The
          [masked chain](#outputs.mock_xi_fine_masked) is declared on
          50 of its realisations and not yet run.
      v1_4_6:
        label: "v1.4.6 suite (submitted)"
        excluded: true
        excluded_reason: |
          35 078 729 galaxies per realisation on a 1600.33 deg² mask
          that is not the data's footprint (the generator's default
          6.0905 arcmin⁻² on a smaller sky). It is the suite the
          submitted mock description rests on; v2 sits far closer to
          the catalog's count.

prior_insights:

  paper_iv_inka_overestimates_variance:
    id: paper_iv_inka_overestimates_variance
    label: "Paper IV's iNKA covariance overestimates the small-scale variance"
    claim: |
      The Gaussian iNKA covariance adopted by UNIONS Paper IV
      (harmonic-space cosmology) gives larger small-scale
      uncertainties than either `OneCovariance` or the GLASS mocks —
      15% against the mocks, around 20% against `OneCovariance` — and
      Paper IV attributes the gap to iNKA accounting for a spatially
      varying galaxy number density, which breaks the stationary-noise
      assumption the other two estimates make.
    notes: |
      The same GLASS suite is on the other side of that comparison and
      is under-noised by a comparable factor; the two effects add (see
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining)).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev_main_text
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "However, the estimate computed from the Gaussian part of iNKA tends to overestimate the variance."
        location: { page: 6 }
      - id: ev_caption_15
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "There is a discrepancy of 15% between the NaMaster estimate and the one obtained from mocks."
        location: { page: 6 }
      - id: ev_appendix_20
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "the iNKA covariance used in this work overestimates by around 20% the uncertainty compared to what is obtained from OneCovariance and GLASS simulations"
        location: { page: 14 }
      - id: ev_mechanism
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "An underlying assumption in OneCovariance and GLASS mocks is that the noise is stationary. This is not true if the object density varies strongly across the sky."
        location: { page: 14 }


  tessore23_glass_lognormal_mocks:
    id: tessore23_glass_lognormal_mocks
    claim: |
      GLASS builds a light cone of matter and weak-lensing fields as
      nested shells, transforming Gaussian random fields (including
      lognormal) to essentially arbitrary precision, and reproduces
      the two-point statistics of clustering and weak lensing at the
      per-cent level. Its realisations are therefore an adequate
      systematics-free reference for B-mode estimator and covariance
      validation, but carry only lognormal non-Gaussianity.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2302.01942"
        quote:
          exact: "also introduces a new technique to generate transformations of Gaussian random fields (including lognormal) to essentially arbitrary precision"
        location:
          page: 1
      - id: ev2
        doi: "10.48550/arXiv.2302.01942"
        quote:
          exact: "readily produces simulated data sets with per cent-level accurate two-point statistics of galaxy clustering and weak lensing"
        location:
          page: 1
    scope: "Tessore et al. 2023, OJAp 6, 11 (abstract); the UNIONS suite itself is Paper III's."


findings:

  mock_xi_matches_input_theory_above_band_limit:
    id: mock_xi_matches_input_theory_above_band_limit
    label: "Mock ξ_± matches input theory above the band limit"
    claim: |
      Above ≈6′ the across-realisation mean ξ_± of the unmasked GLASS
      realisations reproduces the theory the suite was generated from
      to within a few per cent with no trend, so the mocks carry no
      ξ_± bias into the null tests. Below ≈6′ they fall away from the
      unbanded prediction, ξ_- most strongly, entirely because the
      maps are band-limited at ℓ_max = NSide = 4096; these scales lie
      outside the fiducial cut.
    notes: |
      350 realisations. Inside the 12′–83′ window |mean/theory − 1| ≤
      0.03 for both ξ_+ and ξ_-; bin by bin |mean − theory| ≤ 0.33
      σ_ana (ξ_+) and ≤ 0.46 σ_ana (ξ_-) against an error of the mean
      of ≈0.05 σ_ana, scattered in sign. That is the size of the
      band-limited transform's own ±2–3% ringing (2% of ξ_+ at 18′ is
      0.30 σ_ana), so it bounds a mock ξ_± bias at a third of an error
      bar rather than measuring one.

      Below ≈6′: ξ_- at 1.2′ is ~100 times smaller than the unbanded
      prediction, since ξ_-(1′) is built almost entirely from ℓ ~ 10⁴.
      Over the first six reporting bins the theory's band ratio (cut at
      ℓ = 4096) runs 0.006, 0.020, 0.071, 0.166, 0.40, 0.81, against a
      measured mock mean over unbanded theory of ≈0, 0.00, 0.089, 0.208,
      0.49, 0.86 — tracking across two orders of magnitude, with the
      mocks 10–20% above the sharp cut, as lognormal small-scale power
      and an imperfectly sharp band edge would give. This is why
      [mock_xi_input_theory](#outputs.mock_xi_input_theory) is an
      explicit band-limited sum: an FFTLog that extrapolates past the
      last multipole makes the same comparison look like a
      catastrophic small-scale failure. Any use of this suite below
      ≈6′, in ξ_- especially, measures the band limit.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats
      - id: ev2
        artifact: mock_xi_validation_figure

  mock_xi_scatter_falls_below_analytic_at_large_theta:
    id: mock_xi_scatter_falls_below_analytic_at_large_theta
    label: "Mock ξ_+ scatter falls below analytic σ above 100′"
    claim: |
      Against the
      [mock-matched reference covariance](#outputs.mock_xi_reporting_cov_mockmatched),
      the mocks' raw ξ_± scatter matches the analytic Gaussian σ inside
      the fiducial window, but above 100′ the ξ_+ scatter falls below
      it while ξ_- stays near unity. The deficit is neither a density
      nor a footprint effect, and reads as the realisations carrying
      less large-scale sample variance than the analytic covariance
      predicts — a reading of the residual, not an established
      mechanism.
    notes: |
      σ_emp/σ_ana inside 12′–83′: 0.94–1.03 (ξ_+), 0.99–1.12 (ξ_-).
      Against the *data* covariance the same ratios read 0.87–0.98 and
      0.87–0.97, the suite's galaxy excess
      ([mocks_are_over_constraining](#findings.mocks_are_over_constraining)),
      which is why mock validation must not use it. Above 96′ ξ_- sits
      at 0.98–1.07 and ξ_+ at 0.82–0.86.

      Not footprint geometry: the measured pair deficit at 221′ is 13%,
      but shape noise is only 5.7% of the ξ_+ variance there, so it
      moves σ by 0.4% (under 1% at every separation). ξ_+ above 100′
      draws on the lowest multipoles, where a lognormal shell
      construction on a single footprint is least trusted.

      The pair counts themselves fall away from the uniform-density,
      no-edge prediction: the implied galaxy count per bin is flat
      below ≈3′ and declines monotonically to 0.87 of it by 221′. That
      decline (not its absolute level, which floats with the area
      convention) is the footprint-edge effect the noise-only pure-mode
      statistics inherit at large θ; it is invisible in raw ξ_± for
      the reason above.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats

  mock_ptes_skew_low_by_ng_term:
    id: mock_ptes_skew_low_by_ng_term
    label: "Configuration-space PTEs skew mildly low; C_ℓ^BB PTEs are uniform"
    claim: |
      On the clean realizations the C_ℓ^BB PTEs are uniform, while the
      configuration-space PTEs skew mildly low because the analytic σ
      there is slightly smaller than the mock scatter, which raises χ²
      by the inverse square of their ratio. Calibrating the passing
      threshold p_thr on the same realizations partially absorbs this
      skew.
    notes: |
      350 GLASS v1.4.6.3_v2 realisations against the mock-matched
      reference covariance
      ([mock_campaign_evidence](#outputs.mock_campaign_evidence)).
      ⟨χ²⟩/ν: B_{n≤6} 1.105, B_{n≤20} 1.073, ξ_+^B 1.197, ξ_-^B
      1.131, ξ_tot^B 1.148, C_ℓ^BB 0.987 (the paper's 1.07–1.20 for
      configuration space). KS p-values for PTE uniformity: B_{n≤6}
      2.7×10⁻³, B_{n≤20} 9.2×10⁻⁵, ξ_+^B 2.4×10⁻⁹, ξ_-^B 1.4×10⁻⁴,
      ξ_tot^B 2.8×10⁻¹⁰, C_ℓ^BB 0.79.

      The configuration-space excess has the size of the non-Gaussian
      term the Gaussian covariance omits: on the 20-bin reporting grid
      the (G+NG)/G diagonal ratio inside 12′–83′ averages 1.102 (ξ_+)
      and 1.105 (ξ_-), a non-Gaussian share of 9% of the diagonal
      variance there and 7% over all bins. The paper prints 11% and 8%
      (`ngFractionDiagonalFiducial`, `ngFractionDiagonalAll`); the
      baseline's own macro file gives 9% and 7%.

      p_thr is set so a clean sample fails 5% of the time; the paper
      adopts p_thr = 0.01, conservative for nearly all scale-cut
      combinations, against a calibrated 0.006 at the fiducial cuts
      ([mock_min_pte_calibration](#outputs.mock_min_pte_calibration)).
      The observed minimum, ξ_-^B at 0.0193, sits at or above the
      minimum of 38 of 350 clean realisations (10.9% one-sided; 58,
      16.6%, two-sided); the 5% threshold is 0.0058 one-sided and
      0.0034 two-sided.
    created_at: "2026-08-31T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 8.379664071517078'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"pvalue": 0.7939539191651337'
      - id: ev3
        artifact: mock_min_pte_calibration
        quote:
          exact: '"threshold_one_sided": 0.005773478384709799'
    scope: "v1.4.6.3_v2 suite, mock-matched reference covariances, adopted scale cuts, baseline estimator."

  mocks_are_over_constraining:
    id: mocks_are_over_constraining
    label: "Mock galaxy density 17% above the data's"
    claim: |
      Because of an error in the catalog generation, the GLASS
      realizations' galaxy number density is 17% higher than the
      data's, so their shape noise and B-mode scatter are lower. Mock
      scatter is therefore compared only against analytic covariances
      recomputed at the realizations' galaxy density.
    notes: |
      **Size.** On a footprint shared with the data to better than 0.3
      deg², the v1.4.6.3_v2 suite holds 60 423 575 unit-weight galaxies
      against the fiducial catalogue's 51.65 million weight-effective
      galaxies. Per-component σ_e agrees to 0.2% (0.267568 data,
      0.268175 mock), so the count ratio is the whole noise difference:
      predicted shape-noise power σ_e²/N is 0.8596 of the data's and
      the (pure-noise) B-mode variance 0.7389 of it
      ([mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table)).
      Measured, as 17-band means over 300 ≤ ℓ ≤ 1600
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)): the
      covariance machinery at the mocks' noise gives a C_ℓ^BB variance
      ratio of 0.725, and the 350 realisations scatter at 0.716 of the
      data's variance. Held against the data covariance, the mocks
      would appear to validate an error bar roughly 15% too large;
      [reference_covariance](#decisions.reference_covariance) =
      `mockmatched` avoids this.

      **Origin.** The generator (`make_unions_glass_sim.py`) defaults
      `--neff` to 6.0905 arcmin⁻², the catalogue n_eff of the 2405 deg²
      area convention (4.957 at the current 2894 deg²), and the run
      scripts do not override it. It applies that density to an
      occupied-pixel nside-4096 mask of 2757.25 deg²: 6.0905 × 2757.25 ×
      3600 = 60.45 M, against 60.27–60.42 M realised per realisation.
      The catalogue's A = 2894.03 deg² is the full footprint mask, in
      which roughly 5% of pixels hold no galaxy; data galaxies occupy
      2750.65 deg² of it. Paper III and Paper IV describe the mocks as
      matching the data's number density; neither prints a numeric
      mock density, and Sacha Guerrini has confirmed the excess.

      **Areas.** Quoted areas range over 2405, 2757, 2894 and 2949 deg²
      but describe one sky: data galaxies occupy 2750.65 deg², mock
      galaxies 2709.91 deg², their overlap 2703.17 deg², and only 0.26
      deg² of the data footprint lies outside the mock mask. n_eff × A
      is the convention-free quantity (4.9573 arcmin⁻² × 2894.03 deg²
      and the weighted H12 4.8636 × 2949.79 deg² both give 51.65 M). The
      "n_eff = 3.3697 arcmin⁻²" in the campaign code is the v1.4.6
      count divided by 2894 deg², not a density.

      **Paper IV.** Paper IV finds its Gaussian iNKA covariance
      overestimates the small-scale variance relative to the GLASS
      mocks (15%) and `OneCovariance` (~20%), attributing it to iNKA's
      treatment of a spatially varying number density
      ([paper_iv_inka_overestimates_variance](#prior_insights.paper_iv_inka_overestimates_variance)).
      The density excess makes the mocks' variance ~26% low by
      construction, an independent contribution in the same direction;
      part of that gap is plausibly the mocks being under-noised. The
      two effects are additive and nothing here quantifies the split.

      **The excluded v1.4.6 suite** ([mock_suite](#decisions.mock_suite))
      carries 35 078 729 galaxies, 32% fewer than the data, on a
      1600.33 deg² mask: the same 6.0905 default on a smaller sky
      (6.0905 × 1600.33 × 3600 = 35.08 M). Nothing in the campaign rests
      on it.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_vs_data_noise_table
        quote:
          exact: "0.85961"
      - id: ev2
        artifact: clbb_variance_ratios
        quote:
          exact: '"machinery_variance_ratio_mean": 0.7249533827835264'
      - id: ev3
        artifact: clbb_variance_ratios
        quote:
          exact: '"empirical_variance_ratio_mean": 0.7157060122347197'
      - id: ev4
        artifact: mock_sigma_ratio_figure
    scope: "The delivered GLASS v1.4.6.3_v2 suite against the v1.4.6.3 leak-corrected fiducial catalog; galaxy counts, σ_e and footprint only, and the shape-noise scaling that follows from them."

  covariance_amplitude_validated:
    id: covariance_amplitude_validated
    label: "Analytic σ matches the mock scatter at the fiducial cuts"
    claim: |
      At the fiducial cuts the analytic σ of each B-mode statistic
      matches the scatter across the realizations, slightly smaller in
      configuration space and in agreement in harmonic space. The
      agreement degrades on large scales outside the fiducial cuts,
      which PSF leakage already excludes (Paper I), so the
      miscalibration does not affect the choice of scale cuts.
    notes: |
      Median ratio of analytic to mock σ over bins (paper): 0.92–0.95
      in configuration space, 1.01 in harmonic space. Outside the cuts
      the analytic σ is about 17% too small for the first COSEBI mode
      and for ξ_±^B above 100′, and too large for C_ℓ^BB below ℓ ≈ 100,
      where E-to-B leakage is treated only approximately (Nicola et al.
      2021).

      From the 350 GLASS v1.4.6.3_v2 realisations against the
      mock-matched reference covariance, as σ_emp/σ_ana (the inverse of
      the paper's ratio): COSEBI B_1–B_20 median 1.055 (range
      0.974–1.086); ξ_+^B over the seven fiducial-cut θ bins median
      1.087 (1.000–1.164); ξ_-^B median 1.059 (0.978–1.127); C_ℓ^BB over
      the 17 fiducial-cut bands median 0.993 (0.926–1.086). Inverted,
      these are the paper's 0.95, 0.92, 0.94 and 1.01.

      This validates the covariance machinery: the same CosmoCov /
      NaMaster chain that builds the fiducial covariance, pointed at
      the mocks' noise, reproduces their scatter to ~10%. It does not
      say the mock and data covariances agree; they differ by the
      galaxy-count excess.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 1.0550671384448764'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 0.9926463379482149'
    scope: "350 GLASS v1.4.6.3_v2 realisations, mock-matched reference covariance, fiducial scale cuts."

  chi2_machinery_conservative:
    id: chi2_machinery_conservative
    label: "The null tests are conservative"
    claim: |
      The null tests use only the Gaussian part of the covariance,
      which underestimates the true variances by omitting connected
      trispectrum and super-sample terms. They are therefore
      conservative: a test that passes with the Gaussian-only
      covariance would generally pass with a more complete covariance
      estimate, as the simulations confirm.
    notes: |
      The paper puts the non-Gaussian share of the ξ_± diagonal
      variance within the fiducial cuts at about 11%; the baseline's
      reporting-grid covariances give 9% (see
      [mock_ptes_skew_low_by_ng_term](#findings.mock_ptes_skew_low_by_ng_term)).

      Across the 350 GLASS v1.4.6.3_v2 realisations, against the
      mock-matched reference covariance, the mean χ² exceeds ν for
      five of the six statistics — 6.63 against ν = 6 for B_{n≤6},
      21.46 against 20 for B_{n≤20}, 8.38 against 7 for ξ_+^B, 7.91
      against 7 for ξ_-^B, 16.07 against 14 for ξ_tot^B — and falls
      just below for C_ℓ^BB, 16.78 against 17, whose PTEs pass a KS
      test of uniformity at p = 0.79. A mean χ² above ν makes the
      reported PTEs lower than the true tail probabilities. The
      `fiducial` selection of
      [reference_covariance](#decisions.reference_covariance) would
      inflate these means by the galaxy-count difference rather than
      any covariance error; it is not run on this suite.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 6.631945648377122'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 16.775046279157934'
    scope: "350 GLASS v1.4.6.3_v2 realisations at fiducial scale cuts, mock-matched reference covariance."

  tests_are_not_redundant:
    id: tests_are_not_redundant
    label: "Null-test statistics are not redundant"
    claim: |
      The six B-mode test statistics are not perfectly correlated
      across the clean realizations: statistics from different
      estimator families correlate only moderately, and even pairs
      sharing a data vector stay well below unity. This is why the
      minimum PTE over the six skews low and its threshold is
      calibrated on the mocks
      ([pte_threshold](#../decisions.pte_threshold)).
    notes: |
      χ² Pearson correlations across the 350 v1.4.6.3_v2 realisations
      (`correlations.chi2.pearson` in `mock_campaign_evidence`).
      Different families, 0.25–0.53: 0.41 B_{n≤6}–ξ_+^B, 0.37
      B_{n≤6}–C_ℓ^BB, 0.35 ξ_+^B–C_ℓ^BB, 0.46 ξ_-^B–C_ℓ^BB, 0.53
      ξ_tot^B–C_ℓ^BB. Shared data vector: 0.72 ξ_+^B–ξ_tot^B and 0.68
      ξ_-^B–ξ_tot^B (nested by construction), 0.53 B_{n≤6}–B_{n≤20}.
      The PTE Pearson matrix tells the same story (0.37 for B_{n≤6}
      with C_ℓ^BB).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: "0.723441470177607"
    scope: "350 GLASS v1.4.6.3_v2 realisations, fiducial scale cuts, six-statistic χ² and PTE stacks."

