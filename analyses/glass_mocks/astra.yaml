  - id: mock_cross_statistic_correlation_figure
    type: figure
    format: pdf
    description: |
      The comments 1/6/9 figure: the 6×6 empirical correlation
      matrix of the test statistics across realisations, in both
      χ² and PTE space. This is the quantitative replacement for
      the paper's qualitative "the tests are highly correlated" —
      and it does not say what that phrase implies; see
