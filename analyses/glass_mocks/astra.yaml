  # ══ The E-to-B mixing-term test ══════════════════════════════════════════
  #
  # Why the analytic C_ℓ^BB covariance is too large below ℓ ≈ 100, isolated by
  # recomputing it under three fiducial E-mode inputs while everything else —
  # mask, nside, ℓ range, binning, noise bias, the coupled-iNKA branch — is
  # held at the chain's own values.

  - id: clbb_cov_mixing_term_test
    type: metric
    format: json
    description: |
      Diagnostic of why the analytic C_ℓ^BB covariance is too large at
      low ℓ (σ_emp/σ_ana falls to 0.56 at ℓ ≈ 12, outside the
      reporting cut). It replicates the chain's NaMaster iNKA
      covariance on realisation 00001 (weighted galaxy-count mask,
      noise bias Ω_pix ⟨Σ_i w_i² σ_{e,i}²⟩, `coupled` iNKA input) and
      recomputes it under three E-mode inputs, varying only C_ℓ^EE:

      - `a_theory`, the chain's own input `[C_ℓ^EE·pixwin², 0, 0, 0]`
        plus the decoupled noise bias: a gate that must reproduce the
        stored [cl_cov_mockmatched](#inputs.cl_cov_mockmatched)
        diagonal (`gate_max_frac_deviation_from_stored`).
      - `b_noEE`, C_ℓ^EE zeroed: its gap to `a_theory` is the E-to-B
        mask-mixing contribution to the BB variance.
      - `c_mockEE`, the suite's mean C_ℓ^EE in place of theory: if the
        ratio barely moves, the input spectrum is not the problem and
        the coupling is.

      Carries σ_BB per bandpower for all three and the empirical
      scatter, with σ_emp/σ_ana for each, over the full 8 ≤ ℓ ≤ 2048
      grid.
    inputs: [glass_mock_catalogs, redshift_distribution, glass_mock_cl, cl_cov_mockmatched, clbb_cov_mixing_term_script]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      # Realisation 00001, matching the stored mock-matched covariance the gate
      # is checked against. The family input interpolates as its literal glob,
      # so the script resolves the realisation out of it rather than the shell.
      command: >
        python src/workflow/scripts/clbb_cov_mixing_term_test.py
        --mock-catalogs "{inputs.glass_mock_catalogs}" --realisation 00001
        --redshift-distribution {inputs.redshift_distribution}
        --cl-files "{inputs.glass_mock_cl}"
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --nside 1024 --nbins 32 --power 0.5
        --out-file {output}
      resources: { cpus: 16, memory: "150GB" }

  - id: clbb_cov_mixing_term_figure
    type: figure
    format: png
    description: |
      [clbb_cov_mixing_term_test](#outputs.clbb_cov_mixing_term_test)
      drawn: σ(C_ℓ^BB) per bandpower for the empirical scatter and
      the three analytic variants above, with σ_emp/σ_ana beneath
      and the harmonic reporting cut 300 < ℓ < 1600 shaded in both
      panels; log ℓ over the full 8–2048 grid.
    inputs: [clbb_cov_mixing_term_test, clbb_cov_mixing_term_figure_script, plotting_utils_script]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/workflow/scripts/clbb_cov_mixing_term_figure.py
        --mixing-test {inputs.clbb_cov_mixing_term_test}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }


  # ══ The pure-E/B decision re-scan ════════════════════════════════════════
  #
  # Three ASTRA decisions reach the pure-mode transform, and the default table
  # in pure_eb_transform maps each METHOD to a GEOMETRY (dqags -> pointwise,
  # fixed_operator -> averaged).  That mapping is a table of DEFAULTS, not a
  # constraint, and taking it for one is what makes the submitted-vs-adopted
  # comparison confounded: under the defaults, "not pointwise" always also
  # means "not dqags", so the submitted small-θ pure-B excess cannot be
  # attributed to the quadrature rather than to the geometry.  The two cross
  # terms below break that confounding.  AveragedPureEBTransform is
  # method-agnostic by construction — it picks the evaluation nodes, the
  # window and the fine-to-reporting average, then delegates one call to
  # PureEBTransform, which dispatches on the method — so dqags in the averaged
  # geometry needed no new numerics, only an explicit geometry override
  # (`geometry_for(method, geometry)`, `--geometry` on the data chain,
  # `--transform-averaged` on the mock chains).
  #
  # The reverse pairing is a genuine constraint and is absent:
  # fixed_operator cannot be evaluated pointwise, because
  # get_pure_EB_operator builds the single-grid operator (evaluation points
  # must be nodes of the integration grid) and all 20 reporting `meanr` values
  # are off-grid, by up to 0.312% — measured, not assumed.  Snapping them
  # would move θ.  pointwise_fixedop takes that shift deliberately: it snaps
  # each reporting abscissa to the nearest fine node in log θ (opt-in
  # snap_eval=True, offsets recorded per point, max 0.312%), which completes
  # the method × geometry square.  Read it alongside its offsets — the snap
  # also forces the operator's local term onto a single fine node instead of
  # the 20-bin reporting average, so that variant carries fine-bin shot noise
  # and runs ~7× larger in ξ_+^B than pointwise_dqags on realisation 00001.
  # Without snap_eval the constructor still raises, which is what keeps an
  # averaged caller from silently getting a two-grid operator.
  #
  # averaged_npairs_dqags is the one omission — nothing structural prevents
  # it, it was dropped on cost (Cail, 2026-09-04), because the weights
  # question is already answered under the operator at a quarter the price.
  # pure_eb_scan_variants.DROPPED carries that record forward.  Five run:
  #
  #   pointwise_dqags           dqags     / pointwise / none    / reporting_extent  (SUBMITTED)
  #   averaged_uniform_dqags    dqags     / averaged  / uniform / fine_grid_extent   (cross term)
  #   pointwise_fixedop         operator  / pointwise / none    / reporting_extent   (snapped corner)
  #   pointwise_fixedop_reporting  operator / pointwise / none  / reporting_extent   (snapped corner, reporting local term)
  #   averaged_uniform_fixedop  operator  / averaged  / uniform / fine_grid_extent
  #   averaged_uniform_fixedop_reporting  operator / averaged / uniform / fine_grid_extent  (reporting local term; covariance aliased)
  #   averaged_npairs_fixedop   operator  / averaged  / npairs  / fine_grid_extent   (ADOPTED, baseline)
  #
  # The last two pointwise-operator entries differ in ONE thing.  The transform
  # is a local term plus an integral term; the local term is
  # 0.5*(ξ_+ ± ξ_-) AT the evaluation point (schneider2022_nb writes it as
  # `xip_E[i] = 0.5 * (xip[i] + xim[i] + int_tmp) - ...`; the operator adds the
  # same numbers onto column `ii` of its row).  pointwise_dqags takes it from
  # the 20-bin REPORTING measurement and only the integral from the fine grid.
  # pointwise_fixedop, snapped onto a node, takes BOTH from that one fine node
  # — ~1/50 of a reporting bin's pairs — which is why it is noisy.
  # pointwise_fixedop_reporting snaps identically for the integral but restores
  # the reporting local term (`local_from_eval_grid=True`), making it the
  # like-for-like operator counterpart of the submitted chain.
  #
  # That local-vs-integral split is a third axis and it is not confined to the
  # pointwise geometry.  The averaged geometry builds its local term as the
  # block's own weighted mean of 0.5*(ξ_+ ± ξ_-) over the reporting bin's fine
  # nodes, which is NOT the 20-bin reporting measurement — the latter is its
  # own pair-weighted TreeCorr measurement, not a rebinning of the fine one.
  # averaged_uniform_fixedop_reporting substitutes it and completes the square:
  #
  #   local term from ...  pointwise geometry           averaged geometry
  #   the fine grid        pointwise_fixedop            averaged_uniform_fixedop
  #   the reporting ξ      pointwise_fixedop_reporting  averaged_uniform_fixedop_reporting
  #
  # One asymmetry decides how that seventh variant is wired.  The MC covariance
  # chains build their reporting draws BY uniformly rebinning the fine draws,
  # so under `uniform` weights the two local terms coincide on every draw and
  # the averaged reporting variant's COVARIANCE *is* averaged_uniform_fixedop's
  # — measured at 1.4e-20 on a rebinned draw against 1.8e-06 on the real
  # reporting measurement.  So it gets NO covariance output of its own: a
  # `covariance_from` alias in pure_eb_scan_variants points it at
  # averaged_uniform_fixedop's bundle, pure_eb_scan_statistics resolves the
  # alias, and pure_eb_scan_covariances refuses to build one (Cail, 2026-09-06
  # — propagating 500 draws to reproduce a known-identical matrix is a fake
  # dependency).  The substitution bites on the measured DATA VECTOR and on the
  # mock data vectors, where the reporting ξ is a real independent measurement.
  #
  # The one thing the alias does NOT cover: the borrowed bundle carries the
  # DONOR's data pure-mode vectors alongside the shared covariance, and the
  # data vector is exactly what this variant changes.  Reusing it would report
  # averaged_uniform_fixedop's data PTE under this variant's name.  So
  # pure_eb_scan_statistics rebuilds the vector in-stage from the measured ξ
  # (hence its xi_reporting / xi_integration inputs) through
  # gather_pure_eb_chunks.data_vector — the same function the stored vectors
  # came from — and runs the usual PTE against the borrowed covariance.  The
  # guard is a self-check at runtime: before trusting the rebuild it recomputes
  # the DONOR's vector the same way and requires bit-for-bit agreement with the
  # one stored in the bundle, so a divergence between the two code paths fails
  # loudly instead of producing a quietly wrong PTE.
  #
  # The covariance stage is one output per variant, so the propagations
  # run in parallel on separate nodes; every other stage is one output that
  # loops the variants internally, because they are cheap and their value is
  # the comparison rather than any single member.  Either way the variant list
  # lives in one importable table (pure_eb_scan_variants) rather than spread
  # across recipes that must stay in lockstep.
  #
  # The scan's covariances are built from 500 draws, not the fiducial 2000.
  # mc_samples is therefore NOT a decision on these outputs: that decision
  # names the fiducial covariance's sample count, which this stage does not
  # touch.  The Hartlap correction downstream reads the draw count out of each
  # bundle's provenance, so it can never drift from what was actually run.
  #
  # Option values are LITERALS in that table, and the three scanned decisions
  # are deliberately absent from every decisions: list below.  That is the
  # point of a scan: its content must not change with the active universe.  A
  # recipe reading {decisions.pure_eb_integration_method} would collapse to
  # whichever option the universe selects and the comparison would vanish.
  # The decisions stay decisions above, where the ruling lives; this measures
  # them.

  - id: pure_eb_scan_covariance_pointwise_fixedop
    type: data
    format: tar.gz
    description: |
      MC-propagated pure-mode covariances for the `pointwise_fixedop`
      variant (fixed operator, pointwise geometry, snapped evaluation):
      `pointwise_fixedop__data.npz`, the counterpart of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      carrying the data's pure-mode vectors for the variant's data PTE,
      and `pointwise_fixedop__mockmatched.npz`, the counterpart of
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      Each variant propagates its own covariance because the transform is
      what is scanned: `dqags` quadrature error is noise per draw and
      inflates the propagated variance (ξ_-^B bin 0 by ×3.3, ξ_-^amb by
      ×17). Seeds are identical across variants (42 + chunk/batch id), so
      variant-to-variant differences carry no Monte-Carlo noise of their
      own. 500 draws rather than the fiducial 2000 give ≈0.4%
      per-element noise against the 10–30% differences being resolved;
      the downstream Hartlap correction reads the draw count from the
      bundle.

      The single-grid operator evaluates only at integration-grid nodes,
      so each reporting abscissa is snapped to the nearest fine node in
      log θ (offsets −0.312% to +0.272%, recorded as `snap_offsets`). Its
      local term is then read at a single fine node rather than from the
      20-bin reporting measurement
      [pointwise_dqags](#outputs.pure_eb_scan_covariance_pointwise_dqags)
      uses, so it carries fine-bin shot noise: on realisation 00001 its
      ξ_±^B is ~7× the pointwise-dqags amplitude at ξ_+^B and ~2× at
      ξ_-^B, oscillating in sign and not confined to the grid edges. It
      completes the method × geometry square but is not "the operator in
      the submitted geometry"; that is
      [pure_eb_scan_covariance_pointwise_fixedop_reporting](#outputs.pure_eb_scan_covariance_pointwise_fixedop_reporting).
      Cost: minutes (a matvec per draw).
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # The geometry override reaches each chain through the flag it already
      # carries: --geometry on run_pure_eb_semianalytic.sh (forwarded to
      # precompute_pure_eb_chunk) and --transform-averaged on the mock-matched
      # twin. Both are omitted for a variant running in its method's default
      # geometry, so those calls stay byte-for-byte the single-variant ones.
      # mc_samples is deliberately NOT a decision here: that decision names the
      # fiducial covariance's 2000, and the scan's 500 is a scan parameter.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant pointwise_fixedop
        --n-samples 500 --seed 42
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_scan_covariance_pointwise_fixedop_reporting
    type: data
    format: tar.gz
    description: |
      MC-propagated pure-mode covariances (500 draws) for the
      `pointwise_fixedop_reporting` variant:
      `pointwise_fixedop_reporting__data.npz`, the counterpart of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      carrying the data's pure-mode vectors for the variant's data PTE,
      and `pointwise_fixedop_reporting__mockmatched.npz`, the
      counterpart of [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      The Schneider (2022) transform is a local term, 0.5·(ξ_+ ± ξ_-) at
      the reporting abscissa, plus an integral term.
      [pointwise_dqags](#outputs.pure_eb_scan_covariance_pointwise_dqags)
      takes the local term from the 20-bin reporting measurement;
      [pointwise_fixedop](#outputs.pure_eb_scan_covariance_pointwise_fixedop)
      takes both terms from the snapped fine node (~1/50 of a reporting
      bin's pairs). This variant snaps identically for the integral but
      restores the reporting local term, making it the like-for-like
      operator counterpart of the submitted chain: what remains is
      quadrature plus the snapped integral's θ shift. On realisation
      00001 its ξ_±^B sits at the pointwise-dqags amplitude rather than
      `pointwise_fixedop`'s ~7×/~2× excess, identifying that excess as
      fine-bin noise in the local term. Cost: minutes.
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # --local-from-eval-grid reaches both chains through the flag each one
      # now carries (run_pure_eb_semianalytic.sh forwards it to
      # precompute_pure_eb_chunk and gather_pure_eb_chunks; mock_matched_pure_eb_cov
      # takes it directly). It is a no-op for every variant that does not snap,
      # so no other output's calls change.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant pointwise_fixedop_reporting
        --n-samples 500 --seed 42
        --out-file {output}
