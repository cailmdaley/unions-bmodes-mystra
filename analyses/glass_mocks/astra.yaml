version: "0.0.14"
name: "GLASS mock covariance campaign"
description: |
  Validation of the B-mode estimators, covariances and PTE
  convention on 350 systematics-free GLASS lognormal realisations.
  The realisations carry no B power, so every B statistic they
  produce is estimator noise: their scatter is the empirical σ to
  hold the analytic σ against, their per-mock χ² values test the
  PTE convention and calibrate the min-PTE threshold, their χ²
  correlations measure how independent the six statistics are, and
  their pure-B response to a second footprint isolates mask
  geometry.

  Each realisation is measured independently (the
  [ξ_± ensemble](#outputs.mock_xi_fine)) and carried through the
  same ξ_± → COSEBI and ξ_± → pure-E/B transforms the data use; one
  compute pass then compares all six statistics against analytic
  covariances. The key [decision](#decisions.reference_covariance)
  is which covariance: the realisations carry 17% more galaxies
  than the data
  ([finding](#findings.mocks_are_over_constraining)), so they are
  held against a covariance the same CosmoCov / MC / NaMaster chain
  builds at the mocks' own noise. The campaign thus tests the
  covariance machinery, not the data covariance directly.
tags: [glass, mocks, covariance, referee]

inputs:
  - id: selected_config
    from: ../catalog.selected_config

  - id: glass_mock_catalogs
    type: data
    description: |
      The source catalogues of the GLASS mock suite described in Paper
      III: one HEALPix-4096 catalogue per realisation
      (`RA`, `Dec`, `e1`, `e2`, `w`). ξ_± is recomputed from them on
      the fine 1000-bin integration grid, which the stored 20-bin ξ_±
      cannot supply.

      A catalogue holds 60 423 575 unit-weight rows (realisation
      00001) against the fiducial catalog's 61 378 891 rows / 51.65 M
      weight-effective galaxies on the same footprint; the excluded
      [v1.4.6 suite](#decisions.mock_suite) holds 35 078 729.
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/unions_glass_sim_*_4096.fits"

  - id: glass_mock_xi_reporting
    type: data
    description: |
      Sacha Guerrini's precomputed 20-bin TreeCorr ξ_± per
      realisation on the reporting grid. It defines the reporting
      bins of the pure-E/B transform, whose Schneider (2022)
      integrals run over the fine ξ_±. 
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/xi_glass_mock_*_4096_nbins=20.fits"

  - id: glass_mock_cl
    type: data
    description: |
      Pseudo-Cℓ bandpowers per GLASS realisation (EE and BB among
      the rows); the BB row is the campaign's sixth statistic.
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/cl_glass_mock_*_4096.npy"

  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_reporting
    from: ../two_point.xi_reporting

  - id: cov_integration
    from: ../covariance.cov_integration

  - id: pure_eb_semianalytic_data
    from: ../pure_eb.pure_eb_semianalytic_data

  - id: pure_eb_pte_per_cut
    from: ../pure_eb.pure_eb_pte_per_cut

  - id: cosebis_pte_per_cut
    from: ../cosebis.cosebis_pte_per_cut

  - id: cl_pte_per_cut
    from: ../cl_bb.cl_pte_per_cut

  - id: cl_cov_reporting
    from: ../covariance.cl_cov_reporting

  - id: redshift_distributions
    from: ../redshift_distributions

  - id: cosmology_snapshot
    from: ../covariance.cosmology_snapshot

  - id: cov_integration_mockmatched
    type: data
    description: |
      The [cov_integration](#inputs.cov_integration) CosmoCov
      ξ_± covariance recomputed at the mocks' noise: `source_n_gal =
      5.79308 arcmin⁻²` and `sigma_e = 0.37926` (0.26817 per
      component) at the fiducial `area = 2894.0304 deg²`. It is the
      ξ_± half of the mock-matched reference covariance (see
      [reference_covariance](#decisions.reference_covariance)); the
      pure-E/B half is
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      With the area held fixed, that n_gal corresponds to 60.36 M
      galaxies, 0.1% below the 60 423 575 delivered (0.2% low in
      variance). The neighbouring `SP_v1.4.6.3_mockmatched` entry
      carries the v1.4.6 suite's count (3.3697 arcmin⁻², 35.1 M) and
      is not used. See
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining).
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked_processed.txt"

  - id: cl_cov_mockmatched
    type: data
    description: |
      The mock-matched C_ℓ^BB covariance for the
      [v2 suite](#decisions.mock_suite): the NaMaster iNKA
      covariance that produces
      [cl_cov_reporting](#inputs.cl_cov_reporting), run on GLASS v2
      realisation 00001. The method is catalogue-driven (mask = the
      weighted galaxy-count map, noise bias Ω_pix ⟨Σ_i w_i²
      σ_{e,i}²⟩), so no number density or area convention enters.
      Its mock/data variance ratio is 0.726 over 300 ≤ ℓ ≤ 1600,
      against the 350 realisations' empirical 0.716
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)).
    source: "/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/glass_mock_v1.4.6.3_v2/pseudo_cl_cov_glass_mock_v2_00001_powspace_nbins=32.fits"

  - id: cosmocov_ini_data
    type: data
    description: |
      The CosmoCov ini of the fiducial ξ_± covariance: its survey
      block states the noise the covariance is built at, `area =
      2894.0303815288 deg²`, `source_n_gal = 4.957279 arcmin⁻²`,
      `sigma_e = 0.3783980` (total; 0.267568 per component). Read by
      [mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table).
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked.ini"

  - id: cosmocov_ini_mockmatched
    type: data
    description: |
      The same ini for the `SP_v1.4.6.3_mockv2` run that produced
      [cov_integration_mockmatched](#inputs.cov_integration_mockmatched):
      the mocks' noise, `source_n_gal = 5.7930820 arcmin⁻²` and
      `sigma_e = 0.3792561` at the same `area = 2894.0303815288
      deg²`. With the area fixed between the two inis, only the
      galaxy count differs.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked.ini"

  # ── Scripts declared as inputs so that editing one restales its outputs ──
  # Only the figure outputs take the plotting scripts; the expensive compute
  # passes do not, so a plotting change never triggers a recompute.

  - id: scale_cuts_script
    from: ../scale_cuts_script

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: plotting_utils_script
    type: data
    description: |
      The shared plotting module (style, A&A column widths, colours,
      mark spec) every figure here draws from.
    source: "./src/workflow/scripts/plotting_utils.py"

  - id: min_pte_window_scan_script
    type: data
    description: |
      The scale-cut scan of the min-PTE calibration: for every window
      on the reporting grid it re-forms all six null-test statistics
      per realisation — recomputing the COSEBIs *inside each window*
      rather than carrying the fiducial values across — and reads the
      5% quantile of the per-realisation minimum.
    source: "./src/workflow/scripts/min_pte_window_scan.py"

  - id: mock_campaign_analysis_script
    type: data
    description: |
      The campaign script, which computes
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics)
      and renders the σ-ratio and PTE-uniformity figures; an input
      to the figures only.
    source: "./src/workflow/scripts/mock_campaign_analysis.py"

  - id: mock_min_pte_calibration_script
    type: data
    description: |
      The min-PTE script, which both calibrates and renders; an
      input to the figure only.
    source: "./src/workflow/scripts/mock_min_pte_calibration.py"

  - id: mock_validation_figure_script
    type: data
    description: |
      The composer behind
      [mock_validation_figure](#outputs.mock_validation_figure)
      and its fiducial-cuts companion (the same script under
      `--range`).
    source: "./src/workflow/scripts/mock_validation_figure.py"

  - id: mock_xi_input_theory_script
    type: data
    description: |
      The rebuild of the mock generator's own cosmology behind
      [mock_xi_input_theory](#outputs.mock_xi_input_theory).
    source: "./src/workflow/scripts/mock_xi_input_theory.py"

  - id: mock_xi_reporting_cov_script
    type: data
    description: |
      The rebinner behind
      [mock_xi_reporting_cov_mockmatched](#outputs.mock_xi_reporting_cov_mockmatched).
    source: "./src/workflow/scripts/mock_xi_reporting_cov_mockmatched.py"

  - id: mock_xi_validation_script
    type: data
    description: |
      The raw-ξ_± validation script behind both
      [mock_xi_validation_stats](#outputs.mock_xi_validation_stats)
      and
      [mock_xi_validation_figure](#outputs.mock_xi_validation_figure).
    source: "./src/workflow/scripts/mock_xi_validation.py"

  - id: mock_footprint_audit
    type: data
    description: |
      The nside-4096 footprint audit: for the data catalogue and for
      v2 realisation 00001, the galaxy row count, the number of
      occupied HEALPix pixels and the sky area they cover, plus the
      two footprints' overlap and each one's exclusive area. It shows
      the area conventions in circulation (2405, 2757, 2894, 2949 deg²)
      describe a single sky, so the noise difference is a pure count
      ratio.
    source: "/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/glass_mock_v1.4.6.3_v2/clbb_cov_work/footprint_4096.log"

outputs:

  # ── Scatter: the per-realisation data vectors ────────────────────────────
  # The expensive stage is a genuine fan-out — 350 independent TreeCorr runs on
  # 60 M galaxies each, 10-20 core-hours apiece — and the live path is the
  # generated mock_xi_scan sweep. What each stage carries is the ensemble: the
  # realisation axis made explicit as a single stacked array, which is what
  # every consumer here actually wants. The transforms downstream are not
  # fanned out, because they are cheap: they read an ensemble and write one.

  - id: mock_xi_fine
    from: mock_xi_scan.mock_xi_fine

  - id: mock_xi_reporting
    type: data
    format: npz
    description: |
      The suite's stored 20-bin reporting-grid ξ_± vectors, stacked
      into the same ensemble layout as
      [mock_xi_fine](#outputs.mock_xi_fine).
    inputs: [glass_mock_xi_reporting]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_ensemble.py
        --members "$(dirname "$(printf '%s\n' "{inputs.glass_mock_xi_reporting}" | head -n1)")"/xi_glass_mock_*_4096_nbins=20.fits
        --min-sep 1.0 --max-sep 250.0 --nbins 20
        --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_cosebis_modes
    type: data
    format: npz
    description: |
      COSEBI E_n / B_n for n = 1 … 20 and all 350 realisations, stacked
      as a 350 × 20 pair, computed from
      [mock_xi_fine](#outputs.mock_xi_fine) with the same
      `cosmo_numba` call as the data vector, over the
      [fiducial θ range](#decisions.scale_cut_convention).
      [mock_cosebis_modes_full](#outputs.mock_cosebis_modes_full) is
      the 1–250 arcmin counterpart.
    inputs: [mock_xi_fine]
    decisions: [mock_suite, scale_cut_convention]
    recipe:
      # The θ cut reaches the script as the convention, not as two literals:
      # mock_cosebis_scatter resolves grid_bin_edges to edges 9 and 16 of
      # geomspace(1', 250', 21) — what the pipeline actually cut at — and
      # rounded_arcmin to the quoted [12, 83].
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20
        --scale-cut-convention {decisions.scale_cut_convention}
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_cosebis_modes_full
    type: data
    format: npz
    description: |
      Full-range COSEBI E_n / B_n for n = 1 … 20 and all 350
      realisations, stacked as a 350 × 20 pair: as
      [mock_cosebis_modes](#outputs.mock_cosebis_modes), over the
      1–250 arcmin range of the full-range data PTEs.
    inputs: [mock_xi_fine]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20 --theta-min 1.0 --theta-max 250.0
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_pure_eb_modes
    type: data
    format: npz
    description: |
      Pure-mode ξ_±^{E,B,amb} for all 350 realisations on the 20-bin
      reporting grid, stacked as six 350 × 20 blocks. The reporting
      grid comes from
      [mock_xi_reporting](#outputs.mock_xi_reporting) and the
      integration grid from [mock_xi_fine](#outputs.mock_xi_fine),
      truncated at 300' to match the fiducial CosmoCov integration
      grid.
    inputs: [mock_xi_fine, mock_xi_reporting]
    decisions: [mock_suite, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits]
    recipe:
      command: >
        python src/workflow/scripts/mock_pure_eb_scatter.py
        --fine-ensemble {inputs.mock_xi_fine}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 16, memory: "16GB" }

  # ── Scatter: the v1.4.8-masked footprint ─────────────────────────────────
  # Not yet materialised. Scoped to the first 50 realisations (00001-00050):
  # the masked 2PCF is the campaign's most expensive stage, and 50 paired
  # realisations resolve the mean-level geometry effect. The geometry analysis
  # pairs by mock ID, so the comparison runs on the 50-member intersection.

  # ── The mock-matched reference covariance ────────────────────────────────

  - id: pure_cov_mockmatched
    type: data
    format: npz
    description: |
      The fiducial pure-E/B covariance rebuilt from the
      [mock-matched ξ_± covariance](#inputs.cov_integration_mockmatched)
      under the same
      [covariance method](#decisions.pure_eb_covariance_method) —
      the exact M C_ξ Mᵀ with the same M, or the same 2000-sample
      chain with the same six-block ordering and the same
      deterministic seeds as
      [pure_eb_semianalytic_data](#inputs.pure_eb_semianalytic_data),
      only the input covariance differs. The mocks' noise enters
      only through
      [cov_integration_mockmatched](#inputs.cov_integration_mockmatched),
      as it does for COSEBIs. Used when
      [reference_covariance](#decisions.reference_covariance) is
      `mockmatched`.
    inputs: [selected_config, cov_integration_mockmatched, xi_reporting, xi_integration, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind, mc_samples, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method]
    recipe:
      # mock_matched_pure_eb_cov.py is precompute_pure_eb_chunk + gather in one
      # deterministic invocation, on the twin's own partition: 20 batches x 100
      # = 2000, seeded 42 + batch id, so the two chains draw seeds 42-61 with
      # the same block sizes and the same 2000 standard-normal draws. That is
      # what "same deterministic seeds" in the description buys — without it
      # the difference between the two covariances would carry ~sqrt(2/2000)
      # of MC noise per element on top of the effect being measured.
      # Two distinct rebinnings, and only one is a decision. The pointwise
      # geometry rebins the *input* xi_+- from the fine grid to the 20
      # reporting bins with the submitted unweighted mean, matching the twin;
      # that is not a fork and is not parameterised. The averaged geometry
      # fixed_operator selects instead averages the *pure modes* into the
      # reporting bins, and how that average is weighted is
      # pure_eb_rebinning_weights, passed through as --rebinning-weights.
      # --xi-reporting must be the 20-bin reporting grid: the script reads it
      # with max_rows=20, so handing it the 1000-bin integration file would
      # silently take the first twenty fine bins (0.50-0.55') as the reporting
      # theta axis.
      # The n(z) is resolved the twin's way, not handed over as a path: the
      # script builds a CosmologyValidation on --version/--blind and calls
      # get_redshift, which opens cat_config's `redshift_path`. The fiducial
      # pair is hardcoded exactly as in pure_eb_semianalytic_data;
      # `redshift_distributions` stays declared because that lookup is what
      # reaches the n(z) tree, which sits outside the project.
      command: >
        python src/workflow/scripts/mock_matched_pure_eb_cov.py
        --cov-integration {inputs.cov_integration_mockmatched}
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)" --blind A
        --cat-config src/cosmo_val/cat_config.yaml
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples {decisions.mc_samples} --seed 42 --out {output}
      resources: { cpus: 24, memory: "60GB" }

  # ── The six-statistic campaign: compute once, then derive ────────────────
  # Exactly one output is computed (the per-realisation table, the only thing
  # that touches a covariance file); the metrics and figures derive from it.

  - id: mock_per_mock_statistics
    type: data
    format: npz
    description: |
      Per-realisation results for the six statistics (B_{n≤6},
      B_{n≤20}, ξ_+^B, ξ_-^B, ξ_tot^B, C_ℓ^BB): each realisation's B
      vector and its χ² and PTE against the selected reference
      covariance, at the fiducial cuts and over the full range
      (`chi2_full`, `pte_full`, `dof_full`; 1–250 arcmin / 8≤ℓ≤2048).
      Also carries the analytic σ vectors on both ranges, the cut
      masks, and the covariance triple, scale cuts and any skipped
      realisations. Every campaign number derives from this file.
    inputs: [mock_cosebis_modes, mock_cosebis_modes_full, mock_pure_eb_modes, mock_xi_fine, glass_mock_cl, xi_integration, cov_integration, pure_eb_semianalytic_data, cl_cov_reporting, cov_integration_mockmatched, pure_cov_mockmatched, cl_cov_mockmatched]
    decisions: [reference_covariance, mock_suite, scale_cut_convention, fiducial_catalog, fiducial_blind]
    recipe:
      # --reference-covariance picks the covariance triple; under `mockmatched`
      # the C_l^BB reference is the directly computed mock covariance rather
      # than any rescale of the data's. --fine-ensemble is the fallback the
      # COSEBI stage needs only if a stored mode vector carries a non-fiducial
      # theta cut. No --pseudo-cl-dir: that flag drives an optional cross-check
      # against locally recomputed NaMaster bandpowers, and this suite ships no
      # per-mock pseudo_cl_* files, so it has nothing to read.
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --cosebis-ensemble {inputs.mock_cosebis_modes}
        --cosebis-ensemble-full {inputs.mock_cosebis_modes_full}
        --pure-ensemble {inputs.mock_pure_eb_modes}
        --fine-ensemble {inputs.mock_xi_fine}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --cosebis-xi-grid {inputs.xi_integration}
        --cosebis-cov {inputs.cov_integration}
        --pure-cov {inputs.pure_eb_semianalytic_data}
        --cl-cov {inputs.cl_cov_reporting}
        --cosebis-cov-mockmatched {inputs.cov_integration_mockmatched}
        --pure-cov-mockmatched {inputs.pure_cov_mockmatched}
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --reference-covariance {decisions.reference_covariance}
        --scale-cut-convention {decisions.scale_cut_convention}
        --label {decisions.reference_covariance}
        --emit-stats {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mock_min_pte_calibration
    type: metric
    format: json
    description: |
      Calibration of the min-PTE criterion on the clean realisations,
      at the fiducial cuts (top level) and over the full range
      (`full_range`): the data's minimum PTE across the six
      statistics, the fraction of clean mocks at or below it (one- and
      two-sided), and the min-PTE threshold for a 5% global
      false-alarm rate, each with a 68% interval (Wilson for
      fractions, order-statistic bootstrap for thresholds). The fiducial observed PTEs are taken
      from the pure-mode and COSEBI matrices at bins 9–15 (edge indices
      9/16) and C_ℓ^BB at 300 < ℓ < 1600; `full_range` uses the [0, 19]
      matrix cells and all 32 C_ℓ bands (1–250 arcmin / 8≤ℓ≤2048).
      The mock PTE distributions use the matching covariance window,
      including Hartlap-corrected pure-mode statistics.
    inputs: [selected_config, mock_per_mock_statistics, pure_eb_pte_per_cut, cosebis_pte_per_cut, cl_pte_per_cut, scale_cuts_script]
    decisions: [reference_covariance, mock_suite, scale_cut_convention]
    recipe:
      command: >
        python src/workflow/scripts/mock_min_pte_calibration.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --pure-eb-pte {inputs.pure_eb_pte_per_cut}
        --cosebis-pte {inputs.cosebis_pte_per_cut}
        --cl-pte {inputs.cl_pte_per_cut}
        --config {inputs.selected_config}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_min_pte_figure
    type: figure
    format: png
    description: |
      Cumulative distribution of the minimum PTE over the six statistics
      at the fiducial cuts, across the 350 GLASS realizations. Gray
      dashed lines mark the 5% quantile, which calibrates the adopted
      threshold p_thr = 0.01 (solid gray lines; [global PTE
      threshold](#../decisions.pte_threshold)), chosen to be
      conservative across nearly all scale cuts. Red lines mark the
      minimum PTE of the data, which 11% of realizations fall at or
      below. The dotted curve shows the expectation for six independent
      tests. The mocks generally follow this expectation because of two
      effects that largely cancel: correlations between the statistics
      raise the minimum PTE, while the slightly underestimated
      configuration-space covariance lowers it.
    inputs: [selected_config, mock_per_mock_statistics, pure_eb_pte_per_cut, cosebis_pte_per_cut, cl_pte_per_cut, mock_min_pte_calibration_script, plotting_utils_script, scale_cuts_script, paper_mplstyle]
    decisions: [reference_covariance, mock_suite, scale_cut_convention, pte_threshold]
    recipe:
      command: >
        python src/workflow/scripts/mock_min_pte_calibration.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --pure-eb-pte {inputs.pure_eb_pte_per_cut}
        --cosebis-pte {inputs.cosebis_pte_per_cut}
        --cl-pte {inputs.cl_pte_per_cut}
        --config {inputs.selected_config}
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_min_pte_scale_cut_scan
    type: metric
    format: json
    description: |
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration) as
      a function of the scale cut: the same 5%-quantile threshold on
      the per-realisation minimum PTE, evaluated on all 210 windows of
      the reporting grid `geomspace(1', 250', 21)` rather than at the
      fiducial window alone. Per window it carries θ_min, θ_max, the
      threshold, its 68% bootstrap and order-statistic intervals, the
      six per-statistic median PTEs, the number of reporting bins, and
      the reasons any statistic could not be formed.

      The COSEBIs are recomputed in each window from each
      realisation's [fine ξ_±](#outputs.mock_xi_fine), against a COSEBI
      covariance transformed on that window; holding them at their
      fiducial values would depress the threshold across the plane.
      C_ℓ^BB does not depend on the angular window, so its PTEs come
      unchanged from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics).

      The windows are the reporting grid's own bin edges (the
      [grid_bin_edges](#decisions.scale_cut_convention) convention),
      so the fiducial cell (edge indices 9, 16) is the window
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration)
      calibrates at; the two thresholds agree to 2e-11 relative. Under
      `rounded_arcmin` (12.0'/83.0') that cell would not be the
      fiducial window.

      The 20 single-bin windows are marked `comparable: false` and
      excluded from summaries: the COSEBI basis is too ill-conditioned
      over one reporting bin (median mock B_{n≤20} PTE 0.13 there,
      against ~0.45 on every window of two bins or more).
    inputs: [mock_per_mock_statistics, mock_xi_fine, mock_pure_eb_modes, xi_integration, cov_integration, pure_eb_semianalytic_data, cov_integration_mockmatched, pure_cov_mockmatched, min_pte_window_scan_script]
    decisions: [reference_covariance, mock_suite]
    recipe:
      # --reference-covariance selects the pair, exactly as it does for
      # mock_per_mock_statistics. There is no C_l member: the harmonic PTEs
      # arrive already formed in the per-mock statistics npz.
      command: >
        python src/workflow/scripts/min_pte_window_scan.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-xi-fine {inputs.mock_xi_fine}
        --mock-pure-eb-modes {inputs.mock_pure_eb_modes}
        --cosebis-xi-grid {inputs.xi_integration}
        --covariance {inputs.cov_integration}
        --pure-covariance {inputs.pure_eb_semianalytic_data}
        --covariance-mockmatched {inputs.cov_integration_mockmatched}
        --pure-covariance-mockmatched {inputs.pure_cov_mockmatched}
        --reference-covariance {decisions.reference_covariance}
        --xi-min-sep 0.5 --xi-max-sep 300.0 --xi-nbins 1000
        --reporting-theta-min 1.0 --reporting-theta-max 250.0 --reporting-edges 21
        --fiducial-window 9 16
        --nmodes 20 --precision 120 --global-alpha 0.05
        --cosebi-roots interpolate_ratio
        --processes 24
        --emit calibration --out-file {output}
      # Measured: ~85 s of CPU per window, 210 windows, i.e. ~5 CPU-hours.
      # 26 min wall on 12 processes on a contended node; ~15 min expected on
      # 24. Memory is dominated by the 2000x2000 xi covariance shared across
      # forked workers plus per-window blocks.
      resources: { cpus: 24, memory: "32GB" }

  - id: mock_campaign_evidence
    type: metric
    format: json
    description: |
      The campaign's summary statistics, derived from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics):
      per statistic, σ_emp/σ_ana, mean χ², PTE uniformity tests and the
      cross-statistic correlations. The findings' numbers are read
      from it.

      Covariance conventions per statistic: COSEBIs transform the ξ_±
      covariance with no Hartlap factor; the pure-mode blocks are
      sliced from the stored 120×120 matrix with Hartlap N = 2000, the
      [MC sample count](#decisions.mc_samples); C_ℓ^BB takes no Hartlap
      factor, its mock-matched reference being
      [cl_cov_mockmatched](#inputs.cl_cov_mockmatched). σ is reported
      on both the full range and the fiducial cut, so only the χ²
      statistics depend on the
      [adopted scale cuts](#../decisions.fiducial_scale_cuts).
    inputs: [mock_per_mock_statistics]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --from-stats {inputs.mock_per_mock_statistics}
        --emit evidence --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_sigma_ratio_figure
    type: figure
    format: pdf
    description: |
      Empirical σ over analytic σ, per
      COSEBI mode, per θ bin for ξ_±^B, and per ℓ band for
      C_ℓ^BB, with the fiducial cut shaded. Under
      `reference_covariance: mockmatched` it tests the analytic
      covariance amplitude; under `fiducial` it shows the effect of
      the galaxy-count mismatch.
    inputs: [mock_per_mock_statistics, mock_campaign_analysis_script, plotting_utils_script, paper_mplstyle]
    decisions: [reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --from-stats {inputs.mock_per_mock_statistics}
        --emit sigma-ratio-figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_validation_figure
    type: figure
    format: png
    description: |
      The paper's mock-validation figure, over every reporting bin of
      the three B statistics — COSEBI modes 1–20 (at the fiducial cuts,
      filled, and over 1–250′, open), ξ_+^B (filled) and ξ_-^B (open)
      on all reporting bins, C_ℓ^BB on all 32 bands — with scales
      outside the fiducial cuts shaded. Top row: across-realisation
      mean in units of the analytic (data) σ, with σ_emp/(σ_ana√N)
      error bars. Bottom row: σ_ana/σ_emp (below one means the
      analytic σ is tighter than the mock scatter), with ±1/√(2N)
      error bars; the lowest C_ℓ band (≈1.8) is dropped from this row
      only. Series are drawn in the crimson
      [pure_eb_data_vector_figure](#outputs.pure_eb_data_vector_figure)
      uses for ξ±^B; the harmonic axis has the C_ℓ data vector's
      square-root scale.

      Outside the cuts the analytic covariance degrades: σ_ana/σ_emp
      rises to ≈1.8 at the lowest bandpower and returns to unity only
      by ℓ ≈ 100, falls to ≈0.77 above 120′ in configuration space,
      and sits 20–30% low for the low-n full-range COSEBI modes. Inside
      the cuts every ratio is within ~17% of unity and every mean bias
      below 0.12σ. The full 32-band C_ℓ stack is read from
      [glass_mock_cl](#inputs.glass_mock_cl), since
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics)
      stores only the in-cut bands.
    inputs: [mock_per_mock_statistics, mock_campaign_evidence, glass_mock_cl, mock_validation_figure_script, plotting_utils_script, paper_mplstyle]
    decisions: [reference_covariance, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_validation_figure.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --campaign-evidence {inputs.mock_campaign_evidence}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --range full
        --output {output}
      resources: { cpus: 1, memory: "4GB" }

  # ── The raw ξ_± check, upstream of every mode filter ─────────────────────

  - id: mock_xi_reporting_cov_mockmatched
    type: data
    format: npz
    description: |
      The mock-matched ξ_± covariance
      ([cov_integration_mockmatched](#inputs.cov_integration_mockmatched))
      rebinned from the 1000-bin integration grid to the 20 reporting
      bins, `Cov_rep = B Cov_fine Bᵀ`, the
      [reference](#decisions.reference_covariance) for raw ξ_±. `B` is
      pair-weighted, matching TreeCorr's binning; the unweighted
      `pointwise` operator of the submitted pure-mode chain is written
      alongside as `cov_pointwise`, and the two σ agree to 1.3% at
      worst.
    inputs: [cov_integration_mockmatched, mock_xi_reporting, mock_xi_reporting_cov_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_reporting_cov_mockmatched.py
        --covariance {inputs.cov_integration_mockmatched}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --fine-min-sep 0.5 --fine-max-sep 300.0 --fine-nbins 1000
        --out-file {output}
      resources: { cpus: 2, memory: "16GB" }

  - id: mock_xi_input_theory
    type: data
    format: npz
    description: |
      The theory ξ_± the GLASS suite was generated from, on its
      reporting grid, rebuilt with CAMB under the generator's setup:
      the [cosmology snapshot](#inputs.cosmology_snapshot)'s Planck-18
      values, HMcode `mead2020_feedback` at log T_AGN = 7.8, A_s
      rescaled to σ_8 = 0.8102, and the fiducial
      [n(z)](#inputs.redshift_distributions).

      The transform is an explicit Bessel sum band-limited at the
      simulation's ℓ_max = NSide = 4096. An FFTLog transform would
      extrapolate past the last multipole and restore power the maps
      lack, which matters because ξ_- at 1′ is built almost entirely
      from ℓ ~ 10⁴. The unbanded transform (`xip_untruncated` /
      `xim_untruncated`) and the curved-sky FFTLog result are written
      alongside.
    inputs: [mock_xi_reporting, cosmology_snapshot, redshift_distributions, mock_xi_input_theory_script]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_input_theory.py
        --cosmology-json {inputs.cosmology_snapshot}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --cat-config src/cosmo_val/cat_config.yaml
        --out-file {output}
      resources: { cpus: 8, memory: "32GB" }

  - id: mock_xi_validation_figure
    type: figure
    format: png
    description: |
      Validation of the raw 20-bin ξ_± before any pure-mode or COSEBI
      filter. Row 1: θξ_±, the across-realisation mean against
      [the input theory](#outputs.mock_xi_input_theory), band-limited
      at the simulation's ℓ_max and unbanded. Row 2: (mean −
      theory)/σ_ana, a fraction of a single realisation's error bar,
      with σ_emp/(σ_ana√N) error bars as in
      [mock_validation_figure](#outputs.mock_validation_figure). Row
      3: σ_emp/σ_ana. σ_ana comes from the mock-matched
      [mock_xi_reporting_cov_mockmatched](#outputs.mock_xi_reporting_cov_mockmatched).
      Scales outside the fiducial 12–83′ cut are shaded.

      Above ≈6′ the mock mean reproduces the input theory to a few per
      cent with no trend; below it the drop of ξ_- (a factor ~100 at
      1′) is reproduced bin for bin by band-limiting the theory at
      ℓ = 4096, the simulation's resolution, wholly outside the
      fiducial cut.
    inputs: [mock_xi_reporting, mock_xi_input_theory, mock_xi_reporting_cov_mockmatched, mock_xi_validation_script, plotting_utils_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.mock_xi_reporting_cov_mockmatched}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_xi_validation_stats
    type: metric
    format: json
    description: |
      The numbers behind
      [mock_xi_validation_figure](#outputs.mock_xi_validation_figure),
      per reporting bin: mean ξ_± over theory, the residual in
      units of a single realisation's σ_ana and in units of
      σ_emp/√N, σ_emp, σ_ana and their ratio. Two further columns:

      - The shape-noise σ implied by the measured pair counts,
        σ_e²/√(2N_pair). The total σ over it rises from 1.0 at 1′ to 4.2 at
        221′ for raw ξ_+ as sample variance takes over, so shape noise
        is only 5.7% of the ξ_+ variance at 221′ and the footprint pair
        deficit moves σ by under 1% at every separation.
      - The galaxy count each bin's pair count implies for a
        uniform-density footprint of the fiducial area: 1.02 of the
        delivered count at 1′, falling monotonically to 0.87 at 221′ as
        annuli run off the footprint edge — the geometry effect the
        pure-mode scatter inherits at large θ.
    inputs: [mock_xi_reporting, mock_xi_input_theory, mock_xi_reporting_cov_mockmatched, mock_xi_validation_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.mock_xi_reporting_cov_mockmatched}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: mock_mean_vector_stats
    type: metric
    format: json
    description: |
      Per-statistic mean B in units of the analytic σ, its
      σ_emp/√N uncertainty, and the largest absolute normalised
      mean with the mode or bin it falls in.

      The mean-vector χ² is quoted on the full 20-bin reporting grid
      (`full_range`) and on the fiducial bins 9–15
      (`fiducial_window`). For the pure modes they differ: ⟨ξ_+^B⟩
      sits at ≈−0.1σ in the first three bins against a ≈0.055σ error,
      a small-scale residual the cut excludes, so ξ_+^B reads PTE 0.004
      on the full range and 0.13 inside the cut.
    inputs: [selected_config, mock_per_mock_statistics, scale_cuts_script]
    decisions: [reference_covariance, scale_cut_convention]
    recipe:
      command: >
        python src/workflow/scripts/mock_mean_vector_plot.py
        --stats {inputs.mock_per_mock_statistics}
        --label {decisions.reference_covariance}
        --config {inputs.selected_config}
        --scale-cut-convention {decisions.scale_cut_convention}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  # ── The mask-geometry test: the same split ───────────────────────────────

  # ── The noise budget behind the density finding ──────────────────────────

  - id: mock_vs_data_noise_table
    type: table
    format: csv
    description: |
      One row per catalogue — the fiducial v1.4.6.3 leak-corrected
      sample and the v1.4.6.3_v2 GLASS suite — carrying the galaxy
      count, the occupied nside-4096 sky, the area convention, n_eff
      under it, the per-component σ_e, and the two ratios that follow:
      noise power σ_e²/N and its square, the B-mode variance ratio
      (a mock B variance is pure shape noise, so it scales as
      (σ_e²/N)²). Read from the two CosmoCov inis and the footprint
      audit; both catalogues occupy one sky to within 0.3 deg², so the
      area cancels.

      This is the prediction in
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining):
      mock BB variance 0.7389 of the data's, tested against the
      measured ratios in
      [clbb_variance_ratios](#outputs.clbb_variance_ratios).
    inputs: [cosmocov_ini_data, cosmocov_ini_mockmatched, mock_footprint_audit]
    decisions: [mock_suite, fiducial_catalog]
    recipe:
      command: >
        python src/workflow/scripts/mock_vs_data_noise_table.py
        --cosmocov-ini-data {inputs.cosmocov_ini_data}
        --cosmocov-ini-mock {inputs.cosmocov_ini_mockmatched}
        --footprint-audit {inputs.mock_footprint_audit}
        --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: clbb_variance_ratios
    type: metric
    format: json
    description: |
      The measured mock-to-data C_ℓ^BB variance ratio over the 17
      bandpowers inside 300 ≤ ℓ ≤ 1600, two ways. The machinery ratio
      is the diagonal of
      [cl_cov_mockmatched](#inputs.cl_cov_mockmatched) over that of
      the data's [cl_cov_reporting](#inputs.cl_cov_reporting): what the
      covariance chain predicts at the mocks' noise. The empirical
      ratio is the sample variance of the suite's BB bandpowers
      ([glass_mock_cl](#inputs.glass_mock_cl)) over the same data
      diagonal. With no B signal, both are pure shape-noise ratios.
      Mean, median and per-band values. Independent of
      [reference_covariance](#decisions.reference_covariance), which it
      motivates.
    inputs: [cl_cov_mockmatched, cl_cov_reporting, glass_mock_cl]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      # Both covariances are read as their COVAR_BB_BB block; the l cut is
      # reconstructed with the same powspace edges the campaign uses, since
      # the covariance FITS carries no band metadata.
      command: >
        python src/workflow/scripts/clbb_variance_ratios.py
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --cl-cov-data {inputs.cl_cov_reporting}
        --cl-files "{inputs.glass_mock_cl}"
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  pte_threshold:
    from: ../pte_threshold

  pure_eb_integration_method:
    from: ../pure_eb_integration_method

  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights

  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits

  mc_samples:
    from: ../mc_samples

  pure_eb_covariance_method:
    from: ../pure_eb_covariance_method

  reference_covariance:
    label: "Analytic covariance the mock scatter is compared against"
    tags: [glass, covariance]
    rationale: |
      Which analytic covariance the mocks' empirical scatter is held
      against. The realisations carry 17% more galaxies than the data
      ([mocks_are_over_constraining](#findings.mocks_are_over_constraining)),
      so against the data covariance they would measure that count
      mismatch rather than the covariance's accuracy. The campaign
      therefore tests the covariance *machinery*: the same code that
      builds the fiducial covariance, run at the mocks' own noise, held
      against scatter known by construction. Mock-matching is two
      rebuilds of the fiducial primitives:

      | statistic | mock-matched reference | traces to |
      |---|---|---|
      | COSEBIs | the ξ_± covariance transformed by `cosebis_covariance_from_xipm_covariance` | the CosmoCov run |
      | ξ_+^B, ξ_-^B, ξ_tot^B | [pure_cov_mockmatched](#outputs.pure_cov_mockmatched), the 2000-sample MC propagation | the CosmoCov run |
      | C_ℓ^BB | [cl_cov_mockmatched](#inputs.cl_cov_mockmatched), NaMaster iNKA on a mock catalogue | itself |

      Five of the six statistics trace to one artifact, the
      [CosmoCov ξ_± run at the mocks' noise](#inputs.cov_integration_mockmatched),
      transformed for COSEBIs and MC-propagated through the Schneider
      (2022) filters for the pure modes. C_ℓ^BB needs no density
      parameter: NaMaster reads the mock catalogue's weighted count map
      and noise bias directly.

      The CosmoCov rebuild changes only the count: it keeps the data's
      `area = 2894.03` deg² and sets `source_n_gal = 60 423 575 /
      2894.03 deg² = 5.793 arcmin⁻²`. Shot noise depends on n_gal × A,
      so the area convention cancels there, and f_sky enters the
      cosmic-variance term identically on both sides of the mock
      comparison. Mock and data occupy one footprint (data 2750.65 deg²,
      mock 2709.91 deg², overlap 2703.17 deg²), so the count ratio —
      51.65 M weight-effective data galaxies against 60 423 575 mock
      galaxies, σ_e agreeing to 0.2% (0.26757 vs 0.26822) — sets the
      noise difference: mock BB variance 0.726 of the data's from the
      machinery, 0.716 empirically
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)).

      The data covariance keeps the 2894.03 deg² footprint convention
      shared with Papers III and IV rather than the 2750.65 deg² the
      galaxies occupy, a choice worth about 5% of the sample-variance
      term and outside this campaign.

      `mockmatched` is the default. `fiducial` is a diagnostic: it is
      the only place mock scatter meets the data covariance, and the
      ratio between the two runs' σ ratios recovers the count ratio.
    default: mockmatched
    options:
      mockmatched:
        label: "Mock-matched"
        description: |
          The fiducial covariance machinery rerun at the mocks' own
          noise (the CosmoCov run, its MC propagation, and the
          mock-catalogue NaMaster covariance).
      fiducial:
        label: "Fiducial data covariance"
        description: |
          The fiducial v1.4.6.3 leak-corrected covariances at blind A,
          unmodified; diagnostic only, since it measures the
          galaxy-count difference rather than the covariance's
          accuracy.

  mock_suite:
    label: "GLASS realisation suite"
    tags: [glass]
    rationale: |
      Which suite of 350 GLASS lognormal realisations to validate on.
      The v1.4.6.3_v2 suite is generated on the fiducial catalog's
      footprint and backs every product here. The v1.4.6 suite is
      excluded: it sits on a 1600 deg² mask that is not the data's
      footprint and carries a third fewer galaxies than the catalog.
    default: v1_4_6_3_v2
    options:
      v1_4_6_3_v2:
        label: "v1.4.6.3_v2 suite"
        insights: [tessore23_glass_lognormal_mocks]
        description: |
          350 realisations of 60 423 575 unit-weight galaxies on the
          fiducial footprint, 17% more than the data's 51.65 M
          weight-effective galaxies; ships catalogues, 20-bin ξ_± and
          per-mock Cℓ, with a directly computed mock C_ℓ^BB covariance
          ([cl_cov_mockmatched](#inputs.cl_cov_mockmatched)). 
      v1_4_6:
        label: "v1.4.6 suite (submitted)"
        excluded: true
        excluded_reason: |
          35 078 729 galaxies per realisation on a 1600.33 deg² mask
          that is not the data's footprint (the generator's default
          6.0905 arcmin⁻² on a smaller sky). It is the suite the
          submitted mock description rests on; v2 sits far closer to
          the catalog's count.

prior_insights:

  paper_iv_inka_overestimates_variance:
    id: paper_iv_inka_overestimates_variance
    label: "Paper IV's iNKA covariance overestimates the small-scale variance"
    claim: |
      The Gaussian iNKA covariance adopted by UNIONS Paper IV
      (harmonic-space cosmology) gives larger small-scale
      uncertainties than either `OneCovariance` or the GLASS mocks —
      15% against the mocks, around 20% against `OneCovariance` — and
      Paper IV attributes the gap to iNKA accounting for a spatially
      varying galaxy number density, which breaks the stationary-noise
      assumption the other two estimates make.
    notes: |
      The same GLASS suite is on the other side of that comparison and
      is under-noised by a comparable factor; the two effects add (see
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining)).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev_main_text
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "However, the estimate computed from the Gaussian part of iNKA tends to overestimate the variance."
        location: { page: 6 }
      - id: ev_caption_15
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "There is a discrepancy of 15% between the NaMaster estimate and the one obtained from mocks."
        location: { page: 6 }
      - id: ev_appendix_20
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "the iNKA covariance used in this work overestimates by around 20% the uncertainty compared to what is obtained from OneCovariance and GLASS simulations"
        location: { page: 14 }
      - id: ev_mechanism
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "An underlying assumption in OneCovariance and GLASS mocks is that the noise is stationary. This is not true if the object density varies strongly across the sky."
        location: { page: 14 }


  tessore23_glass_lognormal_mocks:
    id: tessore23_glass_lognormal_mocks
    claim: |
      GLASS builds a light cone of matter and weak-lensing fields as
      nested shells, transforming Gaussian random fields (including
      lognormal) to essentially arbitrary precision, and reproduces
      the two-point statistics of clustering and weak lensing at the
      per-cent level. Its realisations are therefore an adequate
      systematics-free reference for B-mode estimator and covariance
      validation, but carry only lognormal non-Gaussianity.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2302.01942"
        quote:
          exact: "also introduces a new technique to generate transformations of Gaussian random fields (including lognormal) to essentially arbitrary precision"
        location:
          page: 1
      - id: ev2
        doi: "10.48550/arXiv.2302.01942"
        quote:
          exact: "readily produces simulated data sets with per cent-level accurate two-point statistics of galaxy clustering and weak lensing"
        location:
          page: 1
    scope: "Tessore et al. 2023, OJAp 6, 11 (abstract); the UNIONS suite itself is Paper III's."


findings:

  mock_xi_matches_input_theory_above_band_limit:
    id: mock_xi_matches_input_theory_above_band_limit
    label: "Mock ξ_± matches input theory above the band limit"
    claim: |
      Above ≈6′ the across-realisation mean ξ_± of the unmasked GLASS
      realisations reproduces the theory the suite was generated from
      to within a few per cent with no trend, so the mocks carry no
      ξ_± bias into the null tests. Below ≈6′ they fall away from the
      unbanded prediction, ξ_- most strongly, entirely because the
      maps are band-limited at ℓ_max = NSide = 4096; these scales lie
      outside the fiducial cut.
    notes: |
      350 realisations. Inside the 12′–83′ window |mean/theory − 1| ≤
      0.03 for both ξ_+ and ξ_-; bin by bin |mean − theory| ≤ 0.33
      σ_ana (ξ_+) and ≤ 0.46 σ_ana (ξ_-) against an error of the mean
      of ≈0.05 σ_ana, scattered in sign. That is the size of the
      band-limited transform's own ±2–3% ringing (2% of ξ_+ at 18′ is
      0.30 σ_ana), so it bounds a mock ξ_± bias at a third of an error
      bar rather than measuring one.

      Below ≈6′: ξ_- at 1.2′ is ~100 times smaller than the unbanded
      prediction, since ξ_-(1′) is built almost entirely from ℓ ~ 10⁴.
      Over the first six reporting bins the theory's band ratio (cut at
      ℓ = 4096) runs 0.006, 0.020, 0.071, 0.166, 0.40, 0.81, against a
      measured mock mean over unbanded theory of ≈0, 0.00, 0.089, 0.208,
      0.49, 0.86 — tracking across two orders of magnitude, with the
      mocks 10–20% above the sharp cut, as lognormal small-scale power
      and an imperfectly sharp band edge would give. This is why
      [mock_xi_input_theory](#outputs.mock_xi_input_theory) is an
      explicit band-limited sum: an FFTLog that extrapolates past the
      last multipole makes the same comparison look like a
      catastrophic small-scale failure. Any use of this suite below
      ≈6′, in ξ_- especially, measures the band limit.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats
      - id: ev2
        artifact: mock_xi_validation_figure

  mock_xi_scatter_falls_below_analytic_at_large_theta:
    id: mock_xi_scatter_falls_below_analytic_at_large_theta
    label: "Mock ξ_+ scatter falls below analytic σ above 100′"
    claim: |
      Against the
      [mock-matched reference covariance](#outputs.mock_xi_reporting_cov_mockmatched),
      the mocks' raw ξ_± scatter matches the analytic Gaussian σ inside
      the fiducial window, but above 100′ the ξ_+ scatter falls below
      it while ξ_- stays near unity. The deficit is neither a density
      nor a footprint effect, and reads as the realisations carrying
      less large-scale sample variance than the analytic covariance
      predicts — a reading of the residual, not an established
      mechanism.
    notes: |
      σ_emp/σ_ana inside 12′–83′: 0.94–1.03 (ξ_+), 0.99–1.12 (ξ_-).
      Against the *data* covariance the same ratios read 0.87–0.98 and
      0.87–0.97, the suite's galaxy excess
      ([mocks_are_over_constraining](#findings.mocks_are_over_constraining)),
      which is why mock validation must not use it. Above 96′ ξ_- sits
      at 0.98–1.07 and ξ_+ at 0.82–0.86.

      Not footprint geometry: the measured pair deficit at 221′ is 13%,
      but shape noise is only 5.7% of the ξ_+ variance there, so it
      moves σ by 0.4% (under 1% at every separation). ξ_+ above 100′
      draws on the lowest multipoles, where a lognormal shell
      construction on a single footprint is least trusted.

      The pair counts themselves fall away from the uniform-density,
      no-edge prediction: the implied galaxy count per bin is flat
      below ≈3′ and declines monotonically to 0.87 of it by 221′. That
      decline (not its absolute level, which floats with the area
      convention) is the footprint-edge effect the noise-only pure-mode
      statistics inherit at large θ; it is invisible in raw ξ_± for
      the reason above.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats

  mock_ptes_skew_low_by_ng_term:
    id: mock_ptes_skew_low_by_ng_term
    label: "Configuration-space PTEs skew mildly low; C_ℓ^BB PTEs are uniform"
    claim: |
      On the clean realizations the C_ℓ^BB PTEs are uniform, while the
      configuration-space PTEs skew mildly low because the analytic σ
      there is slightly smaller than the mock scatter, which raises χ²
      by the inverse square of their ratio. Calibrating the passing
      threshold p_thr on the same realizations partially absorbs this
      skew.
    notes: |
      350 GLASS v1.4.6.3_v2 realisations against the mock-matched
      reference covariance
      ([mock_campaign_evidence](#outputs.mock_campaign_evidence)).
      ⟨χ²⟩/ν: B_{n≤6} 1.105, B_{n≤20} 1.073, ξ_+^B 1.197, ξ_-^B
      1.131, ξ_tot^B 1.148, C_ℓ^BB 0.987 (the paper's 1.07–1.20 for
      configuration space). KS p-values for PTE uniformity: B_{n≤6}
      2.7×10⁻³, B_{n≤20} 9.2×10⁻⁵, ξ_+^B 2.4×10⁻⁹, ξ_-^B 1.4×10⁻⁴,
      ξ_tot^B 2.8×10⁻¹⁰, C_ℓ^BB 0.79.

      The configuration-space excess has the size of the non-Gaussian
      term the Gaussian covariance omits: on the 20-bin reporting grid
      the (G+NG)/G diagonal ratio inside 12′–83′ averages 1.102 (ξ_+)
      and 1.105 (ξ_-), a non-Gaussian share of 9% of the diagonal
      variance there and 7% over all bins. The paper prints 11% and 8%
      (`ngFractionDiagonalFiducial`, `ngFractionDiagonalAll`); the
      baseline's own macro file gives 9% and 7%.

      p_thr is set so a clean sample fails 5% of the time; the paper
      adopts p_thr = 0.01, conservative for nearly all scale-cut
      combinations, against a calibrated 0.006 at the fiducial cuts
      ([mock_min_pte_calibration](#outputs.mock_min_pte_calibration)).
      The observed minimum, ξ_-^B at 0.0193, sits at or above the
      minimum of 38 of 350 clean realisations (10.9% one-sided; 58,
      16.6%, two-sided); the 5% threshold is 0.0058 one-sided and
      0.0034 two-sided.
    created_at: "2026-08-31T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 8.379664071517078'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"pvalue": 0.7939539191651337'
      - id: ev3
        artifact: mock_min_pte_calibration
        quote:
          exact: '"threshold_one_sided": 0.005773478384709799'
    scope: "v1.4.6.3_v2 suite, mock-matched reference covariances, adopted scale cuts, baseline estimator."

  mocks_are_over_constraining:
    id: mocks_are_over_constraining
    label: "Mock galaxy density 17% above the data's"
    claim: |
      Because of an error in the catalog generation, the GLASS
      realizations' galaxy number density is 17% higher than the
      data's, so their shape noise and B-mode scatter are lower. Mock
      scatter is therefore compared only against analytic covariances
      recomputed at the realizations' galaxy density.
    notes: |
      **Size.** On a footprint shared with the data to better than 0.3
      deg², the v1.4.6.3_v2 suite holds 60 423 575 unit-weight galaxies
      against the fiducial catalogue's 51.65 million weight-effective
      galaxies. Per-component σ_e agrees to 0.2% (0.267568 data,
      0.268175 mock), so the count ratio is the whole noise difference:
      predicted shape-noise power σ_e²/N is 0.8596 of the data's and
      the (pure-noise) B-mode variance 0.7389 of it
      ([mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table)).
      Measured, as 17-band means over 300 ≤ ℓ ≤ 1600
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)): the
      covariance machinery at the mocks' noise gives a C_ℓ^BB variance
      ratio of 0.725, and the 350 realisations scatter at 0.716 of the
      data's variance. Held against the data covariance, the mocks
      would appear to validate an error bar roughly 15% too large;
      [reference_covariance](#decisions.reference_covariance) =
      `mockmatched` avoids this.

      **Origin.** The generator (`make_unions_glass_sim.py`) defaults
      `--neff` to 6.0905 arcmin⁻², the catalogue n_eff of the 2405 deg²
      area convention (4.957 at the current 2894 deg²), and the run
      scripts do not override it. It applies that density to an
      occupied-pixel nside-4096 mask of 2757.25 deg²: 6.0905 × 2757.25 ×
      3600 = 60.45 M, against 60.27–60.42 M realised per realisation.
      The catalogue's A = 2894.03 deg² is the full footprint mask, in
      which roughly 5% of pixels hold no galaxy; data galaxies occupy
      2750.65 deg² of it. Paper III and Paper IV describe the mocks as
      matching the data's number density; neither prints a numeric
      mock density, and Sacha Guerrini has confirmed the excess.

      **Areas.** Quoted areas range over 2405, 2757, 2894 and 2949 deg²
      but describe one sky: data galaxies occupy 2750.65 deg², mock
      galaxies 2709.91 deg², their overlap 2703.17 deg², and only 0.26
      deg² of the data footprint lies outside the mock mask. n_eff × A
      is the convention-free quantity (4.9573 arcmin⁻² × 2894.03 deg²
      and the weighted H12 4.8636 × 2949.79 deg² both give 51.65 M). The
      "n_eff = 3.3697 arcmin⁻²" in the campaign code is the v1.4.6
      count divided by 2894 deg², not a density.

      **Paper IV.** Paper IV finds its Gaussian iNKA covariance
      overestimates the small-scale variance relative to the GLASS
      mocks (15%) and `OneCovariance` (~20%), attributing it to iNKA's
      treatment of a spatially varying number density
      ([paper_iv_inka_overestimates_variance](#prior_insights.paper_iv_inka_overestimates_variance)).
      The density excess makes the mocks' variance ~26% low by
      construction, an independent contribution in the same direction;
      part of that gap is plausibly the mocks being under-noised. The
      two effects are additive and nothing here quantifies the split.

      **The excluded v1.4.6 suite** ([mock_suite](#decisions.mock_suite))
      carries 35 078 729 galaxies, 32% fewer than the data, on a
      1600.33 deg² mask: the same 6.0905 default on a smaller sky
      (6.0905 × 1600.33 × 3600 = 35.08 M). Nothing in the campaign rests
      on it.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_vs_data_noise_table
        quote:
          exact: "0.85961"
      - id: ev2
        artifact: clbb_variance_ratios
        quote:
          exact: '"machinery_variance_ratio_mean": 0.7249533827835264'
      - id: ev3
        artifact: clbb_variance_ratios
        quote:
          exact: '"empirical_variance_ratio_mean": 0.7157060122347197'
      - id: ev4
        artifact: mock_sigma_ratio_figure
    scope: "The delivered GLASS v1.4.6.3_v2 suite against the v1.4.6.3 leak-corrected fiducial catalog; galaxy counts, σ_e and footprint only, and the shape-noise scaling that follows from them."

  covariance_amplitude_validated:
    id: covariance_amplitude_validated
    label: "Analytic σ matches the mock scatter at the fiducial cuts"
    claim: |
      At the fiducial cuts the analytic σ of each B-mode statistic
      matches the scatter across the realizations, slightly smaller in
      configuration space and in agreement in harmonic space. The
      agreement degrades on large scales outside the fiducial cuts,
      which PSF leakage already excludes (Paper I), so the
      miscalibration does not affect the choice of scale cuts.
    notes: |
      Median ratio of analytic to mock σ over bins (paper): 0.92–0.95
      in configuration space, 1.01 in harmonic space. Outside the cuts
      the analytic σ is about 17% too small for the first COSEBI mode
      and for ξ_±^B above 100′, and too large for C_ℓ^BB below ℓ ≈ 100,
      where E-to-B leakage is treated only approximately (Nicola et al.
      2021).

      From the 350 GLASS v1.4.6.3_v2 realisations against the
      mock-matched reference covariance, as σ_emp/σ_ana (the inverse of
      the paper's ratio): COSEBI B_1–B_20 median 1.055 (range
      0.974–1.086); ξ_+^B over the seven fiducial-cut θ bins median
      1.087 (1.000–1.164); ξ_-^B median 1.059 (0.978–1.127); C_ℓ^BB over
      the 17 fiducial-cut bands median 0.993 (0.926–1.086). Inverted,
      these are the paper's 0.95, 0.92, 0.94 and 1.01.

      This validates the covariance machinery: the same CosmoCov /
      NaMaster chain that builds the fiducial covariance, pointed at
      the mocks' noise, reproduces their scatter to ~10%. It does not
      say the mock and data covariances agree; they differ by the
      galaxy-count excess.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 1.0550671384448764'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 0.9926463379482149'
    scope: "350 GLASS v1.4.6.3_v2 realisations, mock-matched reference covariance, fiducial scale cuts."

  chi2_machinery_conservative:
    id: chi2_machinery_conservative
    label: "The null tests are conservative"
    claim: |
      The null tests use only the Gaussian part of the covariance,
      which underestimates the true variances by omitting connected
      trispectrum and super-sample terms. They are therefore
      conservative: a test that passes with the Gaussian-only
      covariance would generally pass with a more complete covariance
      estimate, as the simulations confirm.
    notes: |
      The paper puts the non-Gaussian share of the ξ_± diagonal
      variance within the fiducial cuts at about 11%; the baseline's
      reporting-grid covariances give 9% (see
      [mock_ptes_skew_low_by_ng_term](#findings.mock_ptes_skew_low_by_ng_term)).

      Across the 350 GLASS v1.4.6.3_v2 realisations, against the
      mock-matched reference covariance, the mean χ² exceeds ν for
      five of the six statistics — 6.63 against ν = 6 for B_{n≤6},
      21.46 against 20 for B_{n≤20}, 8.38 against 7 for ξ_+^B, 7.91
      against 7 for ξ_-^B, 16.07 against 14 for ξ_tot^B — and falls
      just below for C_ℓ^BB, 16.78 against 17, whose PTEs pass a KS
      test of uniformity at p = 0.79. A mean χ² above ν makes the
      reported PTEs lower than the true tail probabilities. The
      `fiducial` selection of
      [reference_covariance](#decisions.reference_covariance) would
      inflate these means by the galaxy-count difference rather than
      any covariance error; it is not run on this suite.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 6.631945648377122'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 16.775046279157934'
    scope: "350 GLASS v1.4.6.3_v2 realisations at fiducial scale cuts, mock-matched reference covariance."

  tests_are_not_redundant:
    id: tests_are_not_redundant
    label: "Null-test statistics are not redundant"
    claim: |
      The six B-mode test statistics are not perfectly correlated
      across the clean realizations: statistics from different
      estimator families correlate only moderately, and even pairs
      sharing a data vector stay well below unity. This is why the
      minimum PTE over the six skews low and its threshold is
      calibrated on the mocks
      ([pte_threshold](#../decisions.pte_threshold)).
    notes: |
      χ² Pearson correlations across the 350 v1.4.6.3_v2 realisations
      (`correlations.chi2.pearson` in `mock_campaign_evidence`).
      Different families, 0.25–0.53: 0.41 B_{n≤6}–ξ_+^B, 0.37
      B_{n≤6}–C_ℓ^BB, 0.35 ξ_+^B–C_ℓ^BB, 0.46 ξ_-^B–C_ℓ^BB, 0.53
      ξ_tot^B–C_ℓ^BB. Shared data vector: 0.72 ξ_+^B–ξ_tot^B and 0.68
      ξ_-^B–ξ_tot^B (nested by construction), 0.53 B_{n≤6}–B_{n≤20}.
      The PTE Pearson matrix tells the same story (0.37 for B_{n≤6}
      with C_ℓ^BB).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: "0.723441470177607"
    scope: "350 GLASS v1.4.6.3_v2 realisations, fiducial scale cuts, six-statistic χ² and PTE stacks."

