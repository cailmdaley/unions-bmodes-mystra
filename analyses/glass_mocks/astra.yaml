  - id: mock_sigma_ratio_figure
    type: figure
    format: pdf
    description: |
      The comment-7 figure: empirical σ over analytic σ, per
      COSEBI mode, per θ bin for ξ_±^B, and per ℓ band for
      C_ℓ^BB, with the fiducial cut shaded. Under
      `reference_covariance: mockmatched` this is the panel that
      says the paper's covariance amplitude is right; under
      `fiducial` it is the panel that shows what the galaxy-count
      mismatch costs — and which way it points, since the two
      suites sit on opposite sides of the data.
