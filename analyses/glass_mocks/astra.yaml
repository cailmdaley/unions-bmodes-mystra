version: "0.0.14"
name: "GLASS mock covariance campaign"
description: |
  Paper II asserts (Sect. 3.7) that the scatter of the 350 GLASS
  lognormal realisations is "comparable to the fiducial error
  bars" for all three B-mode statistics, and reports PTEs from a
  χ² machinery whose calibration is never demonstrated. The A&A
  referee asked for the numbers behind both claims (comments 7
  and 13), for the empirical correlation between the six test
  statistics that comments 1, 6 and 9 lean on qualitatively, and
  (comment 4) whether the masked catalog's pure-mode failures
  could be mask geometry rather than contamination.

  This sub-analysis is the one extended reduction that answers
  all four. The realisations are systematics-free and carry no
  B power by construction, so every B statistic they develop is
  estimator noise: their across-realisation scatter is the
  empirical σ to hold the analytic σ against, their per-mock χ²
  values are a sampling distribution to test the PTE convention
  against, and their pure-B response to a second footprint is a
  pure geometry measurement.

  The reduction is a scatter/gather: each realisation is measured
  independently — one TreeCorr run per mock, whose stacked result is
  the [ξ_± ensemble](#outputs.mock_xi_fine) — and the suite is then carried as
  stacked arrays through the paper's own ξ_± → COSEBI and ξ_± →
  pure-E/B transforms, until one compute pass compares all six
  statistics against analytic covariances and everything reported is
  derived from its table. Which covariance is the
  [decision](#decisions.reference_covariance) that turns out to
  be the whole ballgame. The realisations do not carry the
  fiducial catalog's galaxy count on the fiducial catalog's sky —
  they carry 17% more — so holding their scatter against the
  paper's own covariance would measure that count mismatch rather
  than anything about the covariance. What the campaign tests
  instead is the covariance *machinery*: the mocks' scatter,
  known by construction, against a covariance the paper's own
  CosmoCov / MC / NaMaster chain builds for the mocks' own noise.

  The count mismatch itself is reported as a
  [finding](#findings.mocks_are_over_constraining): the submitted
  description of these mocks asserts a density match that direct
  measurement does not support, and the direction matters — the
  suite is *quieter* than the data, so its scatter over-constrains,
  and any error bar read off it without mock-matching is too small.
tags: [glass, mocks, covariance, referee]

inputs:

  - id: glass_mock_realisations
    from: ../glass_mock_realisations

  - id: glass_mock_catalogs
    type: data
    description: |
      The catalog member of the
      [GLASS mock family](#inputs.glass_mock_realisations): one
      HEALPix-4096 source catalogue per realisation (`RA`, `Dec`,
      `e1`, `e2`, `w` in the `SOURCE_CATALOGUE` HDU), produced by
      Sacha Guerrini. These are the raw shear catalogues, not
      Sacha's precomputed data vectors — the campaign needs the
      fine 1000-bin integration grid that the stored 20-bin ξ_±
      cannot supply, so ξ_± is recomputed from the catalogues
      here.

      A catalogue holds 60 423 575 unit-weight rows
      (`SOURCE_CATALOGUE` `NAXIS2`, realisation 00001) against
      the fiducial catalog's 61 378 891 rows / 51.65 M
      weight-effective galaxies on the same footprint. The
      superseded [v1.4.6 suite](#decisions.mock_suite) held
      35 078 729.
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/unions_glass_sim_*_4096.fits"

  - id: glass_mock_xi_reporting
    type: data
    description: |
      Sacha's precomputed 20-bin TreeCorr ξ_± per realisation on
      the paper reporting grid. The pure-E/B transform needs both
      grids: this one defines the reporting bins the six output
      blocks land on, and the locally recomputed fine ξ_±
      supplies the integration grid the Schneider (2022)
      integrals run over. The v1.4.6 member of the same family is
      what the covariance sub-analysis stacks for
      [cov_glass_xi_reporting](#../covariance.outputs.cov_glass_xi_reporting).

      Both suites' copies of this file also carry the campaign's
      cheapest measurement of the density difference between
      them: at fixed θ the v1.4.6 / v1.4.6.3_v2 weighted
      pair-count ratio is 0.349, flat across all 20 bins, which
      is what a 0.581 galaxy-count ratio on a *shared* footprint
      predicts and is the direct evidence that the two suites
      differ in density rather than in sky coverage.
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/xi_glass_mock_*_4096_nbins=20.fits"

  - id: glass_mock_xi_fine_measured
    type: data
    description: |
      The suite's fine ξ_±, measured: TreeCorr on the 1000-bin
      integration grid over [0.5', 500'] for each of the 350
      realisations, 60 M galaxies apiece. The one product of this
      campaign the delivered suite does not ship, and the one the
      COSEBI and pure-E/B filters cannot do without.

      Read rather than remade. These files were written 21–23
      August 2026 by the snakemake pipeline this analysis was
      migrated from, by `run_glass_mock_2pcf.py` — the same script
      the recipe here would call, on the same catalogues, on the
      same grid (`r_nom` 0.5017 … 498.28, ratio 1.006932). The
      measurement is untouched by anything the migration changed:
      it is a two-point count, upstream of every estimator
      decision the campaign forks on. Remaking it costs 10–20
      core-hours per realisation — 5 000 for the suite, plus ~700
      for the 50-realisation masked footprint — to reproduce bytes that already
      exist. The seam is held honest by
      [mock_xi_fine_provenance](#outputs.mock_xi_fine_provenance),
      which re-measures one realisation under this spec and
      differences it against the stored one.
    source: "/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/glass_mock_v1.4.6.3_v2/gg_glass_mock_*_nbins=1000.fits"

  - id: glass_mock_cl
    type: data
    description: |
      The pseudo-Cℓ member of the GLASS family: one npy block
      (EE/BB among its rows) per realisation. The campaign reads
      the BB row as its sixth statistic. The optional NaMaster
      cross-check the gather can run against locally recomputed
      bandpowers is inactive for this suite, which ships no
      per-mock `pseudo_cl_*` files.
    source: "/n09data/guerrini/glass_mock_v1.4.6.3_v2/results/cl_glass_mock_*_4096.npy"

  - id: v148_pixel_mask
    type: data
    description: |
      Bit-packed boolean HealSparse union mask (nside 131072)
      encoding the v1.4.8 star-halo/structure cuts — v1.4.8 is
      v1.4.6.3 plus these cuts. Applied to the mock
      catalogues to build the second footprint of the
      [mask-geometry test](#outputs.mask_geometry_evidence).
      Validated 2026-08-23 against the six per-bit maps (99.74%
      pixel agreement) and against the real catalogues: it keeps
      85.4% of v1.4.6.3 rows where the real v1.4.8 keeps 87.8%,
      the residual being pixelised mask versus per-object flags.
      `workflow/config/config.yaml.pixel_mask.source_file`.
    source: "/n17data/UNIONS/WL/masks/mask_r_nside131072.hsp"

  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_reporting
    from: ../two_point.xi_reporting

  - id: cov_integration_g
    from: ../covariance.cov_integration_g

  - id: pure_eb_semianalytic_data
    from: ../pure_eb.pure_eb_semianalytic_data

  - id: pure_eb_pte_per_cut
    from: ../pure_eb.pure_eb_pte_per_cut

  - id: cosebis_pte_per_cut
    from: ../cosebis.cosebis_pte_per_cut

  - id: cl_pte_per_cut
    from: ../cl_bb.cl_pte_per_cut

  - id: cl_cov_reporting
    from: ../covariance.cl_cov_reporting

  - id: redshift_distributions
    from: ../redshift_distributions

  - id: cosmology_snapshot
    from: ../covariance.cosmology_snapshot

  - id: cov_integration_mockmatched
    type: data
    description: |
      The [cov_integration_g](#inputs.cov_integration_g) CosmoCov
      run repeated at the mock suite's own noise level — the ξ_±
      half of the mock-matched reference covariance, and the
      first of the three per-statistic channels tabulated in the
      [reference_covariance](#decisions.reference_covariance)
      rationale. It is the *same* CosmoCov machinery that
      produces the paper's own covariance, driven from a
      `cat_config` survey entry (`SP_v1.4.6.3_mockv2`) carrying
      the mocks' noise instead of the data's: `source_n_gal =
      5.79308 arcmin⁻²` and `sigma_e = 0.37926` at the fiducial
      `area = 2894.0304 deg²`.

      That n_gal is a galaxy count wearing density units — the
      area convention is held fixed and only the count moves — so
      the convention-free reading is 60.36 M galaxies on the
      common footprint, 0.1% below the 60 423 575 actually
      delivered and therefore 0.2% low in variance. σ_e matches
      the mocks' own 0.37926 total (0.26817 per component). The
      superseded `SP_v1.4.6.3_mockmatched` entry alongside it
      carries the v1.4.6 suite's count (3.3697 arcmin⁻², 35.1 M)
      and must not be used here. See
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining).

      Declared as external data rather than as an output because
      the CosmoCov chain reaches it through a `cat_config` entry
      that this reproduction does not carry; the pure-E/B half
      *is* re-derivable here and is declared as
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked_processed.txt"

  - id: cl_cov_mockmatched
    type: data
    description: |
      The mock-matched C_ℓ^BB covariance for the
      [v2 suite](#decisions.mock_suite), computed by pointing the
      paper's own NaMaster iNKA primitive
      (`generate_pseudo_cl_cov.py`, the producer of
      [cl_cov_reporting](#inputs.cl_cov_reporting)) at GLASS v2
      realisation 00001. That primitive is entirely
      catalogue-driven — its mask is the weighted galaxy-count map
      and its noise bias is Ω_pix ⟨Σ_i w_i² σ_{e,i}²⟩ — so no
      number density and no area convention enters, and the mock
      covariance is a direct measurement rather than a rescale of
      the data's. It retires the hand-fed 0.7325 factor the
      earlier v2 gathers used, which is no longer the method:
      the two agree to 0.9% (computed mock/data variance ratio
      0.726 over 300 ≤ ℓ ≤ 1600, against the 350-realisation
      empirical truth of 0.716 — both measured in
      [clbb_variance_ratios](#outputs.clbb_variance_ratios)) and
      the suite-level min-PTE
      calibration moves by less than its own error bar, so the
      switch changes no conclusion — it removes an
      extrapolation, not an error.
    source: "/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/glass_mock_v1.4.6.3_v2/pseudo_cl_cov_glass_mock_v2_00001_powspace_nbins=32.fits"

  - id: cosmocov_ini_data
    type: data
    description: |
      The CosmoCov ini the fiducial ξ_± covariance run was driven
      from. Its survey block is where the data catalogue's noise is
      declared to the covariance chain — `area = 2894.0303815288
      deg²`, `source_n_gal = 4.957279 arcmin⁻²`, `sigma_e =
      0.3783980` (total, i.e. 0.267568 per component) — which makes
      it the authoritative statement of what noise the paper's
      covariance was built at, rather than a number quoted about it.
      Read by [mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table).
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked.ini"

  - id: cosmocov_ini_mockmatched
    type: data
    description: |
      The same ini for the `SP_v1.4.6.3_mockv2` run that produced
      [cov_integration_mockmatched](#inputs.cov_integration_mockmatched):
      the identical machinery at the mocks' own noise, `source_n_gal
      = 5.7930820 arcmin⁻²` and `sigma_e = 0.3792561` at the same
      `area = 2894.0303815288 deg²`. The pair of inis is the cleanest
      statement of the count mismatch that exists on disk, because
      the area convention is literally held fixed between them and
      only the count moves.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_SP_v1.4.6.3_mockv2_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked.ini"

  # ── The figure scripts, declared so that editing one cascades ────────────
  # An output's identity is its recipe string and its decisions, so a restyled
  # plotting script changes nothing lc can see and the materialised figure
  # keeps the old look. Declaring each script as an input puts its bytes in
  # the output's `input_versions`, which is what makes an edit land the figure
  # `stale`. Only the figure outputs take these: the expensive compute passes
  # deliberately do NOT, so a plotting change never triggers a recompute.

  - id: scale_cuts_script
    from: ../scale_cuts_script

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: plotting_utils_script
    type: data
    description: |
      The shared paper plotting module: the matplotlib style path,
      the A&A column widths, the validated categorical colours and
      the scatter-with-error-bar mark spec every figure below
      draws from. An input to all of them, because a change here
      changes all of them.
    source: "./src/workflow/scripts/plotting_utils.py"

  - id: min_pte_window_scan_script
    type: data
    description: |
      The scale-cut scan of the min-PTE calibration: for every window
      on the reporting grid it re-forms all six null-test statistics
      per realisation — recomputing the COSEBIs *inside each window*
      rather than carrying the fiducial values across — and reads the
      5% quantile of the per-realisation minimum. An input to both
      outputs below, because a change here changes both.
    source: "./src/workflow/scripts/min_pte_window_scan.py"

  - id: pure_eb_scan_variants_script
    type: data
    description: |
      The decision scan's variant table (which method/geometry/weights
      triples run, and which are dropped and why). An input to every
      scan stage so that adding or removing a variant restales the
      looped outputs that iterate over it.
    source: "./src/workflow/scripts/pure_eb_scan_variants.py"

  - id: mock_campaign_analysis_script
    type: data
    description: |
      The campaign script. Declared as an input to the two figures
      it renders — the σ-ratio and PTE-uniformity panels — and
      deliberately not to
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics),
      whose four-hour compute pass must not rerun for a restyle.
    source: "./src/workflow/scripts/mock_campaign_analysis.py"

  - id: mock_mean_vector_plot_script
    type: data
    description: |
      The mean-B-vector script, renderer of
      [mock_mean_vector_figure](#outputs.mock_mean_vector_figure).
    source: "./src/workflow/scripts/mock_mean_vector_plot.py"

  - id: mock_min_pte_calibration_script
    type: data
    description: |
      The min-PTE script, which both calibrates and renders; an
      input to the figure only, the calibration metric being a
      function of its inputs rather than of its typography.
    source: "./src/workflow/scripts/mock_min_pte_calibration.py"

  - id: redshift_distribution
    from: ../catalog.redshift_distribution
    # The single resolved blind-A n(z) file, as cl_bb imports it. The
    # `redshift_distributions` tree above is the whole n(z) family; the
    # mixing-term test needs exactly the one file the covariance chain reads.

  - id: clbb_cov_mixing_term_script
    type: data
    description: |
      The replication of `CosmologyValidation.calculate_pseudo_cl_eb_cov`
      behind
      [clbb_cov_mixing_term_test](#outputs.clbb_cov_mixing_term_test).
      Declared as an input because the whole value of that output is
      that the replication is faithful: a change here changes what
      the gate means.
    source: "./src/workflow/scripts/clbb_cov_mixing_term_test.py"

  - id: clbb_cov_mixing_term_figure_script
    type: data
    description: |
      The renderer behind
      [clbb_cov_mixing_term_figure](#outputs.clbb_cov_mixing_term_figure).
    source: "./src/workflow/scripts/clbb_cov_mixing_term_figure.py"

  - id: mock_validation_figure_script
    type: data
    description: |
      The composer behind
      [mock_validation_figure](#outputs.mock_validation_figure)
      and its fiducial-cuts companion; both variants are the same
      script under `--range`, so the two figures cannot drift
      apart in style or in how they normalise.
    source: "./src/workflow/scripts/mock_validation_figure.py"

  - id: mock_xi_input_theory_script
    type: data
    description: |
      The rebuild of the mock generator's own cosmology behind
      [mock_xi_input_theory](#outputs.mock_xi_input_theory).
    source: "./src/workflow/scripts/mock_xi_input_theory.py"

  - id: mock_xi_reporting_cov_script
    type: data
    description: |
      The rebinner behind
      [mock_xi_reporting_cov_mockmatched](#outputs.mock_xi_reporting_cov_mockmatched).
    source: "./src/workflow/scripts/mock_xi_reporting_cov_mockmatched.py"

  - id: mock_xi_validation_script
    type: data
    description: |
      The raw-ξ_± validation script, which both tabulates and
      renders: one `--emit` for
      [mock_xi_validation_stats](#outputs.mock_xi_validation_stats)
      and one for
      [mock_xi_validation_figure](#outputs.mock_xi_validation_figure),
      so the figure cannot show numbers the table does not carry.
    source: "./src/workflow/scripts/mock_xi_validation.py"

  - id: mock_campaign_paper_figure_script
    type: data
    description: |
      The paper-format composer behind
      [mock_campaign_figure](#outputs.mock_campaign_figure).
    source: "./src/workflow/scripts/mock_campaign_paper_figure.py"

  - id: pure_eb_decision_comparison_figure_script
    type: data
    description: |
      The decision-scan composer behind
      [pure_eb_decision_comparison_figure](#outputs.pure_eb_decision_comparison_figure).
    source: "./src/workflow/scripts/pure_eb_decision_comparison_figure.py"

  - id: pure_eb_scan_scatter_figure_script
    type: data
    description: |
      The scan's scatter composer, behind
      [pure_eb_scan_scatter_figure](#outputs.pure_eb_scan_scatter_figure).
    source: "./src/workflow/scripts/pure_eb_scan_scatter_figure.py"

  - id: mock_footprint_audit
    type: data
    description: |
      The nside-4096 footprint audit: for the data catalogue and for
      v2 realisation 00001, the galaxy row count, the number of
      occupied HEALPix pixels and the sky area they cover, plus the
      two footprints' overlap and each one's exclusive area. This is
      the measurement that licenses treating every area convention in
      circulation (2405, 2757, 2894, 2949 deg²) as bookkeeping over a
      single sky, and therefore licenses reading the noise difference
      as a pure count ratio.
    source: "/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/glass_mock_v1.4.6.3_v2/clbb_cov_work/footprint_4096.log"

outputs:

  # ── Scatter: the per-realisation data vectors ────────────────────────────
  # The expensive stage is a genuine fan-out — 350 independent TreeCorr runs on
  # 60 M galaxies each, 10-20 core-hours apiece — and the live path is the
  # generated mock_xi_scan sweep. What each stage carries is the ensemble: the
  # realisation axis made explicit as a single stacked array, which is what
  # every consumer here actually wants. The transforms downstream are not
  # fanned out, because they are cheap: they read an ensemble and write one.

  - id: mock_xi_fine
    from: mock_xi_scan.mock_xi_fine

  # Retain the old external-ingestion reduction only as the receipt's input.
  - id: mock_xi_fine_legacy_ingested
    type: data
    format: npz
    description: |
      The superseded external-ingestion ensemble on the old 500'-grid,
      retained only so mock_xi_fine_provenance can receipt that path.
    inputs: [glass_mock_xi_fine_measured]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_ensemble.py
        --members "$(dirname "$(printf '%s\n' "{inputs.glass_mock_xi_fine_measured}" | head -n1)")"/gg_glass_mock_*_nbins=1000.fits
        --min-sep 0.5 --max-sep 500.0 --nbins 1000
        --out-file {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mock_xi_fine_provenance
    type: data
    format: json
    description: |
      The receipt on the superseded external-ingestion grid. Realisation
      00001 is re-measured here — this spec's environment, this spec's
      TreeCorr call, this spec's catalogue input — and differenced against
      the stored measurement standing in for it in
      [mock_xi_fine_legacy_ingested](#outputs.mock_xi_fine_legacy_ingested).
      Reports the maximum absolute and fractional Δξ_± over the 1000 bins,
      the npairs and weight agreement, and the bin edges both sides used.

      Superseded as the live path by the mock_xi_scan sweep (2026-08-31);
      retained as the receipt on the old 500'-grid ingestion.

      One realisation is ~20 minutes on 24 threads; the suite is 5 000
      core-hours, which is the whole reason the ingest exists. If this
      output stops matching, the ingest is what to suspect first.
    inputs: [glass_mock_catalogs, mock_xi_fine_legacy_ingested]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_fine_provenance.py
        --catalog-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_catalogs}" | head -n1)")"
        --xi-ensemble {inputs.mock_xi_fine_legacy_ingested}
        --mock-id 00001
        --min-sep 0.5 --max-sep 500.0 --nbins 1000
        --out-file {output}
      resources: { cpus: 24, memory: "32GB" }

  - id: mock_xi_reporting
    type: data
    format: npz
    description: |
      Sacha's stored 20-bin ξ_± vectors for the whole suite, stacked
      into the same ensemble layout as
      [mock_xi_fine](#outputs.mock_xi_fine). No measurement happens
      here — the reporting grid on the fiducial footprint ships with
      the suite — but stacking it makes the reporting axis a declared
      artifact rather than a directory the pure-mode stage globs, and
      lets the fiducial and masked footprints enter that stage through
      one interface.
    inputs: [glass_mock_xi_reporting]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_ensemble.py
        --members "$(dirname "$(printf '%s\n' "{inputs.glass_mock_xi_reporting}" | head -n1)")"/xi_glass_mock_*_4096_nbins=20.fits
        --min-sep 1.0 --max-sep 250.0 --nbins 20
        --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_cosebis_modes
    type: data
    format: npz
    description: |
      COSEBI E_n / B_n for n = 1 … 20 and all 350 realisations, stacked
      as a 350 × 20 pair. Computed from
      [mock_xi_fine](#outputs.mock_xi_fine) through exactly the
      `cosmo_numba` `COSEBIS.cosebis_from_xipm` call the paper's own
      COSEBI data vector uses, cut at the
      [fiducial θ range](#decisions.scale_cut_convention). The paired
      [mock_cosebis_modes_full](#outputs.mock_cosebis_modes_full) output
      uses the same script on the 1–250 arcmin range for the full-range
      min-PTE calibration.
    inputs: [mock_xi_fine]
    decisions: [mock_suite, scale_cut_convention]
    recipe:
      # The θ cut reaches the script as the convention, not as two literals:
      # mock_cosebis_scatter resolves grid_bin_edges to edges 9 and 16 of
      # geomspace(1', 250', 21) — what the pipeline actually cut at — and
      # rounded_arcmin to the [12, 83] the paper text prints.
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20
        --scale-cut-convention {decisions.scale_cut_convention}
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_cosebis_modes_full
    type: data
    format: npz
    description: |
      Full-range COSEBI E_n / B_n for n = 1 … 20 and all 350
      realisations, stacked as a 350 × 20 pair. This is the same
      `mock_cosebis_scatter.py` implementation as
      [mock_cosebis_modes](#outputs.mock_cosebis_modes), explicitly run
      over the 1–250 arcmin range used by the data-side full-range
      COSEBI PTEs. It is the mock distribution for the full-range
      B_n≤6 and B_n≤20 statistics.
    inputs: [mock_xi_fine]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20 --theta-min 1.0 --theta-max 250.0
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_pure_eb_modes
    type: data
    format: npz
    description: |
      Pure-mode ξ_±^{E,B,amb} for all 350 realisations on the 20-bin
      reporting grid, stacked as six 350 × 20 blocks. The reporting
      grid comes from
      [mock_xi_reporting](#outputs.mock_xi_reporting) and the
      integration grid from [mock_xi_fine](#outputs.mock_xi_fine),
      truncated at 300' to match the CosmoCov integration input the
      paper covariance was built on. Only the six data-vector blocks
      are written; the analytic covariance is the campaign's business.
    inputs: [mock_xi_fine, mock_xi_reporting]
    decisions: [mock_suite, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits]
    recipe:
      command: >
        python src/workflow/scripts/mock_pure_eb_scatter.py
        --fine-ensemble {inputs.mock_xi_fine}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 16, memory: "16GB" }

  # ── Scatter: the v1.4.8-masked footprint (comment 4) ─────────────────────
  # NOT YET MATERIALISED. The masked chain below is declared against the
  # canonical v2 suite, which has no masked counterpart on disk; running it is
  # a fresh scatter plus its transform. It is scoped to the first 50
  # realisations (00001-00050), not the full 350: the masked 2PCF measurement is
  # the campaign's most expensive stage, and 50 paired realisations resolve the
  # mean-level geometry effect under test. The fiducial ensembles stay at 350
  # and the geometry analysis pairs by mock ID, so the comparison runs on the
  # 50-member intersection. A prior masked run exists at
  # results/glass_mock_masked/ on the superseded v1.4.6 suite and saw
  # geometry-only nulls, but it was never vetted and is not evidence for any
  # finding here — the comment-4 answer is pending this chain's first run.

  - id: mock_xi_fine_masked
    from: mock_xi_masked_scan.mock_xi_fine_masked

  - id: mock_xi_reporting_masked
    from: mock_xi_reporting_masked_scan.mock_xi_reporting_masked

  - id: mock_pure_eb_modes_masked
    type: data
    format: npz
    description: |
      Pure-mode decomposition of the masked-footprint realisations,
      the masked half of the paired
      [geometry test](#outputs.mask_geometry_evidence). Identical
      transform to
      [mock_pure_eb_modes](#outputs.mock_pure_eb_modes), reading the
      masked footprint's own two ensembles — which is why no filename
      bridging is needed between the two chains: both grids arrive as
      arrays on a declared interface rather than as files named by
      whichever script produced them.
    inputs: [mock_xi_fine_masked, mock_xi_reporting_masked]
    decisions: [mock_suite, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits]
    recipe:
      command: >
        python src/workflow/scripts/mock_pure_eb_scatter.py
        --fine-ensemble {inputs.mock_xi_fine_masked}
        --reporting-ensemble {inputs.mock_xi_reporting_masked}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 1, memory: "16GB" }

  # ── The mock-matched reference covariance ────────────────────────────────

  - id: pure_cov_mockmatched
    type: data
    format: npz
    description: |
      The paper's pure-E/B covariance rebuilt from the
      [mock-matched ξ_± covariance](#inputs.cov_integration_mockmatched)
      under the same
      [covariance method](#decisions.pure_eb_covariance_method) —
      the exact M C_ξ Mᵀ with the same M, or the same 2000-sample
      chain with the same six-block ordering and the same
      deterministic seeds as
      [pure_eb_semianalytic_data](#inputs.pure_eb_semianalytic_data),
      only the input covariance differs. The mocks' noise enters
      this stage *entirely* through
      [cov_integration_mockmatched](#inputs.cov_integration_mockmatched):
      the script propagates that stored 2000×2000 ξ_± matrix
      through the Schneider (2022) filters, carrying no n_eff,
      σ_e or area of its own. There is nothing here to match to the mocks
      independently — pointing the one input at the
      `SP_v1.4.6.3_mockv2` run is the whole of the mock-matching
      for the pure-mode channel, exactly as it is for COSEBIs,
      which consume the same artifact through a different
      transform. Consumed by the campaign when
      [reference_covariance](#decisions.reference_covariance) is
      `mockmatched`.
    inputs: [cov_integration_mockmatched, xi_reporting, xi_integration, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind, mc_samples, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method]
    recipe:
      # mock_matched_pure_eb_cov.py is precompute_pure_eb_chunk + gather in one
      # deterministic invocation, on the twin's own partition: 20 batches x 100
      # = 2000, seeded 42 + batch id, so the two chains draw seeds 42-61 with
      # the same block sizes and the same 2000 standard-normal draws. That is
      # what "same deterministic seeds" in the description buys — without it
      # the difference between the two covariances would carry ~sqrt(2/2000)
      # of MC noise per element on top of the effect being measured.
      # Two distinct rebinnings, and only one is a decision. The pointwise
      # geometry rebins the *input* xi_+- from the fine grid to the 20
      # reporting bins with the submitted unweighted mean, matching the twin;
      # that is not a fork and is not parameterised. The averaged geometry
      # fixed_operator selects instead averages the *pure modes* into the
      # reporting bins, and how that average is weighted is
      # pure_eb_rebinning_weights, passed through as --rebinning-weights.
      # --xi-reporting must be the 20-bin reporting grid: the script reads it
      # with max_rows=20, so handing it the 1000-bin integration file would
      # silently take the first twenty fine bins (0.50-0.55') as the reporting
      # theta axis.
      # The n(z) is resolved the twin's way, not handed over as a path: the
      # script builds a CosmologyValidation on --version/--blind and calls
      # get_redshift, which opens cat_config's `redshift_path`. The fiducial
      # pair is hardcoded exactly as in pure_eb_semianalytic_data;
      # `redshift_distributions` stays declared because that lookup is what
      # reaches the n(z) tree, which sits outside the project.
      command: >
        python src/workflow/scripts/mock_matched_pure_eb_cov.py
        --cov-integration {inputs.cov_integration_mockmatched}
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --version SP_v1.4.6.3_leak_corr --blind A
        --cat-config src/cosmo_val/cat_config.yaml
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples 2000 --seed 42 --out {output}
      resources: { cpus: 24, memory: "60GB" }

  # ── The six-statistic campaign: compute once, then derive ────────────────
  # The campaign used to be one invocation that wrote a directory of mixed
  # products. It is split here along the seam that was already there: exactly
  # one output is *computed* — the per-realisation table, the only thing that
  # touches a covariance file — and the metric and the four figures are
  # derivations that read it. Re-cutting a figure no longer reruns the
  # comparison, and nothing has to be extracted from anything.

  - id: mock_per_mock_statistics
    type: data
    format: npz
    description: |
      The campaign's one computed artifact: the 350 × 6 stack of
      per-realisation χ² and PTE values, the raw per-mock B vectors,
      and — travelling with them so that no derivation has to reopen a
      covariance — the analytic σ vectors on both the full and the cut
      ranges, the cut masks, and a provenance blob naming the
      covariance triple, the scale cuts and every skipped realisation.

      Holds, for each of the six statistics — B_{n≤6}, B_{n≤20},
      ξ_+^B, ξ_-^B, ξ_tot^B, C_ℓ^BB — the vector each realisation
      developed and its χ²/PTE against the selected reference
      covariance at both the fiducial and full angular windows. The
      original fiducial keys remain unchanged; `chi2_full`, `pte_full`,
      and `dof_full` add the 1–250 arcmin / 8≤ℓ≤2048 calibration
      alongside them. Everything the referee answers quote is a
      function of this file.
    inputs: [mock_cosebis_modes, mock_cosebis_modes_full, mock_pure_eb_modes, mock_xi_fine, glass_mock_cl, xi_integration, cov_integration_g, pure_eb_semianalytic_data, cl_cov_reporting, cov_integration_mockmatched, pure_cov_mockmatched, cl_cov_mockmatched]
    decisions: [reference_covariance, mock_suite, scale_cut_convention, fiducial_catalog, fiducial_blind]
    recipe:
      # --reference-covariance picks the covariance triple; under `mockmatched`
      # the C_l^BB reference is the directly computed mock covariance rather
      # than any rescale of the data's. --fine-ensemble is the fallback the
      # COSEBI stage needs only if a stored mode vector carries a non-fiducial
      # theta cut. No --pseudo-cl-dir: that flag drives an optional cross-check
      # against locally recomputed NaMaster bandpowers, and this suite ships no
      # per-mock pseudo_cl_* files, so it has nothing to read.
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --cosebis-ensemble {inputs.mock_cosebis_modes}
        --cosebis-ensemble-full {inputs.mock_cosebis_modes_full}
        --pure-ensemble {inputs.mock_pure_eb_modes}
        --fine-ensemble {inputs.mock_xi_fine}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --cosebis-xi-grid {inputs.xi_integration}
        --cosebis-cov {inputs.cov_integration_g}
        --pure-cov {inputs.pure_eb_semianalytic_data}
        --cl-cov {inputs.cl_cov_reporting}
        --cosebis-cov-mockmatched {inputs.cov_integration_mockmatched}
        --pure-cov-mockmatched {inputs.pure_cov_mockmatched}
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --reference-covariance {decisions.reference_covariance}
        --scale-cut-convention {decisions.scale_cut_convention}
        --label {decisions.reference_covariance}
        --emit-stats {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mock_min_pte_calibration
    type: metric
    format: json
    description: |
      The empirical global calibration of the min-PTE criterion, from
      the suite itself. It retains the existing top-level fiducial
      calibration and adds a `full_range` block with the same fields:
      the observed minimum PTE across the six test statistics, the
      clean-mock tail fraction (one- and two-sided), and the empirical
      min-PTE threshold for a nominal 5% global false-alarm rate — each
      with a 68% interval (Wilson for fractions, order-statistic
      bootstrap for thresholds). The fiducial observed PTEs are taken
      from the pure-mode and COSEBI matrices at bins 9–15 (edge indices
      9/16) and C_ℓ^BB at 300 < ℓ < 1600; `full_range` uses the [0, 19]
      matrix cells and all 32 C_ℓ bands (1–250 arcmin / 8≤ℓ≤2048).
      The mock PTE distributions use the matching covariance window,
      including Hartlap-corrected pure-mode statistics.
    inputs: [mock_per_mock_statistics, pure_eb_pte_per_cut, cosebis_pte_per_cut, cl_pte_per_cut, scale_cuts_script]
    decisions: [reference_covariance, mock_suite, scale_cut_convention]
    recipe:
      command: >
        python src/workflow/scripts/mock_min_pte_calibration.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --pure-eb-pte {inputs.pure_eb_pte_per_cut}
        --cosebis-pte {inputs.cosebis_pte_per_cut}
        --cl-pte {inputs.cl_pte_per_cut}
        --config src/papers/bmodes/config/config.yaml
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_min_pte_figure
    type: figure
    format: png
    description: |
      The picture behind
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration):
      across clean mock realisations, the cumulative distribution of
      the *minimum* PTE over the six test statistics — the one-sided
      minimum, min_s PTE_s, which is the statistic the calibration's
      `p_global_one_sided` is a tail fraction of, not the two-sided
      min(PTE, 1−PTE) companion it also reports. The curve is the
      unbinned empirical CDF in percent: each rise is one
      realisation, and its height at x is the suite's false-alarm
      rate on clean data for a threshold x. Both axes are
      logarithmic (x from 10⁻³ to 0.3, y up to 100%), so the trend
      shows over several decades.

      Column width, drawn at print size, in the paper's figure
      semantics: a neutral dark step curve; a thin light-grey dotted
      curve, 1 − (1 − x)⁶, the expectation for six independent
      tests; a grey dashed drop line from `global_alpha` (5%) across
      to the curve and down to the calibrated threshold
      `threshold_one_sided`; a thin solid dark-grey line from the
      adopted [global PTE threshold](#../decisions.pte_threshold)
      up to the curve and across to its clean-sample failure rate,
      tagged p_thr; and a crimson
      drop line — the colour that means a B mode everywhere else —
      from the data's own minimum up to the curve and across to the
      empirical global p-value, tagged "data", the fraction of mocks at or below
      the data's minimum, which is what a "does the suite reject the
      null" statement is allowed to quote, the per-statistic nominal
      PTEs being non-uniform on clean mocks. The curve and both
      readings come from the calibration payload this same
      invocation computes, so the figure cannot disagree with the
      JSON beside it.
    inputs: [mock_per_mock_statistics, pure_eb_pte_per_cut, cosebis_pte_per_cut, cl_pte_per_cut, mock_min_pte_calibration_script, plotting_utils_script, scale_cuts_script, paper_mplstyle]
    decisions: [reference_covariance, mock_suite, scale_cut_convention, pte_threshold]
    recipe:
      command: >
        python src/workflow/scripts/mock_min_pte_calibration.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --pure-eb-pte {inputs.pure_eb_pte_per_cut}
        --cosebis-pte {inputs.cosebis_pte_per_cut}
        --cl-pte {inputs.cl_pte_per_cut}
        --config src/papers/bmodes/config/config.yaml
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_min_pte_scale_cut_scan
    type: metric
    format: json
    description: |
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration) as
      a function of the scale cut: the same 5%-quantile threshold on
      the per-realisation minimum PTE, evaluated on all 210 windows of
      the reporting grid `geomspace(1', 250', 21)` rather than at the
      fiducial window alone. Per window it carries θ_min, θ_max, the
      threshold, its 68% bootstrap and order-statistic intervals, the
      six per-statistic median PTEs, the number of reporting bins, and
      the reasons any statistic could not be formed.

      What distinguishes this from a naive scan is that the COSEBIs are
      **recomputed in each window**, from each realisation's
      [fine ξ_±](#outputs.mock_xi_fine) through the same
      `cosmo_numba` call the pipeline uses, against a COSEBI covariance
      transformed on that same window. Holding them at their fiducial
      values instead imports the fiducial window's COSEBI fluctuations
      everywhere, which depresses the threshold across the plane and
      materially changes where "threshold ≤ 0.01" holds. C_ℓ^BB does
      not depend on the angular window; its per-realisation PTEs are
      read unchanged from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics),
      which is also what carries that file's own C_ℓ covariance choice.

      The scan is *defined* on the reporting grid's own bin edges —
      `geomspace(1', 250', 21)`, pinned in the recipe rather than left
      to a default — so it is the
      [grid_bin_edges](#decisions.scale_cut_convention) reading by
      construction, and the fiducial cell (edge indices 9, 16) is the
      same window
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration)
      calibrates at. That identity is the cheapest standing check on
      the two: the cell's threshold and
      `threshold_one_sided` agree to 2e-11 relative. It is specific to
      that convention — under `rounded_arcmin` the pipeline cuts at
      12.0'/83.0', which this grid cannot express, and the cell would
      no longer be the fiducial window.

      Twenty of the 210 windows — the adjacent-edge pairs, which hold
      a single reporting bin — are marked `comparable: false` and
      excluded from every summary over the plane. Their COSEBI basis
      is solved over one reporting bin's θ range, where it is too
      ill-conditioned to compare: the mocks' median B_{n≤20} PTE is
      0.13 on those windows against ~0.45 on every window holding two
      bins or more, and the effect switches off cleanly at two bins
      rather than tailing away. Whether `mpmath` raises
      `NoConvergence` on them or returns roots is a property of the
      environment — it raises outside the project image and converges
      inside it — so the exclusion is structural, keyed on the bin
      count, and does not depend on the solve happening to fail.
    inputs: [mock_per_mock_statistics, mock_xi_fine, mock_pure_eb_modes, xi_integration, cov_integration_g, pure_eb_semianalytic_data, cov_integration_mockmatched, pure_cov_mockmatched, min_pte_window_scan_script]
    decisions: [reference_covariance, mock_suite]
    recipe:
      # --reference-covariance selects the pair, exactly as it does for
      # mock_per_mock_statistics. There is no C_l member: the harmonic PTEs
      # arrive already formed in the per-mock statistics npz.
      command: >
        python src/workflow/scripts/min_pte_window_scan.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-xi-fine {inputs.mock_xi_fine}
        --mock-pure-eb-modes {inputs.mock_pure_eb_modes}
        --cosebis-xi-grid {inputs.xi_integration}
        --covariance {inputs.cov_integration_g}
        --pure-covariance {inputs.pure_eb_semianalytic_data}
        --covariance-mockmatched {inputs.cov_integration_mockmatched}
        --pure-covariance-mockmatched {inputs.pure_cov_mockmatched}
        --reference-covariance {decisions.reference_covariance}
        --xi-min-sep 0.5 --xi-max-sep 300.0 --xi-nbins 1000
        --reporting-theta-min 1.0 --reporting-theta-max 250.0 --reporting-edges 21
        --fiducial-window 9 16
        --nmodes 20 --precision 120 --global-alpha 0.05
        --cosebi-roots interpolate_ratio
        --processes 24
        --emit calibration --out-file {output}
      # Measured: ~85 s of CPU per window, 210 windows, i.e. ~5 CPU-hours.
      # 26 min wall on 12 processes on a contended node; ~15 min expected on
      # 24. Memory is dominated by the 2000x2000 xi covariance shared across
      # forked workers plus per-window blocks.
      resources: { cpus: 24, memory: "32GB" }

  - id: mock_min_pte_scale_cut_validation
    type: metric
    format: json
    description: |
      The gate that licenses
      [mock_min_pte_scale_cut_scan](#outputs.mock_min_pte_scale_cut_scan)
      to be read as the pipeline's own statistics evaluated on a
      different window, rather than a second implementation that
      merely resembles them. The scan re-forms all six statistics
      from scratch; at two windows the pipeline has already stored
      the answer, so at those two windows the two must agree.

      It runs the same machinery at the fiducial window (edge indices
      9, 16) against
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics)`['pte']`
      and at the full range (0, 20) against that file's `['pte_full']`,
      and records the maximum absolute per-realisation PTE difference
      for each statistic. Observed: ≤ 7e-12 at the fiducial window and
      ≤ 3e-10 at the full range on the COSEBI columns, and at
      floating-point noise on the pure modes. C_ℓ^BB is expected to
      disagree at the full range and only there — the scan holds it at
      its fixed 300 < ℓ < 1600 cut while `pte_full` uses all 32 bands
      — and the artifact says so in its own `note` field.

      The COSEBI columns are the informative ones: they degrade to
      ~1e-5 if `--cosebi-roots shared` is used instead of the
      per-realisation `interpolate_ratio` the recipe pins, so this
      file is also what detects that substitution. Four minutes to
      produce, which is why it is an output and not a note in a
      transcript.
    inputs: [mock_per_mock_statistics, mock_xi_fine, mock_pure_eb_modes, xi_integration, cov_integration_g, pure_eb_semianalytic_data, cov_integration_mockmatched, pure_cov_mockmatched, min_pte_window_scan_script]
    decisions: [reference_covariance, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/min_pte_window_scan.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-xi-fine {inputs.mock_xi_fine}
        --mock-pure-eb-modes {inputs.mock_pure_eb_modes}
        --cosebis-xi-grid {inputs.xi_integration}
        --covariance {inputs.cov_integration_g}
        --pure-covariance {inputs.pure_eb_semianalytic_data}
        --covariance-mockmatched {inputs.cov_integration_mockmatched}
        --pure-covariance-mockmatched {inputs.pure_cov_mockmatched}
        --reference-covariance {decisions.reference_covariance}
        --xi-min-sep 0.5 --xi-max-sep 300.0 --xi-nbins 1000
        --reporting-theta-min 1.0 --reporting-theta-max 250.0 --reporting-edges 21
        --fiducial-window 9 16
        --nmodes 20 --precision 120
        --cosebi-roots interpolate_ratio
        --processes 12
        --emit validation --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: mock_min_pte_scale_cut_scan_figure
    type: figure
    format: pdf
    description: |
      The picture behind
      [mock_min_pte_scale_cut_scan](#outputs.mock_min_pte_scale_cut_scan),
      and deliberately not a lone heatmap of the threshold. Three
      panels over the (θ_min, θ_max) plane, log axes: the calibrated
      threshold, the number of reporting bins the window contains, and
      the mocks' median B_{n≤20} PTE.

      The second and third panels are there because the first one's
      extremes are not equally meaningful. The threshold is pushed
      *up* at short, narrow windows, where few and strongly correlated
      degrees of freedom keep every PTE near 0.5 — that is the second
      panel. It is pushed *down* at the widest windows, where the
      analytic COSEBI covariance understates the mock scatter (σ_emp /
      σ_ana reaching 1.14 by θ_max = 250′, carried by ξ_- beyond
      ~120′) and the B-mode PTEs run systematically low — that is the
      third. Read alone, the first panel would invite both artifacts
      to be taken as sensitivity.

      The 0.01 level — the threshold the referee response quotes a
      region for — is drawn on the first panel as a labelled contour,
      so the claim is checkable by eye rather than by interpolating a
      logarithmic colourbar; it closes around the short-θ_min corner
      and stays clear of the outlined region.

      The fiducial window is marked and the region the analysis
      actually reports is outlined. The twenty single-reporting-bin
      windows — the adjacent-edge pairs, eight of them inside the
      analysis region — are cross-hatched rather than left blank, so
      they cannot be misread as a threshold near zero; that is exactly
      how they would read, since their ill-conditioned COSEBI basis
      drives the threshold as low as 3e-06. Drawn from the scan's own
      JSON, so the figure cannot disagree with it.
    inputs: [mock_min_pte_scale_cut_scan, min_pte_window_scan_script, plotting_utils_script]
    decisions: [reference_covariance, mock_suite]
    recipe:
      # --from-scan makes this a pure derivation: it opens the metric and
      # nothing else, so re-cutting the figure never reruns the plane.
      command: >
        python src/workflow/scripts/min_pte_window_scan.py
        --emit figure --from-scan {inputs.mock_min_pte_scale_cut_scan}
        --highlight-theta-min 5.241 --highlight-theta-max 36.196
        --contour-level 0.01
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_campaign_evidence
    type: metric
    format: json
    description: |
      The campaign's machine-readable result and the artifact
      every number in this spec's findings is read from, derived from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics)
      alone.

      Three covariance conventions are deliberately kept apart
      and are properties of each statistic rather than live
      choices: COSEBIs transform the ξ_± covariance through
      `cosebis_covariance_from_xipm_covariance` with no Hartlap
      factor; the pure-mode blocks are sliced out of the stored
      120×120 matrix and carry Hartlap N = 2000, the
      [MC sample count](#decisions.mc_samples) they were
      propagated with; C_ℓ^BB selects bandpowers with the paper's
      powspace edge logic and takes no Hartlap factor, its
      mock-matched reference being the directly computed
      [cl_cov_mockmatched](#inputs.cl_cov_mockmatched). Both the
      full 20-bin/20-mode range and the fiducial cut are reported
      for σ, so the
      [adopted scale cuts](#../decisions.fiducial_scale_cuts)
      are not a fork here — only the χ² statistics use the cut.
    inputs: [mock_per_mock_statistics]
    recipe:
