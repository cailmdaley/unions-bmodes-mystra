        python src/workflow/scripts/mock_mean_vector_plot.py
        --stats {inputs.mock_per_mock_statistics}
        --label {decisions.reference_covariance}
        --config src/papers/bmodes/config/config.yaml
        --scale-cut-convention {decisions.scale_cut_convention}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_validation_figure
    type: figure
    format: png
    description: |
      The paper's mock-validation figure: two rows over the three
      B statistics on every reporting bin — COSEBI modes 1–20 on
      the full 1–250′ range, ξ±^B on all reporting bins, C_ℓ^BB on
      all 32 bands — with the scales outside the fiducial cuts
      shaded. Row 1 is the across-realisation mean in units of the
      analytic (data) σ, with σ_emp/(σ_ana√N) error bars, so it
      reads as "fraction of a data error bar". Row 2 is
      σ_ana/σ_emp, the check that the analytic covariance
      reproduces the mock scatter — below one means the analytic
      uncertainties are tighter than the mock scatter — with ±1/√(2N) error bars — the
      sampling uncertainty of a ratio of standard deviations
      estimated from N realisations. The lowest C_ℓ band is
      dropped from the ratio panel alone — its ≈1.8 would set the
      whole row's range — and kept in the mean panel. Colour
      encodes the *mode*, not the statistic: every series is the
      crimson
      [pure_eb_data_vector_figure](#outputs.pure_eb_data_vector_figure)
      gives ξ±^B, and the statistic is named by the panel label;
      within a panel the two series differ by marker fill —
      COSEBIs at the fiducial cuts (filled) vs over all scales
      (open), ξ+^B (filled) vs ξ−^B (open). The harmonic axis is the same square-root
      scale as the C_ℓ data vector.

      The full range is shown deliberately: the estimator is tested
      on every scale it was run on, not only on the cuts chosen
      after the fact. What the shaded regions carry is where the
      analytic covariance stops being trustworthy — σ_ana/σ_emp
      rises to ≈1.8 at the lowest bandpower and returns to
      unity only by ℓ ≈ 100, while in configuration space it falls
      to ≈0.77 above 120′ and the low-n COSEBI modes on the full
      range sit 20–30% low. Inside the cuts every ratio is within
      ~17% of unity and every mean bias below 0.12σ; the companion
      [mock_validation_figure_fiducial](#outputs.mock_validation_figure_fiducial)
      isolates that view.

      The full 32-band per-mock C_ℓ stack is not carried in
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics),
      which stores only the in-cut bands, so this figure reads
      the per-mock npy blocks
      ([glass_mock_cl](#inputs.glass_mock_cl)) directly. The
      directory comes from the campaign's own provenance rather
      than a default, and the script asserts that the masked full
      stack reproduces the stored in-cut one — a wrong C_ℓ suite
      otherwise renders as a plausible covariance failure instead
      of an error.
    inputs: [mock_per_mock_statistics, mock_campaign_evidence, glass_mock_cl, mock_validation_figure_script, plotting_utils_script, paper_mplstyle]
    decisions: [reference_covariance, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_validation_figure.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --campaign-evidence {inputs.mock_campaign_evidence}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --range full
        --output {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_validation_figure_fiducial
    type: figure
    format: pdf
    description: |
      The same two rows restricted to each statistic's fiducial
      scale cuts — COSEBI modes 1–20 on 12–83′, ξ±^B on the seven
      reporting bins inside the config-space cut, C_ℓ^BB on the
      seventeen bands fully inside the harmonic cut. Nothing is
      shaded because nothing lies outside the cuts. Kept as a
      companion to [mock_validation_figure](#outputs.mock_validation_figure)
      for the response letter: it is the zoom on the scales the
      paper's PTEs actually use.
    inputs: [mock_per_mock_statistics, mock_campaign_evidence, mock_validation_figure_script, plotting_utils_script, paper_mplstyle]
    decisions: [reference_covariance, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_validation_figure.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --campaign-evidence {inputs.mock_campaign_evidence}
        --range fiducial
        --output {output}
      resources: { cpus: 1, memory: "4GB" }

  # ── The raw ξ_± check, upstream of every mode filter ─────────────────────

  - id: mock_xi_reporting_cov_mockmatched
    type: data
    format: npz
    description: |
      The campaign's reference covariance for raw ξ_±, on the
      reporting grid. The
      [reference_covariance](#decisions.reference_covariance)
      decision settles that mock validation is done against the
      CosmoCov run built at the *suite's* own noise level
      ([cov_integration_mockmatched](#inputs.cov_integration_mockmatched),
      `SP_v1.4.6.3_mockv2`), not the catalogue's: held against the
      data covariance the mocks simply report their own 17% galaxy
      excess. That run exists only on the 1000-bin integration
      grid, so this output binds it to the 20 reporting bins the
      suite reports ξ_± on — `Cov_rep = B Cov_fine Bᵀ`, one
      operator applied to the ξ_+ and ξ_- halves alike.

      TreeCorr's 20-bin ξ_± is a pair-weighted average within each
      bin, so `B` carries the pair density a uniform field gives.
      The unweighted `pointwise` operator the submitted pure-mode
      chain applies to the input ξ_± is written alongside as
      `cov_pointwise`; the two σ agree to 1.3% at worst, adjacent
      fine bins being almost perfectly correlated, so nothing here
      turns on the choice.

      This is a rebin, not a rescale: no data-level covariance is
      touched and no density factor is applied by hand.
    inputs: [cov_integration_mockmatched, mock_xi_reporting, mock_xi_reporting_cov_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_reporting_cov_mockmatched.py
        --covariance {inputs.cov_integration_mockmatched}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --fine-min-sep 0.5 --fine-max-sep 300.0 --fine-nbins 1000
        --out-file {output}
      resources: { cpus: 2, memory: "16GB" }

  - id: mock_xi_input_theory
    type: data
    format: npz
    description: |
      The theory ξ_± the GLASS suite was generated from, on the
      suite's own reporting grid. The delivered suite ships no
      theory vector and the generation is external to this
      project, so this output rebuilds it: CAMB under the
      generator's exact setup — the
      [cosmology snapshot](#inputs.cosmology_snapshot)'s Planck-18
      values, HMcode `mead2020_feedback` at log T_AGN = 7.8, A_s
      rescaled to σ_8 = 0.8102 — with a lensing source window on
      the fiducial [n(z)](#inputs.redshift_distributions),
      resolved through `sp_validation`'s own reader so it is the
      same n(z) every other stage uses.

      The transform is an explicit Bessel sum over the multipoles
      supplied, **band-limited at the simulation's own
      ℓ_max = NSide = 4096**, and that is the whole reason this
      output exists rather than a call into CCL: the FFTLog path
      extrapolates the input spectrum past its last multipole, so
      a "truncated" transform run through it silently restores
      power the maps do not have — and ξ_- at 1′ is built almost
      entirely out of ℓ ~ 10⁴. The unbanded transform is written
      alongside (`xip_untruncated` / `xim_untruncated`), together
      with the curved-sky FFTLog result, so the band limit and the
      flat-sky kernel are both readable rather than assumed.
    inputs: [mock_xi_reporting, cosmology_snapshot, redshift_distributions, mock_xi_input_theory_script]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_input_theory.py
        --cosmology-json {inputs.cosmology_snapshot}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --cat-config src/cosmo_val/cat_config.yaml
        --out-file {output}
      resources: { cpus: 8, memory: "32GB" }

  - id: mock_xi_validation_figure
    type: figure
    format: png
    description: |
      The undressed check. Every other validation figure in this
      campaign lives downstream of a pure-mode or COSEBI filter,
      so a defect in the *input* — the 20-bin ξ_± the suite ships
      — would reach them dressed as an estimator problem. This is
      the same two-row logic applied before any transform, on
      ξ_+ and ξ_- themselves, with a middle row the B-mode
      figures do not need because their expectation is zero.

      Row 1 is θξ_± : the across-realisation mean against
      [the input theory](#outputs.mock_xi_input_theory), drawn
      both band-limited at the simulation's ℓ_max and unbanded.
      Row 2 is the residual as a fraction of a *single*
      realisation's error bar, (mean − theory)/σ_ana, with
      σ_emp/(σ_ana√N) error bars — the same normalisation
      [mock_validation_figure](#outputs.mock_validation_figure)'s
      top row uses, so the axis reads as "fraction of an error
      bar" and the significance sits in the error bar rather than
      in the point. Row 3 is σ_emp/σ_ana. Both rows take σ_ana
      from
      [mock_xi_reporting_cov_mockmatched](#inputs.mock_xi_reporting_cov_mockmatched),
      the mock-matched reference, not the data covariance. Scales
      outside the fiducial 12–83′ cut are shaded, as in
      [mock_validation_figure](#outputs.mock_validation_figure),
      whose style and colours this follows.

      What it shows: above ≈6′ the mock mean reproduces the input
      theory to a few per cent with no trend, and below it the
      apparent collapse of ξ_- — a factor ~100 at 1′ — is
      reproduced bin for bin by band-limiting the theory at
      ℓ = 4096. It is the simulation's resolution, not a defect
      in the mocks or in the ξ_± measurement, and it lies wholly
      outside the fiducial cut.
    inputs: [mock_xi_reporting, mock_xi_input_theory, mock_xi_reporting_cov_mockmatched, mock_xi_validation_script, plotting_utils_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.mock_xi_reporting_cov_mockmatched}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_xi_validation_stats
    type: metric
    format: json
    description: |
      The numbers behind
      [mock_xi_validation_figure](#outputs.mock_xi_validation_figure),
      per reporting bin: mean ξ_± over theory, the residual in
      units of a single realisation's σ_ana and in units of
      σ_emp/√N, σ_emp, σ_ana and their ratio — plus two columns
      the figure has no room for.

      The first is the pure shape-noise σ the ensemble's *own*
      measured pair counts imply, σ_e²/√(2N_pair). For raw ξ_+ it
      rises from 1.0 at 1′ to 4.2 at 221′: sample variance takes
      over with θ, and the near-unity scatter ratios quoted for
      ξ_+^B are a statement about a *noise-only* statistic that
      does not carry over to the raw correlation function. It is
      also what makes the footprint-geometry effect negligible
      here — a 13% pair deficit moves σ by under 1% at every
      separation, because shape noise is only 5.7% of the ξ_+
      variance at 221′.

      The second is the galaxy count each bin's pair count implies
      under a uniform-density footprint of the fiducial area. It
      sits at 1.02 of the delivered count at 1′ — which is what
      fixes the area convention — and falls monotonically to 0.87
      at 221′: a 13% pair deficit from annuli running off the
      footprint edge, the geometry effect the pure-mode scatter
      inherits at large θ.
    inputs: [mock_xi_reporting, mock_xi_input_theory, mock_xi_reporting_cov_mockmatched, mock_xi_validation_script]
    decisions: [mock_suite, reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.mock_xi_reporting_cov_mockmatched}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: mock_campaign_figure
    type: figure
    format: png
    description: |
      The campaign as one paper figure: two rows over the same
      three columns — COSEBI modes, pure ξ_±^B on the reporting
      grid, C_ℓ^BB. The top row is the across-realisation mean B
      vector in units of the analytic (data) σ, with
      σ_emp/(σ_ana√N) error bars; the bottom row is the
      empirical-over-analytic σ ratio, with the
      1/√(2(N−1)) sampling error of an N-realisation standard
      deviation. Together they are the two things the mocks say
      about the paper's covariance: that it is unbiased, and that
      its amplitude is right. Adopted scale cuts are shaded. Both
      rows are scatter with error bars rather than connected
      lines — these are independent per-bin estimates, not a
      series in a continuous variable — and the two pure-mode
      series are dodged ±2.5% in θ so their markers do not
      overlap.

      Composed from the same stack as
      [mock_mean_vector_figure](#outputs.mock_mean_vector_figure)
      and
      [mock_sigma_ratio_figure](#outputs.mock_sigma_ratio_figure),
      which stay the working versions; this is their paper-format
      twin — A&A double-column width, the paper matplotlib style,
      no suptitle.
    inputs: [mock_per_mock_statistics, mock_campaign_paper_figure_script, plotting_utils_script]
    decisions: [reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_paper_figure.py
        --stats {inputs.mock_per_mock_statistics}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_mean_vector_stats
    type: metric
    format: json
    description: |
      The numbers behind
      [mock_mean_vector_figure](#outputs.mock_mean_vector_figure):
      per-statistic mean B in units of the analytic σ, its
      σ_emp/√N uncertainty, and the largest absolute normalised
      mean with the mode or bin it falls in.

      The mean-vector χ² is quoted on **two labelled ranges**, and
      for the pure modes they differ materially: `full_range` is
      the whole 20-bin reporting grid, `fiducial_window` is the
      bins the null test is actually claimed on (9–15, resolved by
      `scale_cuts.resolve_fiducial_bin_window`). The mocks carry a
      small mean B residual at the smallest scales — ⟨ξ_+^B⟩ sits
      at ≈−0.1σ in the first three bins against a ≈0.055σ error —
      which the cut excludes, so ξ_+^B reads PTE 0.004 on the full
      range and 0.13 inside the cut. The full range is the
      pipeline diagnostic; the window is what the paper's null
      test rests on.
    inputs: [mock_per_mock_statistics, scale_cuts_script]
    decisions: [reference_covariance, scale_cut_convention]
    recipe:
      command: >
        python src/workflow/scripts/mock_mean_vector_plot.py
        --stats {inputs.mock_per_mock_statistics}
        --label {decisions.reference_covariance}
        --config src/papers/bmodes/config/config.yaml
        --scale-cut-convention {decisions.scale_cut_convention}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  # ── The mask-geometry test (comment 4): the same split ───────────────────

  - id: mask_geometry_statistics
    type: data
    format: npz
    description: |
      The mask-geometry test's computed artifact: per-realisation χ²
      and PTE for every pure-mode block under both footprints, on the
      full 20 bins and on the fiducial cut, together with the full
      comparison report the two derivations below read.

      NOT YET MATERIALISED — it waits on the masked scatter chain
      above, which has never been run on this suite.
    inputs: [mock_pure_eb_modes, mock_pure_eb_modes_masked, pure_eb_semianalytic_data]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/workflow/scripts/mock_mask_geometry_analysis.py
        --fiducial-ensemble {inputs.mock_pure_eb_modes}
        --masked-ensemble {inputs.mock_pure_eb_modes_masked}
        --pure-cov {inputs.pure_eb_semianalytic_data}
        --label mask-geometry
        --emit-stats {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mask_geometry_evidence
    type: metric
    format: json
    description: |
      The comment-4 answer, derived from
      [mask_geometry_statistics](#outputs.mask_geometry_statistics).
      The same 50 realisations (the masked chain's subset of the
      suite) transformed
      under two footprints are compared four ways: the mean B
      vector against the empirical covariance of the mean (Hartlap on
      the inverse) per footprint; per-realisation χ²
      against each footprint's own empirical covariance with a KS
      test between the two samples; the **paired** masked−fiducial
      difference, where cosmic variance cancels and which is the
      sharpest geometry test; and per-realisation χ² against the
      paper's MC-propagated analytic covariance, on the full 20
      bins and on the fiducial cut.

      The ambiguous-mode blocks act as the control: they *should*
      move enormously between footprints, and if they do while
      the pure-B blocks do not, the decomposition is putting
      geometry exactly where it belongs.
    inputs: [mask_geometry_statistics]
    recipe:
      command: >
        python src/workflow/scripts/mock_mask_geometry_analysis.py
        --from-stats {inputs.mask_geometry_statistics}
        --emit evidence --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mask_geometry_figure
    type: figure
    format: png
    description: |
      The three-panel companion to
      [mask_geometry_evidence](#outputs.mask_geometry_evidence):
      the two footprints' mean pure-B vectors, the ambiguous-mode
      control, and the per-realisation χ² distributions.
    inputs: [mask_geometry_statistics]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_mask_geometry_analysis.py
        --from-stats {inputs.mask_geometry_statistics}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  # ── The noise budget behind the density finding ──────────────────────────

  - id: mock_vs_data_noise_table
    type: table
    format: csv
    description: |
      One row per catalogue — the fiducial v1.4.6.3 leak-corrected
      sample and the v1.4.6.3_v2 GLASS suite — carrying the galaxy
      count, the occupied nside-4096 sky, the area convention, n_eff
      under it, the per-component σ_e, and the two ratios that follow:
      noise power σ_e²/N and its square, the B-mode variance ratio.

      Every cell is read or derived from three declared artifacts and
      nothing else: the two CosmoCov ini files, which are what the
      covariance chain itself was driven from, and the footprint
      audit. The derivation is one line of physics — with no B signal
      by construction, a mock B variance is pure shape noise, so it
      scales as (σ_e²/N)² — and it is what makes the ratio
      convention-free: the audit shows both catalogues occupy one sky
      to within 0.3 deg², so the area cancels.

      This is the table
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining)
      rests on for its *prediction*: the count and σ_e ratio say the
      mock BB variance should be 0.7389 of the data's. What the
      covariance machinery and the realisations themselves actually
      deliver is measured separately, in
      [clbb_variance_ratios](#outputs.clbb_variance_ratios), and the
      finding is the two held against each other.
    inputs: [cosmocov_ini_data, cosmocov_ini_mockmatched, mock_footprint_audit]
    decisions: [mock_suite, fiducial_catalog]
    recipe:
      command: >
        python src/workflow/scripts/mock_vs_data_noise_table.py
        --cosmocov-ini-data {inputs.cosmocov_ini_data}
        --cosmocov-ini-mock {inputs.cosmocov_ini_mockmatched}
        --footprint-audit {inputs.mock_footprint_audit}
        --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: clbb_variance_ratios
    type: metric
    format: json
    description: |
      The measured half of the density finding: how much quieter the
      mocks' C_ℓ^BB actually is than the data's, over the harmonic
      reporting cut 300 ≤ ℓ ≤ 1600 (the 17 bandpowers whose powspace
      edges fall entirely inside it), in two independent readings.

      The **machinery** ratio is the diagonal of
      [cl_cov_mockmatched](#inputs.cl_cov_mockmatched) — the paper's
      own NaMaster iNKA primitive pointed at a mock catalogue — over
      the diagonal of the data's
      [cl_cov_reporting](#inputs.cl_cov_reporting). It is what the
      covariance chain predicts at the mocks' noise, with nothing
      hand-fed. The **empirical** ratio is the sample variance of the
      suite's own BB bandpowers
      ([glass_mock_cl](#inputs.glass_mock_cl)) over the same data
      diagonal: what the realisations do, and the truth the machinery
      ratio is checked against. The mocks carry no B signal by
      construction, so both are pure shape-noise variance ratios and
      the count mismatch is the whole of what they measure.

      Deliberately independent of
      [reference_covariance](#decisions.reference_covariance): this
      output is the evidence that motivates that decision, so it
      measures both sides regardless of which one is selected. Mean
      and median over the cut plus the per-band values, so the
      near-flatness of the ratio across the cut is visible rather
      than asserted.
    inputs: [cl_cov_mockmatched, cl_cov_reporting, glass_mock_cl]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      # Both covariances are read as their COVAR_BB_BB block; the l cut is
      # reconstructed with the same powspace edges the campaign uses, since
      # the covariance FITS carries no band metadata.
      command: >
        python src/workflow/scripts/clbb_variance_ratios.py
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --cl-cov-data {inputs.cl_cov_reporting}
        --cl-files "{inputs.glass_mock_cl}"
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  # ══ The E-to-B mixing-term test ══════════════════════════════════════════
  #
  # Why the analytic C_ℓ^BB covariance is too large below ℓ ≈ 100, isolated by
  # recomputing it under three fiducial E-mode inputs while everything else —
  # mask, nside, ℓ range, binning, noise bias, the coupled-iNKA branch — is
  # held at the chain's own values.

  - id: clbb_cov_mixing_term_test
    type: metric
    format: json
    description: |
      Where the low-ℓ C_ℓ^BB covariance miscalibration comes from.
      [clbb_variance_ratios](#outputs.clbb_variance_ratios) measures
      the mock/data variance ratio inside the reporting cut; this
      output asks the separate question of why σ_emp/σ_ana falls to
      0.56 at ℓ ≈ 12 *outside* it, recorded in the fiber
      `analytic-covariance-large-scale-miscalibration`.

      The script replicates `CosmologyValidation.
      calculate_pseudo_cl_eb_cov` line for line — the mask is
      realisation 00001's weighted galaxy-count map, the noise bias
      is Ω_pix ⟨Σ_i w_i² σ_{e,i}²⟩, `fiducial_input_inka` is the
      `coupled` branch the chain actually runs — and recomputes the
      bandpower covariance under three fiducial E-mode inputs,
      sharing one `NmtField` / `NmtWorkspace` /
      `NmtCovarianceWorkspace` so the only thing that varies is
      C_ℓ^EE:

      - `a_theory`, the chain's own input `[C_ℓ^EE·pixwin², 0, 0, 0]`
        plus the decoupled noise bias. This is the **gate**: it must
        reproduce the stored
        [cl_cov_mockmatched](#inputs.cl_cov_mockmatched) diagonal,
        and `gate_max_frac_deviation_from_stored` records by how
        much it misses.
      - `b_noEE`, the same with C_ℓ^EE zeroed, leaving shape noise
        alone. The gap between this and `a_theory` is the E-to-B
        mask-mixing contribution to the BB variance.
      - `c_mockEE`, the suite's own mean C_ℓ^EE in place of theory.
        This separates a wrong *input spectrum* from a wrong
        *coupling kernel*: if the ratio barely moves, the spectrum
        fed to the covariance is not the problem.

      Carries σ_BB per bandpower for all three plus the suite's
      empirical scatter, and σ_emp/σ_ana for each, over the full
      8 ≤ ℓ ≤ 2048 grid rather than the reporting cut — the whole
      point is the bands below it.

      Diagnostic only: nothing upstream is changed on the strength
      of it, and no covariance the paper uses is regenerated.
    inputs: [glass_mock_catalogs, redshift_distribution, glass_mock_cl, cl_cov_mockmatched, clbb_cov_mixing_term_script]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      # Realisation 00001, matching the stored mock-matched covariance the gate
      # is checked against. The family input interpolates as its literal glob,
      # so the script resolves the realisation out of it rather than the shell.
      command: >
        python src/workflow/scripts/clbb_cov_mixing_term_test.py
        --mock-catalogs "{inputs.glass_mock_catalogs}" --realisation 00001
        --redshift-distribution {inputs.redshift_distribution}
        --cl-files "{inputs.glass_mock_cl}"
        --cl-cov-mockmatched {inputs.cl_cov_mockmatched}
        --nside 1024 --nbins 32 --power 0.5
        --out-file {output}
      resources: { cpus: 16, memory: "150GB" }

  - id: clbb_cov_mixing_term_figure
    type: figure
    format: png
    description: |
      [clbb_cov_mixing_term_test](#outputs.clbb_cov_mixing_term_test)
      drawn: σ(C_ℓ^BB) per bandpower for the empirical scatter and
      the three analytic variants above, with σ_emp/σ_ana beneath
      and the harmonic reporting cut 300 < ℓ < 1600 shaded in both
      panels. Log in ℓ across the full 8–2048 grid, so the bands
      the miscalibration lives in are visible rather than cropped.
    inputs: [clbb_cov_mixing_term_test, clbb_cov_mixing_term_figure_script, plotting_utils_script]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/workflow/scripts/clbb_cov_mixing_term_figure.py
        --mixing-test {inputs.clbb_cov_mixing_term_test}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }


  # ══ The pure-E/B decision re-scan ════════════════════════════════════════
  #
  # Three ASTRA decisions reach the pure-mode transform, and the default table
  # in pure_eb_transform maps each METHOD to a GEOMETRY (dqags -> pointwise,
  # fixed_operator -> averaged).  That mapping is a table of DEFAULTS, not a
  # constraint, and taking it for one is what makes the submitted-vs-adopted
  # comparison confounded: under the defaults, "not pointwise" always also
  # means "not dqags", so the paper's small-θ pure-B excess cannot be
  # attributed to the quadrature rather than to the geometry.  The two cross
  # terms below break that confounding.  AveragedPureEBTransform is
  # method-agnostic by construction — it picks the evaluation nodes, the
  # window and the fine-to-reporting average, then delegates one call to
  # PureEBTransform, which dispatches on the method — so dqags in the averaged
  # geometry needed no new numerics, only an explicit geometry override
  # (`geometry_for(method, geometry)`, `--geometry` on the data chain,
  # `--transform-averaged` on the mock chains).  Verified 2026-09-04: the
  # adopted variant reproduces results/baseline/glass_mocks/mock_pure_eb_modes
  # bit-for-bit, max|diff| = 0.
  #
  # The reverse pairing is a genuine constraint and is absent:
  # fixed_operator cannot be evaluated pointwise, because
  # get_pure_EB_operator builds the single-grid operator (evaluation points
  # must be nodes of the integration grid) and all 20 reporting `meanr` values
  # are off-grid, by up to 0.312% — measured, not assumed.  Snapping them
  # would move θ.  pointwise_fixedop takes that shift deliberately: it snaps
  # each reporting abscissa to the nearest fine node in log θ (opt-in
  # snap_eval=True, offsets recorded per point, max 0.312%), which completes
  # the method × geometry square.  Read it alongside its offsets — the snap
  # also forces the operator's local term onto a single fine node instead of
  # the 20-bin reporting average, so that variant carries fine-bin shot noise
  # and runs ~7× larger in ξ_+^B than pointwise_dqags on realisation 00001.
  # Without snap_eval the constructor still raises, which is what keeps an
  # averaged caller from silently getting a two-grid operator.
  #
  # averaged_npairs_dqags is the one omission — nothing structural prevents
  # it, it was dropped on cost (Cail, 2026-09-04), because the weights
  # question is already answered under the operator at a quarter the price.
  # pure_eb_scan_variants.DROPPED carries that record forward.  Five run:
  #
  #   pointwise_dqags           dqags     / pointwise / none    / reporting_extent  (SUBMITTED)
  #   averaged_uniform_dqags    dqags     / averaged  / uniform / fine_grid_extent   (cross term)
  #   pointwise_fixedop         operator  / pointwise / none    / reporting_extent   (snapped corner)
  #   pointwise_fixedop_reporting  operator / pointwise / none  / reporting_extent   (snapped corner, reporting local term)
  #   averaged_uniform_fixedop  operator  / averaged  / uniform / fine_grid_extent   (ADOPTED, baseline)
  #   averaged_uniform_fixedop_reporting  operator / averaged / uniform / fine_grid_extent  (reporting local term; covariance aliased)
  #   averaged_npairs_fixedop   operator  / averaged  / npairs  / fine_grid_extent   (ruled arm)
  #
  # The last two pointwise-operator entries differ in ONE thing.  The transform
  # is a local term plus an integral term; the local term is
  # 0.5*(ξ_+ ± ξ_-) AT the evaluation point (schneider2022_nb writes it as
  # `xip_E[i] = 0.5 * (xip[i] + xim[i] + int_tmp) - ...`; the operator adds the
  # same numbers onto column `ii` of its row).  pointwise_dqags takes it from
  # the 20-bin REPORTING measurement and only the integral from the fine grid.
  # pointwise_fixedop, snapped onto a node, takes BOTH from that one fine node
  # — ~1/50 of a reporting bin's pairs — which is why it is noisy.
  # pointwise_fixedop_reporting snaps identically for the integral but restores
  # the reporting local term (`local_from_eval_grid=True`), making it the
  # like-for-like operator counterpart of the submitted chain.
  #
  # That local-vs-integral split is a third axis and it is not confined to the
  # pointwise geometry.  The averaged geometry builds its local term as the
  # block's own weighted mean of 0.5*(ξ_+ ± ξ_-) over the reporting bin's fine
  # nodes, which is NOT the 20-bin reporting measurement — the latter is its
  # own pair-weighted TreeCorr measurement, not a rebinning of the fine one.
  # averaged_uniform_fixedop_reporting substitutes it and completes the square:
  #
  #   local term from ...  pointwise geometry           averaged geometry
  #   the fine grid        pointwise_fixedop            averaged_uniform_fixedop
  #   the reporting ξ      pointwise_fixedop_reporting  averaged_uniform_fixedop_reporting
  #
  # One asymmetry decides how that seventh variant is wired.  The MC covariance
  # chains build their reporting draws BY uniformly rebinning the fine draws,
  # so under `uniform` weights the two local terms coincide on every draw and
  # the averaged reporting variant's COVARIANCE *is* averaged_uniform_fixedop's
  # — measured at 1.4e-20 on a rebinned draw against 1.8e-06 on the real
  # reporting measurement.  So it gets NO covariance output of its own: a
  # `covariance_from` alias in pure_eb_scan_variants points it at
  # averaged_uniform_fixedop's bundle, pure_eb_scan_statistics resolves the
  # alias, and pure_eb_scan_covariances refuses to build one (Cail, 2026-09-06
  # — propagating 500 draws to reproduce a known-identical matrix is a fake
  # dependency).  The substitution bites on the measured DATA VECTOR and on the
  # mock data vectors, where the reporting ξ is a real independent measurement.
  #
  # The one thing the alias does NOT cover: the borrowed bundle carries the
  # DONOR's data pure-mode vectors alongside the shared covariance, and the
  # data vector is exactly what this variant changes.  Reusing it would report
  # averaged_uniform_fixedop's data PTE under this variant's name.  So
  # pure_eb_scan_statistics rebuilds the vector in-stage from the measured ξ
  # (hence its xi_reporting / xi_integration inputs) through
  # gather_pure_eb_chunks.data_vector — the same function the stored vectors
  # came from — and runs the usual PTE against the borrowed covariance.  The
  # guard is a self-check at runtime: before trusting the rebuild it recomputes
  # the DONOR's vector the same way and requires bit-for-bit agreement with the
  # one stored in the bundle, so a divergence between the two code paths fails
  # loudly instead of producing a quietly wrong PTE.
  #
  # The covariance stage is one output per variant, so the propagations
  # run in parallel on separate nodes; every other stage is one output that
  # loops the variants internally, because they are cheap and their value is
  # the comparison rather than any single member.  Either way the variant list
  # lives in one importable table (pure_eb_scan_variants) rather than spread
  # across recipes that must stay in lockstep.
  #
  # The scan's covariances are built from 500 draws, not the fiducial 2000.
  # mc_samples is therefore NOT a decision on these outputs: that decision
  # names the paper covariance's sample count, which this stage does not
  # touch.  The Hartlap correction downstream reads the draw count out of each
  # bundle's provenance, so it can never drift from what was actually run.
  #
  # Option values are LITERALS in that table, and the three scanned decisions
  # are deliberately absent from every decisions: list below.  That is the
  # point of a scan: its content must not change with the active universe.  A
  # recipe reading {decisions.pure_eb_integration_method} would collapse to
  # whichever option the universe selects and the comparison would vanish.
  # The decisions stay decisions above, where the ruling lives; this measures
  # them.

  - id: pure_eb_scan_covariance_pointwise_fixedop
    type: data
    format: tar.gz
    description: |
      Both MC-propagated pure-mode covariances for the `pointwise_fixedop`
      variant — the snapped-evaluation corner — bundled as
      `pointwise_fixedop__data.npz` and
      `pointwise_fixedop__mockmatched.npz`. The first is the twin of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      and also carries the data's own pure-mode vectors, which is what
      the variant's data PTE is computed from downstream; the second is
      the twin of
      [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      One output per variant rather than one looped output, so the four
      run in parallel on separate nodes. Per variant rather than shared,
      because the transform that propagates the draws *is* the thing
      under scan: the `dqags` quadrature error is noise per draw and
      inflates the propagated variance (ξ_-^B bin 0 by ×3.3, ξ_-^amb by
      ×17), so one shared covariance would compare each variant's data
      vector against another variant's error bars. Seeds are identical
      across variants (42 + chunk/batch id, same block sizes), so the
      variant-to-variant difference carries no Monte-Carlo noise of its
      own.

      **500 draws, not the fiducial 2000.** The scan compares variants
      against each other rather than reporting an absolute error bar,
      and 500 draws give ≈0.4% per-element noise against the 10–30%
      differences being resolved. At 2000 this variant alone would run
      four times as long. The paper's fiducial 2000-draw covariance is a
      separate artifact and is untouched. The Hartlap correction
      downstream is read from this bundle's provenance, so it tracks the
      draw count rather than the pipeline's 2000.

      **Read this variant alongside its snap offsets.** The single-grid
      operator evaluates only at integration-grid nodes, so each of the 20
      reporting abscissae is snapped to the nearest fine node in log θ —
      offsets of −0.312% to +0.272%, recorded per point in the transform's
      `snap_offsets` and carried into the mode provenance as
      `snap_offset_max`. The consequence is larger than the shift: the
      operator's local term is then read at a *single fine node* rather than
      from the 20-bin reporting average that
      [pointwise_dqags](#outputs.pure_eb_scan_covariance_pointwise_dqags)
      uses, so it carries that node's own shot noise. Measured on realisation
      00001, the resulting ξ_±^B is ~7× the pointwise-dqags amplitude at
      ξ_+^B and ~2× at ξ_-^B, oscillating in sign across bins and *not*
      confined to the grid edges — the excess is fine-bin noise, not a
      quadrature effect. The variant completes the method × geometry square,
      but it is the noisiest corner of it and should not be read as "the
      operator in the submitted geometry" — for that reading, see
      [pure_eb_scan_covariance_pointwise_fixedop_reporting](#outputs.pure_eb_scan_covariance_pointwise_fixedop_reporting),
      which snaps identically but restores the reporting-grid local term.

      Cost: free. The operator is assembled once and applied as a matvec, so
      a realisation transforms in well under a second; 500 draws × 2
      covariances is minutes, and the time limit is margin for the chunked
      driver rather than for the transform.
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # The geometry override reaches each chain through the flag it already
      # carries: --geometry on run_pure_eb_semianalytic.sh (forwarded to
      # precompute_pure_eb_chunk) and --transform-averaged on the mock-matched
      # twin. Both are omitted for a variant running in its method's default
      # geometry, so those calls stay byte-for-byte the single-variant ones.
      # mc_samples is deliberately NOT a decision here: that decision names the
      # fiducial covariance's 2000, and the scan's 500 is a scan parameter.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant pointwise_fixedop
        --n-samples 500 --seed 42
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_scan_covariance_pointwise_fixedop_reporting
    type: data
    format: tar.gz
    description: |
      Both MC-propagated pure-mode covariances for the
      `pointwise_fixedop_reporting` variant — the *hybrid* snapped corner —
      bundled as `pointwise_fixedop_reporting__data.npz` and
      `pointwise_fixedop_reporting__mockmatched.npz`. Same two roles as
      every other bundle in this scan: the first is the twin of
      [pure_eb_semianalytic_data](#../pure_eb.pure_eb_semianalytic_data)
      and carries the data's own pure-mode vectors, which is what this
      variant's data PTE is computed from downstream; the second is the
      twin of [pure_cov_mockmatched](#outputs.pure_cov_mockmatched).

      **What it separates.** The Schneider-2022 transform is a *local*
      term plus an *integral* term. The local term is
      0.5·(ξ_+ ± ξ_-) evaluated **at the reporting abscissa**: the
      reference implementation writes it as
      `xip_E[i] = 0.5 * (xip[i] + xim[i] + int_tmp) - …`, and the operator
      adds exactly the same coefficients onto its own evaluation column
      (`out[ii] += 0.5`, `out[ii + n] ± 0.5`).
      [pointwise_dqags](#outputs.pure_eb_scan_covariance_pointwise_dqags)
      takes that term from the 20-bin reporting measurement and only the
      integral from the fine grid.
      [pointwise_fixedop](#outputs.pure_eb_scan_covariance_pointwise_fixedop),
      forced by the single-grid operator to evaluate at a node, takes
      **both** from the snapped fine node — roughly 1/50 of a reporting
      bin's pairs — so its per-point noise is fine-bin shot noise, not a
      quadrature effect. This variant snaps identically for the integral
      term (same nearest-node choice in log θ, same recorded offsets) and
      restores the reporting local term
      (`local_from_eval_grid=True` on `PureEBTransform`). It is therefore
      the like-for-like operator counterpart of the submitted pointwise
      chain: what remains between the two is quadrature plus the snapped
      integral's θ shift.

      Measured on realisation 00001, the hybrid's ξ_±^B sits at the
      pointwise-dqags amplitude rather than the ~7×/~2× excess
      `pointwise_fixedop` shows, which is what identifies that excess as
      the local term's fine-bin noise.

      **500 draws, not the fiducial 2000**, for the reason every bundle in
      this scan carries: the comparison is variant-against-variant, and
      500 draws give ≈0.4% per-element noise against the 10–30%
      differences being resolved. The Hartlap correction downstream reads
      the draw count from this bundle's provenance.

      Cost: free, like its neighbour. The operator is assembled once and
      applied as a matvec, and the local-term correction is one vector
      add per draw; the time limit is margin for the chunked driver.
    inputs: [xi_reporting, xi_integration, cov_integration_g, cov_integration_mockmatched, redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # --local-from-eval-grid reaches both chains through the flag each one
      # now carries (run_pure_eb_semianalytic.sh forwards it to
      # precompute_pure_eb_chunk and gather_pure_eb_chunks; mock_matched_pure_eb_cov
      # takes it directly). It is a no-op for every variant that does not snap,
      # so no other output's calls change.
      command: >
        python src/workflow/scripts/pure_eb_scan_covariances.py
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --cov-integration-mockmatched {inputs.cov_integration_mockmatched}
        --variant pointwise_fixedop_reporting
        --n-samples 500 --seed 42
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

