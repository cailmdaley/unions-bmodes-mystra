  - id: mock_mean_vector_figure
    type: figure
    format: pdf
    description: |
      Across-realisation mean of each B statistic in units of the
      analytic (data) σ, with σ_emp/(σ_ana√N) error bars in the
      same units and one y-range shared across the three panels.
      The mock-to-mock scatter itself is
      [mock_sigma_ratio_figure](#outputs.mock_sigma_ratio_figure)'s
      subject and is not repeated here. The y-axis reads directly
      as "fraction of a data error bar", which is the distinction
      that matters: a bias resolvable at mock precision (error
      bars ≈ 1/√N of a σ) can still be negligible for the data.
      Each pure-mode series is annotated with two χ²: the full
      20-bin reporting range and the fiducial window.
    inputs: [mock_per_mock_statistics, mock_mean_vector_plot_script, plotting_utils_script, scale_cuts_script]
    decisions: [reference_covariance, scale_cut_convention]
