    from: ../pure_eb_covariance_method

  reference_covariance:
    label: "Analytic covariance the mock scatter is compared against"
    tags: [glass, covariance]
    rationale: |
      This is the decision the whole campaign turns on, and it is
      easy to get wrong in a way that inverts the answer to
      referee comment 7.

      What the campaign tests is the *machinery*: the mock
      realisations' empirical scatter is held against an analytic
      covariance computed for the mocks' own noise by the same
      code that produces the paper's covariance. Agreement means
      that machinery gets the amplitude right on a catalogue
      whose true scatter is known by construction. It is not a
      comparison of the mock covariance against the data
      covariance, and nothing here should be read that way — the
      two catalogues carry different noise, so their covariances
      differ by design.

      "Mock-matched" resolves to just **two** independent
      rebuilds, not one per statistic, and each is the paper's
      own primitive pointed at the mocks:

      | statistic | mock-matched reference | traces to |
      |---|---|---|
      | COSEBIs | the ξ_± covariance transformed by `cosebis_covariance_from_xipm_covariance` | the CosmoCov run |
      | ξ_+^B, ξ_-^B, ξ_tot^B | [pure_cov_mockmatched](#outputs.pure_cov_mockmatched), the 2000-sample MC propagation | the CosmoCov run |
      | C_ℓ^BB | [cl_cov_mockmatched](#inputs.cl_cov_mockmatched), NaMaster iNKA on a mock catalogue | itself |

      Five of the six statistics therefore trace back to a single
      artifact — the
      [CosmoCov ξ_± run at the mocks' noise](#inputs.cov_integration_mockmatched)
      — with two consumers: the campaign transforms it for
      COSEBIs, and `mock_matched_pure_eb_cov.py` draws
      multivariate-normal samples from it and pushes them through
      the Schneider (2022) filters for the pure modes. The MC
      propagation carries no noise parameters of its own; it
      inherits whatever ξ_± covariance it is handed. So the
      mock-versus-data matching problem lives in exactly one
      declared input, and getting that one artifact right is the
      whole of it for the configuration-space channels.

      C_ℓ^BB is the separate and cleanest path, because it needs
      no density parameter at all: the primitive reads the mock
      catalogue's own weighted count map and noise bias. It
      replaces an earlier hand-fed 0.7325 rescale of the data
      covariance, which is retired and is not the current method.

      Mock-matching is necessary because the mocks do not carry
      the catalog's galaxy count. The convention-free statement
      is galaxies-per-sky, since mock and data catalogues occupy
      the same footprint: an nside-4096 audit puts data galaxies
      on 2750.65 deg², mock galaxies on 2709.91 deg² and their
      overlap at 2703.17 deg², with only 0.26 deg² of the data
      footprint outside the mock mask, so the areas in
      circulation (2405, 2757, 2894 deg²) are bookkeeping over
      one sky and cancel from any ratio. On that sky the fiducial
      catalog carries 51.65 M weight-effective galaxies
      (61 378 891 rows; equivalently 4.9573 arcmin⁻² × 2894.03
      deg², or the weighted H12 n_eff 4.8636 × 2949.79 deg² — the
      product is the invariant, not either factor) against the
      suite's 60 423 575 unit-weight galaxies. Per-component σ_e
      agrees to 0.2% (0.26757 data, 0.26822 mock), so the count
      ratio is the whole story: the mocks are *under*-noised,
      with a BB variance 0.726 of the data's against an empirical
      truth of 0.716. That is
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining),
      and the two measured ratios it rests on are
      [clbb_variance_ratios](#outputs.clbb_variance_ratios).

      The mock-matched rebuild moves the count and leaves the area
      convention alone: the mockmatched CosmoCov ini keeps
      `area = 2894.03` — the data's own convention, Σmask × pixarea
      of the nside-4096 binary footprint mask — and sets
      `source_n_gal = 60 423 575 / 2894.03 deg² = 5.793 arcmin⁻²`.
      That is the consistent choice on both terms of the covariance.
      Shot noise depends on the product n_gal × A, so the convention
      cancels there outright; f_sky enters the cosmic-variance term
      identically on the mock and data sides, so it cancels from the
      mock-versus-machinery comparison this campaign makes. C_ℓ^BB
      needs no convention at all — NaMaster reads the mock count map
      directly. Which area is the better f_sky for the *data*
      covariance (2894.03 deg² footprint versus the 2750.65 deg² the
      galaxies actually occupy) is a separate question, worth about
      5% of the sample-variance term and out of scope here; ruled
      (Cail, 2026-08-31): the data covariance keeps the 2894.03 deg²
      footprint convention — the same area the data products
      themselves use, shared with Papers III and IV. Nothing was
      computed any other way, so the ruling changes no artifact. For reference, the
      convention-free target for a correctly generated suite is
      51.65 M galaxies on the shared footprint — 4.957 arcmin⁻² on
      the footprint mask, or 5.20 on the occupied-pixel mask.

      `mockmatched` is therefore the default and the selection
      the response letter should quote. `fiducial` is retained
      as the diagnostic that *demonstrates* the count mismatch is
      the whole effect rather than a covariance error — it is the
      only place mock scatter meets the data covariance, and the
      ratio between the two runs' σ ratios recovers the count
      ratio.
    default: mockmatched
    options:
      mockmatched:
        label: "The paper's covariance machinery rerun at the mocks' own noise"
        description: |
          The two rebuilds of the table above:
          `--cosebis-cov-mockmatched` takes the
          `SP_v1.4.6.3_mockv2` CosmoCov run and
          `--pure-cov-mockmatched` the MC propagation of that
          same run, while `--cl-cov-mockmatched` takes the
          independently computed mock-catalogue NaMaster
          covariance. Materialised as
          `results/glass_mock_v1.4.6.3_v2/campaign_350_avg_wide/`
          with its C_ℓ column in
          `campaign_350_avg_wide_clbbcov/`.
      fiducial:
        label: "The paper's own covariance, unmodified"
        description: |
          `--cosebis-cov` and `--pure-cov` take the fiducial
          v1.4.6.3 leak-corrected covariances at blind A, C_ℓ^BB
          unscaled — the data's noise held against the mocks'
          scatter. Diagnostic only: it measures the galaxy-count
          difference between the two catalogues, not the
          covariance's accuracy.

  mock_suite:
    label: "GLASS realisation suite"
    tags: [glass]
    rationale: |
      Two suites of 350 GLASS lognormal realisations were
      delivered, and only the later one is admissible.

      The 2026-03 **v1.4.6.3_v2** suite is generated against the
      paper's fiducial catalog and is the suite everything here
      is computed on. It backs every product the response letter
      quotes: the direct mock-matched C_ℓ^BB covariance and the
      C_ℓ channel rebuilt on it, the suite-level min-PTE
      calibration, and the corrected transform-averaged
      wide-operator campaign.

      The earlier **v1.4.6** suite is excluded rather than kept
      as a live alternative. It is not a different defensible
      analysis path — it is a stale one, generated on a 1600 deg²
      mask that is not the data's footprint and carrying a third
      fewer galaxies than the catalog, and every result computed
      on it has been recomputed on v2. It is
      declared here because a reader will encounter it in the
      campaign's file tree and in earlier notes, and needs to
      know why it is not the answer.
    default: v1_4_6_3_v2
    options:
      v1_4_6_3_v2:
        label: "v1.4.6.3_v2 suite (2026-03, fiducial catalog)"
        description: |
          `/n09data/guerrini/glass_mock_v1.4.6.3_v2/results`, 350
          realisations of 60 423 575 unit-weight galaxies on the
          fiducial footprint — 17% more than the data's 51.65 M
          weight-effective galaxies, hence slightly under-noised.
          Ships catalogues, stored 20-bin ξ_± and per-mock Cℓ,
          and has a directly computed mock C_ℓ^BB covariance
          ([cl_cov_mockmatched](#inputs.cl_cov_mockmatched)). It
          has no masked counterpart on disk: the
          [masked chain](#outputs.mock_xi_fine_masked) is
          declared against it, scoped to 50 realisations, and not
          yet run.
      v1_4_6:
        label: "v1.4.6 suite (paper Sect. 3.7, stale density)"
        excluded: true
        excluded_reason: |
          Stale-density suite. `/n09data/guerrini/glass_mock_v1.4.6/results`
          holds 35 078 729 unit-weight galaxies per realisation
          on a 1600.33 deg² mask, not the data's footprint: the
          generator's default 6.0905 arcmin⁻² — a density frozen
          at the 2405 deg² era of the survey-area bookkeeping —
          applied to that smaller sky. The "n_eff = 3.3697
          arcmin⁻²" figure in older notes is that count divided
          by the 2894 deg² convention, and describes neither the
          suite's own density nor the data's. This is the suite Paper II Sect. 3.7
          describes and the one the original 2026-08 campaign and
          the unvetted masked-footprint run were computed on;
          both are superseded by the v2 suite, which sits far
          closer to the catalog's own count. Retained as a named
          option so the file tree and the earlier notes remain
          legible.

prior_insights:

  paper_iv_inka_overestimates_variance:
    id: paper_iv_inka_overestimates_variance
    label: "Paper IV's iNKA covariance overestimates the small-scale variance"
    claim: |
      The Gaussian iNKA covariance adopted by UNIONS Paper IV
      (harmonic-space cosmology) gives larger small-scale
      uncertainties than either `OneCovariance` or the GLASS mocks —
      15% against the mocks, around 20% against `OneCovariance` — and
      Paper IV attributes the gap to iNKA accounting for a spatially
      varying galaxy number density, which breaks the stationary-noise
      assumption the other two estimates make.

      Quoted here because the same GLASS suites are on the other side
      of that comparison, and this sub-analysis measures them to be
      under-noised by a comparable factor. See
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining)
      for how the two readings compose — additively, not in
      contradiction.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev_main_text
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "However, the estimate computed from the Gaussian part of iNKA tends to overestimate the variance."
        location: { page: 6 }
      - id: ev_caption_15
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "There is a discrepancy of 15% between the NaMaster estimate and the one obtained from mocks."
        location: { page: 6 }
      - id: ev_appendix_20
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "the iNKA covariance used in this work overestimates by around 20% the uncertainty compared to what is obtained from OneCovariance and GLASS simulations"
        location: { page: 14 }
      - id: ev_mechanism
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "An underlying assumption in OneCovariance and GLASS mocks is that the noise is stationary. This is not true if the object density varies strongly across the sky."
        location: { page: 14 }


findings:

  mock_xi_matches_input_theory_above_band_limit:
    id: mock_xi_matches_input_theory_above_band_limit
    label: "The suite's raw ξ_± is unbiased above its band limit, and band-limited below it"
    claim: |
      The across-realisation mean ξ_± of the 350 unmasked GLASS
      realisations reproduces the theory the suite was generated
      from to within a few per cent at every separation above
      ≈6′, with no trend: |mean/theory − 1| ≤ 0.03 over the whole
      12′–83′ fiducial window for both ξ_+ and ξ_-. The mocks
      carry no ξ_± bias the null tests inherit.

      Below ≈6′ they depart dramatically — ξ_- at 1.2′ is ~100
      times smaller than the unbanded prediction, and ξ_+ sits a
      few per cent off — and the departure is *entirely* the
      simulation's resolution. The maps are NSide 4096 and the
      generator sets ℓ_max = NSide, while ξ_-(1′) is built almost
      entirely out of ℓ ~ 10⁴. Truncating the theory at ℓ = 4096
      accounts for essentially all of it: over the first six
      reporting bins the theory's own band ratio runs 0.006,
      0.020, 0.071, 0.166, 0.40, 0.81, against a measured mock
      mean over *unbanded* theory of ≈0, 0.00, 0.089, 0.208,
      0.49, 0.86. The two track each other across two orders of
      magnitude, with the mocks sitting 10–20% above the sharp
      cut — the residual a lognormal field's extra small-scale
      power and a band edge that is not perfectly sharp would
      give. This is why the transform in
      [mock_xi_input_theory](#outputs.mock_xi_input_theory) is an
      explicit band-limited sum: run through an FFTLog that
      extrapolates past the last supplied multipole, the same
      comparison reads as a catastrophic small-scale failure of
      the mocks.

      The affected scales lie wholly outside the fiducial cut, so
      nothing the paper claims rests on them — but any future use
      of this suite below ≈6′, in ξ_- especially, is measuring the
      simulation's band limit.

      Bin by bin the residual inside the cut is |mean − theory| ≤
      0.33 σ_ana (ξ_+) and ≤ 0.46 σ_ana (ξ_-) against an error of
      the mean of ≈0.05 σ_ana, so it is statistically resolved but
      scattered in sign with no trend. Its size is what the
      band-limited transform's own ±2–3% ringing predicts: 2% of
      ξ_+ at 18′ is 0.30 σ_ana. It bounds a mock ξ_± bias at the
      third of an error bar level rather than measuring one.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats
      - id: ev2
        artifact: mock_xi_validation_figure

  mock_xi_scatter_falls_below_analytic_at_large_theta:
    id: mock_xi_scatter_falls_below_analytic_at_large_theta
    label: "Raw ξ_+ scatter falls 15–18% below the mock-matched analytic σ above 100′"
    claim: |
      Against the campaign's own
      [mock-matched reference covariance](#outputs.mock_xi_reporting_cov_mockmatched),
      the suite's raw ξ_± scatter sits on unity inside the
      12′–83′ window: σ_emp/σ_ana = 0.94–1.03 for ξ_+ and
      0.99–1.12 for ξ_-. The analytic covariance machinery
      reproduces the mocks' ξ_± scatter where the paper uses it.
      (Against the *data* covariance the same ratios read
      0.87–0.98 and 0.87–0.97 — the suite's 17% galaxy excess,
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining),
      and the reason mock validation must not use it.)

      Outside the window the two correlation functions part
      company. ξ_- stays near unity (0.98–1.07 above 96′), while
      ξ_+ falls to 0.82–0.86 there. The deficit survives the
      correct noise-level reference, so it is not a density
      effect, and it is not footprint geometry either: the
      measured pair deficit at 221′ is 13%, but shape noise is
      only 5.7% of the ξ_+ variance there, so that deficit moves
      σ by 0.4% — under 1% at every separation. What remains is
      that the realisations carry less large-scale sample variance
      at those separations than the Gaussian analytic covariance
      predicts. This is a reading of the residual, not a mechanism
      established here; ξ_+ at >100′ draws on the lowest
      multipoles, where a lognormal shell construction on a single
      footprint is least trusted.

      Separately, and independently of the covariance: the
      measured pair counts fall away from the uniform-density,
      no-edge prediction. The implied galaxy count per bin is flat
      at the delivered value below ≈3′ and declines monotonically
      to 0.87 of it by 221′. That decline — not its absolute
      level, which floats with the area convention — is the
      footprint-edge effect the *noise-only* pure-mode statistics
      inherit at large θ, and it is invisible in raw ξ_± for the
      reason above.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats

  mock_ptes_skew_low_by_ng_term:
    id: mock_ptes_skew_low_by_ng_term
    label: "Clean-mock PTEs skew low by the missing non-Gaussian covariance term"
    claim: |
      On the clean lognormal mocks, the per-realisation PTE
      distributions of all five configuration-space statistics are
      significantly non-uniform (KS p from 3×10⁻⁴ down to 2×10⁻⁹) and
      skewed low: mean χ²/dof runs 1.08–1.19, so a nominal 0.05
      per-statistic threshold fires on 7–11% of clean realisations.
      C_ℓ^BB — the one statistic whose reference covariance is
      mock-derived rather than CosmoCov — is uniform (χ²/dof 0.987,
      KS p 0.79). The mechanism is the covariance class: the MC draw
      source is Gaussian-only CosmoCov (non-Gaussian terms are
      intractable on the 1000-bin integration grid), while the
      lognormal realisations carry connected-trispectrum variance;
      on the reporting grid, where both flavours exist, the NG/G
      diagonal ratio inside the 12'–83' window is 1.121 (ξ_+) /
      1.123 (ξ_-) — the size of the mock χ²/dof excess. Nominal
      per-statistic PTEs are therefore mis-calibrated by a known,
      quantified mechanism, and global statements should be made in
      the empirical mock currency of
      [mock_min_pte_calibration](#outputs.mock_min_pte_calibration):
      under the adopted baseline the observed minimum PTE (ξ_-^B,
      0.027 nominal) sits above 15.7% (one-sided; 23.1% two-sided) of
      clean-mock minima, and the empirical min-PTE threshold for a 5%
      global false-alarm rate is 0.0059 (one-sided) / 0.0034
      (two-sided).
    created_at: "2026-08-31T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: |
            chi2_calibration KS pte_uniformity p-values: B_n<=6
            5.7e-5, B_n<=20 9.5e-6, xi+^B 9.7e-8, xi-^B 3.1e-4,
            xi_tot^B 1.8e-9, C_ell^BB 0.79.
      - id: ev2
        artifact: mock_min_pte_calibration
        quote:
          exact: |
            P(min p <= 0.027) = 55/350 = 0.157 one-sided, 81/350 =
            0.231 two-sided; empirical 5% global thresholds 0.0059 /
            0.0034.
    scope: "v1.4.6.3_v2 suite, mock-matched reference covariances, adopted scale cuts, baseline estimator."

  mocks_are_over_constraining:
    id: mocks_are_over_constraining
    label: "The GLASS mocks are under-noised, so their scatter over-constrains"
    claim: |
      The GLASS realisations carry more galaxies than the catalogue
      they stand in for, and are therefore quieter than the data:
      their B-mode scatter is *smaller* than the data's, and any error
      bar taken from them without correction understates the real
      uncertainty. On a footprint shared with the data to better than
      0.3 deg², the v1.4.6.3_v2 suite holds 60 423 575 unit-weight
      galaxies against the fiducial catalogue's 51.65 million
      weight-effective galaxies — 17% more. Per-component ellipticity
      dispersion agrees to 0.2% (0.267568 data, 0.268175 mock), so
      that count ratio is the whole of the noise difference: shape
      noise power σ_e²/N is 0.8596 of the data's, and the B-mode
      variance, which for these mocks is pure noise, 0.7389 of it.

      The measured numbers agree with that prediction and sit just
      below it: the covariance machinery run at the mocks' own noise
      gives a C_ℓ^BB variance ratio of 0.726, and the 350 realisations
      themselves scatter at 0.716 of the data's variance.

      The consequence is a methodological constraint, not a defect in
      the campaign: mock scatter may be compared only against a
      covariance built at the mocks' own noise, which is what
      [reference_covariance](#decisions.reference_covariance) =
      `mockmatched` does. Held against the paper's own covariance the
      same realisations would appear to validate an error bar roughly
      15% too large, and the campaign would be measuring the count
      mismatch rather than the covariance.
    notes: |
      **Provenance of each number.** The counts, areas, σ_e values,
      the 0.8596 noise-power ratio and the 0.7389 variance ratio are
      all in
      [mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table),
      derived there from the two CosmoCov inis and the footprint
      audit and from nothing else — and they are a *prediction*, from
      counts and σ_e alone. The two numbers in the claim's second
      paragraph are the measurement that prediction is tested
      against, and they come from
      [clbb_variance_ratios](#outputs.clbb_variance_ratios): the
      17-band means over 300 ≤ ℓ ≤ 1600 of the mock-matched-to-data
      covariance diagonal ratio (0.7257) and of the 350 realisations'
      sample-variance-to-data ratio (0.7164). Both were first
      obtained by hand during the campaign and recorded in
      `results/glass_mock_v1.4.6.3_v2/RUNBOOK_v2_campaign.md`
      (lines 66-67 and 93-94) and in the plotting script beside it,
      `clbb_cov_work/plot_cl_cov_comparison.py`, as 0.726 and 0.716;
      the declared output reproduces those hand values exactly, which
      is the cross-check that retired them as prose.

      **The submitted descriptions say the opposite.** Paper III
      writes that the catalogues "were created using the same mask,
      effective number density and σ_e as the data", and Paper IV
      that the mocks reproduce "the footprint, the number density,
      the shape noise, and the redshift distribution of the UNIONS
      weak lensing sample". Neither paper prints a numeric mock
      density, so neither statement is checkable from the text; both
      are superseded here by direct measurement of the delivered
      catalogues, which Sacha Guerrini has confirmed in discussion.

      **The origin, read off the generator.** Sacha's
      `make_unions_glass_sim.py` takes the density as `--neff`, with
      a default of 6.0905 arcmin⁻², and neither `run_glass_mock.sh`
      nor `run_glass_mock_local.sh` overrides it. 6.0905 is the
      catalogue n_eff of the 2405 deg² area era; when the high-res
      footprint mask moved the area to 2894 deg² the catalogue n_eff
      became 4.957, and the generator default did not follow. The
      generator applies that density to
      `/n09data/guerrini/glass_mock_v1.4.6.3_v2/mask_nside4096.fits`,
      built by `create_mask.py` as the nside-4096 pixels containing
      at least one catalogue galaxy: 2757.25 deg². The product
      6.0905 × 2757.25 × 3600 = 60.45 M is the 60.27–60.42 M
      realised per realisation. The catalogue's own A = 2894.03 in
      `cat_config.yaml` is a different definition at the same nside —
      Σmask × pixarea of
      `sp_validation/cosmo_inference/data/mask/mask_map_footprint_nside_4096.fits`,
      the binary footprint mask derived from the HealSparse pixel
      mask, in which roughly 5% of pixels contain no galaxy because
      sub-pixel holes are filled at nside 4096. Data galaxies occupy
      2750.65 deg² of it. So the excess is a density default frozen
      at an older area convention, applied on an occupied-pixel mask
      rather than the footprint mask the catalogue's area comes from.

      **Corroboration from Paper IV, read carefully.** Paper IV
      reports that its fiducial Gaussian iNKA covariance
      *overestimates* the small-scale variance relative to both
      `OneCovariance` and the GLASS mocks — "a discrepancy of 15%"
      against the mocks in its Fig. 4 caption, "by around 20%"
      against `OneCovariance` in its Appendix D — and attributes the
      gap to iNKA's treatment of a spatially varying number density,
      which breaks the stationary-noise assumption the other two
      make. See
      [paper_iv_inka_overestimates_variance](#prior_insights.paper_iv_inka_overestimates_variance).

      That mechanism is real and is not disputed here. But it is
      measured as a *gap between two estimates*, and this finding
      identifies an independent contribution to the same gap running
      in the same direction: if the GLASS mocks carry 17% more
      galaxies than the data, their variance is ~26% low by
      construction, so a comparison against them will show any
      correctly normalised covariance "overestimating". Part of
      Paper IV's submitted 15-20% is therefore plausibly the mocks
      being under-noised rather than iNKA being wrong. This is a
      partial reattribution and not a reversal: the two effects are
      additive, Paper IV's homogeneous-density test isolates its own
      mechanism directly, and nothing here quantifies the split.

      **The measurement chain is deliberately convention-free.**
      Areas quoted for this survey range over 2405, 2757, 2894 and
      2949 deg² depending on the bookkeeping, and the nside-4096
      audit shows they describe one sky: data galaxies occupy
      2750.65 deg², v2 mock galaxies 2709.91 deg², their overlap
      2703.17 deg², and only 0.26 deg² of the data footprint falls
      outside the mock mask. Since area cancels from any ratio taken
      on one footprint, the physical quantity is galaxies-per-sky,
      and n_eff × A is its convention-free form (4.9573 arcmin⁻² ×
      2894.03 deg² and the weighted H12 4.8636 × 2949.79 deg² both
      give 51.65 M). The "n_eff = 3.3697 arcmin⁻²" that appears in
      the campaign code and in earlier notes is the *v1.4.6* count
      divided by the 2894 deg² convention — a count ratio in density
      clothing, not that suite's density on its own sky.

      **The superseded suite missed the other way.** The
      [v1.4.6 suite](#decisions.mock_suite) carried 35 078 729
      galaxies, 32% *fewer* than the data — and on a 1600.33 deg²
      mask rather than the data's footprint, so it is not comparable
      to the data by a count ratio alone. It is excluded, and its row
      is left out of the table rather than asserted there.

      The two suites do not share a mask.
      `/n09data/guerrini/glass_mock_v1.4.6/mask_nside4096.fits`
      covers 1600.33 deg², and 6.0905 × 1600.33 × 3600 = 35.08 M is
      exactly the v1.4.6 count: the same frozen density default on a
      smaller sky. An earlier pixel-level count that put both suites
      at ≈6.09 arcmin⁻² on their own masks was therefore right, and
      the reading that they sit on one sky differing only in count
      was wrong. Nothing in the campaign rests on v1.4.6, which
      should not have been used at all.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_vs_data_noise_table
        quote:
          exact: "0.85961"
      - id: ev2
        artifact: clbb_variance_ratios
        quote:
          exact: '"machinery_variance_ratio_mean": 0.7256688533232034'
      - id: ev3
        artifact: clbb_variance_ratios
        quote:
          exact: '"empirical_variance_ratio_mean": 0.7164085265873238'
      - id: ev4
        artifact: mock_sigma_ratio_figure
    scope: "The delivered GLASS v1.4.6.3_v2 suite against the v1.4.6.3 leak-corrected fiducial catalog; galaxy counts, σ_e and footprint only, and the shape-noise scaling that follows from them."

  covariance_amplitude_validated:
    id: covariance_amplitude_validated
    label: "Analytic covariance amplitude validated at the 10% level"
    claim: |
      Against the mock-matched reference covariance, the
      empirical scatter of the 350 GLASS v1.4.6.3_v2 realisations
      agrees with the analytic σ used in the paper's PTEs to
      within roughly 10% for every statistic: median σ_emp/σ_ana
      is 1.05 across the 20 COSEBI modes (range 0.99–1.16), 1.08
      for both ξ_+^B and ξ_-^B over the seven fiducial-cut θ bins
      (ranges 0.96–1.14 and 0.94–1.14), and 0.99 across the 17
      fiducial-cut C_ℓ^BB bands (range 0.93–1.09). This is the
      quantitative replacement for Sect. 3.7's unsupported
      "comparable to the fiducial error bars".
    notes: |
      From
      `results/glass_mock_v1.4.6.3_v2/campaign_350_avg_wide/evidence.json`
      with the C_ℓ column from `campaign_350_avg_wide_clbbcov/`
      (350 realisations, corrected transform-averaged wide
      operator). The C_ℓ figures quoted are those from the
      directly computed mock covariance; the retired 0.7325
      count-ratio rescale gives 0.92–1.08, median 0.989, so the
      channel is insensitive to which is used.

      What this validates is the covariance *machinery*: the
      mocks' scatter is known by construction, and the same
      CosmoCov / MC / NaMaster chain that builds the paper's
      covariance, pointed at the mocks' noise, reproduces it to
      ~10%. It is not a statement that the mock and data
      covariances agree — they should not, since the two
      catalogues carry different galaxy counts.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: |
            COSEBI B modes 1--20: sigma ratio min 0.989, max
            1.161, median 1.047. C_ell BB 17 cut bands: min
            0.926, max 1.086, median 0.993.
    scope: "350 GLASS v1.4.6.3_v2 realisations, mock-matched reference covariance, fiducial scale cuts."

  chi2_machinery_conservative:
    id: chi2_machinery_conservative
    label: "χ² PTEs are calibrated, and err conservatively"
    claim: |
      Held against a covariance built by the paper's own
      machinery at the mocks' noise, the per-realisation χ²
      sampling distribution tracks the assumed χ²_ν closely and,
      where it departs, departs in the safe direction. Across the
      350 realisations the mean χ² exceeds ν by 8–17% for five of
      the six statistics — 6.78 against ν = 6 for B_{n≤6}, 21.60
      against 20 for B_{n≤20}, 8.21 against 7 for ξ_+^B, 7.92
      against 7 for ξ_-^B, 16.28 against 14 for ξ_tot^B — and
      falls just below for the sixth, 16.78 against 17 for
      C_ℓ^BB, whose PTE distribution passes a KS test of
      uniformity at p = 0.79. A mean χ² above ν makes the
      reported PTEs systematically *lower* than the true tail
      probabilities, so a null test that passes at these PTEs
      would pass at the calibrated ones.
    notes: |
      `chi2_calibration` in the 350-realisation evidence file,
      and `cl_channel.new_mock_matched` in
      `campaign_350_avg_wide_clbbcov/evidence_cl_channel.json`
      for the C_ℓ KS test. The residual departure is not a χ²
      problem: the pure-mode PTE distributions are non-uniform
      because the MC-propagated pure-E/B covariance carries a
      known per-bin σ shape error, an estimator issue tracked
      separately from the covariance amplitude this campaign
      validates. The `fiducial` selection of
      [reference_covariance](#decisions.reference_covariance)
      would show these means inflated by the galaxy-count
      difference rather than by any covariance error, but it has
      not been run on this suite.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: |
            B_n<=6: chi2_mean 6.780, expected_mean_nu 6.
            xi+^B: chi2_mean 8.207, expected_mean_nu 7,
            hartlap_n 2000. C_ell^BB: chi2_mean 16.775,
            expected_mean_nu 17.
    scope: "350 GLASS v1.4.6.3_v2 realisations at fiducial scale cuts, mock-matched reference covariance."

  tests_are_not_redundant:
    id: tests_are_not_redundant
    label: "The six null tests are only weakly correlated"
    claim: |
      Empirically the six B-mode test statistics are far less
      redundant than the paper's qualitative "the tests are
      highly correlated" suggests. Across the 350 v1.4.6.3_v2
      realisations the χ² Pearson correlations between statistics
      from different estimator families sit between 0.23 and 0.46
      — 0.40 between B_{n≤6} and ξ_+^B, 0.37 between B_{n≤6} and
      C_ℓ^BB, 0.33 between ξ_+^B and C_ℓ^BB, 0.46 between ξ_-^B
      and C_ℓ^BB. Only pairs sharing a data vector correlate more
      strongly, and even they stay well under unity: 0.68 for
      ξ_-^B with ξ_tot^B and 0.67 for ξ_+^B with ξ_tot^B, both
      nested by construction, and 0.57 for B_{n≤6} with B_{n≤20}.
    notes: |
      `correlations.chi2.pearson_matrix` in
      `campaign_350_avg_wide/evidence.json`; the Spearman matrix
      tells the same story (0.37 for B_{n≤6} with C_ℓ^BB). The
      v1.4.6 suite gives systematically lower cross-family
      numbers (0.34, 0.26, 0.22 for the three C_ℓ^BB pairs), so
      the conclusion is not suite-dependent in direction. This
      strengthens rather than weakens the paper's multi-statistic
      argument — near-independent tests make simultaneous passage
      a stronger statement, and it also means the look-elsewhere
      penalty for running six of them is real rather than
      absorbed by redundancy.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: |
            chi2 Pearson: B_n<=6 with C_ell^BB 0.373, xi+^B with
            C_ell^BB 0.330, xi-^B with C_ell^BB 0.462; xi-^B with
            xi_tot^B 0.681.
    scope: "350 GLASS v1.4.6.3_v2 realisations, fiducial scale cuts, six-statistic χ² and PTE stacks."

