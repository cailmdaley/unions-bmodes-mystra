version: "0.0.14"
name: "GLASS mocks"
description: |
  Validation of the B-mode estimators, covariances and PTE
  convention on 350 systematics-free GLASS lognormal realisations.
  The realisations contain no B-mode signal, so every B statistic
  they produce is noise: their scatter is the empirical σ to hold
  the analytic σ against, their per-mock χ² values test the PTE
  convention and calibrate the min-PTE threshold, and their χ²
  correlations measure how independent the six statistics are.

  Each realisation is measured independently (the
  [ξ_± ensemble](#outputs.mock_xi_fine)) and carried through the
  same ξ_± → COSEBI and ξ_± → pure-E/B transforms the data use; all
  six statistics are then compared against analytic covariances.
  The key [decision](#decisions.reference_covariance) is which
  covariance: the realisations carry 17% more galaxies than the
  data ([finding](#findings.mocks_are_over_constraining)), so they
  are held against a covariance the same CosmoCov and NaMaster chain
  builds at the mocks' own noise. The campaign thus tests the
  covariance machinery, not the data covariance directly: the
  [analytic covariances](#../../analyses.covariances.outputs.pure_eb_covariance_reference), not a mock sample
  covariance, enter the PTEs.

inputs:

  - id: glass_mock_catalogs
    from: ../glass_mock_catalogs

  - id: glass_mock_xi_reporting
    from: ../glass_mock_xi_reporting

  - id: glass_mock_cl
    from: ../glass_mock_cl

  - id: xi_integration
    from: ../xi_integration

  - id: cl_cov_reporting
    from: ../cl_cov_reporting

  - id: cov_integration_reference
    from: ../cov_integration_reference

  - id: cov_reporting_reference
    from: ../cov_reporting_reference

  - id: cl_cov_reference
    from: ../cl_cov_reference

  - id: pure_eb_covariance_reference
    from: ../pure_eb_covariance_reference

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: redshift_distributions
    from: ../redshift_distributions

  - id: cosmology_snapshot
    from: ../cosmology_snapshot

outputs:

  # ── The per-realisation data vectors ─────────────────────────────────────

  - id: mock_xi_fine
    from: mock_xi_scan.mock_xi_fine

  - id: mock_xi_reporting
    type: data
    format: npz
    description: |
      The suite's stored 20-bin reporting-grid ξ_± vectors, stacked
      into the same ensemble layout as
      [mock_xi_fine](#outputs.mock_xi_fine).
    inputs: [glass_mock_xi_reporting]
    decisions: [mock_suite, reporting_binning]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_ensemble.py
        --members "$(dirname "$(printf '%s\n' "{inputs.glass_mock_xi_reporting}" | head -n1)")"/xi_glass_mock_*_4096_nbins=20.fits
        --reporting-binning {decisions.reporting_binning}
        --out-file {output}
      resources: { cpus: 1, memory: "8GB" }

  - id: mock_cosebis_modes
    type: data
    format: npz
    description: |
      COSEBI E_n / B_n for n = 1 … 20 and all 350 realisations, stacked
      as a 350 × 20 pair, computed from
      [mock_xi_fine](#outputs.mock_xi_fine) with the same
      `cosmo_numba` call as the data vector, over the
      [fiducial θ range](#decisions.scale_cut_convention). The filters
      span the first and last fine-bin centres inside the cut,
      12.05′–82.14′ under `grid_bin_edges`.
      [mock_cosebis_modes_full](#outputs.mock_cosebis_modes_full) is
      the 1–250 arcmin counterpart.
    inputs: [mock_xi_fine]
    decisions: [mock_suite, scale_cut_convention]
    recipe:
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20
        --scale-cut-convention {decisions.scale_cut_convention}
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_cosebis_modes_full
    type: data
    format: npz
    description: |
      Full-range COSEBI E_n / B_n for n = 1 … 20 and all 350
      realisations, stacked as a 350 × 20 pair: as
      [mock_cosebis_modes](#outputs.mock_cosebis_modes), over the
      1–250 arcmin range of the full-range data PTEs.
    inputs: [mock_xi_fine]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_cosebis_scatter.py
        --xi-ensemble {inputs.mock_xi_fine} --out-file {output}
        --nmodes 20 --theta-min 1.0 --theta-max 250.0
      resources: { cpus: 16, memory: "8GB" }

  - id: mock_pure_eb_modes
    type: data
    format: npz
    description: |
      Pure-mode ξ_±^{E,B,amb} for all 350 realisations on the 20-bin
      reporting grid, stacked as six 350 × 20 blocks. The reporting
      bins come from
      [mock_xi_reporting](#outputs.mock_xi_reporting) and the transform
      runs over [mock_xi_fine](#outputs.mock_xi_fine), on the same
      0.5′–300′ grid as the data, under the same
      [quadrature](#decisions.pure_eb_integration_method). Under
      `npairs` [weights](#decisions.pure_eb_rebinning_weights) each
      realisation is averaged with its own pair counts.
    inputs: [mock_xi_fine, mock_xi_reporting]
    decisions: [mock_suite, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, decomposition_method]
    recipe:
      command: >
        python src/workflow/scripts/mock_pure_eb_scatter.py
        --fine-ensemble {inputs.mock_xi_fine}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 16, memory: "16GB" }

  # ── The six-statistic campaign ───────────────────────────────────────────

  - id: mock_per_mock_statistics
    type: data
    format: npz
    description: |
      Per-realisation results for the six statistics (B_{n≤6},
      B_{n≤20}, ξ_+^B, ξ_-^B, ξ_tot^B, C_ℓ^BB): each realisation's B
      vector and its χ² and PTE against the selected reference
      covariance, at the fiducial cuts and over the full range
      (`chi2_full`, `pte_full`, `dof_full`; 1–250 arcmin / 8≤ℓ≤2048).
      Also carries the analytic σ vectors on both ranges, the cut
      masks, and the covariance triple, scale cuts and any skipped
      realisations. The campaign's σ, χ² and PTE summaries derive from
      this file.
    inputs: [mock_cosebis_modes, mock_cosebis_modes_full, mock_pure_eb_modes, mock_xi_fine, glass_mock_cl, xi_integration, cov_integration_reference, pure_eb_covariance_reference, cl_cov_reference]
    decisions: [reference_covariance, mock_suite, scale_cut_convention, fiducial_catalog, fiducial_blind, pte_definition, integration_grid]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --cosebis-ensemble {inputs.mock_cosebis_modes}
        --cosebis-ensemble-full {inputs.mock_cosebis_modes_full}
        --pure-ensemble {inputs.mock_pure_eb_modes}
        --fine-ensemble {inputs.mock_xi_fine}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --cosebis-xi-grid {inputs.xi_integration}
        --cosebis-cov {inputs.cov_integration_reference}
        --pure-cov {inputs.pure_eb_covariance_reference}
        --cl-cov {inputs.cl_cov_reference}
        --scale-cut-convention {decisions.scale_cut_convention}
        --label {decisions.reference_covariance}
        --emit-stats {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mock_min_pte_scale_cut_scan
    type: metric
    format: json
    description: |
      [mock_min_pte_calibration](#../../analyses.null_tests.outputs.mock_min_pte_calibration) as
      a function of the scale cut: the same 5%-quantile threshold on
      the per-realisation minimum PTE, evaluated on all 210 windows of
      the reporting grid `geomspace(1', 250', 21)` rather than at the
      fiducial window alone. Per window it carries θ_min, θ_max, the
      threshold, its 68% bootstrap and order-statistic intervals, the
      median minimum PTE, the false-alarm rates at 0.01 and 0.05, the
      six per-statistic median PTEs, the number of reporting bins, and
      the reasons any statistic could not be formed.

      The COSEBIs are recomputed in each window from each
      realisation's [fine ξ_±](#outputs.mock_xi_fine), against a COSEBI
      covariance transformed on that window; holding them at their
      fiducial values would depress the threshold across the plane.
      C_ℓ^BB does not depend on the angular window, so its PTEs come
      unchanged from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics).

      The windows are always the reporting grid's own bin edges (the
      [grid_bin_edges](#decisions.scale_cut_convention) convention),
      so the fiducial cell (edge indices 9, 16) is the window
      [mock_min_pte_calibration](#../../analyses.null_tests.outputs.mock_min_pte_calibration)
      calibrates at; the two thresholds agree to machine precision.
      Under `rounded_arcmin` (12.0'/83.0') that cell would not be the
      fiducial window.

      The 20 single-bin windows are marked `comparable: false` and
      excluded from summaries: the COSEBI basis is too ill-conditioned
      over one reporting bin (median mock B_{n≤20} PTE 0.13 across
      them, against 0.41 across the 190 windows of two bins or more,
      which span 0.23–0.59). On those 190 windows the calibrated
      threshold lies below the adopted
      [p_thr = 0.01](#decisions.pte_threshold) on 148, and its 68%
      bootstrap interval lies wholly above it on 10.
    inputs: [mock_per_mock_statistics, mock_xi_fine, mock_pure_eb_modes, xi_integration, cov_integration_reference, pure_eb_covariance_reference]
    decisions: [reference_covariance, mock_suite, pte_definition, integration_grid]
    recipe:
      command: >
        python src/workflow/scripts/min_pte_window_scan.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-xi-fine {inputs.mock_xi_fine}
        --mock-pure-eb-modes {inputs.mock_pure_eb_modes}
        --cosebis-xi-grid {inputs.xi_integration}
        --covariance {inputs.cov_integration_reference}
        --pure-covariance {inputs.pure_eb_covariance_reference}
        --reference-covariance {decisions.reference_covariance}
        --xi-min-sep 0.5 --xi-max-sep 300.0 --xi-nbins 1000
        --reporting-theta-min 1.0 --reporting-theta-max 250.0 --reporting-edges 21
        --fiducial-window 9 16
        --nmodes 20 --precision 120 --global-alpha 0.05
        --cosebi-roots interpolate_ratio
        --processes 24
        --emit calibration --out-file {output}
      resources: { cpus: 24, memory: "32GB" }

  - id: mock_campaign_evidence
    type: metric
    format: json
    description: |
      The campaign's summary statistics, derived from
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics):
      per statistic, σ_emp/σ_ana, mean χ², PTE uniformity tests and the
      cross-statistic correlations. The σ-ratio, χ² and correlation
      numbers in the findings are read from it.

      Covariance conventions per statistic: COSEBIs transform the ξ_±
      covariance with no Hartlap factor; the pure-mode blocks are
      sliced from the stored 120×120 matrix, with a Hartlap factor only
      under the `monte_carlo`
      [covariance method](#decisions.pure_eb_covariance_method), where
      N is the [MC sample count](#decisions.mc_samples); C_ℓ^BB takes
      no Hartlap factor, its mock-matched reference being
      [cl_cov_reference](#inputs.cl_cov_reference). Pure-mode σ is
      reported on all 20 reporting bins and on the fiducial cut, COSEBI
      σ on the fiducial window and C_ℓ^BB σ on the 17 fiducial bands.
    inputs: [mock_per_mock_statistics]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --from-stats {inputs.mock_per_mock_statistics}
        --emit evidence --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_sigma_ratio_figure
    type: figure
    format: pdf
    description: |
      Empirical σ over analytic σ, per COSEBI mode on the fiducial
      window, per θ bin for ξ_±^B, and per ℓ band for the 17 fiducial
      C_ℓ^BB bands, with the fiducial cut shaded. Under
      `reference_covariance: mockmatched` it tests the analytic
      covariance amplitude; under `data_covariance` it shows the effect of
      the galaxy-count mismatch.
    inputs: [mock_per_mock_statistics]
    decisions: [reference_covariance]
    recipe:
      command: >
        python src/workflow/scripts/mock_campaign_analysis.py
        --from-stats {inputs.mock_per_mock_statistics}
        --emit sigma-ratio-figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_validation_figure
    type: figure
    format: png
    description: |
      The paper's mock-validation figure, over every reporting bin of
      the three B statistics — COSEBI modes 1–20 (at the fiducial cuts,
      filled, and over 1–250′, open), ξ_+^B (filled) and ξ_-^B (open)
      on all reporting bins, C_ℓ^BB on all 32 bands — with scales
      outside the fiducial cuts shaded. Top row: across-realisation
      mean in units of the analytic σ of the
      [reference covariance](#decisions.reference_covariance), with
      σ_emp/(σ_ana√N) error bars. Bottom row: σ_ana/σ_emp (below one
      means the analytic σ is tighter than the mock scatter), with
      ±1/√(2N) error bars; the lowest C_ℓ band (≈1.8) is dropped from
      this row only.

      Outside the cuts the analytic covariance degrades: σ_ana/σ_emp
      rises to ≈1.8 at the lowest bandpower and returns to unity only
      by ℓ ≈ 100, falls from 0.85–0.88 at 127′ to ≈0.77 at 221′ in
      configuration space, and sits at 0.77–0.85 for the full-range
      COSEBI modes n ≤ 6. Inside the cuts every ratio is within ~15%
      of unity and every mean bias below 0.12σ. The full 32-band C_ℓ
      stack is read from
      [glass_mock_cl](#inputs.glass_mock_cl), since
      [mock_per_mock_statistics](#outputs.mock_per_mock_statistics)
      stores only the in-cut bands.
    inputs: [mock_per_mock_statistics, mock_campaign_evidence, glass_mock_cl]
    decisions: [reference_covariance, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_validation_figure.py
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --campaign-evidence {inputs.mock_campaign_evidence}
        --cl-dir "$(dirname "$(printf '%s\n' "{inputs.glass_mock_cl}" | head -n1)")"
        --range full
        --output {output}
      resources: { cpus: 1, memory: "4GB" }

  # ── The raw ξ_± check, upstream of every mode filter ─────────────────────

  - id: mock_xi_input_theory
    type: data
    format: npz
    description: |
      The theory ξ_± the GLASS suite was generated from, on its
      reporting grid, rebuilt with CAMB under the generator's setup:
      the [cosmology snapshot](#inputs.cosmology_snapshot)'s Planck-18
      values, HMcode `mead2020_feedback` at log T_AGN = 7.8, A_s
      rescaled to σ_8 = 0.8102, and the fiducial
      [n(z)](#inputs.redshift_distributions).

      The transform is an explicit Bessel sum band-limited at the
      simulation's ℓ_max = NSide = 4096. An FFTLog transform would
      extrapolate past the last multipole and restore power the maps
      lack, which matters because ξ_- at 1′ is built almost entirely
      from ℓ ~ 10⁴. The unbanded transform (`xip_untruncated` /
      `xim_untruncated`) and the curved-sky FFTLog result are written
      alongside.
    inputs: [mock_xi_reporting, cosmology_snapshot, redshift_distributions]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_input_theory.py
        --cosmology-json {inputs.cosmology_snapshot}
        --reporting-ensemble {inputs.mock_xi_reporting}
        --cat-config src/cosmo_val/cat_config.yaml
        --out-file {output}
      resources: { cpus: 8, memory: "32GB" }

  - id: mock_xi_validation_figure
    type: figure
    format: png
    description: |
      Validation of the raw 20-bin ξ_± before any pure-mode or COSEBI
      filter. Row 1: θξ_±, the across-realisation mean against
      [the input theory](#outputs.mock_xi_input_theory), band-limited
      at the simulation's ℓ_max and unbanded. Row 2: (mean −
      theory)/σ_ana, a fraction of a single realisation's error bar,
      with σ_emp/(σ_ana√N) error bars as in
      [mock_validation_figure](#outputs.mock_validation_figure). Row
      3: σ_emp/σ_ana. σ_ana comes from the
      [reference covariance](#inputs.cov_reporting_reference).
      Scales outside the fiducial 12–83′ cut are shaded.

      Above ≈6′ the mock mean reproduces the input theory to a few per
      cent with no trend; below it the drop of ξ_- (a factor ~100 at
      1′) is reproduced bin for bin by band-limiting the theory at
      ℓ = 4096, the simulation's resolution, wholly outside the
      fiducial cut.
    inputs: [mock_xi_reporting, mock_xi_input_theory, cov_reporting_reference]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.cov_reporting_reference}
        --emit figure --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: mock_xi_validation_stats
    type: metric
    format: json
    description: |
      The numbers behind
      [mock_xi_validation_figure](#outputs.mock_xi_validation_figure),
      per reporting bin: mean ξ_± over theory, the residual in
      units of a single realisation's σ_ana and in units of
      σ_emp/√N, σ_emp, σ_ana and their ratio. Two further columns:

      - The shape-noise σ implied by the measured pair counts,
        σ_e²/√(2N_pair). The total σ over it rises from 1.0 at 1′ to 4.2 at
        221′ for raw ξ_+ as sample variance takes over, so shape noise
        is only 5.7% of the ξ_+ variance at 221′ and the footprint pair
        deficit moves σ by about 1% or less at every separation.
      - The galaxy count each bin's pair count implies for a
        uniform-density footprint of the fiducial area: 1.02 of the
        delivered count at 1′, falling monotonically to 0.87 at 221′ as
        annuli run off the footprint edge — the geometry effect the
        pure-mode scatter inherits at large θ.
    inputs: [mock_xi_reporting, mock_xi_input_theory, cov_reporting_reference]
    decisions: [mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_xi_validation.py
        --reporting-ensemble {inputs.mock_xi_reporting}
        --theory {inputs.mock_xi_input_theory}
        --covariance {inputs.cov_reporting_reference}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: mock_mean_vector_stats
    type: metric
    format: json
    description: |
      Per-statistic mean B across the realisations, averaged over
      scales, raw and in units of the analytic σ, with its standard
      error and z-score, and the largest absolute normalised mean with
      the mode or bin it falls in.

      The mean-vector χ², against the empirical covariance of the mean,
      is quoted on the full 20-bin reporting grid (`full_range`) and,
      for the pure modes, on the fiducial bins 9–15
      (`fiducial_window`); COSEBIs and C_ℓ^BB carry `full_range` alone,
      over their 20 modes and 17 fiducial bands. For the pure modes the
      two differ: ⟨ξ_+^B⟩
      sits at ≈−0.1σ in the first three bins against a ≈0.055σ error,
      a small-scale residual the cut excludes, so ξ_+^B reads PTE 0.004
      on the full range and 0.13 inside the cut.
    inputs: [mock_per_mock_statistics]
    decisions: [reference_covariance, scale_cut_convention, pte_definition, reporting_binning]
    recipe:
      command: >
        python src/workflow/scripts/mock_mean_vector_plot.py
        --stats {inputs.mock_per_mock_statistics}
        --label {decisions.reference_covariance}
        --reporting-binning {decisions.reporting_binning}
        --scale-cut-convention {decisions.scale_cut_convention}
        --emit stats --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  # ── The noise budget behind the density finding ──────────────────────────

  - id: mock_footprint_audit
    type: data
    format: txt
    description: |
      The nside-4096 footprint audit: for the data catalogue and for
      v2 realisation 00001, the galaxy row count, the number of
      occupied HEALPix pixels and the sky area they cover, plus the
      two footprints' overlap and each one's exclusive area. It shows
      the area conventions in circulation (2405, 2757, 2894, 2949 deg²)
      describe a single sky, so the noise difference is a pure count
      ratio.
    inputs: [shapepipe_v14_catalogs, glass_mock_catalogs]
    decisions: [fiducial_catalog, leakage_correction, mock_suite]
    recipe:
      command: >
        python src/workflow/scripts/mock_footprint_audit.py
        --cat-config src/cosmo_val/cat_config.yaml
        --data-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --mock-version "$(python src/workflow/scripts/decision_values.py reference_catalog mockmatched)"
        --out-file {output}
      resources: { cpus: 1, memory: "16GB" }

  - id: mock_vs_data_noise_table
    type: table
    format: csv
    description: |
      One row per catalogue — the fiducial v1.4.6.3 leak-corrected
      sample and the v1.4.6.3_v2 GLASS suite — carrying the galaxy
      count, the occupied nside-4096 sky, the area convention, n_eff
      under it, the per-component σ_e, and the two ratios that follow:
      noise power σ_e²/N and its square, the B-mode variance ratio
      (a mock B variance is noise-dominated, so it scales as
      (σ_e²/N)²). The noise of each row is that of a
      [reference_covariance](#decisions.reference_covariance) option,
      whatever the selection, and the counts come from the
      [footprint audit](#outputs.mock_footprint_audit); the data lie inside
      the mock mask to within 0.3 deg², so the area cancels.

      This is the prediction in
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining):
      mock BB variance 0.7389 of the data's, tested against the
      measured ratios in
      [clbb_variance_ratios](#outputs.clbb_variance_ratios).
    inputs: [mock_footprint_audit]
    decisions: [mock_suite, fiducial_catalog]
    recipe:
      command: >
        python src/workflow/scripts/mock_vs_data_noise_table.py
        --footprint-audit {inputs.mock_footprint_audit}
        --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: clbb_variance_ratios
    type: metric
    format: json
    description: |
      The measured mock-to-data C_ℓ^BB variance ratio over the 17
      bandpowers inside 300 ≤ ℓ ≤ 1600, two ways. The machinery ratio
      is the diagonal of
      [cl_cov_reference](#inputs.cl_cov_reference) over that of
      the data's [cl_cov_reporting](#inputs.cl_cov_reporting): what the
      covariance chain predicts at the mocks' noise. The empirical
      ratio is the sample variance of the suite's BB bandpowers
      ([glass_mock_cl](#inputs.glass_mock_cl)) over the same data
      diagonal. With no B signal, both are noise-dominated ratios.
      Mean, median and per-band values. It motivates
      [reference_covariance](#decisions.reference_covariance) under
      `mockmatched`; under `data_covariance` the machinery ratio is unity
      by construction.
    inputs: [cl_cov_reference, cl_cov_reporting, glass_mock_cl]
    decisions: [mock_suite, fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/workflow/scripts/clbb_variance_ratios.py
        --cl-cov-reference {inputs.cl_cov_reference}
        --cl-cov-data {inputs.cl_cov_reporting}
        --cl-files "{inputs.glass_mock_cl}"
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

decisions:
  integration_grid:
    from: ../../integration_grid
  pte_definition:
    from: ../../pte_definition
  decomposition_method:
    from: ../../decomposition_method
  reporting_binning:
    from: ../../reporting_binning
  fiducial_catalog:
    from: ../../fiducial_catalog
  fiducial_blind:
    from: ../../fiducial_blind
  scale_cut_convention:
    from: ../../scale_cut_convention
  pte_threshold:
    from: ../../pte_threshold
  pure_eb_integration_method:
    from: ../../pure_eb_integration_method
  pure_eb_rebinning_weights:
    from: ../../pure_eb_rebinning_weights
  pure_eb_integration_limits:
    from: ../../pure_eb_integration_limits
  mc_samples:
    from: ../../mc_samples
  pure_eb_covariance_method:
    from: ../../pure_eb_covariance_method
  reference_covariance:
    from: ../../reference_covariance
  mock_suite:
    from: ../../mock_suite
  leakage_correction:
    from: ../../leakage_correction

prior_insights:

  paper_iv_inka_overestimates_variance:
    id: paper_iv_inka_overestimates_variance
    label: "Paper IV's iNKA covariance overestimates the small-scale variance"
    claim: |
      The Gaussian iNKA covariance adopted by UNIONS Paper IV
      (harmonic-space cosmology) gives larger small-scale
      uncertainties than either `OneCovariance` or the GLASS mocks —
      around 20% against both, with its Fig. 4 caption quoting 15%
      against the mocks — and Paper IV attributes the gap to iNKA accounting for a spatially
      varying galaxy number density, which breaks the stationary-noise
      assumption the other two estimates make.
    notes: |
      The same GLASS suite is on the other side of that comparison and
      is under-noised by a comparable factor; the two effects add (see
      [mocks_are_over_constraining](#findings.mocks_are_over_constraining)).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev_main_text
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "However, the estimate computed from the Gaussian part of iNKA tends to overestimate the variance."
        location: { page: 6 }
      - id: ev_caption_15
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "There is a discrepancy of 15% between the NaMaster estimate and the one obtained from mocks."
        location: { page: 6 }
      - id: ev_appendix_20
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "the iNKA covariance used in this work overestimates by around 20% the uncertainty compared to what is obtained from OneCovariance and GLASS simulations"
        location: { page: 14 }
      - id: ev_mechanism
        doi: "10.48550/arXiv.2605.13543"
        quote:
          exact: "An underlying assumption in OneCovariance and GLASS mocks is that the noise is stationary. This is not true if the object density varies strongly across the sky."
        location: { page: 14 }


findings:

  mock_xi_matches_input_theory_above_band_limit:
    id: mock_xi_matches_input_theory_above_band_limit
    label: "Mock ξ_± matches input theory above the band limit"
    claim: |
      Above ≈6′ the across-realisation mean ξ_± of the GLASS
      realisations reproduces the theory the suite was generated from
      to within a few per cent with no trend, so the mocks carry no
      ξ_± bias into the null tests. Below ≈6′ they depart from the
      unbanded prediction, ξ_- falling away by up to two orders of
      magnitude and ξ_+ ringing by up to 15%, because the maps are
      band-limited at ℓ_max = NSide = 4096; these scales lie outside
      the fiducial cut.
    notes: |
      350 realisations. Inside the 12′–83′ window |mean/theory − 1| ≤
      0.03 for ξ_+ and ≤ 0.04 for ξ_-; bin by bin |mean − theory| ≤ 0.33
      σ_ana (ξ_+) and ≤ 0.46 σ_ana (ξ_-) against an error of the mean
      of ≈0.05 σ_ana, scattered in sign. That is the size of the
      band-limited transform's own ±2–4% ringing (2% of ξ_+ at 18′ is
      0.30 σ_ana); against the unbanded prediction the same mean agrees
      to 1.6% (ξ_+) and 0.7% (ξ_-). So it bounds a mock ξ_± bias at a
      third to a half of an error bar rather than measuring one.

      Below ≈6′: the mock ξ_- at 1.2′ is ≈2% of the unbanded prediction,
      since ξ_-(1′) is built almost entirely from ℓ ~ 10⁴.
      Over the first six reporting bins the theory's band ratio (cut at
      ℓ = 4096) runs 0.006, 0.020, 0.071, 0.166, 0.400, 0.815, against a
      measured mock mean over unbanded theory of −0.021, 0.002, 0.099,
      0.202, 0.463, 0.828 — tracking across two orders of magnitude,
      with the mocks 2–40% above the sharp cut over the last four bins,
      as lognormal small-scale power and an imperfectly sharp band edge
      would give. This is why
      [mock_xi_input_theory](#outputs.mock_xi_input_theory) is an
      explicit band-limited sum: an FFTLog that extrapolates past the
      last multipole makes the same comparison look like a
      catastrophic small-scale failure. Any use of this suite below
      ≈6′, in ξ_- especially, measures the band limit.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats
      - id: ev2
        artifact: mock_xi_validation_figure

  mock_xi_scatter_falls_below_analytic_at_large_theta:
    id: mock_xi_scatter_falls_below_analytic_at_large_theta
    label: "Mock ξ_+ scatter falls below analytic σ above 100′"
    claim: |
      Against the
      [mock-matched reference covariance](#inputs.cov_reporting_reference),
      the mocks' raw ξ_± scatter matches the analytic Gaussian σ inside
      the fiducial window, but above 100′ the ξ_+ scatter falls below
      it while ξ_- stays near unity. The deficit is neither a density
      nor a footprint effect, and reads as the realisations carrying
      less large-scale sample variance than the analytic covariance
      predicts — a reading of the residual, not an established
      mechanism.
    notes: |
      σ_emp/σ_ana inside 12′–83′: 0.94–1.03 (ξ_+), 0.99–1.12 (ξ_-).
      Against the data's Gaussian reporting-grid covariance the same
      ratios read 0.90–0.98 and 0.87–0.97, the suite's galaxy excess
      ([mocks_are_over_constraining](#findings.mocks_are_over_constraining)),
      which is why mock validation must not use it. Above 96′ ξ_- sits
      at 0.98–1.07 and ξ_+ at 0.82–0.86.

      Not footprint geometry: at 221′ the implied galaxy count is 13%
      low, a 24% pair deficit, but shape noise is only 5.7% of the ξ_+
      variance there, so it moves σ by 0.7% (about 1% or less at every
      separation). ξ_+ above 100′
      draws on the lowest multipoles, where a lognormal shell
      construction on a single footprint is least trusted.

      The pair counts themselves fall away from the uniform-density,
      no-edge prediction: the implied galaxy count per bin declines
      monotonically from 1.02 of the delivered count at 1′ to 0.87 at
      221′. That decline (not its absolute level, which floats with the area
      convention) is the footprint-edge effect the noise-only pure-mode
      statistics inherit at large θ; it is invisible in raw ξ_± for
      the reason above.
    created_at: "2026-09-13T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_xi_validation_stats

  mocks_are_over_constraining:
    id: mocks_are_over_constraining
    label: "Mock galaxy density 17% above the data's"
    claim: |
      Because of an error in the catalog generation, the GLASS
      realizations' galaxy number density is 17% higher than the
      data's, so their shape noise and B-mode scatter are lower. Mock
      scatter is therefore compared only against analytic covariances
      recomputed at the realizations' galaxy density.
    notes: |
      **Size.** On a footprint containing the data's to within 0.3
      deg², the v1.4.6.3_v2 suite holds 60 423 575 unit-weight galaxies
      (realisation 00001) against the fiducial catalogue's 51.65 million
      weight-effective galaxies. Per-component σ_e agrees to 0.2%
      (0.267568 data, 0.268175 mock), so the count ratio is nearly the
      whole noise difference:
      predicted shape-noise power σ_e²/N is 0.8596 of the data's and
      the (pure-noise) B-mode variance 0.7389 of it
      ([mock_vs_data_noise_table](#outputs.mock_vs_data_noise_table)).
      Measured, as 17-band means over 300 ≤ ℓ ≤ 1600
      ([clbb_variance_ratios](#outputs.clbb_variance_ratios)): the
      covariance machinery at the mocks' noise gives a C_ℓ^BB variance
      ratio of 0.725, and the 350 realisations scatter at 0.716 of the
      data's variance. Held against the data covariance, the mock
      scatter would sit roughly 15% below the analytic σ for a reason
      unrelated to the covariance's accuracy;
      [reference_covariance](#decisions.reference_covariance) =
      `mockmatched` avoids this.

      **Origin.** The generator (`make_unions_glass_sim.py`) defaults
      `--neff` to 6.0905 arcmin⁻², a catalogue n_eff from the earlier
      2405 deg² area (the fiducial catalogue's is 4.957 on 2894 deg²),
      and the run scripts do not override it. It applies that density to an
      occupied-pixel nside-4096 mask of 2757.25 deg²: 6.0905 × 2757.25 ×
      3600 = 60.45 M, against 60.27–60.42 M realised per realisation.
      The catalogue's A = 2894.03 deg² is the full footprint mask, in
      which roughly 5% of pixels hold no galaxy; data galaxies occupy
      2750.65 deg² of it. Paper III and Paper IV describe the mocks as
      matching the data's number density; neither prints a numeric
      mock density, and Sacha Guerrini has confirmed the excess.

      **Areas.** Quoted areas range over 2405, 2757, 2894 and 2949 deg²
      but describe one sky: data galaxies occupy 2750.65 deg², mock
      galaxies 2709.91 deg², their overlap 2703.17 deg², and only 0.26
      deg² of the data footprint lies outside the mock mask. n_eff × A
      is the convention-free quantity (4.9573 arcmin⁻² × 2894.03 deg²
      and the weighted H12 4.8636 × 2949.79 deg² both give 51.65 M).

      **Paper IV.** Paper IV finds its Gaussian iNKA covariance
      overestimates the small-scale variance relative to the GLASS
      mocks and `OneCovariance` (~20% against both; its Fig. 4 caption
      quotes 15% against the mocks), attributing it to iNKA's
      treatment of a spatially varying number density
      ([paper_iv_inka_overestimates_variance](#prior_insights.paper_iv_inka_overestimates_variance)).
      The density excess makes the mocks' variance ~26% low by
      construction, an independent contribution in the same direction;
      part of that gap is plausibly the mocks being under-noised. The
      two effects are additive and nothing here quantifies the split.

      **The excluded v1.4.6 suite** ([mock_suite](#decisions.mock_suite))
      carries 35 078 729 galaxies, 32% fewer than the data, on a
      1600.33 deg² mask: the same 6.0905 default on a smaller sky
      (6.0905 × 1600.33 × 3600 = 35.09 M). Nothing in the campaign rests
      on it.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev1
        artifact: mock_vs_data_noise_table
        quote:
          exact: "0.85961"
      - id: ev2
        artifact: clbb_variance_ratios
        quote:
          exact: '"machinery_variance_ratio_mean": 0.7249533827835264'
      - id: ev3
        artifact: clbb_variance_ratios
        quote:
          exact: '"empirical_variance_ratio_mean": 0.7157060122347197'
      - id: ev4
        artifact: mock_sigma_ratio_figure
    scope: "The delivered GLASS v1.4.6.3_v2 suite against the v1.4.6.3 leak-corrected fiducial catalog; galaxy counts, σ_e and footprint only, and the shape-noise scaling that follows from them."

  covariance_amplitude_validated:
    id: covariance_amplitude_validated
    label: "Analytic σ matches the mock scatter at the fiducial cuts"
    claim: |
      At the fiducial cuts the analytic σ of each B-mode statistic
      matches the scatter across the realizations, slightly smaller in
      configuration space and in agreement in harmonic space. The
      agreement degrades on large scales outside the fiducial cuts,
      which PSF leakage already excludes (Paper I), so the
      miscalibration does not affect the choice of scale cuts.
    notes: |
      Median ratio of analytic to mock σ over bins (paper): 0.92–0.95
      in configuration space, 1.01 in harmonic space. Outside the cuts
      the analytic σ is about 17% too small for the first COSEBI mode
      and for ξ_±^B above 100′, and too large for C_ℓ^BB below ℓ ≈ 100,
      where E-to-B leakage is treated only approximately (Nicola et al.
      2021).

      From the 350 GLASS v1.4.6.3_v2 realisations against the
      mock-matched reference covariance, as σ_emp/σ_ana (the inverse of
      the paper's ratio): COSEBI B_1–B_20 median 1.055 (range
      0.974–1.086); ξ_+^B over the seven fiducial-cut θ bins median
      1.087 (1.000–1.164); ξ_-^B median 1.059 (0.978–1.127); C_ℓ^BB over
      the 17 fiducial-cut bands median 0.993 (0.926–1.086). Inverted,
      these are the paper's 0.95, 0.92, 0.94 and 1.01.

      This validates the covariance machinery: the same CosmoCov /
      NaMaster chain that builds the fiducial covariance, pointed at
      the mocks' noise, reproduces their scatter to better than 10% in
      the median and within 17% in every fiducial bin. It does not
      say the mock and data covariances agree; they differ by the
      galaxy-count excess.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 1.0550671384448764'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"median": 0.9926463379482149'
    scope: "350 GLASS v1.4.6.3_v2 realisations, mock-matched reference covariance, fiducial scale cuts."

  chi2_machinery_conservative:
    id: chi2_machinery_conservative
    label: "The null tests are conservative"
    claim: |
      The null tests use only the Gaussian part of the covariance,
      which underestimates the true variances by omitting connected
      trispectrum and super-sample terms. They are therefore
      conservative: a test that passes with the Gaussian-only
      covariance would generally pass with a more complete covariance
      estimate, as the simulations confirm.
    notes: |
      The paper puts the non-Gaussian share of the ξ_± diagonal
      variance within the fiducial cuts at about 9% (see
      [mock_ptes_skew_low_by_ng_term](#../../findings.mock_ptes_skew_low_by_ng_term)).

      Across the 350 GLASS v1.4.6.3_v2 realisations, against the
      mock-matched reference covariance, the mean χ² exceeds ν for
      five of the six statistics — 6.63 against ν = 6 for B_{n≤6},
      21.46 against 20 for B_{n≤20}, 8.38 against 7 for ξ_+^B, 7.91
      against 7 for ξ_-^B, 16.07 against 14 for ξ_tot^B — and falls
      just below for C_ℓ^BB, 16.78 against 17, whose PTEs pass a KS
      test of uniformity at p = 0.79. A mean χ² above ν makes the
      reported PTEs lower than the true tail probabilities. The
      `data_covariance` selection of
      [reference_covariance](#decisions.reference_covariance) would
      lower these means by the galaxy-count difference rather than
      any covariance error; it is not run on this suite.
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 6.631945648377122'
      - id: ev2
        artifact: mock_campaign_evidence
        quote:
          exact: '"chi2_mean": 16.775046279157934'
    scope: "350 GLASS v1.4.6.3_v2 realisations at fiducial scale cuts, mock-matched reference covariance."

  tests_are_not_redundant:
    id: tests_are_not_redundant
    label: "Null-test statistics are not redundant"
    claim: |
      The six B-mode test statistics are not perfectly correlated
      across the clean realizations: statistics from different
      estimator families correlate only moderately, and even pairs
      sharing a data vector stay well below unity. This is why the
      minimum PTE over the six skews low and its threshold is
      calibrated on the mocks
      ([pte_threshold](#decisions.pte_threshold)).
    notes: |
      χ² Pearson correlations across the 350 v1.4.6.3_v2 realisations
      (`correlations.chi2.pearson` in `mock_campaign_evidence`).
      Different families, 0.25–0.53: 0.41 B_{n≤6}–ξ_+^B, 0.37
      B_{n≤6}–C_ℓ^BB, 0.35 ξ_+^B–C_ℓ^BB, 0.46 ξ_-^B–C_ℓ^BB, 0.53
      ξ_tot^B–C_ℓ^BB. Shared data vector: 0.72 ξ_+^B–ξ_tot^B and 0.68
      ξ_-^B–ξ_tot^B (nested by construction), 0.53 B_{n≤6}–B_{n≤20}.
      The PTE Pearson matrix tells the same story (0.37 for B_{n≤6}
      with C_ℓ^BB).
    created_at: "2026-08-29T00:00:00Z"
    evidence:
      - id: ev1
        artifact: mock_campaign_evidence
        quote:
          exact: "0.723441470177607"
    scope: "350 GLASS v1.4.6.3_v2 realisations, fiducial scale cuts, six-statistic χ² and PTE stacks."

