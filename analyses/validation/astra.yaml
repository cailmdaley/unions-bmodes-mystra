version: "0.0.14"
name: "Validation"
description: |
  The evidence that the null tests can be trusted. Checks that the results do
  not depend on how the adopted estimators are computed: the pure-mode and COSEBI
  results are remade from a 10,000-bin ξ_± measurement of the fiducial catalog,
  with both grids scored against the 1,000-bin covariance, since no 10,000-bin
  CosmoCov block exists and changing it with the grid would mix the two effects.
  COSEBIs are computed from harmonic-space bandpowers and compared with those
  from ξ_±, which shows that null-test sensitivity is set by the filter functions
  rather than the basis. The B-mode covariances are compared across the n(z)
  blinds, which supports using one blind throughout. The
  [GLASS mocks](#analyses.glass_mocks) hold the estimators, covariances and PTE
  convention against 350 systematics-free simulations.

inputs:
  - id: xi_reporting
    from: ../data_vectors.xi_reporting

  - id: xi_integration
    from: ../data_vectors.xi_integration

  - id: xi_sweep
    from: ../data_vectors.xi_sweep

  - id: pure_eb_data
    from: ../data_vectors.pure_eb_data

  - id: pure_eb_covariance
    from: ../covariances.pure_eb_covariance

  - id: cosebis_covariance
    from: ../covariances.cosebis_covariance

  - id: cosebis_modes_data
    from: ../data_vectors.cosebis_modes_data

  - id: cl_bandpowers_fine
    from: ../data_vectors.cl_bandpowers_fine

  - id: cl_sweep
    from: ../data_vectors.cl_sweep

  - id: cl_cov_sweep
    from: ../covariances.cl_cov_sweep

  - id: cosmology_snapshot
    from: ../covariances.cosmology_snapshot

  - id: cov_integration
    from: ../covariances.cov_integration

  - id: cov_sweep
    from: ../covariances.cov_sweep

  - id: cl_cov_reporting
    from: ../covariances.cl_cov_reporting

  - id: cl_cov_fine
    from: ../covariances.cl_cov_fine

  - id: redshift_distributions
    from: ../redshift_distributions

  - id: blind_cov_sweep
    from: ../covariances.blind_cov_sweep

  - id: cl_bandpowers_reporting
    from: ../data_vectors.cl_bandpowers_reporting

  - id: xi_10000_bins
    from: ../data_vectors.xi_10000_bins

  - id: cov_integration_reference
    from: ../covariances.cov_integration_reference

  - id: cov_reporting_reference
    from: ../covariances.cov_reporting_reference

  - id: cl_cov_reference
    from: ../covariances.cl_cov_reference

  - id: pure_eb_covariance_reference
    from: ../covariances.pure_eb_covariance_reference

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: glass_mock_catalogs
    from: ../glass_mock_catalogs

  - id: glass_mock_xi_reporting
    from: ../glass_mock_xi_reporting

  - id: glass_mock_cl
    from: ../glass_mock_cl

outputs:
  - id: tenk_grid_comparison
    when: [leakage_correction.applied]
    type: metric
    format: json
    description: |
      Per reporting bin (ξ_±^B, ξ_±^amb) and per COSEBI mode
      (n = 1 … 20, both scale cuts): the value on the 1,000-bin and
      10,000-bin integration grids, their difference, and that
      difference in units of the fiducial analytic σ, plus the χ²/PTE
      on each grid: the fiducial window (12'–83') for the pure modes,
      both scale cuts at n ≤ 6 and n ≤ 20 for the COSEBIs. For the
      COSEBIs it also carries all four combinations of integration
      grid × COSEBI interval.

      Both grids are scored with the same 1,000-bin covariance: the
      pure-mode matrix
      [pure_eb_covariance](#inputs.pure_eb_covariance)
      and the T^T C_ξ T mode covariance
      [cosebis_covariance](#inputs.cosebis_covariance). Both grids
      are TreeCorr runs over the same catalog on the same
      [0.5', 300'] extent, so sample variance cancels and every
      difference is numerical.
      This cross-check is available only for corrected shear: the
      10,000-bin measurement exists only for the leak-corrected catalog.

      Sanity checks: pair counts summed into each reporting bin on
      both grids (totals agree to 4e-6; per-bin sums differ because
      the one fine bin straddling each reporting edge is assigned
      whole, up to 3.0% of a reporting bin at 1,000 bins and 0.3% at
      10,000), and the effective COSEBI interval each grid's
      bin selection produces. The fiducial window is bins (9, 15)
      on both grids.
    decisions: [fiducial_catalog, fiducial_blind, scale_cut_convention, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, mode_count, decomposition_method, pte_definition, leakage_correction, reporting_binning, integration_grid]
    inputs: [xi_reporting, xi_integration, xi_10000_bins, pure_eb_data, pure_eb_covariance, cosebis_modes_data, cosebis_covariance]
    recipe:
      command: >
        python src/papers/bmodes/scripts/tenk_grid_convergence.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --xi-reporting {inputs.xi_reporting}
        --xi-1k {inputs.xi_integration}
        --xi-10k {inputs.xi_10000_bins}
        --pure-eb-baseline {inputs.pure_eb_data}
        --pure-eb-covariance {inputs.pure_eb_covariance}
        --cosebis-baseline {inputs.cosebis_modes_data}
        --cosebis-covariance {inputs.cosebis_covariance}
        --scale-cut-convention {decisions.scale_cut_convention}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 16, memory: "150GB" }

  - id: cosebis_harmonic_modes
    type: data
    format: npz
    description: |
      COSEBI E_n, B_n and covariance at both scale cuts from two
      paths: the harmonic path, summing the FFT-log W_n(ℓ) filters
      against the fine Cℓ bandpowers
      ([cl_bandpowers_fine](#inputs.cl_bandpowers_fine); 96 bins in
      the paper, set by
      [harmonic_validation_binning](#decisions.harmonic_validation_binning))
      and propagating their covariance linearly, and the configuration
      path of [cosebis_modes_data](#inputs.cosebis_modes_data). PTEs
      are in
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention, pte_definition, leakage_correction, reporting_binning, integration_grid, mode_count]
    inputs: [cl_bandpowers_fine, cl_cov_fine, xi_integration, cov_integration]
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --angular-range fiducial --blind {decisions.fiducial_blind}
        --harmonic-validation-binning {decisions.harmonic_validation_binning}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-cl-path {inputs.cl_bandpowers_fine}
        --fiducial-cl-cov-path {inputs.cl_cov_fine}
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_metrics
    type: metric
    format: json
    description: |
      COSEBI B-mode χ² and PTEs over n ≤ 6, the modes validated on the
      GLASS mocks, at the fiducial scale cuts for the harmonic and
      configuration paths of
      [cosebis_harmonic_modes](#outputs.cosebis_harmonic_modes),
      quoted in the
      [harmonic/configuration COSEBI table](#../outputs.cosebis_harmonic_config).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes]
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range fiducial
        --metrics-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_metrics_full
    type: metric
    format: json
    description: |
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics)
      over the full angular range: the n ≤ 6 failure of both paths
      behind the
      [filter-function finding](#../findings.filter_functions_set_sensitivity).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes]
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range full
        --metrics-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_version_ptes
    # Harmonic-path COSEBI B-mode PTEs of the non-fiducial catalog versions,
    # for the `cosebis_harmonic_config` table.
    from: cosebis_harmonic_scan.cosebis_harmonic_version_ptes

  - id: cosebis_harmonic_figure
    type: figure
    format: png
    description: |
      COSEBI E_n (top row) and B_n/σ_n (bottom row) for the [fiducial
      catalog](#decisions.fiducial_catalog), computed from
      configuration-space ξ_± (filled circles) and harmonic-space
      bandpowers (open squares). Modes n > 6 are shaded; for n ≤ 6,
      where the cosmological information is concentrated, we confirm
      consistency between the two paths on GLASS simulations.
    decisions: [fiducial_catalog, scale_cut_convention]
    inputs:
      - cosebis_harmonic_modes
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range full
        --figure-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: bb_covariance_blind_independence_evidence
    type: figure
    format: png
    description: |
      Per-bin ratios of the covariance diagonals of blinds B and C to
      blind A, for the B-mode block and, as the reference, the E-mode
      block: pure E/B over the 20 reporting bins, COSEBIs (n ≤ 20) on
      the full 1'–250' range and harmonic Cℓ over the 32 bandpowers, on
      the [catalog version](#decisions.bb_blind_check_version) chosen
      for the check. The covariances come from the
      [blind scan](#inputs.blind_cov_sweep), the COSEBI filters from the
      [integration-grid ξ_±](#inputs.xi_integration) and the multipoles
      from the [bandpowers](#inputs.cl_bandpowers_reporting). Supports the
      [blind-A fiducial choice](#decisions.fiducial_blind); it does not
      enter the headline figures. The [Monte-Carlo sample
      count](#decisions.mc_samples) sizes the ±√(2/N) reference band drawn
      on the ξ_± panels.
    decisions: [bb_blind_check_version, reporting_binning, integration_grid, mode_count, mc_samples]
    inputs:
      - blind_cov_sweep
      - xi_integration
      - cl_bandpowers_reporting
    recipe:
      command: >
        d=$(mktemp -d) && tar xzf {inputs.blind_cov_sweep} -C $d &&
        python src/papers/bmodes/scripts/bb_covariance_blind_independence.py
        --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} --mc-samples {decisions.mc_samples}
        --covariance-dir $d
        --xi-integration {inputs.xi_integration}
        --cl-bandpowers {inputs.cl_bandpowers_reporting}
        --out-file {output}

  - {id: mock_per_mock_statistics, from: glass_mocks.mock_per_mock_statistics}
  - {id: mock_min_pte_scale_cut_scan, from: glass_mocks.mock_min_pte_scale_cut_scan}
  - {id: mock_campaign_evidence, from: glass_mocks.mock_campaign_evidence}
  - {id: mock_validation_figure, from: glass_mocks.mock_validation_figure}
  - {id: mock_mean_vector_stats, from: glass_mocks.mock_mean_vector_stats}
  - {id: mock_vs_data_noise_table, from: glass_mocks.mock_vs_data_noise_table}

decisions:
  pte_definition:
    from: ../pte_definition
