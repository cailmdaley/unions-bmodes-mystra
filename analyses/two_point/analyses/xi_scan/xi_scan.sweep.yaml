# Design-B ξ± version scan. Expand with:
#   scripts/sweep_expand.py -o analyses/two_point/analyses/xi_scan/astra.yaml \
#       analyses/two_point/analyses/xi_scan/xi_scan.sweep.yaml
id: xi_scan
version: "1.0"
name: "TreeCorr ξ± catalog-version scan"
description: |
  Design-B producer sweep: TreeCorr ξ_±(θ) for every non-fiducial,
  non-ecut catalog version (7 variants — 3 leak-corrected + 4
  uncorrected) on both the 20-bin reporting and 1000-bin
  integration grids. Each (version, grid) is its own lc output —
  independently cacheable and re-runnable — and the gather bundles
  them under run_2pcf's native, already-canonical
  `{ver}_xi_minsep=..._nbins=..._npatch=1.txt` names into the
  `tar.gz` that `two_point.xi_sweep` re-exports. Members are not
  independently interesting; every consumer reads the bundle.
tags: [sweep, generated, two_point]

inputs:
  # Each member opens its own version's catalog through cat_config.
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs
  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

decisions:
  integration_grid:
    from: ../integration_grid
  reporting_binning:
    from: ../reporting_binning
  patch_count:
    from: ../patch_count
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog

matrix:
  slot: [SP_v1.4.5, SP_v1.4.5_leak_corr, fiducial_counterpart, SP_v1.4.8, SP_v1.4.8_leak_corr, SP_v1.4.11.3, SP_v1.4.11.3_leak_corr]
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr
  grid: [reporting, integration]
  min_sep: [1.0, 0.5]
  max_sep: [250.0, 300.0]
  nbins: [20, 1000]
  grid_decision: [reporting_binning, integration_grid]

# grid/min_sep/max_sep/nbins/grid_decision are one composite axis: the two angular grids,
# not their cartesian product.
zip: [[version, slot], [grid, min_sep, max_sep, nbins, grid_decision]]

template:
  id: xi_${slot}_${grid}
  type: data
  format: txt
  description: |
    TreeCorr ξ_±(θ) for catalog version `${version}` on the
    ${grid} grid (${nbins} logarithmic bins over
    [${min_sep}', ${max_sep}'], npatch 1), as a single TreeCorr
    text dump. The per-version analogue of
    [xi_${grid}](#../outputs.xi_${grid}); same `run_2pcf.py`
    invocation, different `--ver`.
  inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun]
  decisions: [fiducial_catalog, patch_count, "${grid_decision}", leakage_correction]
  recipe:
    # The per-version unit of work: exactly the run_2pcf.py CLI the fiducial
    # xi_reporting / xi_integration recipes call, with --ver swept. The July
    # driver (run_xi_sweep.py) looped this serially inside one recipe; lc now
    # schedules the members itself.
    command: >
      python src/workflow/scripts/run_2pcf.py
      --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version ${version})" --min-sep ${min_sep} --max-sep ${max_sep} --nbins ${nbins} --npatch 1
      --cat-config src/cosmo_val/cat_config.yaml
      --no-fits --out-file {output}
    resources: { cpus: 24, memory: "30GB" }

gather:
  id: xi_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members bundled flat under their
    July-canonical `{ver}_xi_minsep=..._nbins=..._npatch=1.txt`
    names — the exact directory layout
    `cosebis_version_comparison` (`--results-dir`) and the pure
    E/B sweep (`--xi-sweep-dir`) reconstruct. Re-exported by
    [two_point.xi_sweep](#../outputs.xi_sweep); consumers untar it
    into a temp dir, unchanged from the July contract.
  decisions: [fiducial_catalog, leakage_correction]
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout xi --fiducial-catalog {decisions.fiducial_catalog}
      --leakage-correction {decisions.leakage_correction}
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
