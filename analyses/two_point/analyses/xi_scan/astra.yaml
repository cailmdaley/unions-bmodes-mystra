  type: data
  description: |
    TreeCorr ξ_±(θ) for catalog version `SP_v1.4.5` on the
    reporting grid (20 logarithmic bins over
    [1.0', 250.0'], one patch), measured as
    [xi_reporting](#../outputs.xi_reporting) is. If the fiducial
    measurement is uncorrected, the `fiducial_counterpart` slot
    holds the leakage-corrected size-cut catalog instead.
  inputs:
  - shapepipe_v14_catalogs
  - shapepipe_v145_rerun
  decisions:
  - fiducial_catalog
  - patch_count
