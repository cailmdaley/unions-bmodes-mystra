version: "0.0.14"
name: "Integration-grid convergence of the adopted estimators"

# Why this is a sub-analysis and not a `bins_10000` flip of `integration_grid`:
# a universe flip forks the WHOLE chain, and the chain's covariance cannot
# follow. The pure-mode covariance is Monte-Carlo-propagated from the 1000-bin
# CosmoCov ξ± matrix and the COSEBI mode covariance is T^T C_ξ T on that same
# matrix; no 10,000-bin CosmoCov block exists, and building one would change
# the covariance at the same time as the grid, which is the one thing a
# convergence test must not do. What the test needs is a data vector remade on
# the fine grid and scored against the covariance the baseline already has —
# two grids inside one universe, which is an output, not a universe.
#
# The 10,000-bin ξ± themselves are already a declared artifact: the
# [staged TreeCorr dump](#../two_point.inputs.tenk_xi_staging) is the `source:`, and
# [xi_integration_convergence](#../two_point.outputs.xi_integration_convergence)
# is the adopted copy. This sub-analysis consumes that output; nothing is
# copied into results/ by hand.

inputs:
  - id: xi_reporting
    from: ../two_point.xi_reporting

  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_integration_convergence
    from: ../two_point.xi_integration_convergence

  - id: pure_eb_semianalytic_data
    from: ../pure_eb.pure_eb_semianalytic_data

  - id: cosebis_modes_data
    from: ../cosebis.cosebis_modes_data

  # Declared so an edit to either script restales the outputs below, whose
  # recipe strings name the script by a path that does not change.
  - id: scale_cuts_script
    from: ../scale_cuts_script

  - id: tenk_grid_convergence_script
    type: data
    description: |
      The convergence comparator and its renderer. It reuses the
      baseline chain's own data-vector and pure-mode code, so the grid
      is the only difference, and checks its 1,000-bin vector against
      [pure_eb_semianalytic_data](#inputs.pure_eb_semianalytic_data)
      before comparing.
    source: "./src/papers/bmodes/scripts/tenk_grid_convergence.py"

outputs:
  - id: tenk_grid_comparison
    when: [leakage_correction.applied]
    type: metric
    format: json
    description: |
      Per reporting bin (ξ_±^B, ξ_±^amb) and per COSEBI mode
      (n = 1 … 20, both scale cuts): the value on the 1,000-bin and
      10,000-bin integration grids, their difference, and that
      difference in units of the fiducial analytic σ, plus the
      fiducial-window (12'–83') χ²/PTE on each grid. For the COSEBIs
      it also carries all four combinations of integration grid ×
      COSEBI interval.

      Both grids are scored with the same 1,000-bin covariance: the
      Monte-Carlo-propagated pure-mode matrix from
      [pure_eb_semianalytic_data](#inputs.pure_eb_semianalytic_data)
      and the T^T C_ξ T mode covariance from
      [cosebis_modes_data](#inputs.cosebis_modes_data). Both grids
      are TreeCorr runs over the same catalog on the same
      [0.5', 300'] extent, so sample variance cancels and every
      difference is numerical.
      This cross-check is available only for corrected shear: the imported
      10,000-bin measurement has no raw-shear counterpart.

      Sanity checks: pair counts summed into each reporting bin on
      both grids (totals agree to 4e-6; per-bin sums differ because
      the one fine bin straddling each reporting edge is assigned
      whole, 3.0% of a reporting bin at 1,000 bins and 0.3% at
      10,000), and the effective COSEBI interval each grid's
      bin selection produces. The fiducial window is bins (9, 15)
      on both grids.
    decisions: [fiducial_catalog, fiducial_blind, scale_cut_convention, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, mode_count, decomposition_method, pte_definition, leakage_correction, reporting_binning, integration_grid]
    inputs:
      [xi_reporting, xi_integration, xi_integration_convergence,
       pure_eb_semianalytic_data, cosebis_modes_data,
       scale_cuts_script, tenk_grid_convergence_script]
    recipe:
      # Compute mode. The 10,000-bin operator is a 6-block
      # (~8.6k eval rows x 20k columns) matrix built once and applied as a
      # matvec; the COSEBI filter tabulation at precision=120 is the other
      # pole. Both fit in the resources below.
      command: >
        python src/papers/bmodes/scripts/tenk_grid_convergence.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --xi-reporting {inputs.xi_reporting}
        --xi-1k {inputs.xi_integration}
        --xi-10k {inputs.xi_integration_convergence}
        --pure-eb-baseline {inputs.pure_eb_semianalytic_data}
        --cosebis-baseline {inputs.cosebis_modes_data}
        --scale-cut-convention {decisions.scale_cut_convention}
        --integration-method {decisions.pure_eb_integration_method}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --integration-limits {decisions.pure_eb_integration_limits}
        --out-file {output}
      resources: { cpus: 16, memory: "150GB" }

decisions:
  pte_definition:
    from: ../pte_definition
  decomposition_method:
    from: ../decomposition_method

  leakage_correction:
    from: ../leakage_correction

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  pure_eb_integration_method:
    from: ../pure_eb_integration_method

  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights

  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits

  mode_count:
    from: ../mode_count
  integration_grid:
    from: ../integration_grid
  reporting_binning:
    from: ../reporting_binning

findings:

  pure_modes_converged_at_1000_bins:
    label: "Pure modes converged at 1,000 bins"
    claim: |
      The adopted pure-mode chain is converged on the 1,000-bin
      integration grid: refining to 10,000 bins leaves the
      fiducial-window PTEs essentially unchanged, and the coherent
      positive ξ_-^B offset that drives the window's ξ_-^B PTE is not
      a grid artifact.
    notes: |
      Refining to 10,000 bins moves ξ_±^B by at most 0.12 σ in any of
      the seven fiducial-window bins (0.40 σ over all 20 bins, in the
      168' bin at the operator's upper edge) and the ambiguous modes
      by at most 0.054 σ anywhere. PTEs: ξ_+^B 0.823 → 0.842, ξ_-^B
      0.0193 → 0.0213, joint 0.0387 → 0.0435. The residual per-bin
      motion is sign-alternating, not coherent.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        artifact: tenk_grid_comparison
        quote:
          exact: '"pte": 0.8420537855782535'

  cosebis_verdicts_stable_at_1000_bins:
    label: "COSEBI verdicts stable at 1,000 bins"
    claim: |
      The COSEBI B-mode null-test verdicts are stable to the
      integration grid: refining from 1,000 to 10,000 bins moves the
      n ≤ 6 modes by at most 0.64 σ and leaves every PTE verdict
      unchanged, while individual higher modes (n ≥ 10) shift by up
      to 1.37 σ.
    notes: |
      The paper states this as: "we repeat the calculation on a
      10 000-bin grid for the fiducial catalog and find the B_n
      amplitudes and their significance to be stable."

      n ≤ 6 shifts are at most 0.56 σ at the fiducial cuts and
      0.64 σ over the full range. PTEs: fiducial n ≤ 6 0.777 → 0.715,
      n ≤ 20 0.943 → 0.748; full range n ≤ 6 1.37×10⁻⁵ → 1.55×10⁻⁵,
      n ≤ 20 1.08×10⁻⁴ → 4.12×10⁻⁴. Modes shifting by 1.0–1.37 σ are
      n = 13–16 and 20 at the fiducial cuts (largest n = 15) and
      n = 10–12 and 20 over the full range.

      Each grid's edge-based bin selection lands on a slightly
      different θ interval (12.053′–82.141′ at 1,000 bins,
      12.003′–82.800′ at 10,000); recomputing one grid over the
      other's interval moves the high-n modes and full-range PTEs
      further, a sensitivity to the interval rather than to
      resolution. Shifts are in units of the 1,000-bin σ (the only
      mode covariance), not a significance of the difference.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        artifact: tenk_grid_comparison
        quote:
          exact: '"pte": 0.7145810240685493'
