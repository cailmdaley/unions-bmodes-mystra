version: "0.0.14"
name: "Covariances"
description: |
  Every covariance of the analysis: `CosmoCov` ξ_± covariances on the
  integration and reporting grids, NaMaster iNKA covariances of the Cℓ
  bandpowers, and the pure E/B and COSEBI covariances, which carry the ξ_±
  covariance through the linear transforms of the data vectors as M C_ξ Mᵀ and
  Tᵀ C_ξ T. Those two read the bin centres and pair counts of the
  [ξ_± measurement](#inputs.xi_integration) and none of its shear. The
  [reference covariances](#decisions.reference_covariance) are the same recipes
  at the noise the GLASS mocks are held against, kept apart from the data
  covariances the null tests read, and a [scan](#analyses.blind_cov_scan) repeats
  them across the n(z) blinds.

inputs:
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

  - id: shapepipe_comprehensive_catalog
    from: ../shapepipe_comprehensive_catalog

  # Realisation 00001 is the catalog of the mock-matched Cℓ covariance.
  - id: glass_mock_catalogs
    from: ../glass_mock_catalogs

  - id: redshift_distributions
    from: ../redshift_distributions
    # Per-version n(z), read by the CosmoCov and iNKA covariances, by the
    # CosmoCov runs of the [cov_scan](#analyses.cov_scan) sweep and, as the theory
    # mean of its draws, by the Monte Carlo pure-mode covariance.

  # The masked (v1.4.8) and relaxed-flags (v1.4.11.3) catalogs of
  # pure_eb_covariance_sweep draw about a theory mean built from the pre-SOM n(z).
  - id: redshift_distributions_pre_som
    from: ../redshift_distributions_pre_som

  # Pair counts and bin centres for the transforms; the shear columns are not read.
  - id: xi_reporting
    from: ../data_vectors.xi_reporting

  - id: xi_integration
    from: ../data_vectors.xi_integration

  - id: xi_sweep
    from: ../data_vectors.xi_sweep

outputs:
  - id: cosmology_snapshot
    type: data
    description: |
      The Planck 2018 fiducial cosmology
      (`sp_validation.cosmology.PLANCK18`) as JSON: Ω_m = 0.30966,
      Ω_b = 0.04897, h = 0.6766, n_s = 0.9665, σ_8 = 0.8102, in flat
      ΛCDM with Ω_v = 1 − Ω_m. It sets the cosmology of every
      CosmoCov run.
    format: json
    decisions: [fiducial_cosmology]
    recipe:
      command: >
        python -c "import json; from sp_validation.cosmology import PLANCK18; d = dict(PLANCK18); d['Omega_v'] = 1 - PLANCK18['Omega_m']; json.dump(d, open('{output}', 'w'), indent=2)"

  - id: footprint_power_spectrum
    type: data
    format: txt
    description: |
      Power spectrum of the 2894 deg² survey footprint (HEALPix nside
      4096, normalised). The footprint is reconstructed from the catalog,
      with no external mask: its pixels are those holding an object that
      passes the spatial cuts of the
      [comprehensive catalog](#inputs.shapepipe_comprehensive_catalog).
      CosmoCov uses the spectrum only for the super-sample window of the
      [reporting-grid non-Gaussian covariance](#outputs.cov_reporting_ng);
      the Gaussian covariances behind the PTEs depend on the survey area
      alone.
    inputs: [shapepipe_comprehensive_catalog]
    recipe:
      command: >
        python src/workflow/scripts/footprint_power_spectrum.py
        --comprehensive-catalog {inputs.shapepipe_comprehensive_catalog}
        --out-file {output}
      resources: { cpus: 8, memory: "32GB" }

  - id: cov_reporting_g
    type: data
    description: |
      Reporting-grid 20-bin Gaussian-only CosmoCov covariance for
      the [fiducial catalog](#decisions.fiducial_catalog) at
      [blind A](#decisions.fiducial_blind), with area-only geometry:
      the Gaussian part of the [Gaussian + non-Gaussian diagnostic](#outputs.cov_reporting_ng).
      The nside-4096 spectrum is too short for CosmoCov's Gaussian
      pair-count correction, so no unused spectrum is passed here.
      Together they give the non-Gaussian share of the ξ_±
      diagonal variance quoted in the paper.
    decisions: [fiducial_catalog, fiducial_blind, covariance_engine, reporting_binning, leakage_correction]
    inputs: [cosmology_snapshot, redshift_distributions]
    format: txt
    recipe:
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian g
        --planck18-json {inputs.cosmology_snapshot}
        --nz "$(python src/workflow/scripts/decision_values.py nz_file {decisions.fiducial_catalog} {decisions.fiducial_blind})"
        --emit processed_g --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_ng
    type: data
    description: |
      Reporting-grid 20-bin full Gaussian + non-Gaussian
      CosmoCov covariance for the
      [fiducial catalog](#decisions.fiducial_catalog) at
      [blind A](#decisions.fiducial_blind), including
      connected-trispectrum and super-sample-covariance terms.
      [Mask application](#decisions.mask_application) selects the SSC window
      (footprint spectrum or circular-area approximation); G remains area-only.
      It sets the non-Gaussian share of the diagonal variance
      quoted in the paper and the total-ξ_± error bars of the
      [pure-mode data-vector figure](#../analyses.null_tests.outputs.pure_eb_data_vector_figure),
      but does not enter the PTEs, which use
      the [selected integration covariance](#decisions.covariance_class).
    decisions: [fiducial_catalog, fiducial_blind, mask_application, covariance_engine, reporting_binning, leakage_correction]
    inputs: [cosmology_snapshot, footprint_power_spectrum, redshift_distributions]
    format: txt
    recipe:
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --mask-application {decisions.mask_application}
        --planck18-json {inputs.cosmology_snapshot}
        --mask-cls {inputs.footprint_power_spectrum}
        --nz "$(python src/workflow/scripts/decision_values.py nz_file {decisions.fiducial_catalog} {decisions.fiducial_blind})"
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_integration
    type: data
    description: |
      Integration-grid 1000-bin CosmoCov covariance for the
      [fiducial catalog](#decisions.fiducial_catalog) at
      [blind A](#decisions.fiducial_blind), on 0.5–300 arcmin.
      The [covariance class](#decisions.covariance_class) is Gaussian-only
      on this grid, with area-only geometry.
      COSEBI covariances derive from it by a linear transform;
      pure-mode covariances use a linear transform or
      [MC realisations](#../decisions.mc_samples).
    decisions: [fiducial_catalog, fiducial_blind, covariance_class, covariance_engine, integration_grid, leakage_correction]
    inputs: [cosmology_snapshot, redshift_distributions]
    format: txt
    recipe:
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind}
        --min-sep 0.5 --max-sep 300.0 --nbins 1000
        --gaussian {decisions.covariance_class}
        --planck18-json {inputs.cosmology_snapshot}
        --nz "$(python src/workflow/scripts/decision_values.py nz_file {decisions.fiducial_catalog} {decisions.fiducial_blind})"
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_integration_reference
    type: data
    description: |
      [cov_integration](#outputs.cov_integration) at the noise the
      [reference covariance](#decisions.reference_covariance) selects: the
      covariance the GLASS mocks are held against, and the ξ_± half of the
      mock-matched reference (the pure-E/B half is
      [pure_eb_covariance_reference](#outputs.pure_eb_covariance_reference)).
      Under `mockmatched` that is `source_n_gal = 5.79308 arcmin⁻²` and
      `sigma_e = 0.37926` (0.26817 per component) at the fiducial
      `area = 2894.0304 deg²`; under `data_covariance` it is the catalog's own.

      With the area held fixed, that n_gal corresponds to 60.36 M
      galaxies, 0.1% below the 60 423 575 of realisation 00001, which
      raises the noise variance by 0.2%. See
      [mocks_are_over_constraining](#../analyses.validation.analyses.glass_mocks.findings.mocks_are_over_constraining).
    decisions: [fiducial_catalog, fiducial_blind, reference_covariance, mock_suite, covariance_class, covariance_engine, integration_grid, leakage_correction]
    inputs: [cosmology_snapshot, redshift_distributions]
    format: txt
    recipe:
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind}
        --min-sep 0.5 --max-sep 300.0 --nbins 1000
        --gaussian {decisions.covariance_class}
        --reference-covariance {decisions.reference_covariance}
        --planck18-json {inputs.cosmology_snapshot}
        --nz "$(python src/workflow/scripts/decision_values.py nz_file {decisions.fiducial_catalog} {decisions.fiducial_blind})"
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_reference
    type: data
    format: npz
    description: |
      [cov_integration_reference](#outputs.cov_integration_reference)
      rebinned from the 1000-bin integration grid to the 20 reporting
      bins, `Cov_rep = B Cov_fine Bᵀ`, the reference for raw ξ_±. `B`
      weights each fine bin by a uniform field's pair density
      (θ_r² − θ_l²), approximating TreeCorr's pair-weighted binning; the
      unweighted `pointwise` operator of the `adaptive_dqags` chain
      is written alongside as `cov_pointwise`, and the two σ agree to
      1.3% at worst.
    decisions: [reference_covariance, mock_suite, integration_grid, reporting_binning]
    inputs: [cov_integration_reference]
    recipe:
      command: >
        python src/workflow/scripts/xi_reporting_covariance.py
        --covariance {inputs.cov_integration_reference}
        --reporting-binning {decisions.reporting_binning}
        --integration-grid {decisions.integration_grid}
        --out-file {output}
      resources: { cpus: 2, memory: "16GB" }

  - id: cl_cov_reporting
    type: data
    description: |
      Gaussian (NaMaster iNKA) covariance of the Cℓ
      bandpowers for the fiducial catalog at blind A, on the
      32-bandpower √ℓ-spaced grid of
      [the harmonic-space data vector](#../analyses.data_vectors), the prescription
      Paper IV uses for its BB and EB null tests. It takes a Planck
      2018 theory spectrum plus analytic noise, with the weighted
      galaxy-count map at nside 1024 as the window.
    decisions: [fiducial_catalog, fiducial_blind, bandpower_binning, noise_bias_correction, leakage_correction, fiducial_cosmology]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions]
    format: fits
    recipe:
      command: >
        python src/workflow/scripts/generate_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "16GB" }

  - id: cl_cov_fine
    type: data
    description: |
      As [cl_cov_reporting](#outputs.cl_cov_reporting), on the
      √ℓ-spaced fine grid (96 bandpowers in the fiducial analysis) of
      [cl_bandpowers_fine](#../analyses.data_vectors.outputs.cl_bandpowers_fine),
      for the harmonic-space COSEBI transform. The other three
      leak-corrected catalogs' counterparts come from the
      [cl_cov_scan sweep](#analyses.cl_cov_scan).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, noise_bias_correction, leakage_correction, fiducial_cosmology]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions]
    format: fits
    recipe:
      command: >
        python src/workflow/scripts/generate_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins "$(python src/workflow/scripts/decision_values.py harmonic_validation_binning {decisions.harmonic_validation_binning})" --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_cov_reference
    type: data
    description: |
      [cl_cov_reporting](#outputs.cl_cov_reporting) on the catalog the
      [reference covariance](#decisions.reference_covariance) selects:
      realisation 00001 of the [GLASS suite](#decisions.mock_suite) under
      `mockmatched`, the fiducial catalog under `data_covariance`. The
      method is catalogue-driven (mask = the weighted galaxy-count map,
      noise bias Ω_pix ⟨Σ_i w_i² σ_{e,i}²⟩), so the option names a catalog
      and no number density or area convention enters. The mock's variance
      ratio to the data is 0.725 over 300 ≤ ℓ ≤ 1600, against the 350
      realisations' empirical 0.716
      ([clbb_variance_ratios](#../analyses.validation.analyses.glass_mocks.outputs.clbb_variance_ratios)).
    decisions: [fiducial_blind, reference_covariance, mock_suite, bandpower_binning, noise_bias_correction, fiducial_cosmology]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, glass_mock_catalogs, redshift_distributions]
    format: fits
    recipe:
      command: >
        python src/workflow/scripts/generate_cl_cov.py
        --ver "$(python src/workflow/scripts/decision_values.py reference_catalog {decisions.reference_covariance})"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "16GB" }

  - id: cov_sweep
    # Integration-grid covariances of the other catalog variants.
    from: cov_scan.cov_sweep_bundle

  - id: cl_cov_sweep
    # iNKA covariances of the other catalog variants. The fine-grid members feed
    # [cosebis_harmonic_scan](#../analyses.validation.analyses.cosebis_harmonic_scan).
    from: cl_cov_scan.cl_cov_sweep_bundle

  - id: pure_eb_covariance
    type: data
    format: npz
    description: |
      The 120×120 covariance (six 20-bin blocks) of the pure E/B data vector
      [pure_eb_data](#../analyses.data_vectors.outputs.pure_eb_data) for the
      [fiducial catalog](#../decisions.fiducial_catalog) at blind A, propagated
      from [cov_integration](#outputs.cov_integration) by the selected
      [covariance method](#../decisions.pure_eb_covariance_method). The file
      records that construction (and the draw count, for the Monte Carlo) so χ²
      consumers apply the matching Hartlap treatment. The transform M weights
      fine bins by the [measured pair counts](#inputs.xi_integration); the
      Monte Carlo draws of ξ_± produce this covariance and nothing else.
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method, leakage_correction]
    inputs: [xi_reporting, xi_integration, cov_integration, redshift_distributions]
    recipe:
      command: >
        bash src/papers/bmodes/scripts/run_pure_eb_covariance.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration}
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})"
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_covariance_reference
    type: data
    format: npz
    description: |
      [pure_eb_covariance](#outputs.pure_eb_covariance) from the
      [reference ξ_± covariance](#outputs.cov_integration_reference): the
      same transform M, built from the data's pair counts, or the same Monte
      Carlo chain with the same draws, so the two differ by their input
      alone. The mocks' noise enters only through that covariance, as it
      does for COSEBIs.
    decisions: [fiducial_catalog, fiducial_blind, reference_covariance, mock_suite, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method, leakage_correction, integration_grid]
    inputs: [xi_reporting, xi_integration, cov_integration_reference, redshift_distributions]
    recipe:
      command: >
        bash src/papers/bmodes/scripts/run_pure_eb_covariance.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_reference}
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})"
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_covariance_sweep
    type: data
    format: tar.gz
    description: |
      [pure_eb_covariance](#outputs.pure_eb_covariance) for the seven
      non-fiducial catalog versions (the other three variants with and without
      the leakage correction, and the fiducial variant with the opposite
      treatment), one npz each, from that version's ξ_±
      ([xi_sweep](#inputs.xi_sweep)) and Gaussian integration covariance
      ([cov_sweep](#outputs.cov_sweep)).
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method, leakage_correction]
    inputs: [xi_sweep, cov_sweep, redshift_distributions, redshift_distributions_pre_som]
    recipe:
      command: |
        set -e
        x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c
        o=$(mktemp -d)
        b="$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        versions=$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --nonfiducial)
        for ver in $versions; do
          cb=covariance_"$ver"_"$b"_integration
          bash src/papers/bmodes/scripts/run_pure_eb_covariance.sh \
            --version "$ver" --blind "$b" \
            --cat-config src/cosmo_val/cat_config.yaml \
            --xi-reporting "$x/$ver"_xi_minsep=1.0_maxsep=250.0_nbins=20_npatch=1.txt \
            --xi-integration "$x/$ver"_xi_minsep=0.5_maxsep=300.0_nbins=1000_npatch=1.txt \
            --cov-integration "$c/$cb/$cb"_processed.txt \
            --integration-method {decisions.pure_eb_integration_method} \
            --integration-limits {decisions.pure_eb_integration_limits} \
            --rebinning-weights {decisions.pure_eb_rebinning_weights} \
            --covariance-method {decisions.pure_eb_covariance_method} \
            --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})" \
            --out-file "$o/$ver"_"$b"_pure_eb_covariance.npz
        done
        tar czf {output} -C $o .
      resources: { cpus: 16, memory: "60GB" }

  - id: cosebis_covariance
    type: data
    format: npz
    description: |
      The COSEBI mode covariance T^T C_ξ T of
      [cosebis_modes_data](#../analyses.data_vectors.outputs.cosebis_modes_data)
      at both scale cuts, from [cov_integration](#outputs.cov_integration), with
      the σ_n that normalise B_n / σ_n in the
      [COSEBI data-vector figure](#../outputs.fig_cosebis_fiducial). T depends on
      the [integration-grid bin centres](#inputs.xi_integration) inside each cut.
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention, leakage_correction, reporting_binning, integration_grid]
    inputs: [xi_integration, cov_integration]
    recipe:
      command: >
        python src/papers/bmodes/scripts/cosebis_covariance.py
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_covariance_sweep
    type: data
    format: tar.gz
    description: |
      [cosebis_covariance](#outputs.cosebis_covariance) for the three other
      catalog versions of the
      [COSEBI version comparison](#../outputs.fig_versions_cosebis), one npz each,
      from that version's ξ_± ([xi_sweep](#inputs.xi_sweep)) and Gaussian
      integration covariance ([cov_sweep](#outputs.cov_sweep)).
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention, leakage_correction, reporting_binning, integration_grid]
    inputs: [xi_sweep, cov_sweep]
    recipe:
      command: |
        set -e
        x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c
        o=$(mktemp -d)
        b="$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        versions=$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --comparison)
        for ver in $versions; do
          cb=covariance_"$ver"_"$b"_integration
          python src/papers/bmodes/scripts/cosebis_covariance.py \
            --version "$ver" \
            --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} \
            --xi-integration "$x/$ver"_xi_minsep=0.5_maxsep=300.0_nbins=1000_npatch=1.txt \
            --cov-integration "$c/$cb/$cb"_processed.txt \
            --scale-cut-convention {decisions.scale_cut_convention} \
            --out-file "$o/$ver"_"$b"_cosebis_covariance.npz
        done
        tar czf {output} -C $o .
      resources: { cpus: 8, memory: "16GB" }

  - id: blind_cov_sweep
    # The ξ_±, pure E/B and Cℓ covariances at each n(z) blind, for the
    # [blind-independence check](#../analyses.validation.outputs.bb_covariance_blind_independence_evidence).
    from: blind_cov_scan.blind_cov_sweep_bundle

  - id: pure_eb_covariance_figure
    type: figure
    description: |
      Correlation matrix of the pure E/B covariance for the [fiducial
      catalog](#decisions.fiducial_catalog), propagated from the
      CosmoCov ξ_± covariance, in six 20-bin blocks: ξ_+^E,
      ξ_-^E, ξ_+^B, ξ_-^B, ξ_+^amb, ξ_-^amb. Off-diagonal correlations
      arise from integral coupling in the pure-mode filters.
    format: png
    decisions: [fiducial_catalog, leakage_correction]
    inputs: [pure_eb_covariance]
    recipe:
      command: >
        python src/papers/bmodes/scripts/pure_eb_covariance.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --pure-eb-covariance {inputs.pure_eb_covariance}
        --out-file {output}


