  fiducial_cosmology:
    from: ../fiducial_cosmology
outputs:
- id: cl_cov_sp_v1p4p5_nbins32
  type: data
  description: |
    iNKA Gaussian covariance of the Cℓ bandpowers for catalog version
    `SP_v1.4.5` on the `nbins32` √ℓ-spaced bandpower grid at blind A, computed
    as for the fiducial catalog.
  inputs:
  - shapepipe_v14_catalogs
  - shapepipe_v145_rerun
  - redshift_distributions
  - redshift_distributions_pre_som
  decisions:
  - fiducial_catalog
  - fiducial_blind
  - noise_bias_correction
  - bandpower_binning
  - fiducial_cosmology
  - leakage_correction
  recipe:
    command: |
      python src/workflow/scripts/generate_cl_cov.py --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version SP_v1.4.5 $(if [ nbins32 = fine ]; then printf -- '--fine-grid'; fi))" --cat-config src/cosmo_val/cat_config.yaml --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind} --out-file {output}
    resources:
