id: cl_cov_scan
version: '1.0'
name: Cℓ covariance catalog-version scan
description: |
  NaMaster iNKA Gaussian covariance of the Cℓ bandpowers, √ℓ-spaced at blind A,
  across catalog versions: the seven variants other than the selected primary
  catalog (in the fiducial analysis, three leak-corrected and four uncorrected),
  on the 32-bandpower reporting grid, and the initial, masked and relaxed-flags
  catalogs on the primary leakage branch on the finer grid of the
  [harmonic COSEBI scan](#../../../analyses.validation.analyses.cosebis_harmonic_scan).
  Each variant's window is the weighted galaxy-count map of its own catalog. The
  gathered result feeds the
  [version comparison](#../../../analyses.null_tests.outputs.cl_version_comparison_figure), the
  [Cℓ^BB PTE grids](#../../../analyses.null_tests.outputs.cl_pte_per_cut) and the harmonic COSEBI
  scan.
tags:
- sweep
inputs:
- id: redshift_distributions
  from: ../redshift_distributions
- id: redshift_distributions_pre_som
  from: ../redshift_distributions_pre_som
- id: shapepipe_v14_catalogs
  from: ../shapepipe_v14_catalogs
- id: shapepipe_v145_rerun
  from: ../shapepipe_v145_rerun
decisions:
  noise_bias_correction:
    from: ../noise_bias_correction
  bandpower_binning:
