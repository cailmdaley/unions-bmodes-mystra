id: cov_scan
version: "1.0"
name: "CosmoCov integration-grid catalog-version scan"
description: |
  Integration-grid 1000-bin Gaussian-only, area-only CosmoCov ξ_±
  covariance across catalog versions: the seven variants other than
  the selected primary catalog (in the fiducial analysis, three
  leak-corrected and four uncorrected), the version-swept analogue of
  [cov_integration](#../outputs.cov_integration). A version enters
  through its survey area, n_eff, σ_e and n(z); the masked catalog
  covers 2517 deg² rather than 2894 deg². The leakage correction
  changes none of these, so the corrected and uncorrected variants of
  a catalog receive identical CosmoCov inputs. The gathered result
  feeds the catalog-version pure-mode and COSEBI PTEs, among them the
  [pure-mode sweep](#../../data_vectors.real_space.outputs.pure_eb_sweep) and the
  [COSEBI comparison](#../../data_vectors.cosebis.outputs.cosebis_version_comparison).
tags: [sweep]

inputs:
  - id: cosmology_snapshot
    from: ../../covariances.cosmology_snapshot
  # Each version's n(z).
  - id: redshift_distributions
    from: ../redshift_distributions

decisions:
  integration_grid:
    from: ../integration_grid
  covariance_engine:
    from: ../covariance_engine
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  covariance_class:
    from: ../covariance_class

matrix:
  slot: [SP_v1.4.5, SP_v1.4.5_leak_corr, fiducial_counterpart, SP_v1.4.8, SP_v1.4.8_leak_corr, SP_v1.4.11.3, SP_v1.4.11.3_leak_corr]
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr

zip: [[version, slot]]

template:
  id: cov_${slot}
  type: data
  format: txt
  description: |
    Gaussian-only, area-only CosmoCov ξ_± covariance for
    catalog version `${version}` on the 1000-bin integration grid
    ([0.5', 300'], blind A).
    The per-version analogue of
    [cov_integration](#../outputs.cov_integration).
  inputs: [cosmology_snapshot, redshift_distributions]
  decisions: [fiducial_catalog, fiducial_blind, covariance_class, covariance_engine, integration_grid, leakage_correction]
  recipe:
    command: >
      bash src/workflow/scripts/run_cosmocov_chain.sh
      --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version ${version})" --blind {decisions.fiducial_blind}
      --min-sep 0.5 --max-sep 300.0 --nbins 1000
      --gaussian {decisions.covariance_class}
      --planck18-json {inputs.cosmology_snapshot}
      --cat-config src/cosmo_val/cat_config.yaml
      --emit processed --out-file {output}
    resources: { cpus: 4, memory: "16GB" }

gather:
  id: cov_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members together: one Gaussian-only
    integration covariance per catalog variant, published as
    [cov_sweep](#../outputs.cov_sweep).
  decisions: [fiducial_catalog, leakage_correction]
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cov --fiducial-catalog {decisions.fiducial_catalog}
      --leakage-correction {decisions.leakage_correction}
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
