id: blind_cov_scan
version: "1.0"
name: "Covariance scan over the n(z) blinds"
description: |
  The ξ_±, pure E/B and Cℓ covariances at each of the three n(z) blinds, on the
  [catalog chosen for the check](#../decisions.bb_blind_check_version): the
  Gaussian CosmoCov ξ_± covariance on the integration grid, its propagation
  through the pure-mode transform, and the iNKA covariance of the 32 bandpowers,
  each by the recipe of its fiducial counterpart. Only the n(z) moves between
  members. The gathered result feeds the
  [blind-independence check](#../../../analyses.validation.outputs.bb_covariance_blind_independence_evidence).
tags: [sweep]

inputs:
  - id: cosmology_snapshot
    from: ../../covariances.cosmology_snapshot
  - id: redshift_distributions
    from: ../redshift_distributions
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs
  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun
  # Bin centres and pair counts for the pure-mode transform.
  - id: xi_reporting
    from: ../xi_reporting
  - id: xi_integration
    from: ../xi_integration

decisions:
  bb_blind_check_version:
    from: ../bb_blind_check_version
  covariance_engine:
    from: ../covariance_engine
  covariance_class:
    from: ../covariance_class
  integration_grid:
    from: ../integration_grid
  bandpower_binning:
    from: ../bandpower_binning
  noise_bias_correction:
    from: ../noise_bias_correction
  fiducial_cosmology:
    from: ../fiducial_cosmology
  pure_eb_integration_method:
    from: ../pure_eb_integration_method
  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights
  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits
  pure_eb_covariance_method:
    from: ../pure_eb_covariance_method
  mc_samples:
    from: ../mc_samples
  decomposition_method:
    from: ../decomposition_method

matrix:
  blind: [blind_a, blind_b, blind_c]

template:
  id: blind_covariances_${blind}
  type: data
  format: tar.gz
  description: |
    The ξ_±, pure E/B and Cℓ covariances at `${blind}`:
    [cov_integration](#../outputs.cov_integration),
    [pure_eb_covariance](#../outputs.pure_eb_covariance) and
    [cl_cov_reporting](#../outputs.cl_cov_reporting) with that blind's n(z).
  inputs: [cosmology_snapshot, redshift_distributions, shapepipe_v14_catalogs, shapepipe_v145_rerun, xi_reporting, xi_integration]
  decisions: [bb_blind_check_version, covariance_class, covariance_engine, integration_grid, bandpower_binning, noise_bias_correction, fiducial_cosmology, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method]
  recipe:
    command: |
      set -e
      version=$(python src/workflow/scripts/decision_values.py bb_blind_check_version {decisions.bb_blind_check_version})
      o=$(mktemp -d)
      bash src/workflow/scripts/run_cosmocov_chain.sh \
        --version "$version" --blind ${blind} \
        --min-sep 0.5 --max-sep 300.0 --nbins 1000 \
        --gaussian {decisions.covariance_class} \
        --planck18-json {inputs.cosmology_snapshot} \
        --emit processed --out-file "$o"/cov_integration_${blind}.txt
      bash src/papers/bmodes/scripts/run_pure_eb_covariance.sh \
        --version "$version" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind ${blind})" \
        --cat-config src/cosmo_val/cat_config.yaml \
        --xi-reporting {inputs.xi_reporting} \
        --xi-integration {inputs.xi_integration} \
        --cov-integration "$o"/cov_integration_${blind}.txt \
        --integration-method {decisions.pure_eb_integration_method} \
        --integration-limits {decisions.pure_eb_integration_limits} \
        --rebinning-weights {decisions.pure_eb_rebinning_weights} \
        --covariance-method {decisions.pure_eb_covariance_method} \
        --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})" \
        --out-file "$o"/pure_eb_covariance_${blind}.npz
      python src/workflow/scripts/generate_cl_cov.py \
        --ver "$version" \
        --cat-config src/cosmo_val/cat_config.yaml \
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind ${blind} \
        --out-file "$o"/cl_cov_${blind}.fits
      tar czf {output} -C $o .
    resources: { cpus: 24, memory: "60GB" }

gather:
  id: blind_cov_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The covariances of all ${n_members} blinds, named by blind, published as
    [blind_cov_sweep](#../outputs.blind_cov_sweep).
  recipe:
    command: |
      set -e
      o=$(mktemp -d)
      for member in ${member_refs}; do tar xzf "$member" -C $o; done
      tar czf {output} -C $o .
    resources: { cpus: 1, memory: "4GB" }
