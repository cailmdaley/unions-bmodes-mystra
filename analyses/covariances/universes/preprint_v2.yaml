id: preprint_v2
description: |
  Gaussian CosmoCov covariance for all three ξ± pairings, with a Monte Carlo
  pure-mode covariance. The reference covariances sit at the noise of the
  published v1.4.6.3_v2 GLASS suite.
decisions:
  covariance_engine: cosmocov
  covariance_class: gaussian_only
  fiducial_cosmology: planck18
  # 2000 draws, with the Hartlap factor on the inverse at χ² time.
  pure_eb_covariance_method: monte_carlo
