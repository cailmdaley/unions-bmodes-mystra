version: "0.0.14"
name: "Fiducial catalog products"
description: |
  What the rest of the analysis needs to know about the fiducial
  catalog: its n(z) for the selected blind, its footprint mask power
  spectrum, and its area, n_eff and σ_e. The shear catalogs themselves
  come from Paper I and are read directly by the two-point measurement.
  These products stand apart because the covariance and the paper's
  survey table rest on them, and they follow from the catalog and blind
  choices alone.

inputs:
  - id: redshift_distributions
    from: ../redshift_distributions

  - id: footprint_masks
    from: ../footprint_masks

outputs:
  - id: redshift_distribution
    type: data
    description: |
      Redshift distribution n(z) of the fiducial catalog for the
      selected blind. Leakage-corrected and uncorrected variants of a
      version share one n(z): the correction acts on ellipticities,
      not photometry.
    format: txt
    inputs: [redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --fiducial-catalog {decisions.fiducial_catalog}
        --cat-config src/cosmo_val/cat_config.yaml
        --emit redshift_distribution --blind {decisions.fiducial_blind} --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: mask_power_spectrum
    type: data
    description: |
      Angular power spectrum of the fiducial catalog's 2894 deg²
      footprint mask (HEALPix nside 4096, normalised). CosmoCov uses
      it only for the super-sample window of the
      [reporting-grid G+NG covariance](#../covariance.outputs.cov_reporting_ng);
      the Gaussian covariances behind the PTEs depend on the survey
      area alone.
    format: txt
    decisions: [fiducial_catalog]
    inputs: [footprint_masks]
    recipe:
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --fiducial-catalog {decisions.fiducial_catalog}
        --cat-config src/cosmo_val/cat_config.yaml
        --emit mask_power_spectrum --out-file {output}
      resources: { cpus: 8, memory: "2GB" }

  - id: survey_properties
    type: data
    description: |
      Survey properties that set the CosmoCov covariance: area
      (deg²), effective galaxy density n_eff (arcmin⁻²) and combined
      two-component shape noise σ_e. For the fiducial size-cut
      catalog: 2894 deg², n_eff = 4.957 arcmin⁻², σ_e = 0.378
      (≈ 0.27 per component).
    format: json
    decisions: [fiducial_catalog]
    recipe:
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --fiducial-catalog {decisions.fiducial_catalog}
        --cat-config src/cosmo_val/cat_config.yaml
        --emit survey_properties --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

