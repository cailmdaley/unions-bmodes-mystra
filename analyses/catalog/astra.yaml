version: "0.0.14"
name: "Catalog preparation"

inputs:
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: redshift_distributions
    from: ../redshift_distributions

  - id: footprint_masks
    from: ../footprint_masks

outputs:
  - id: redshift_distribution
    type: data
    description: |
      Per-blind n(z) text file for the selected base version.
      Path keyed by `cc[ver]['shear']['redshift_path']` in the
      catalog config. Each base version has a single n(z) shared
      between the leakage-corrected and uncorrected variants
      (correction is in ellipticity calibration, not photometry).
    format: txt
    inputs: [redshift_distributions]
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # Copy the n(z) cat_config names for the fiducial catalog, switched to
      # the selected blind.
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --cat-config src/cosmo_val/cat_config.yaml
        --emit redshift_distribution --blind {decisions.fiducial_blind} --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: mask_power_spectrum
    type: data
    description: |
      Footprint mask power spectrum at HEALPix nside=4096,
      apodised and normalised, selected per catalog variant
      (standard 2894 deg² for v1.4.5 / v1.4.6.3 / v1.4.11.3,
      star-halo-masked 2517 deg² for v1.4.8). Consumed by
      CosmoCov via the `mask_cl_path` field of the generated
      `.ini` file.
    format: txt
    decisions: [fiducial_catalog]
    inputs: [footprint_masks]
    recipe:
      # Copy the footprint mask power spectrum the fiducial catalog's config
      # names (`fiducial.mask_cls`; nside 4096, apodised + normalised), which
      # the covariance sub-analysis feeds CosmoCov. Every catalog's footprint
      # is declared so it is visible in the sandbox; the star-halo variant
      # (same directory as the standard one) applies only to v1.4.8.
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --cat-config src/cosmo_val/cat_config.yaml
        --emit mask_power_spectrum --out-file {output}
      resources: { cpus: 8, memory: "2GB" }

  - id: survey_properties
    type: data
    description: |
      Per-version survey-property summary used to seed CosmoCov:
      area in deg², effective galaxy density n_eff in arcmin⁻²,
      and the combined two-component shape noise σ_e. Sourced from the `cov_th` block of
      `cat_config.yaml` for the selected version. For the
      fiducial size-cut catalog: 2894 deg², n_eff = 4.957
      arcmin⁻², σ_e = 0.378 (combined; ≈ 0.27 per component).
    format: json
    inputs: []
    decisions: [fiducial_catalog]
    recipe:
      # The fiducial catalog's cov_th block (A / n_e / sigma_e, exactly as
      # generate_cosmocov_ini.py consumes them) as area / n_eff /
      # sigma_e_combined.
      command: >
        python src/papers/bmodes/scripts/catalog_products.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --cat-config src/cosmo_val/cat_config.yaml
        --emit survey_properties --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  leakage_correction:
    from: ../leakage_correction
