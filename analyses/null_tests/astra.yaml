version: "0.0.14"
name: "B-mode null tests, PTE matrices, and blind-independence checks"

inputs:

  - id: paper_claims_script
    type: data
    description: Script converting the claims macros to a table and comparing universes.
    source: "./src/papers/bmodes/scripts/paper_claims.py"

  - id: pure_eb_pte_per_cut
    from: ../pure_eb.pure_eb_pte_per_cut

  - id: cosebis_pte_per_cut
    from: ../cosebis.cosebis_pte_per_cut

  - id: pure_eb_ptes
    from: ../pure_eb.pure_eb_ptes

  - id: cosebis_ptes
    from: ../cosebis.cosebis_ptes

  - id: cl_sweep
    from: ../cl_bb.cl_sweep

  - id: cl_bandpowers_reporting
    from: ../cl_bb.cl_bandpowers_reporting

  - id: cl_cov_reporting
    from: ../covariance.cl_cov_reporting

  - id: blind_check_pure_eb
    from: ../blind_check_pure_eb

  - id: blind_check_harmonic_cov
    from: ../blind_check_harmonic_cov

  - id: blind_check_cosmocov
    from: ../blind_check_cosmocov

  - id: blind_check_xi
    from: ../blind_check_xi

  - id: blind_check_pseudo_cl
    from: ../blind_check_pseudo_cl

  # Declared so an edit to either script restales the outputs below, whose
  # recipe strings name the script by a path that does not change.
  - id: config_space_pte_matrices_script
    from: ../config_space_pte_matrices_script

  - id: scale_cuts_script
    from: ../scale_cuts_script

  - id: generate_paper_macros_script
    from: ../generate_paper_macros_script

  # Calibrated minimum-PTE threshold from the sibling mock campaign.
  - id: mock_min_pte_calibration
    from: ../glass_mocks.mock_min_pte_calibration

  # Sigma ratios / chi^2 calibration and the scale-cut scan, for the prose macros.
  - id: mock_campaign_evidence
    from: ../glass_mocks.mock_campaign_evidence

  - id: mock_min_pte_scale_cut_scan
    from: ../glass_mocks.mock_min_pte_scale_cut_scan

  # Harmonic-vs-configuration COSEBI PTE metrics (App. cross-check), consumed
  # by pte_summary_macros to emit the four \*CosebisPteSixThree* macros.
  - id: cosebis_harmonic_metrics
    from: ../cosebis.cosebis_harmonic_metrics

  - id: cosebis_harmonic_metrics_full
    from: ../cosebis.cosebis_harmonic_metrics_full

  # Survey, first-mode, mock-ensemble and covariance summaries behind the
  # prose macros of pte_summary_macros.
  - id: survey_properties
    from: ../catalog.survey_properties

  - id: cosebis_modes_data
    from: ../cosebis.cosebis_modes_data

  - id: mock_per_mock_statistics
    from: ../glass_mocks.mock_per_mock_statistics

  - id: mock_mean_vector_stats
    from: ../glass_mocks.mock_mean_vector_stats

  - id: mock_vs_data_noise_table
    from: ../glass_mocks.mock_vs_data_noise_table

  - id: cov_reporting_g
    from: ../covariance.cov_reporting_g

  - id: cov_reporting_ng
    from: ../covariance.cov_reporting_ng

outputs:
  - id: paper_claims
    type: table
    format: csv
    description: |
      One row per claims macro, with its name, display text and numeric value
      where applicable, derived from [pte_summary_macros](#outputs.pte_summary_macros).
    inputs: [pte_summary_macros, paper_claims_script]
    recipe:
      command: >-
        python src/papers/bmodes/scripts/paper_claims.py extract
        {inputs.pte_summary_macros} {output}

  - id: config_space_pte_data
    type: metric
    format: json
    description: |
      ξ_+^B, ξ_-^B and COSEBI B_n χ² PTE matrices over the
      (θ_min, θ_max) pair grid of `geomspace(1', 250', 21)` for all
      catalog variants, with the values at the
      [adopted 12'–83' cut](#../decisions.fiducial_scale_cuts).
      Feeds the config-space columns of the per-version PTE table
      and the configuration-space PTE heatmaps.
    decisions: [scale_cut_convention, scale_cut_pair_grid_alignment, fiducial_catalog, leakage_correction, reporting_binning, fiducial_blind]
    inputs:
      - pure_eb_ptes
      - cosebis_ptes
      - pure_eb_pte_per_cut
      - cosebis_pte_per_cut
      - config_space_pte_matrices_script
      - scale_cuts_script
    recipe:
      # config_space_pte_matrices.py, evidence-only mode. The 7-version
      # (leak-corrected + uncorrected) sweep lives INSIDE the script; the swept
      # per-version PTE intermediates arrive as tar.gz bundles and are unpacked
      # into temp dirs. The fiducial version's per-cut NPZs come in directly.
      command: >
        d_pe=$(mktemp -d) && tar xzf {inputs.pure_eb_ptes} -C $d_pe &&
        d_cb=$(mktemp -d) && tar xzf {inputs.cosebis_ptes} -C $d_cb &&
        python src/papers/bmodes/scripts/config_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --pte-intermediate-dir $d_pe
        --cosebis-pte-dir $d_cb
        --blind {decisions.fiducial_blind}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pure-eb-pte-path {inputs.pure_eb_pte_per_cut}
        --fiducial-cosebis-pte-path {inputs.cosebis_pte_per_cut}
        --emit evidence
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: harmonic_space_pte_data
    type: metric
    format: json
    description: |
      Cℓ^BB χ² PTE matrices over the (ℓ_min, ℓ_max) bandpower-pair
      grid spanning 8 ≤ ℓ ≤ 2048 for all catalog variants, with the
      value at the
      [adopted 300 < ℓ < 1600 cut](#../decisions.fiducial_scale_cuts).
      Feeds the harmonic column of the per-version PTE table and
      the Cℓ^BB PTE heatmap.
    inputs:
      - cl_sweep
      - cl_bandpowers_reporting
      - cl_cov_reporting
    decisions: [cl_pte_blind_strategy, pte_definition, fiducial_catalog, leakage_correction, fiducial_blind]
    recipe:
      # harmonic_space_pte_matrices.py, evidence-only mode. The 7-version sweep
      # lives INSIDE the script and reads per-version pseudo_cl_* /
      # pseudo_cl_cov_* (blind A) FITS out of the unpacked cl_sweep bundle.
      command: >
        d_cl=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d_cl &&
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind}
        --results-dir $d_cl
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --emit evidence
        --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: pte_summary_macros
    type: data
    format: tex
    description: |
      The paper's quantitative-claims macros (`claims_macros.tex`) as
      `\newcommand` definitions:

      - the six headline PTEs and the version-comparison numbers,
        with pure-mode scale cuts resolved from the
        [scale-cut convention](#../decisions.scale_cut_convention) and
        rounded to integer arcmin;
      - the harmonic/configuration COSEBI cross-check PTEs
        (`\harmCosebisPteSixThreeFid`, `\cfgCosebisPteSixThreeFid`,
        `\harmCosebisPteSixThreeFull`, `\cfgCosebisPteSixThreeFull`) from
        [cosebis_harmonic_metrics](#inputs.cosebis_harmonic_metrics) and its
        [full-range twin](#inputs.cosebis_harmonic_metrics_full);
      - the GLASS mock-calibrated global minimum-PTE criterion at both
        windows: mock count, global p-values, the adopted
        [global PTE threshold](#../decisions.pte_threshold)
        (`\mockMinPteThreshold`), the raw calibration floor
        (`\mockMinPteFloor`) and the observed minima;
      - from [mock_campaign_evidence](#inputs.mock_campaign_evidence), the
        in-cut median analytic/empirical σ ratios
        (`\mockSigmaRatioPure{Min,Max}`, `\mockSigmaRatioCosebis`,
        `\mockSigmaRatioCl`) and the configuration-space ⟨χ²⟩/ν range
        (`\mockChiTwoNuConfig{Min,Max}`);
      - from [the scale-cut scan](#inputs.mock_min_pte_scale_cut_scan), the
        clean-sample failure rate at the adopted threshold in the fiducial
        window (`\mockAlphaFiducial`);
      - from the two PTE payloads, the minimum ν−2 PTE over the six
        statistics at the fiducial cuts (`\fiducialMinPteNuPenalty`,
        computed as in the root `nu_penalty_verdicts` table) and the
        largest PTE shift induced by the object-wise PSF-leakage
        correction (`\leakCorrMaxPteShift`);
      - the survey row (`\surveyArea`, `\surveyNeff`, `\surveySigmaE`) from
        [survey_properties](#inputs.survey_properties);
      - the COSEBI first-mode significance B₁/σ₁ at both windows
        (`\cosebisFirstModeSignificance{Full,Fid}`) from
        [cosebis_modes_data](#inputs.cosebis_modes_data);
      - the full-range analytic/empirical σ comparison
        (`\mockCosebisFirstModeTighter`, `\mockCosebisFirstModeSignificance`,
        `\mockPureLargeThetaTighter`) from
        [mock_per_mock_statistics](#inputs.mock_per_mock_statistics);
      - the ensemble-mean COSEBI bias (`\mockMeanBiasCosebis`) from
        [mock_mean_vector_stats](#inputs.mock_mean_vector_stats);
      - the mock galaxy-density excess (`\mockDensityExcess`) from
        [mock_vs_data_noise_table](#inputs.mock_vs_data_noise_table);
      - the non-Gaussian share of the diagonal ξ± variance over all bins
        and over the fiducial window (`\ngFractionDiagonal{All,Fiducial}`)
        from [cov_reporting_g](#inputs.cov_reporting_g) and
        [cov_reporting_ng](#inputs.cov_reporting_ng).
    decisions: [scale_cut_convention, pte_threshold, fiducial_catalog, leakage_correction, reporting_binning]
    inputs:
      - config_space_pte_data
      - harmonic_space_pte_data
      - mock_min_pte_calibration
      - mock_campaign_evidence
      - mock_min_pte_scale_cut_scan
      - cosebis_harmonic_metrics
      - cosebis_harmonic_metrics_full
      - survey_properties
      - cosebis_modes_data
      - mock_per_mock_statistics
      - mock_mean_vector_stats
      - mock_vs_data_noise_table
      - cov_reporting_g
      - cov_reporting_ng
      - generate_paper_macros_script
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_paper_macros.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --mock-min-pte-calibration {inputs.mock_min_pte_calibration}
        --mock-campaign-evidence {inputs.mock_campaign_evidence}
        --mock-scale-cut-scan {inputs.mock_min_pte_scale_cut_scan}
        --harmonic-config-fiducial-evidence {inputs.cosebis_harmonic_metrics}
        --harmonic-config-full-evidence {inputs.cosebis_harmonic_metrics_full}
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --survey-properties {inputs.survey_properties}
        --cosebis-modes-data {inputs.cosebis_modes_data}
        --mock-per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-mean-vector-stats {inputs.mock_mean_vector_stats}
        --mock-noise-table {inputs.mock_vs_data_noise_table}
        --cov-reporting-g {inputs.cov_reporting_g}
        --cov-reporting-ng {inputs.cov_reporting_ng}
        --emit macros
        --out-file {output}

  - id: bb_covariance_blind_independence_evidence
    type: figure
    format: png
    description: |
      BB-block diagonal variance across blinds A, B and C, compared
      with the EE-block diagonal variance, for pure E/B, COSEBIs and
      harmonic Cℓ, on the
      [catalog version](#decisions.bb_blind_check_version) chosen for
      the check. Supports the [blind-A fiducial
      choice](#../decisions.fiducial_blind); it does not enter the
      headline figures.
    decisions: [bb_blind_check_version, reporting_binning, integration_grid, mode_count, mc_samples]
    inputs:
      - blind_check_pure_eb
      - blind_check_harmonic_cov
      - blind_check_cosmocov
      - blind_check_xi
      - blind_check_pseudo_cl
    recipe:
      command: >
        python src/papers/bmodes/scripts/bb_covariance_blind_independence.py
        --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} --mc-samples {decisions.mc_samples}
        --version {decisions.bb_blind_check_version}
        --pure-eb-template '{inputs.blind_check_pure_eb}'
        --harmonic-template '{inputs.blind_check_harmonic_cov}'
        --cov-integration-template '{inputs.blind_check_cosmocov}'
        --xi-template '{inputs.blind_check_xi}'
        --pseudo-cl-template '{inputs.blind_check_pseudo_cl}'
        --out-file {output}

decisions:
  pte_definition:
    from: ../pte_definition
  cl_pte_blind_strategy:
    from: ../cl_pte_blind_strategy

  scale_cut_convention:
    from: ../scale_cut_convention

  pte_threshold:
    from: ../pte_threshold

  bb_blind_check_version:
    label: "Catalog for the blind-independence check"
    tags: [data_selection]
    rationale: |
      Blind independence is a geometric property of the footprint,
      so one catalog version suffices for the
      [BB-covariance blind-independence
      check](#outputs.bb_covariance_blind_independence_evidence).
      It uses the fiducial leak-corrected v1.4.6.3 catalog, for which
      the GLASS mock suite was built. B-mode covariance ratios are expected to sit closer
      to unity across blinds than E-mode ratios, though finite MC
      sampling can still introduce visible B-mode covariance scatter.
    default: fiducial_version_v1463
    options:
      fiducial_version_v1463:
        label: "Fiducial size-cut v1.4.6.3"
        description: |
          Per-blind covariances on the fiducial leak-corrected
          catalog, matching the admissible mock suite.
      mock_version_v146:
        label: "Earlier mock version v1.4.6"
        description: |
          Per-blind covariances at v1.4.6, the version of the
          earlier GLASS mock delivery.
        excluded: true
        excluded_reason: |
          The v1.4.6 mock suite is a stale-density delivery
          (see [mock_suite](#../glass_mocks.decisions.mock_suite));
          the check follows the admissible v1.4.6.3 suite.

  scale_cut_pair_grid_alignment:
    label: "Scale-cut grid alignment across statistics"
    tags: [scale_cuts]
    rationale: |
      The configuration-space PTE composite uses the same
      `geomspace(1', 250', 21)` index pairs for ξ_+^B, ξ_-^B and
      COSEBI B_n, so the
      [adopted 12'–83' fiducial cut
      ](#../decisions.fiducial_scale_cuts) falls in the same
      (i = 9, j = 16) cell of every panel. The COSEBI
      [stable-pair grid
      ](#../analyses.cosebis) is a strict subset of the pure-mode
      grid (pure modes have no polynomial-root instability), so the
      missing COSEBI cells appear as NaN tiles. The harmonic-space
      composite uses its own (ℓ_min, ℓ_max) bandpower-pair grid over
      8 ≤ ℓ ≤ 2048; the ℓ-cut is a separate decision from the θ-cut,
      so no cross-grid alignment is enforced.
    default: aligned_with_cosebis_subset
    options:
      aligned_with_cosebis_subset:
        label: "Aligned θ-grids with COSEBI subset (fiducial)"
      independent_grids:
        label: "Independent grids per statistic"
        excluded: true
        excluded_reason: "The PTE composite indexes shared reporting-bin edges; separate θ-grids have no implemented comparison path."
        description: |
          A separate θ-grid per statistic, which would prevent
          comparing the adopted-cut cell across panels.
  fiducial_blind:
    from: ../fiducial_blind
  fiducial_catalog:
    from: ../fiducial_catalog
  integration_grid:
    from: ../integration_grid
  leakage_correction:
    from: ../leakage_correction
  mc_samples:
    from: ../mc_samples
  mode_count:
    from: ../mode_count
  reporting_binning:
    from: ../reporting_binning
