version: "0.0.14"
name: "B-mode null tests"
description: |
  Turns the B-mode measurements into the paper's verdicts: χ² PTE matrices over
  every scale-cut pair for each statistic and catalog version, the PTE tables
  and heatmaps, the primary null test and the numbers the paper quotes. It stands on its own because it gathers
  the results of every measurement, covariance and mock analysis.

inputs:

  - id: pure_eb_pte_per_cut
    from: ../data_vectors.pure_eb_pte_per_cut

  - id: cosebis_pte_per_cut
    from: ../data_vectors.cosebis_pte_per_cut

  - id: pure_eb_sweep
    from: ../data_vectors.pure_eb_sweep

  - id: xi_sweep
    from: ../data_vectors.xi_sweep

  - id: cov_sweep
    from: ../covariances.cov_sweep

  - id: cl_sweep
    from: ../data_vectors.cl_sweep

  - id: cl_bandpowers_reporting
    from: ../data_vectors.cl_bandpowers_reporting

  - id: cl_cov_reporting
    from: ../covariances.cl_cov_reporting

  - id: mock_min_pte_calibration
    from: ../validation.mock_min_pte_calibration

  - id: mock_campaign_evidence
    from: ../validation.mock_campaign_evidence

  - id: mock_min_pte_scale_cut_scan
    from: ../validation.mock_min_pte_scale_cut_scan

  - id: cosebis_harmonic_metrics
    from: ../validation.cosebis_harmonic_metrics

  - id: cosebis_harmonic_metrics_full
    from: ../validation.cosebis_harmonic_metrics_full

  - id: cosebis_harmonic_version_ptes
    from: ../validation.cosebis_harmonic_version_ptes

  - id: cosebis_modes_data
    from: ../data_vectors.cosebis_modes_data

  - id: mock_per_mock_statistics
    from: ../validation.mock_per_mock_statistics

  - id: mock_mean_vector_stats
    from: ../validation.mock_mean_vector_stats

  - id: mock_vs_data_noise_table
    from: ../validation.mock_vs_data_noise_table

  - id: cov_reporting_g
    from: ../covariances.cov_reporting_g

  - id: cov_reporting_ng
    from: ../covariances.cov_reporting_ng

outputs:
  - id: primary_null_test_report
    type: metric
    format: json
    description: |
      The null test for the selected primary range and COSEBI mode subsets,
      with the global minimum-PTE threshold and mock p-value recalibrated from
      the stored per-mock PTE columns; the mocks are not remeasured. The
      complete six-test, two-range evidence stays in
      [mock_min_pte_calibration](#inputs.mock_min_pte_calibration).
    inputs: [mock_min_pte_calibration, mock_per_mock_statistics]
    decisions: [fiducial_scale_cuts, mode_subsets]
    recipe:
      command: >
        python src/papers/bmodes/scripts/primary_null_test_report.py
        --calibration {inputs.mock_min_pte_calibration}
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --fiducial-scale-cuts {decisions.fiducial_scale_cuts}
        --mode-subsets {decisions.mode_subsets}
        --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: paper_claims
    type: table
    format: csv
    description: |
      The table the paper's text reads its quoted numbers from: one row per
      macro of [pte_summary_macros](#outputs.pte_summary_macros), with its
      name, display text and numeric value where it has one.
    inputs: [pte_summary_macros]
    recipe:
      command: >-
        python src/papers/bmodes/scripts/paper_claims.py extract
        {inputs.pte_summary_macros} {output}

  - id: pure_eb_ptes
    type: data
    description: |
      Pure-mode PTE matrices (ξ_+^B, ξ_-^B, joint ξ_tot^B over the
      (θ_min, θ_max) scale-cut grid) for the seven catalog versions of
      [pure_eb_sweep](#inputs.pure_eb_sweep), one
      `{ver}_A_pure_eb_ptes.npz` each, computed as
      [pure_eb_pte_per_cut](#inputs.pure_eb_pte_per_cut) is, with the
      [covariance-dependent Hartlap
      treatment](#../decisions.pure_eb_covariance_method), from that
      version's data vector and pure-mode covariance. Feeds the
      per-version [PTE
      heatmaps](#outputs.fig_pte_heatmaps).
    format: tar.gz
    decisions: [fiducial_catalog, fiducial_blind, pte_blind_strategy, pte_definition, leakage_correction]
    inputs: [pure_eb_sweep, cov_sweep]
    recipe:
      command: >
        p=$(mktemp -d) && tar xzf {inputs.pure_eb_sweep} -C $p &&
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c &&
        o=$(mktemp -d) &&
        bash src/papers/bmodes/scripts/run_pure_eb_ptes_sweep.sh
        --versions "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --nonfiducial)" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --pure-eb-sweep-dir $p
        --cov-sweep-dir $c
        --out $o
        && tar czf {output} -C $o .
      resources: { cpus: 4, memory: "16GB" }

  - id: cosebis_ptes
    # The COSEBI PTE matrices of the seven other catalog versions.
    from: cosebis_pte_scan.cosebis_ptes_bundle

  - id: config_space_pte_data
    type: metric
    format: json
    description: |
      ξ_+^B, ξ_-^B, joint ξ_tot^B and COSEBI B_n (n ≤ 6 and n ≤ 20) χ²
      PTE matrices over the (θ_min, θ_max) pair grid of
      `geomspace(1', 250', 21)`, for all four catalog versions with and
      without leakage correction, with the values at the
      [adopted 12'–83' cut](#../decisions.fiducial_scale_cuts) and over
      the full range. The adopted-cut values are read from grid cells,
      so the [θ-cut convention](#../decisions.scale_cut_convention)
      changes the cut recorded here but none of the PTEs.
      Feeds the config-space columns of the per-version PTE table
      and the configuration-space PTE heatmaps.
    decisions: [scale_cut_convention, scale_cut_pair_grid_alignment, fiducial_catalog, leakage_correction, reporting_binning, fiducial_blind]
    inputs:
      - pure_eb_ptes
      - cosebis_ptes
      - pure_eb_pte_per_cut
      - cosebis_pte_per_cut
    recipe:
      command: >
        d_pe=$(mktemp -d) && tar xzf {inputs.pure_eb_ptes} -C $d_pe &&
        d_cb=$(mktemp -d) && tar xzf {inputs.cosebis_ptes} -C $d_cb &&
        python src/papers/bmodes/scripts/config_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --pte-intermediate-dir $d_pe
        --cosebis-pte-dir $d_cb
        --blind {decisions.fiducial_blind}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pure-eb-pte-path {inputs.pure_eb_pte_per_cut}
        --fiducial-cosebis-pte-path {inputs.cosebis_pte_per_cut}
        --emit evidence
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: harmonic_space_pte_data
    type: metric
    format: json
    description: |
      Cℓ^BB χ² PTE matrices over the (ℓ_min, ℓ_max) pair grid of the
      32 bandpowers spanning 8 ≤ ℓ ≤ 2048, for all four catalog
      versions with and without leakage correction, with the values at
      the [adopted 300 < ℓ < 1600 cut](#../decisions.fiducial_scale_cuts)
      and over the full range.
      Feeds the harmonic column of the per-version PTE table and
      the Cℓ^BB PTE heatmap.
    inputs:
      - cl_sweep
      - cl_bandpowers_reporting
      - cl_cov_reporting
    decisions: [pte_blind_strategy, pte_definition, fiducial_catalog, leakage_correction, fiducial_blind]
    recipe:
      command: >
        d_cl=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d_cl &&
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind}
        --results-dir $d_cl
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-cl-cov-path {inputs.cl_cov_reporting}
        --emit evidence
        --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: pte_table_appendix
    type: table
    format: csv
    # Columns: `version` (Initial / Size_cuts / Masked / Relaxed_flags),
    # `version_full` (catalog version), `cut` (Fiducial / Full_range), and the six
    # statistics `cosebis_n6`, `cosebis_n20`, `xip_B`, `xim_B`, `xitot_B`, `cl_BB`.
    # Configuration-space cells come from config_space_pte_data, the cl_BB column
    # from harmonic_space_pte_data.
    description: |
      B-mode PTE values across catalog versions at fiducial and
      full-range scale cuts. Fiducial scale cuts are 12–83 arcmin in
      configuration space and 300 < ℓ < 1600 in harmonic space; the full
      range is 1–250 arcmin / 8 ≤ ℓ ≤ 2048. A row passes the null test
      when its minimum PTE is at least p_thr = 0.01; only the fiducial
      catalog at the adopted cuts passes.
    inputs: [config_space_pte_data, harmonic_space_pte_data]
    decisions: [fiducial_catalog, leakage_correction]
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_paper_macros.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --emit table
        --out-file {output}

  - id: pte_table_tex
    type: data
    format: tex
    description: |
      LaTeX version of the [PTE table](#outputs.pte_table_appendix),
      with an added column for each row's minimum PTE.
    inputs: [pte_table_appendix]
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_pte_table_tex.py
        --pte-csv {inputs.pte_table_appendix}
        --out-file {output}

  - id: nu_penalty_verdicts
    type: table
    format: csv
    description: |
      The ν → ν−2 penalty for treating the two scale-cut boundaries
      as fitted parameters, applied across the whole
      [PTE table](#outputs.pte_table_appendix).
      One row per catalog version × statistic × cut (4 × 6 × 2 = 48).
      χ²_obs is recovered from each stored PTE and re-evaluated at
      ν−2; ν counts θ bins for ξ_±^B (twice that for ξ_tot^B; 7 at
      the fiducial cut), COSEBI modes (6 or 20), or bandpowers for
      C_ℓ^BB (17 at the fiducial cut).

      Columns: `version`, `version_full`, `cut`, `statistic`, `nu`,
      `nu_penalized`, `chi2`, `pte`, `pte_penalized`, `pte_decrease`,
      `passes`, `passes_penalized`, `verdict_change` (the last three
      against a fixed 0.05 level, not the
      [adopted p_thr](#decisions.pte_threshold)).
    decisions: [scale_cut_convention, pte_definition, reporting_binning, leakage_correction]
    inputs:
      - config_space_pte_data
      - harmonic_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/emit_nu_penalty_verdicts.py
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --reporting-binning {decisions.reporting_binning} --leakage-correction {decisions.leakage_correction}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  - id: cosebis_harmonic_config
    type: table
    format: csv
    description: |
      COSEBI B-mode PTEs computed two ways — from ξ± in
      configuration space and from Cℓ bandpowers in harmonic space —
      for the four catalog versions at fiducial and full-range cuts.
      The [PTE table](#outputs.pte_table_appendix) carries only the
      configuration-space COSEBIs; this table adds the harmonic path.
      Columns: `version` (initial / size_cuts / masked /
      relaxed_flags), `path` (harmonic / config), `cut` (fiducial /
      full_range), `pte`, `chi2`, `dof`; `chi2` and `dof` are filled
      only for the harmonic path, a χ²(ν=6) test. Configuration-space
      values come from
      [config_space_pte_data](#outputs.config_space_pte_data).
    inputs:
      - config_space_pte_data
      - cosebis_harmonic_metrics
      - cosebis_harmonic_metrics_full
      - cosebis_harmonic_version_ptes
    decisions: [leakage_correction]
    recipe:
      # The fiducial catalog's harmonic PTEs come from the two metrics outputs,
      # the other three catalogs' from the harmonic COSEBI scan.
      command: >
        python src/papers/bmodes/scripts/emit_cosebis_harmonic_config.py
        --leakage-correction {decisions.leakage_correction}
        --config-space-evidence {inputs.config_space_pte_data}
        --cosebis-evidence {inputs.cosebis_harmonic_metrics}
        --cosebis-evidence-full {inputs.cosebis_harmonic_metrics_full}
        --harmonic-version-ptes {inputs.cosebis_harmonic_version_ptes}
        --out-file {output}

  - id: fig_pte_heatmaps
    type: figure
    format: png
    description: |
      Configuration-space PTE maps for all four catalog versions.
      Columns show ξ_+^B, ξ_-^B, and COSEBI B_n (n ≤ 6) PTEs as a
      function of angular scale cuts; rows show different catalog
      versions. Solid blue cells indicate PTE < p_thr ([global PTE
      threshold](#decisions.pte_threshold)); whites and reds indicate
      consistency with zero. Black squares mark the adopted cuts (12–83
      arcmin). The size cut (fiducial versus initial) expands the
      acceptance region, while stellar masking contracts it.
    decisions: [scale_cut_convention, pte_threshold, fiducial_catalog, leakage_correction, reporting_binning]
    inputs:
      - config_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/config_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --from-evidence {inputs.config_space_pte_data}
        --figure appendix
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --out-file {output}

  - id: fig_cl_pte_heatmap
    type: figure
    format: png
    description: |
      Harmonic-space C_ℓ^BB PTE maps for all four catalog versions.
      Solid blue cells indicate failing PTEs ([global PTE
      threshold](#decisions.pte_threshold)); whites and reds indicate
      consistency with zero. The initial and relaxed-flags catalogs show
      widespread failures across multipole ranges; the fiducial and
      masked catalogs pass across nearly all multipole combinations.
    decisions: [pte_threshold, fiducial_catalog, leakage_correction]
    inputs:
      - harmonic_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --from-evidence {inputs.harmonic_space_pte_data}
        --figure appendix
        --pte-threshold {decisions.pte_threshold}
        --out-file {output}

  - id: pte_summary_macros
    type: data
    format: tex
    description: |
      The paper's quantitative-claims macros (`claims_macros.tex`) as
      `\newcommand` definitions:

      - the six headline PTEs and the version-comparison numbers,
        with pure-mode scale cuts resolved from the
        [scale-cut convention](#../decisions.scale_cut_convention) and
        rounded to integer arcmin, which gives 12 and 83 under either
        reading;
      - the harmonic/configuration COSEBI cross-check PTEs
        (`\harmCosebisPteSixThreeFid`, `\cfgCosebisPteSixThreeFid`,
        `\harmCosebisPteSixThreeFull`, `\cfgCosebisPteSixThreeFull`) from
        [cosebis_harmonic_metrics](#inputs.cosebis_harmonic_metrics) and its
        [full-range twin](#inputs.cosebis_harmonic_metrics_full);
      - the GLASS mock-calibrated global minimum-PTE criterion at both
        windows: mock count, global p-values, the adopted
        [global PTE threshold](#../decisions.pte_threshold)
        (`\mockMinPteThreshold`), the raw calibration floor
        (`\mockMinPteFloor`) and the observed minima;
      - from [mock_campaign_evidence](#inputs.mock_campaign_evidence), the
        in-cut median analytic/empirical σ ratios
        (`\mockSigmaRatioPure{Min,Max}`, `\mockSigmaRatioCosebis`,
        `\mockSigmaRatioCl`) and the configuration-space ⟨χ²⟩/ν range
        (`\mockChiTwoNuConfig{Min,Max}`);
      - from [the scale-cut scan](#inputs.mock_min_pte_scale_cut_scan), the
        clean-sample failure rate at the adopted threshold in the fiducial
        window (`\mockAlphaFiducial`);
      - from the two PTE matrix outputs, the minimum ν−2 PTE over the six
        statistics at the fiducial cuts (`\fiducialMinPteNuPenalty`,
        computed as in [nu_penalty_verdicts](#outputs.nu_penalty_verdicts)) and the
        largest PTE shift induced by the object-wise PSF-leakage
        correction (`\leakCorrMaxPteShift`);
      - the survey row (`\surveyArea`, `\surveyNeff`, `\surveySigmaE`) of the
        [fiducial catalog](#../decisions.fiducial_catalog);
      - the COSEBI first-mode significance B₁/σ₁ at both windows
        (`\cosebisFirstModeSignificance{Full,Fid}`) from
        [cosebis_modes_data](#inputs.cosebis_modes_data);
      - the full-range analytic/empirical σ comparison
        (`\mockCosebisFirstModeTighter`, `\mockCosebisFirstModeSignificance`,
        `\mockPureLargeThetaTighter`) from
        [mock_per_mock_statistics](#inputs.mock_per_mock_statistics);
      - the ensemble-mean COSEBI bias (`\mockMeanBiasCosebis`) from
        [mock_mean_vector_stats](#inputs.mock_mean_vector_stats);
      - the mock galaxy-density excess (`\mockDensityExcess`) from
        [mock_vs_data_noise_table](#inputs.mock_vs_data_noise_table);
      - the non-Gaussian share of the diagonal ξ± variance over all bins
        and over the fiducial window (`\ngFractionDiagonal{All,Fiducial}`)
        from [cov_reporting_g](#inputs.cov_reporting_g) and
        [cov_reporting_ng](#inputs.cov_reporting_ng).
    decisions: [scale_cut_convention, pte_threshold, fiducial_catalog, leakage_correction, reporting_binning]
    inputs:
      - config_space_pte_data
      - harmonic_space_pte_data
      - mock_min_pte_calibration
      - mock_campaign_evidence
      - mock_min_pte_scale_cut_scan
      - cosebis_harmonic_metrics
      - cosebis_harmonic_metrics_full
      - cosebis_modes_data
      - mock_per_mock_statistics
      - mock_mean_vector_stats
      - mock_vs_data_noise_table
      - cov_reporting_g
      - cov_reporting_ng
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_paper_macros.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --mock-min-pte-calibration {inputs.mock_min_pte_calibration}
        --mock-campaign-evidence {inputs.mock_campaign_evidence}
        --mock-scale-cut-scan {inputs.mock_min_pte_scale_cut_scan}
        --harmonic-config-fiducial-evidence {inputs.cosebis_harmonic_metrics}
        --harmonic-config-full-evidence {inputs.cosebis_harmonic_metrics_full}
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --survey-properties {decisions.fiducial_catalog}
        --cosebis-modes-data {inputs.cosebis_modes_data}
        --mock-per-mock-statistics {inputs.mock_per_mock_statistics}
        --mock-mean-vector-stats {inputs.mock_mean_vector_stats}
        --mock-noise-table {inputs.mock_vs_data_noise_table}
        --cov-reporting-g {inputs.cov_reporting_g}
        --cov-reporting-ng {inputs.cov_reporting_ng}
        --emit macros
        --out-file {output}

decisions:
  fiducial_scale_cuts:
    from: ../fiducial_scale_cuts
  pte_definition:
    from: ../pte_definition
  pte_blind_strategy:
    from: ../pte_blind_strategy
  scale_cut_convention:
    from: ../scale_cut_convention
  pte_threshold:
    from: ../pte_threshold
  scale_cut_pair_grid_alignment:
    label: "Scale-cut grid alignment across statistics"
    tags: [scale_cuts]
    rationale: |
      The configuration-space PTE composite uses the same
      `geomspace(1', 250', 21)` reporting bins for ξ_+^B, ξ_-^B and
      COSEBI B_n, so the
      [adopted 12'–83' fiducial cut
      ](#../decisions.fiducial_scale_cuts) selects the same window in
      every panel: bins 9–15, spanning edges 9–16. The pure-mode
      matrices index a cut by its first and last bin, (9, 15), and the
      COSEBI matrices by its edges, (9, 16). The COSEBI panels show 190
      of the 210 pure-mode cuts: the single-bin cuts, which include the
      four [unstable pairs
      ](#../decisions.scale_cut_pair_grid), are NaN tiles. The
      harmonic-space composite uses its own (ℓ_min, ℓ_max)
      bandpower-pair grid over 8 ≤ ℓ ≤ 2048, which has no cell-by-cell
      correspondence with the θ grid.
    default: aligned_with_cosebis_subset
    options:
      aligned_with_cosebis_subset:
        label: "Aligned θ-grids with COSEBI subset"
      independent_grids:
        label: "Independent grids per statistic"
        excluded: true
        excluded_reason: "Not implemented: the PTE composite indexes one shared set of reporting bins."
        description: |
          A separate θ-grid per statistic, which would prevent
          comparing the adopted-cut cell across panels.
  scale_cut_pair_grid:
    from: ../scale_cut_pair_grid
  fiducial_blind:
    from: ../fiducial_blind
  fiducial_catalog:
    from: ../fiducial_catalog
  leakage_correction:
    from: ../leakage_correction
  reporting_binning:
    from: ../reporting_binning
  integration_grid:
    from: ../integration_grid
  mode_count:
    from: ../mode_count
  mode_subsets:
    label: "PTE-reported mode subsets"
    tags: [estimator]
    rationale: |
      n ≤ 6 is the cosmologically informative range, where the
      E-mode amplitude has saturated; n ≤ 20 tests the B modes over
      the full computed basis, which matters for the full-range
      oscillatory pattern that motivates the lower angular cut.
      The selection acts in [primary_null_test_report](#outputs.primary_null_test_report),
      recalibrating its minimum from the selected stored mock PTE columns;
      the complete reference products and mode-vector figures retain both subsets.
      Larger subsets are unavailable because the
      [mode count](#../decisions.mode_count) is 20.
    default: n_le_6_and_n_le_20
    options:
      n_le_6_and_n_le_20:
        label: "Both subsets"
        insights: [asgari12_few_cosebis_modes_saturate_information, asgari19a_cosebis_nmax20_for_systematics]
      n_le_6_only:
        label: "n ≤ 6 only"
        description: |
          Drops the n ≤ 20 test.
      n_le_20_only:
        label: "n ≤ 20 only"
        description: |
          Drops the cosmologically informative subset.

analyses:

  cosebis_pte_scan:
    path: ./analyses/cosebis_pte_scan

prior_insights:

  asgari12_few_cosebis_modes_saturate_information:
    id: asgari12_few_cosebis_modes_saturate_information
    claim: |
      A relatively small number of COSEBI modes always saturates the
      available cosmological information, fewer for logarithmic than
      for linear COSEBIs. Restricting the cosmologically informative
      PTE subset to the first few modes keeps nearly all the E-mode
      information.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201218828"
        quote:
          exact: "We find that a relatively small number of COSEBIs modes is always enough to saturate to the maximum information level."
        location:
          page: 1
    scope: |
      Fisher forecasts (Asgari, Schneider & Simon 2012); the
      saturation point depends on survey and parameters, and Paper
      II's n ≈ 5–6 comes from its own E-mode data vector.

  asgari19a_cosebis_nmax20_for_systematics:
    id: asgari19a_cosebis_nmax20_for_systematics
    claim: |
      COSEBI E-mode predictions vanish beyond the first ~7 modes, so
      high modes carry no cosmological information, but systematic
      signals need not follow that behaviour and can be significant
      at large n. Truncating at n = 20 covers both the cosmological
      and the systematic-diagnostic range.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "Therefore, we do not expect to gain any cosmological information from these modes."
        location:
          page: 7
      - id: ev2
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "On the other hand the signal from systematic effects does not necessarily follow the same behaviour."
        location:
          page: 7
      - id: ev3
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "which encompasses modes that are important for both cosmological and systematic analyses."
        location:
          page: 7
    scope: |
      COSEBI B-mode analysis of KiDS-450, DES-SV and CFHTLenS
      (Asgari et al. 2019a, §4); same n_max = 20 as Paper II.
