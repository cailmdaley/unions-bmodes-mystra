id: cosebis_pte_scan
version: "1.0"
name: "COSEBI PTE-matrix catalog-version scan"
description: |
  The COSEBI PTE matrix of
  [cosebis_pte_per_cut](#../outputs.cosebis_pte_per_cut) for the seven
  other catalog versions: three leak-corrected and four uncorrected in
  the fiducial analysis. Only ξ_± and its covariance differ from member
  to member; the scale-cut grid and modes are shared. The gathered
  [cosebis_ptes](#../outputs.cosebis_ptes) is read, with the fiducial
  matrix, by
  [config_space_pte_data](#../outputs.config_space_pte_data), behind
  the [PTE composite figure](#../outputs.pte_heatmaps_figure) and the
  [PTE table](#../outputs.pte_table_appendix).
tags: [sweep]

inputs:
  - id: xi_sweep
    from: ../xi_sweep
  - id: cov_sweep
    from: ../cov_sweep

decisions:
  pte_definition:
    from: ../pte_definition
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  scale_cut_pair_grid:
    from: ../scale_cut_pair_grid
  integration_grid:
    from: ../integration_grid
  mode_count:
    from: ../mode_count
  reporting_binning:
    from: ../reporting_binning

matrix:
  # `fiducial_counterpart` is the fiducial catalog under the other
  # leakage_correction option: SP_v1.4.6.3 here, its leak-corrected version when
  # the analysis selects `uncorrected`. The other six slots hold what they name.
  slot: [SP_v1.4.5, SP_v1.4.5_leak_corr, fiducial_counterpart, SP_v1.4.8, SP_v1.4.8_leak_corr, SP_v1.4.11.3, SP_v1.4.11.3_leak_corr]
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr

zip: [[version, slot]]

template:
  id: cosebis_ptes_${slot}
  type: data
  format: npz
  description: |
    COSEBI E_n and B_n, with their χ² and PTEs at n ≤ 6 and n ≤ 20,
    over the stable scale-cut pairs of `geomspace(1', 250', 21)` for
    catalog version `${version}` at blind A: the per-version analogue
    of [cosebis_pte_per_cut](#../outputs.cosebis_pte_per_cut).
  inputs: [xi_sweep, cov_sweep]
  decisions: [fiducial_catalog, fiducial_blind, scale_cut_pair_grid, pte_definition, leakage_correction, reporting_binning, integration_grid, mode_count]
  recipe:
    command: |
      set -e
      x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x
      c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c
      ver=$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version ${version})
      cb=covariance_"$ver"_A_integration
      python src/papers/bmodes/scripts/compute_cosebis_pte_single.py \
        --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} \
        --xi-integration "$x/$ver"_xi_minsep=0.5_maxsep=300.0_nbins=1000_npatch=1.txt \
        --cov-integration "$c/$cb/$cb"_processed.txt \
        --version $ver --blind {decisions.fiducial_blind} \
        --out-file {output}
      rm -rf "$x" "$c"
    resources: { cpus: 8, memory: "16GB" }

gather:
  id: cosebis_ptes_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} per-version PTE matrices, bundled for
    [config_space_pte_data](#../outputs.config_space_pte_data) and
    available as [cosebis_ptes](#../outputs.cosebis_ptes). The fiducial
    version is not a member; its matrix is
    [cosebis_pte_per_cut](#../outputs.cosebis_pte_per_cut).
  decisions: [fiducial_catalog, leakage_correction]
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cosebis_ptes --fiducial-catalog {decisions.fiducial_catalog}
      --leakage-correction {decisions.leakage_correction}
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
