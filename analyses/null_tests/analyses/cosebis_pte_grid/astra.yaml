id: cosebis_pte_grid
version: '1.0'
name: COSEBI PTE matrix over scale cuts
description: |
  The COSEBI B-mode PTE matrix of the fiducial catalog: E_n and B_n
  with their χ² and PTEs at n ≤ 6 and n ≤ 20, for each stable pair of
  edges of `geomspace(1', 250', 21)`
  ([scale_cut_pair_grid](#../../decisions.scale_cut_pair_grid)). Each
  member computes one θ_min row of the matrix, and the gather
  assembles the rows into
  [cosebis_pte_per_cut](#../outputs.cosebis_pte_per_cut). That matrix
  is read by
  [config_space_pte_data](#../outputs.config_space_pte_data), behind
  the [PTE composite figure](#../../outputs.fig_pte_heatmaps) and the
  [PTE table](#../../outputs.pte_table_appendix), and by the
  [mock minimum-PTE calibration](#../../outputs.mock_min_pte_calibration).
tags:
- sweep
inputs:
- id: xi_integration
  from: ../xi_integration
- id: cov_integration
  from: ../cov_integration
decisions:
  pte_definition:
    from: ../pte_definition
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  scale_cut_pair_grid:
    from: ../scale_cut_pair_grid
  integration_grid:
    from: ../integration_grid
  leakage_correction:
    from: ../leakage_correction
  mode_count:
    from: ../mode_count
  reporting_binning:
    from: ../reporting_binning
outputs:
- id: cosebis_pte_row_00
  type: data
  description: |
    Row `i_min = 00` of the fiducial COSEBI PTE matrix: E_n and
    B_n, with their χ² and PTEs at n ≤ 6 and n ≤ 20, for every stable
    `(00, j)` scale-cut pair. All other cells of the matrix are NaN.
  inputs:
  - xi_integration
  - cov_integration
  decisions:
  - fiducial_catalog
  - fiducial_blind
  - scale_cut_pair_grid
  - pte_definition
  - leakage_correction
  - reporting_binning
  - integration_grid
  - mode_count
  recipe:
    command: |
      python src/papers/bmodes/scripts/compute_cosebis_pte_single.py --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} --xi-integration {inputs.xi_integration} --cov-integration {inputs.cov_integration} --row 00 --out-file {output}
    resources:
      cpus: 1
      memory: 16GB
  format: npz
