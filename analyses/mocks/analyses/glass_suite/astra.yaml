id: glass_suite
version: '1.0'
name: GLASS realization suite
description: |
  The 350 GLASS lognormal realizations, each generated, measured with this
  analysis's TreeCorr and NaMaster recipes, and discarded: a member keeps
  the realization's 1000-bin and 20-bin ξ_± and its 32-band Cℓ, never the
  catalog. The gathered suite is published as the
  [three mock ensembles](#../outputs.glass_mock_suite).
