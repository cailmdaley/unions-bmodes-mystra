version: "0.0.14"
name: "Harmonic space"
description: |
  Measures catalog-based Cℓ bandpowers and tests Cℓ^BB against zero
  over a grid of multipole ranges, for the fiducial catalog and, through its
  scan, every other catalog variant. It stands on its own because it works
  directly from the shear catalogs rather than from ξ_±, giving a
  harmonic-space check alongside the configuration-space statistics.

inputs:

  - id: cl_cov_reporting
    from: ../cl_cov_reporting

  - id: redshift_distributions
    from: ../redshift_distributions
    # Theory n(z) of the [cl_scan](#analyses.cl_scan) iNKA covariances for
    # v1.4.5 and v1.4.6.3.

  - id: redshift_distributions_pre_som
    from: ../redshift_distributions_pre_som
    # Theory n(z) of the [cl_scan](#analyses.cl_scan) iNKA covariances for
    # v1.4.8 and v1.4.11.3.

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

outputs:
  - id: cl_bandpowers_reporting
    type: data
    description: |
      Cℓ^EE, Cℓ^EB and Cℓ^BB bandpowers of the fiducial
      catalog at blind A on the
      [32-bandpower √ℓ-spaced grid](#decisions.bandpower_binning)
      over 8 ≤ ℓ ≤ 2048, decoupled and noise-bias-corrected.
      They are the data vector of the
      [Cℓ figure](#../../outputs.fig_cl_fiducial).
    format: fits
    decisions: [fiducial_catalog, fiducial_blind, estimator_choice, bandpower_binning, noise_bias_correction, leakage_correction]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun]
    recipe:
      command: >
        python src/workflow/scripts/generate_cl.py
        --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_bandpowers_fine
    type: data
    description: |
      The same bandpowers on the √ℓ-spaced grid of the
      [harmonic-space COSEBI
      transform](#../../decisions.harmonic_validation_binning),
      96 bandpowers in the fiducial analysis, fine enough to resolve the
      oscillations of its W_n(ℓ) filters.
    format: fits
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, estimator_choice, noise_bias_correction, leakage_correction]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun]
    recipe:
      command: >
        python src/workflow/scripts/generate_cl.py
        --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins "$(python src/workflow/scripts/decision_values.py harmonic_validation_binning {decisions.harmonic_validation_binning})" --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_sweep
    # Bandpowers and iNKA covariances of the other catalog variants. The fine-grid
    # members feed [cosebis_harmonic_scan](#../../analyses.validation.analyses.estimator_checks.analyses.cosebis_harmonic_scan).
    from: cl_scan.cl_sweep_bundle

  - id: cl_data_vector_figure
    type: figure
    description: |
      C_ℓ^BB/σ (top) and C_ℓ^EB/σ (bottom) for the [fiducial
      catalog](#../../decisions.fiducial_catalog). C_ℓ^BB is
      predominantly positive across the fiducial range; C_ℓ^EB
      scatters symmetrically around zero, suggesting that any
      B-mode contamination is not strongly correlated with the
      lensing signal.
    format: png
    decisions: [fiducial_catalog, pte_definition, leakage_correction]
    inputs: [cl_bandpowers_reporting, cl_cov_reporting]
    recipe:
      command: >
        python src/papers/bmodes/scripts/cl_data_vector.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_version_comparison_figure
    type: figure
    description: |
      C_ℓ^BB/σ and C_ℓ^EB/σ across catalog versions: initial (red
      circles), size-cut/fiducial (olive squares), masked (teal
      diamonds) and relaxed-flags (purple triangles). Rectangles
      span each bin horizontally and the range across versions
      vertically; horizontal lines mark the fiducial value; shaded
      bands mark multipoles outside the fiducial cuts. Only the
      size-cut catalog passes all statistics at the fiducial scale cuts
      ([PTE table](#../../outputs.pte_table_appendix)).
    format: png
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting]
    decisions: [pte_definition, fiducial_catalog, leakage_correction]
    recipe:
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/cl_version_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --results-dir $d
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_pte_per_cut
    type: data
    description: |
      Cℓ^BB null-test PTEs for all eight catalog variants (four
      catalogs, with and without leakage correction) over a grid of
      (ℓ_min, ℓ_max) bandpower ranges, using the iNKA Gaussian
      bandpower covariance from the
      [covariances sub-analysis](#../../analyses.covariances). The
      [adopted 300 < ℓ < 1600
      cut](#../../decisions.fiducial_scale_cuts) is one cell of the
      grid, which the
      [harmonic-space PTE heatmap](#../../outputs.fig_cl_pte_heatmap)
      shows.
    format: npz
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting]
    decisions: [pte_blind_strategy, pte_definition, fiducial_catalog, leakage_correction, fiducial_blind]
    recipe:
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind}
        --results-dir $d
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-cl-cov-path {inputs.cl_cov_reporting}
        --emit matrices
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

decisions:
  fiducial_cosmology:
    from: ../../fiducial_cosmology
  pte_definition:
    from: ../../pte_definition
  leakage_correction:
    from: ../../leakage_correction
  fiducial_catalog:
    from: ../../fiducial_catalog
  fiducial_blind:
    from: ../../fiducial_blind
  harmonic_validation_binning:
    from: ../../harmonic_validation_binning
  estimator_choice:
    label: "Cℓ estimator"
    tags: [estimator]
    rationale: |
      The Wolz et al. (2025) catalog-based estimator evaluates
      spin-2 spherical-harmonic transforms directly at source
      positions through the `ducc` library (Reinecke et al.
      2023), avoiding the pixelization artifacts of map-based
      pseudo-Cℓ. Paper IV measures its cosmic-shear spectra with
      the same estimator, so the null tests match the inference.
      Map-based pseudo-Cℓ, as used by DES and HSC, is the
      standard alternative.
    default: wolz25_catalog_based
    options:
      wolz25_catalog_based:
        label: "Wolz et al. 2025 catalog-based"
        description: |
          Spin-2 transforms at source positions via `ducc`, with
          NaMaster-decoupled bandpowers and analytic shot-noise
          subtraction.
        insights: [wolz25_catalog_based_pseudo_cl, hivon02_master_mode_coupling_deconvolution, alonso19_namaster_unbiased_spin2_pseudo_cl, reinecke23_sht_on_arbitrary_grids]
      map_based_pseudo_cl:
        excluded: true
        excluded_reason: "Not implemented here: the measurement recipes run only the catalog estimator, the GLASS mock spectra that validate it use the same one, and the iNKA covariance fails in the Monte-Carlo noise mode that matches the map estimator's noise subtraction."
        label: "Map-based pseudo-Cℓ on HEALPix"
        insights: [hivon02_master_mode_coupling_deconvolution, alonso19_namaster_unbiased_spin2_pseudo_cl]
        description: |
          Shapes binned into HEALPix pixels before the transform,
          which introduces pixel-window and aliasing effects near
          the pixel scale.
  bandpower_binning:
    from: ../../bandpower_binning
  noise_bias_correction:
    from: ../../noise_bias_correction
  pte_blind_strategy:
    from: ../../pte_blind_strategy

prior_insights:

  wolz25_catalog_based_pseudo_cl:
    id: wolz25_catalog_based_pseudo_cl
    claim: |
      The catalog-based pseudo-Cℓ estimator measures power
      spectra of fields sampled at arbitrary source positions,
      without pixelized maps; subtracting the discrete mask's
      shot noise analytically makes it immune to pixelization
      and aliasing and unbiased against noise uncorrelated
      between sources.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            We present a formalism to extract the angular
            power spectrum of fields sampled at a finite
            number of points with arbitrary positions -- a
            common situation for several catalog-based
            astrophysical probes -- through a simple extension
            of the standard pseudo-$C_\ell$ algorithm.
          prefix: "Abstract."
          suffix: "A key complication in this case is the need to handle the shot noise component of the associated discrete angular mask"
        location:
          page: 1
      - id: ev2
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            The resulting estimator is immune to small-scale
            pixelization effects and aliasing, and, more
            interestingly, unbiased against the contribution
            from measurement noise uncorrelated between
            different sources.
          prefix: "We show that this problem can be solved easily by estimating this contribution analytically and subtracting it."
          suffix: "We demonstrate the validity of the method in the context of cosmic shear datasets"
        location:
          page: 1
    scope: |
      Wolz, Alonso & Nicola 2025, JCAP 01, 028; the basis of the
      [harmonic_space](#../analyses.harmonic_space) estimator and its shot-noise
      correction.


  hivon02_master_mode_coupling_deconvolution:
    id: hivon02_master_mode_coupling_deconvolution
    claim: |
      MASTER describes the mode coupling from incomplete sky
      coverage analytically through the harmonic transform of the
      sky window and corrects for it to obtain an unbiased C_ℓ.
      Both estimators considered here decouple their bandpowers
      this way.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1086/338126"
        quote:
          exact: "The harmonic mode-mode coupling induced by the incomplete sky coverage is described analytically by the SHT of the sky window and corrected for in order to obtain an unbiased estimate of the"
        location:
          page: 2
    scope: |
      Hivon et al. 2002, ApJ 567, 2; derived for CMB temperature
      maps. NaMaster (Alonso et al. 2019) provides the spin-2
      implementation used here.

  alonso19_namaster_unbiased_spin2_pseudo_cl:
    id: alonso19_namaster_unbiased_spin2_pseudo_cl
    claim: |
      NaMaster provides a unified pseudo-Cℓ framework for any pair of
      spin-0 or spin-2 fields, and its validation suite recovers the
      input power spectra with no detectable bias in complex
      scenarios.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "provides a unified framework to compute angular cross-power spectra of any pair of spin-0 or spin-2 fields"
        location:
          page: 1
      - id: ev2
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "use it to show that the code is able to recover the input power spectra in the most complex scenarios with no detectable bias."
        location:
          page: 1
    scope: |
      Alonso, Sanchez & Slosar 2019, MNRAS 484, 4127; validated on
      maps, extended to catalogs by Wolz et al. 2025. Paper II uses
      it to decouple the bandpowers.

  reinecke23_sht_on_arbitrary_grids:
    id: reinecke23_sht_on_arbitrary_grids
    claim: |
      The `ducc` nonuniform-FFT code performs spherical harmonic
      transforms efficiently on completely arbitrary point sets,
      which is what makes evaluating spin-2 transforms directly at
      the tens of millions of UNIONS source positions practical.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202346717"
        quote:
          exact: "This publicly available code enables de facto efficient spherical harmonic transforms on completely arbitrary grids, and it might be applied in other areas as well."
        location:
          page: 1
    scope: |
      Reinecke, Belkner & Carron 2023, A&A 678, A165, motivated by
      CMB lensing; applied to catalog pseudo-Cℓ by Wolz et al. 2025.

analyses:

  cl_scan:
    path: ./analyses/cl_scan
