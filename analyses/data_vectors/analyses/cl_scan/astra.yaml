  recipe:
    command: |
      python src/workflow/scripts/generate_cl.py --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version SP_v1.4.5 $(if [ nbins32 = fine ]; then printf -- '--fine-grid'; fi))" --cat-config src/cosmo_val/cat_config.yaml --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind} --out-file {output}
