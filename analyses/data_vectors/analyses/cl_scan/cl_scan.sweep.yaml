id: cl_scan
version: "1.0"
name: "Cℓ catalog-version scan"
description: |
  Cℓ bandpowers, √ℓ-spaced at blind A, across catalog versions: the seven
  variants other than the selected primary catalog (in the fiducial analysis,
  three leak-corrected and four uncorrected). All seven use the 32-bandpower
  reporting grid; the initial, masked and relaxed-flags catalogs on the
  primary leakage branch also use the finer grid of the
  [harmonic COSEBI scan](#../../../analyses.validation.analyses.cosebis_harmonic_scan.outputs.cosebis_harmonic_version_ptes).
  Each variant's window comes from its own catalog's source positions and
  weights. The gathered result feeds the
  [version comparison](#../../../analyses.null_tests.outputs.cl_version_comparison_figure), the
  [Cℓ^BB PTE grids](#../../../analyses.null_tests.outputs.cl_pte_per_cut) and the harmonic COSEBI
  scan; the [iNKA covariances](#../../../analyses.covariances.outputs.cl_cov_sweep)
  are their own scan.
tags: [sweep]

inputs:
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs
  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

decisions:
  noise_bias_correction:
    from: ../noise_bias_correction
  bandpower_binning:
    from: ../bandpower_binning
  estimator_choice:
    from: ../estimator_choice
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  harmonic_validation_binning:
    from: ../harmonic_validation_binning

matrix:
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr
    - SP_v1.4.5_leak_corr
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3_leak_corr
  slot: [SP_v1.4.5, SP_v1.4.5_leak_corr, fiducial_counterpart, SP_v1.4.8, SP_v1.4.8_leak_corr, SP_v1.4.11.3, SP_v1.4.11.3_leak_corr, SP_v1.4.5, SP_v1.4.8, SP_v1.4.11.3]
  grid: [nbins32, nbins32, nbins32, nbins32, nbins32, nbins32, nbins32, fine, fine, fine]
  nbins: ['32', '32', '32', '32', '32', '32', '32', '"$(python src/workflow/scripts/decision_values.py harmonic_validation_binning {decisions.harmonic_validation_binning})"', '"$(python src/workflow/scripts/decision_values.py harmonic_validation_binning {decisions.harmonic_validation_binning})"', '"$(python src/workflow/scripts/decision_values.py harmonic_validation_binning {decisions.harmonic_validation_binning})"']
  grid_decision: [bandpower_binning, bandpower_binning, bandpower_binning, bandpower_binning, bandpower_binning, bandpower_binning, bandpower_binning, harmonic_validation_binning, harmonic_validation_binning, harmonic_validation_binning]

zip: [[version, slot, grid, nbins, grid_decision]]

template:
  id: cl_${slot}_${grid}
  type: data
  format: fits
  description: |
    Cℓ bandpowers for catalog version `${version}` on the `${grid}` √ℓ-spaced
    bandpower grid at blind A, computed as for the fiducial catalog.
  inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun]
  decisions: [fiducial_catalog, fiducial_blind, noise_bias_correction, "${grid_decision}", estimator_choice, leakage_correction]
  recipe:
    command: >
      python src/workflow/scripts/generate_cl.py
      --ver "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --scan-version ${version} $(if [ ${grid} = fine ]; then printf -- '--fine-grid'; fi))"
      --cat-config src/cosmo_val/cat_config.yaml
      --nside 1024 --npatch 1 --binning powspace --nbins ${nbins} --power 0.5 --blind {decisions.fiducial_blind}
      --out-file {output}
    resources: { cpus: 12, memory: "32GB" }

gather:
  id: cl_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members together: bandpowers per catalog variant
    and grid, published as [cl_sweep](#../outputs.cl_sweep).
  decisions: [fiducial_catalog, leakage_correction, harmonic_validation_binning]
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cl --fiducial-catalog {decisions.fiducial_catalog}
      --leakage-correction {decisions.leakage_correction}
      --harmonic-validation-binning {decisions.harmonic_validation_binning}
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
