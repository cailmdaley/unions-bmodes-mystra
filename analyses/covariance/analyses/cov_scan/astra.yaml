id: cov_scan
version: '1.0'
name: CosmoCov integration-grid catalog-version scan
description: |
  Design-B producer sweep: integration-grid 1000-bin Gaussian-only
  area-only CosmoCov covariance for every non-fiducial, non-ecut
  catalog version (7 variants — 3 leak-corrected + 4 uncorrected),
  the version-swept analogue of
  [cov_integration](#../outputs.cov_integration). Each version
  is its own lc output — a full `run_cosmocov_chain.sh` chain, the
  heaviest members in the reproduction — and the gather bundles
  them under the canonical
  `covariance_{ver}_A_integration/`
  per-version subdirectory layout that `--cov-dir` consumers read.
  Covariance is recomputed per variant — it is NOT assumed
  correction-invariant: v1.4.8 has a different survey area
  and the uncorrected variants differ in σ_e.
tags:
- sweep
- generated
- covariance
inputs:
- id: selected_config
  from: ../selected_config
- id: cosmology_snapshot
  from: ../../covariance.cosmology_snapshot
- id: redshift_distributions
  from: ../redshift_distributions
- id: cosmocov_binary
  from: ../cosmocov_binary
- id: cosmocov_libgsl
  from: ../cosmocov_libgsl
decisions:
  integration_grid:
    from: ../integration_grid
  covariance_engine:
    from: ../covariance_engine
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  covariance_class:
    from: ../covariance_class
outputs:
- id: cov_sp_v1p4p5
  type: data
  description: |
    Processed Gaussian-only, area-only CosmoCov ξ_± covariance for
    catalog version `SP_v1.4.5` on the 1000-bin integration grid
    ([0.5', 300'], blind A).
    The per-version analogue of
    [cov_integration](#../outputs.cov_integration); same
    `run_cosmocov_chain.sh` chain, different `--version`.
  inputs:
  - selected_config
  - cosmology_snapshot
  - redshift_distributions
  - cosmocov_binary
  - cosmocov_libgsl
  decisions:
  - fiducial_catalog
  - fiducial_blind
  - covariance_class
  - covariance_engine
  - integration_grid
  recipe:
    command: |
      bash src/workflow/scripts/run_cosmocov_chain.sh --version "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --scan-version SP_v1.4.5)" --blind A --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian {decisions.covariance_class} --planck18-json {inputs.cosmology_snapshot} --cat-config src/cosmo_val/cat_config.yaml --cosmocov {inputs.cosmocov_binary} --libgsl {inputs.cosmocov_libgsl} --emit processed --out-file {output}
    resources:
