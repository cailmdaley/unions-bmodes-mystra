  description: |
    Processed Gaussian-only masked CosmoCov ξ_± covariance for
    catalog version `SP_v1.4.5` on the 1000-bin integration grid
    ([0.5', 300'], blind A), computed against the `mask_power_spectrum`
    footprint power spectrum. The per-version analogue of
    [cov_integration_g](#../outputs.cov_integration_g); same
    `run_cosmocov_chain.sh` chain, different `--version`.
  inputs:
  - cosmology_snapshot
  - mask_power_spectrum
  - footprint_mask_starhalo
  - redshift_distributions
  - cosmocov_binary
  - cosmocov_libgsl
  decisions:
  - fiducial_catalog
  - fiducial_blind
  - covariance_class
  recipe:
    command: |
      bash src/workflow/scripts/run_cosmocov_chain.sh --version SP_v1.4.5 --blind A --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian g --planck18-json {inputs.cosmology_snapshot} --cat-config src/cosmo_val/cat_config.yaml --cosmocov {inputs.cosmocov_binary} --libgsl {inputs.cosmocov_libgsl} --mask-cls {inputs.mask_power_spectrum} --emit processed --out-file {output}
