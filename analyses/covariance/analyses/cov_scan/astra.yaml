id: cov_scan
version: '1.0'
name: CosmoCov integration-grid catalog-version scan
description: |
  Design-B producer sweep: integration-grid 1000-bin Gaussian-only
  masked CosmoCov covariance for every non-fiducial, non-ecut
  catalog version (7 variants — 3 leak-corrected + 4 uncorrected),
  the version-swept analogue of
  [cov_integration_g](#../outputs.cov_integration_g). Each version
  is its own lc output — a full `run_cosmocov_chain.sh` chain, the
  heaviest members in the reproduction — and the gather bundles
  them under the canonical
  `covariance_{ver}_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/`
  per-version subdirectory layout that `--cov-dir` consumers read.
  Covariance is recomputed per variant — it is NOT assumed
  correction-invariant: the masked v1.4.8 star-halo geometry
  differs outright and the uncorrected variants differ in σ_e.
tags:
- sweep
- generated
- covariance
