# Design-B CosmoCov version scan. Expand with:
#   scripts/sweep_expand.py -o analyses/covariance/analyses/cov_scan/astra.yaml \
#       analyses/covariance/analyses/cov_scan/cov_scan.sweep.yaml
id: cov_scan
version: "1.0"
name: "CosmoCov integration-grid catalog-version scan"
description: |
  Design-B producer sweep: integration-grid 1000-bin Gaussian-only
  masked CosmoCov covariance for every non-fiducial, non-ecut
  catalog version (7 variants — 3 leak-corrected + 4 uncorrected),
  the version-swept analogue of
  [cov_integration_g](#../outputs.cov_integration_g). Each version
  is its own lc output — a full `run_cosmocov_chain.sh` chain, the
  heaviest members in the reproduction — and the gather bundles
  them under the canonical
  `covariance_{ver}_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/`
  per-version subdirectory layout that `--cov-dir` consumers read.
  Covariance is recomputed per variant — it is NOT assumed
  correction-invariant: the masked v1.4.8 star-halo geometry
  differs outright and the uncorrected variants differ in σ_e.
tags: [sweep, generated, covariance]

inputs:
  - id: cosmology_snapshot
    from: ../../covariance.cosmology_snapshot
  - id: mask_power_spectrum
    from: ../mask_power_spectrum
  - id: footprint_mask_starhalo
    from: ../footprint_mask_starhalo
  # The chain's two host reads that no `{inputs...}` used to name: the CosmoCov
  # binary it execs, and the n(z) that generate_cosmocov_ini.py composes from
  # the version string and writes into the .ini. Every member needs both; all
  # seven versions' n(z) live under the one declared tree.
  - id: redshift_distributions
    from: ../redshift_distributions
  - id: cosmocov_binary
    from: ../cosmocov_binary
  - id: cosmocov_libgsl
    from: ../cosmocov_libgsl

decisions:
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  covariance_class:
    from: ../covariance_class

matrix:
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr
  # Per [mask_application](#../decisions.mask_application), v1.4.8 (corrected or
  # not) takes the star-halo footprint power spectrum and every other version
  # the standard footprint — mirrors covariance.smk get_mask_cls_path. Carried
  # as an axis zipped to `version` because interpolation has no conditionals.
  mask:
    - mask_power_spectrum
    - mask_power_spectrum
    - mask_power_spectrum
    - footprint_mask_starhalo
    - footprint_mask_starhalo
    - mask_power_spectrum
    - mask_power_spectrum

zip: [[version, mask]]

template:
  id: cov_${version}
  type: data
  format: txt
  description: |
    Processed Gaussian-only masked CosmoCov ξ_± covariance for
    catalog version `${version}` on the 1000-bin integration grid
    ([0.5', 300'], blind A), computed against the `${mask}`
    footprint power spectrum. The per-version analogue of
    [cov_integration_g](#../outputs.cov_integration_g); same
    `run_cosmocov_chain.sh` chain, different `--version`.
  inputs: [cosmology_snapshot, mask_power_spectrum, footprint_mask_starhalo, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
  decisions: [fiducial_catalog, fiducial_blind, covariance_class]
  recipe:
    # The per-version unit of work: one run_cosmocov_chain.sh chain, exactly as
    # the fiducial cov_integration_g recipe calls it. CosmoCov scratch (.ini,
    # .log, cov_tmp*/order_cov_tmp*) stays inside the chain's own scratch dir;
    # only the processed matrix reaches {output}.
    command: >
      bash src/workflow/scripts/run_cosmocov_chain.sh
      --version ${version} --blind A
      --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian g
      --planck18-json {inputs.cosmology_snapshot}
      --cat-config src/cosmo_val/cat_config.yaml
      --cosmocov {inputs.cosmocov_binary}
      --libgsl {inputs.cosmocov_libgsl}
      --mask-cls {inputs.${mask}}
      --emit processed --out-file {output}
    resources: { cpus: 4, memory: "16GB" }

gather:
  id: cov_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members bundled under their
    July-canonical per-version subdirectory layout
    `covariance_{ver}_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/{base}_processed.txt`
    — the exact tree `cosebis_version_comparison` (`--cov-dir`) and
    the pure E/B sweep read. Re-exported by
    [covariance.cov_sweep](#../outputs.cov_sweep); consumers untar
    it into a temp dir and pass the archive root as `--cov-dir`,
    unchanged from the July contract.
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cov --config src/papers/bmodes/config/config.yaml
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
