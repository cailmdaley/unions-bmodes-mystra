version: "1.0"
name: "Semi-analytical covariance and GLASS mock validation"

inputs:
  - id: redshift_distribution
    type: analysis
    from: ../catalog.redshift_distribution

  - id: mask_power_spectrum
    type: analysis
    from: ../catalog.mask_power_spectrum

  - id: survey_properties
    type: analysis
    from: ../catalog.survey_properties

  - id: glass_mock_realisations
    type: data
    from: ../glass_mock_realisations

outputs:
  - id: cosmology_snapshot
    type: data
    description: |
      Frozen JSON dump of `sp_validation.cosmology.PLANCK18`
      (Ω_m, σ_8, n_s, Ω_b, h, w_0, w_a, plus derived Ω_v) used
      to seed every CosmoCov `.ini`. Materialised by the
      `cosmology_params` rule so that the snakemake parse-time
      DAG does not import sp_validation; one snapshot per run.
    recipe:
      # Clean lc-native: dump the PLANCK18 snapshot (+ derived Omega_v) to
      # {output}/planck18.json directly inside the sp_validation container.
      # Source of truth remains sp_validation.cosmology.PLANCK18.
      command: >
        apptainer exec
        --bind /home,/scratch,/automnt,/n17data,/n23data1,/n09data
        --env PYTHONPATH=/n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/src
        /n17data/cdaley/containers/containers/
        /usr/local/bin/python -c "import json, os; from sp_validation.cosmology import PLANCK18; d = dict(PLANCK18); d['Omega_v'] = 1 - PLANCK18['Omega_m']; os.makedirs('{output}', exist_ok=True); json.dump(d, open(os.path.join('{output}', 'planck18.json'), 'w'), indent=2)"

  - id: cov_blocks
    type: data
    description: |
      Concatenated CosmoCov covariance matrix assembled from the
      three shear-shear block pairs (`++`, `--`, `+-`) per
      `(version, blind, gaussian, grid, mask)` tuple. The three
      blocks are each computed independently by
      `rule covariance_cosmocov` (one Slurm task per block,
      running the CosmoCov C++ binary), then joined by
      `rule covariance_cat` into the single matrix consumed
      downstream. Block runtimes range from minutes on the
      reporting grid to hours on the integration grid.
    decisions: [fiducial_catalog, fiducial_blind, covariance_class]
    inputs: [cov_reporting_ng]
    recipe:
      # Projection: the concatenated raw CosmoCov blocks (++/--/+-) produced
      # inside the cov_reporting_ng run (its covariance.txt = covariance_cat).
      command: >
        mkdir -p {output} &&
        cp /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cov_reporting_ng/covariance.txt {output}/covariance.txt

  - id: cov_reporting_g
    type: data
    description: |
      Reporting-grid 20-bin Gaussian-only CosmoCov covariance for
      the [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the standard
      footprint mask applied. Used as the Gaussian seed for
      reporting-grid Monte-Carlo cross-checks and as the
      Gaussian-only diagonal extracted by `cosmocov_process.py`.
    inputs: [cov_reporting_ng]
    recipe:
      # Projection: the Gaussian-only extract (covariance_processed_g.txt) of the
      # cov_reporting_ng run, exposed as this output's covariance_processed.txt.
      command: >
        mkdir -p {output} &&
        cp /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cov_reporting_ng/covariance_processed_g.txt {output}/covariance_processed.txt

  - id: cov_reporting_ng
    type: data
    description: |
      Reporting-grid 20-bin full Gaussian + non-Gaussian
      CosmoCov covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), masked. Includes
      connected-trispectrum and super-sample-covariance terms
      via CosmoCov's `cng = 1`. Reported in covariance
      diagnostics; the paper's null-test PTEs use the
      [Gaussian-only flavour](#decisions.covariance_class)
      throughout, so this matrix is materialised for
      cross-checking variance ratios but does not enter the
      headline PTEs.
    inputs: [cosmology_snapshot]
    recipe:
      # Primary reporting-grid CosmoCov run (reporting grid, ng=1, masked). Its
      # {output} holds the .ini, the 3 raw blocks, covariance.txt (concatenated
      # = cov_blocks), covariance_processed.txt (G+NG = this output),
      # covariance_processed_g.txt (Gaussian extract = cov_reporting_g), and
      # covariance_processed_plot.pdf (= cov_processed_qa) — exactly the products
      # of the paper's single cosmocov_process call. cov_blocks / cov_reporting_g
      # / cov_processed_qa are thin projections of this run.
      command: >
        bash /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/workflow/scripts/run_cosmocov_chain.sh
        --version SP_v1.4.6.3_leak_corr --blind A
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cosmology_snapshot/planck18.json
        --cat-config /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/cosmo_val/cat_config.yaml
        --mask-cls /n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask/mask_cls_footprint_nside_4096_norm.txt
        --out {output}
      resources: { cpus: 4, memory: "16GB", time_limit: "3h" }

  - id: cov_integration_g
    type: data
    description: |
      Integration-grid 1000-bin Gaussian-only CosmoCov
      covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the
      standard footprint mask applied. This is the Gaussian
      draw source for the
      [2000 MC realisations](#../decisions.mc_samples) that
      propagate through the pure-mode and COSEBI filters; it is
      also the closed-form covariance the COSEBI linear
      transform uses. Non-Gaussian terms are not computed at
      this binning — the
      [Gaussian-only choice](#decisions.covariance_class) is
      forced by tractability on the 1000-bin integration grid.
    inputs: [cosmology_snapshot]
    recipe:
      # Clean lc-native: run_cosmocov_chain.sh does the full CosmoCov chain
      # (generate .ini from planck18.json + cat_config cov_th -> 3 blocks
      # ++/--/+- on the bare host with module load [container:none], as the
      # original -> cat -> cosmocov_process). Integration grid, Gaussian-only
      # (ng=0), masked. Writes covariance_processed.txt (the G matrix that
      # pure_eb + cosebis MC-propagation consume). Fiducial hardcoded.
      command: >
        bash /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/workflow/scripts/run_cosmocov_chain.sh
        --version SP_v1.4.6.3_leak_corr --blind A
        --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian g
        --planck18-json /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cosmology_snapshot/planck18.json
        --cat-config /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/cosmo_val/cat_config.yaml
        --mask-cls /n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask/mask_cls_footprint_nside_4096_norm.txt
        --out {output}
      resources: { cpus: 4, memory: "16GB", time_limit: "12h" }

  - id: cov_processed_qa
    type: figure
    description: |
      Per-`(version, blind, gaussian, grid, mask)` covariance
      structure plot generated by `cosmocov_process.py` showing
      the diagonal variance, off-diagonal correlation
      structure, and condition number diagnostics. Used in the
      covariance review notebooks; not in the paper.
    inputs: [cov_reporting_ng]
    recipe:
      # Projection: the covariance QA correlation-structure plot produced by
      # cosmocov_process inside the cov_reporting_ng run.
      command: >
        mkdir -p {output} &&
        cp /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cov_reporting_ng/covariance_processed_plot.pdf {output}/covariance_processed_plot.pdf

  - id: cov_glass_xi_reporting
    type: data
    description: |
      Sample covariance of ξ_± across the 350 GLASS mock
      realisations on the reporting grid (20 bins, 4096
      patches). Materialised once for v1.4.6 catalog
      properties (the geometry of v1.4.6.3 is identical at this
      level). Compared diagonally against
      [cov_reporting_ng](#outputs.cov_reporting_ng) for
      validation; not used as a paper covariance source.
    decisions: [fiducial_catalog, glass_validation_strategy]
    recipe:
      # Primary GLASS sample-covariance run. compute_glass_mock_covariance.py
      # stacks the 350 pre-computed mock data vectors (xi_+/xi_- 20-bin +
      # pseudo-Cl EE/BB) and emits, in ONE invocation, the xi-only cov (this
      # output), the cl-only cov (projected into cov_glass_cl_reporting), the
      # combined cov, the three means, and the correlation heatmap — all into
      # {output}. Sub-second np.cov over 350x40 vectors; the cost is loading
      # 700 FITS/npy files. Globs expand on the host shell before apptainer.
      command: >
        mkdir -p {output} &&
        apptainer exec
        --bind /home,/scratch,/automnt,/n17data,/n23data1,/n09data
        --env PYTHONPATH=/n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/src
        /n17data/cdaley/containers/containers/
        /usr/local/bin/python /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/workflow/scripts/compute_glass_mock_covariance.py
        --xi-files /n09data/guerrini/glass_mock_v1.4.6/results/xi_glass_mock_*_4096_nbins=20.fits
        --cl-files /n09data/guerrini/glass_mock_v1.4.6/results/cl_glass_mock_*_4096.npy
        --xi-covariance {output}/xi_covariance.npy
        --cl-covariance {output}/cl_covariance.npy
        --combined-covariance {output}/combined_covariance.npy
        --combined-correlation-plot {output}/combined_correlation.png
        --xi-mean {output}/xi_mean.npy
        --cl-mean {output}/cl_mean.npy
        --combined-mean {output}/combined_mean.npy
      resources: { cpus: 4, memory: "8GB", time_limit: "30min" }

  - id: cov_glass_cl_reporting
    type: data
    description: |
      Sample covariance of NaMaster pseudo-Cℓ across the 350
      GLASS mock realisations on the harmonic reporting grid
      (32 √ℓ-linear bandpowers). Validation companion to
      [cov_glass_xi_reporting](#outputs.cov_glass_xi_reporting);
      compared against the
      [pseudo-Cℓ bandpower covariance](#outputs.cl_cov_reporting)
      for reporting-grid agreement.
    decisions: [fiducial_catalog, glass_validation_strategy]
    inputs: [cov_glass_xi_reporting]
    recipe:
      # Projection: the pseudo-Cl sample covariance is emitted by the same
      # compute_glass_mock_covariance.py invocation that produces
      # cov_glass_xi_reporting; expose its cl_covariance.npy (and cl_mean.npy)
      # as this output.
      command: >
        mkdir -p {output} &&
        cp /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cov_glass_xi_reporting/cl_covariance.npy {output}/cl_covariance.npy &&
        cp /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cov_glass_xi_reporting/cl_mean.npy {output}/cl_mean.npy
      resources: { cpus: 1, memory: "2GB", time_limit: "15min" }

  - id: cl_cov_reporting
    type: data
    description: |
      NaMaster pseudo-Cℓ bandpower covariance for the fiducial
      catalog at blind A on the harmonic reporting grid (32
      √ℓ-linear bandpowers). Produced inline with
      [cl_bb's pseudo-Cℓ data vector](#../analyses.cl_bb) by
      the `pseudo_cl_cov` rule under NaMaster's iNKA Gaussian
      framework (matching Paper IV's BB / EB covariance
      choice). Materialised here rather than in cl_bb so that
      it is co-located with the configuration-space CosmoCov
      runs as a single covariance package.
    decisions: [fiducial_catalog, fiducial_blind]
    recipe:
      # Clean lc-native: generate_pseudo_cl_cov.py CLI, NaMaster iNKA Gaussian
      # bandpower covariance matching the reporting data-vector binning
      # (powspace, nbins=32). Native filename pseudo_cl_cov_<ver>.fits under
      # {output}. cosmo defaults to Planck18 (byte-identical to planck18.json).
      command: >
        apptainer exec
        --bind /home,/scratch,/automnt,/n17data,/n23data1,/n09data
        --env PYTHONPATH=/n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/src
        /n17data/cdaley/containers/containers/
        /usr/local/bin/python /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/workflow/scripts/generate_pseudo_cl_cov.py
        --ver SP_v1.4.6.3_leak_corr
        --cat-config /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind A
        --out {output}
      resources: { cpus: 12, memory: "16GB", time_limit: "3h" }

  - id: cov_sweep
    type: data
    description: |
      Design-B producer sweep: integration-grid 1000-bin
      Gaussian-only masked CosmoCov covariance for every
      non-fiducial, non-ecut catalog version (7 variants — 3
      leak-corrected + 4 uncorrected), each written into a
      per-version subdir under the canonical
      `covariance_{ver}_A_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/..._processed.txt`
      naming that
      [cosebis_version_comparison](#../cosebis.outputs.cosebis_version_comparison)
      (`--cov-dir`) and the
      [pure E/B sweep](#../pure_eb.outputs.pure_eb_sweep) read.
      This is the version-swept analogue of
      [cov_integration_g](#outputs.cov_integration_g). Per
      [mask_application](#decisions.mask_application), v1.4.8
      uses the star-halo footprint power spectrum and every
      other version the standard footprint. Covariance is
      recomputed per variant — it is NOT assumed
      correction-invariant: the masked v1.4.8 star-halo geometry
      differs outright, and the uncorrected variants differ in
      σ_e — so all 7 get a full CosmoCov chain.
    decisions: [fiducial_catalog, fiducial_blind, covariance_class]
    inputs: [cosmology_snapshot]
    recipe:
      # run_cov_sweep.sh loops the non-fiducial version list (sweep_versions.py)
      # and calls run_cosmocov_chain.sh once per version (integration grid,
      # gaussian g, masked, blind A) into a per-version canonical subdir, renaming
      # covariance_processed.txt -> {base}_processed.txt. Per-version mask select
      # mirrors covariance.smk get_mask_cls_path. Reads the shared cosmology
      # snapshot by absolute path. Serial over versions.
      command: >
        bash /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/papers/bmodes/scripts/run_cov_sweep.sh
        --config /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/papers/bmodes/config/config.yaml
        --cat-config /n17data/cdaley/unions/code/sp_validation.worktrees/repro-paper-ii-astra/cosmo_val/cat_config.yaml
        --planck18-json /n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/Reproductions/UNIONS/pure_eb/analyses/covariance/results/baseline/cosmology_snapshot/planck18.json
        --mask-base /n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask
        --out {output}
      resources: { cpus: 4, memory: "16GB", time_limit: "48h" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  covariance_engine:
    label: "Semi-analytical covariance engine"
    tags: [covariance, method]
    rationale: |
      `CosmoCov` (Krause & Eifler 2017; Fang, Eifler & Krause
      2020) is the configuration-space covariance code adopted
      by Paper III for cosmological inference; this paper
      reuses the same engine for parity. CosmoCov computes
      shear-shear correlation-function covariances analytically
      with optional connected-trispectrum and super-sample
      terms, requires no simulations as a primary covariance
      source, and uses 2D-FFTLog (`fang.eifler.krause20`) for
      numerically stable real-space transforms on
      arcmin-scale grids. The harmonic-space pseudo-Cℓ
      covariance uses NaMaster's iNKA framework instead — this
      sub-analysis exposes both engines because the paper
      ingests CosmoCov for ξ_± and iNKA for Cℓ_BB, matching
      Paper III and Paper IV respectively.
    default: cosmocov
    options:
      cosmocov:
        label: "CosmoCov (paper fiducial; configuration-space)"
        description: |
          Krause & Eifler 2017 covariance code; runs as a C++
          binary launched per `(block, .ini)` tuple from the
          `covariance_cosmocov` rule.
      namaster_inka:
        label: "NaMaster iNKA (paper fiducial; harmonic-space)"
        description: |
          NaMaster's improved Narrow Kernel Approximation
          Gaussian covariance; computed inline with the
          `pseudo_cl_cov` rule. Used for the BB and EB
          bandpower covariances directly. Paper IV validates it
          against 10,000 Gaussian sims (their Appendix C).
      mock_sample_covariance:
        label: "GLASS sample covariance"
        description: |
          Empirical sample covariance from the 350 GLASS mock
          realisations. Used as a validation reference, not a
          paper covariance source.
        excluded: true
        excluded_reason: |
          350 mocks at data-vector dimension up to 40 leave
          enough Hartlap bias and noise on the inverse that
          the paper PTEs would be inflated; CosmoCov is
          unbiased at the price of a fixed cosmology
          assumption.

  covariance_class:
    label: "Gaussian vs Gaussian + non-Gaussian covariance"
    tags: [covariance, statistics, primary]
    rationale: |
      All B-mode null-test PTEs in the paper use Gaussian-only
      covariance: in configuration space because the
      non-Gaussian (cng) terms are intractable on the 1000-bin
      integration grid required for pure-mode and COSEBI
      filter integration, and in harmonic space because Paper
      IV's iNKA covariance for the BB and EB spectra is
      Gaussian by construction (non-Gaussian terms enter only
      Paper IV's EE cosmological likelihood, not the BB/EB
      null tests). The non-Gaussian connected-trispectrum and
      super-sample terms are positive-definite contributions
      to the variance, so their omission underestimates the
      true variance and the reported PTEs are conservative —
      a null test that passes with Gaussian-only covariance
      would generally pass with the full covariance.
    default: gaussian_only
    options:
      gaussian_only:
        label: "Gaussian only (paper fiducial for null tests)"
        description: |
          `ng = 0` and `cng = 0` in the CosmoCov `.ini`.
          Materialised at both reporting and integration grids.
          NaMaster iNKA covariance is Gaussian by default; no
          flag toggle.
      gaussian_plus_ng:
        label: "Gaussian + non-Gaussian"
        description: |
          `ng = 1` and `cng = 1` in the CosmoCov `.ini`;
          computed at reporting grid only. Used for variance
          ratio diagnostics in covariance review; not in
          paper PTEs.

  mask_application:
    label: "Footprint mask in covariance"
    tags: [covariance, geometry]
    rationale: |
      CosmoCov can either ignore the survey footprint
      (`c_footprint_file = ""` in the `.ini`) or include it via
      a precomputed mask power spectrum. The fiducial paper
      runs use the
      [standard 2894 deg² or star-halo 2517 deg² mask
      power spectrum](#inputs.mask_power_spectrum) appropriate
      to the catalog version; the unmasked variant is retained
      to expose the geometry contribution to the covariance
      diagonal as a sanity check (the masked / unmasked
      variance ratio is a fixed-cosmology fingerprint of the
      footprint).
    default: masked
    options:
      masked:
        label: "Masked (paper fiducial)"
        description: |
          `_masked` suffix on the covariance directory; the
          standard footprint power spectrum or the star-halo
          variant is supplied via `c_footprint_file`. Standard
          footprint for v1.4.5 / v1.4.6.3 / v1.4.11.3;
          star-halo for v1.4.8.
      unmasked:
        label: "Unmasked"
        description: |
          No mask path; CosmoCov assumes a contiguous area of
          `area` deg². Used for diagnostic comparisons only.

  block_pairs:
    label: "Shear-shear block pairs computed by CosmoCov"
    tags: [covariance, structure]
    rationale: |
      CosmoCov computes the shear-shear covariance as three
      independent block pairs: ++ (ξ_+ auto), -- (ξ_- auto),
      and +- (ξ_+ × ξ_- cross). All three are required for the
      paper PTEs because the joint ξ_tot^B test concatenates ξ_+
      and ξ_- and weights against the full block matrix; pure
      E/B and COSEBI mode integration also samples the
      cross-block under the integral kernels. Computing fewer
      blocks is therefore not a viable production option; the
      decision is exposed for documentation rather than choice.
    default: all_three
    options:
      all_three:
        label: "All three: ++, --, +-"
        description: |
          `BLOCK_PAIRS = [("++", "1"), ("--", "2"),
          ("+-", "3")]` in the source Snakefile. Concatenated
          by `rule covariance_cat` into one text matrix.
      auto_only:
        label: "Auto blocks only (++, --)"
        description: |
          Sufficient for separate ξ_+^B and ξ_-^B PTEs;
          insufficient for the joint ξ_tot^B test the paper
          reports.
        excluded: true
        excluded_reason: |
          Joint ξ_tot^B requires the cross-block; the paper
          reports the joint PTE.

  glass_validation_strategy:
    label: "GLASS mock-validation use"
    tags: [covariance, validation]
    rationale: |
      The 350 GLASS lognormal mocks are matched to v1.4.6
      catalog properties under the
      [Planck-18 fiducial](#../decisions.fiducial_cosmology) and
      contain no PSF systematics by construction. They serve a
      different role than the CosmoCov covariance: they
      validate that the
      [estimator pipeline as a whole](#../analyses.null_tests)
      recovers B-modes consistent with zero on a noise-only
      input. The paper's quantitative validation claim is that
      COSEBI mean B_n over a 100-realisation subset is biased
      by less than 0.3σ per mode, while the mock scatter is
      comparable to the adopted fiducial error bars. The mocks
      also validate the diagonal of the analytic covariance
      against an independent sample. They are not a production
      covariance source — Hartlap bias on a 350-realisation
      sample inverse at data-vector dimension ≤ 40 would inflate
      the reported PTEs more than the missing non-Gaussian terms
      suppress them.
    default: validation_only
    options:
      validation_only:
        label: "Validation comparator (paper fiducial)"
        description: |
          Sample covariance compared diagonally against
          CosmoCov; ensemble-mean B-modes compared against
          zero. CosmoCov drives the paper PTEs.
      sample_covariance_production:
        label: "GLASS sample covariance as production"
        excluded: true
        excluded_reason: |
          Insufficient realisations for a production inverse
          covariance; would introduce Hartlap inflation
          exceeding the missing non-Gaussian effect.
