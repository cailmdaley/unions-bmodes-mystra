version: "0.0.14"
name: "Semi-analytical covariances"

inputs:
  - id: selected_config
    from: ../catalog.selected_config
  - id: mask_power_spectrum
    from: ../catalog.mask_power_spectrum

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

  # The fiducial catalog's n(z), read by the fiducial chain's CosmoCov runs.
  - id: redshift_distribution
    from: ../catalog.redshift_distribution

  - id: pseudo_cl_cov_script
    from: ../pseudo_cl_cov_script

  - id: cosmocov_binary
    from: ../cosmocov_binary

  - id: cosmocov_libgsl
    from: ../cosmocov_libgsl
    # The recipes pass the binary and library explicitly (`--cosmocov`,
    # `--libgsl`) so the declared inputs are what the chain runs. CosmoCov reads
    # area / n_eff / sigma_e from cat_config.yaml, not from a catalog output.

  - id: redshift_distributions
    from: ../redshift_distributions
    # The raw n(z) tree. lc binds only declared inputs, and both
    # `generate_pseudo_cl_cov.py` (via cat_config's `redshift_path`) and
    # `generate_cosmocov_ini.py` (which writes an n(z) path under
    # `/n17data/sguerrini/UNIONS/WL/nz/` into the `.ini`) read files inside it.

outputs:
  - id: cosmology_snapshot
    type: data
    description: |
      The Planck 2018 fiducial cosmology
      (`sp_validation.cosmology.PLANCK18`: Ω_m, σ_8, n_s, Ω_b, h,
      w_0, w_a, plus derived Ω_v) as JSON, used to write every
      CosmoCov `.ini`.
    format: json
    decisions: [fiducial_cosmology]
    recipe:
      # Dump the PLANCK18 snapshot (+ derived Omega_v) straight to {output}.
      # Source of truth remains sp_validation.cosmology.PLANCK18.
      command: >
        python -c "import json; from sp_validation.cosmology import PLANCK18; d = dict(PLANCK18); d['Omega_v'] = 1 - PLANCK18['Omega_m']; json.dump(d, open('{output}', 'w'), indent=2)"

  - id: cov_reporting_g
    type: data
    description: |
      Reporting-grid 20-bin Gaussian-only CosmoCov covariance for
      the [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with area-only geometry:
      the Gaussian part of the [Gaussian + non-Gaussian diagnostic](#outputs.cov_reporting_ng).
      The nside-4096 spectrum is too short for CosmoCov's Gaussian
      pair-count correction, so no unused spectrum is passed here.
      Together they give the non-Gaussian share of the ξ_±
      diagonal variance quoted in the paper.
    decisions: [fiducial_catalog, fiducial_blind, covariance_engine, reporting_binning]
    inputs: [selected_config, cosmology_snapshot, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Compute just G: the NG diagnostic does not change this extract.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian g
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --nz {inputs.redshift_distribution}
        --emit processed_g --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_ng
    type: data
    description: |
      Reporting-grid 20-bin full Gaussian + non-Gaussian
      CosmoCov covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), including
      connected-trispectrum and super-sample-covariance terms.
      [Mask application](#decisions.mask_application) selects the SSC window
      (footprint spectrum or circular-area approximation); G remains area-only.
      It sets the non-Gaussian share of the diagonal variance
      quoted in the paper but does not enter the PTEs, which use
      the [selected integration covariance](#decisions.covariance_class).
    decisions: [fiducial_catalog, fiducial_blind, mask_application, covariance_engine, reporting_binning]
    inputs: [selected_config, cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Primary reporting-grid CosmoCov run (20 bins, ng=1, masked). Emits the
      # processed G+NG matrix as this output's single file; the concatenated
      # blocks, the Gaussian extract and the QA plot are separate outputs
      # (cov_blocks / cov_reporting_g / cov_processed_qa), each selecting its
      # product from the same chain via --emit.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --mask-application {decisions.mask_application}
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_integration
    type: data
    description: |
      Integration-grid 1000-bin CosmoCov covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), on 0.5–300 arcmin.
      The [covariance class](#decisions.covariance_class) is Gaussian-only
      on this grid, with area-only geometry.
      COSEBI covariances derive from it by a linear transform;
      pure-mode covariances use a linear transform or
      [MC realisations](#../decisions.mc_samples).
    decisions: [fiducial_catalog, fiducial_blind, covariance_class, covariance_engine, integration_grid]
    inputs: [selected_config, cosmology_snapshot, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Full CosmoCov chain (generate .ini from the cosmology snapshot +
      # cat_config cov_th -> 3 blocks ++/--/+- -> cat -> cosmocov_process).
      # The Gaussian-only class reaches the integration covariance
      # that pure_eb and COSEBI propagation consume.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 0.5 --max-sep 300.0 --nbins 1000
        --gaussian {decisions.covariance_class}
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cl_cov_reporting
    type: data
    description: |
      Gaussian (NaMaster iNKA) covariance of the pseudo-Cℓ
      bandpowers for the fiducial catalog at blind A, on the
      32-bandpower √ℓ-spaced grid of
      [cl_bb's data vector](#../analyses.cl_bb) — the covariance
      Paper IV uses for its BB / EB null tests.
    decisions: [fiducial_catalog, fiducial_blind, bandpower_binning, noise_bias_correction]
    inputs: [selected_config, shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # generate_pseudo_cl_cov.py CLI: NaMaster iNKA Gaussian bandpower
      # covariance matching the reporting data-vector binning (powspace,
      # nbins=32), written to {output}. cosmo defaults to Planck18
      # (byte-identical to the cosmology snapshot).
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "16GB" }

  - id: cl_cov_fine
    type: data
    description: |
      As [cl_cov_reporting](#outputs.cl_cov_reporting), on the 96-bin
      √ℓ-spaced fine grid of
      [cl_bb.cl_bandpowers_fine](#../cl_bb.outputs.cl_bandpowers_fine),
      for the harmonic-space COSEBI transform. The other three
      leak-corrected catalogs' counterparts come from the
      [cl_scan sweep](#../cl_bb.analyses.cl_scan).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, noise_bias_correction]
    inputs: [selected_config, shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # Same generate_pseudo_cl_cov.py CLI as cl_cov_reporting, 96-bin fine
      # grid. Distinct {output} file, so no cache collision with the 32-bin run.
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins {decisions.harmonic_validation_binning} --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cov_sweep
    # Re-export of the generated cov_scan sweep's gather output — the only edge
    # into the sweep. The bundle uses the per-version
    # `covariance_{ver}_A_integration/` subdirectory layout that every
    # `--cov-dir` consumer reads. Regenerate with
    #   scripts/sweep_expand.py -o analyses/covariance/analyses/cov_scan/astra.yaml \
    #       analyses/covariance/analyses/cov_scan/cov_scan.sweep.yaml
    from: cov_scan.cov_sweep_bundle

decisions:
  integration_grid:
    from: ../integration_grid
  reporting_binning:
    from: ../reporting_binning
  noise_bias_correction:
    from: ../noise_bias_correction
  bandpower_binning:
    from: ../bandpower_binning
  fiducial_cosmology:
    from: ../fiducial_cosmology
  leakage_correction:
    from: ../leakage_correction

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  harmonic_validation_binning:
    from: ../harmonic_validation_binning

  covariance_engine:
    label: "Semi-analytical covariance engine"
    tags: [covariance_model]
    rationale: |
      Each B-mode statistic starts from the covariance
      prescription of its companion cosmology paper. For ξ_±
      (and the pure-mode and COSEBI statistics derived from it)
      that is `CosmoCov` (Krause & Eifler 2017; Fang, Eifler &
      Krause 2020), Paper III's analytic code, whose 2D-FFTLog
      transforms give numerically stable real-space covariances
      without simulations. For Cℓ^BB and Cℓ^EB it is NaMaster's
      iNKA Gaussian covariance, as in Paper IV's B-mode null
      tests. The GLASS mocks validate both rather than replace
      them. CosmoCov computes the shear-shear covariance as three
      blocks, ++ (ξ_+ auto), -- (ξ_- auto) and +- (cross), all
      required: the joint ξ_tot^B test needs the cross-block, and
      the pure-mode and COSEBI transforms mix ξ_+ and ξ_-.
    default: cosmocov
    options:
      cosmocov:
        label: "CosmoCov (fiducial; configuration-space)"
        insights: [fang20_2dfftlog_stable_real_space_covariance]
        description: |
          Analytic configuration-space covariance code of Krause
          & Eifler 2017.
      namaster_inka:
        label: "NaMaster iNKA (fiducial; harmonic-space)"
        excluded: true
        excluded_reason: "iNKA supplies the harmonic covariance, not an alternative implementation of the configuration-space CosmoCov covariance."
        description: |
          NaMaster's improved Narrow Kernel Approximation
          Gaussian bandpower covariance, which Paper IV validates
          against Gaussian simulations (their Appendix C).
      mock_sample_covariance:
        label: "GLASS sample covariance"
        description: |
          Sample covariance across the 350 GLASS mock
          realisations.
        excluded: true
        excluded_reason: |
          The mocks validate the analytic covariances; a
          350-realisation sample covariance is too noisy to
          invert for the PTEs without correction.

  covariance_class:
    label: "Gaussian vs Gaussian + non-Gaussian covariance"
    tags: [covariance_model]
    rationale: |
      The fiducial B-mode null tests use only the Gaussian part of the
      covariance. In configuration space this keeps the
      calculation tractable on the 1000-bin integration grid;
      in harmonic space Paper IV likewise adds non-Gaussian
      terms only for its EE cosmology analysis. Omitting the
      connected-trispectrum and super-sample terms
      underestimates the variances (by about 11% of the ξ_±
      diagonal within the fiducial cuts), so the null tests are
      conservative: a test that passes with the Gaussian-only
      covariance would generally pass with a more complete one,
      as the GLASS mocks confirm.
      The non-Gaussian contribution is quantified only on the reporting grid.
    default: gaussian_only
    options:
      gaussian_only:
        label: "Gaussian only (fiducial for null tests)"
        description: |
          Gaussian CosmoCov terms on both grids; NaMaster iNKA
          is Gaussian by construction.
      gaussian_plus_ng:
        label: "Gaussian + non-Gaussian"
        excluded: true
        excluded_reason: "Non-Gaussian terms are intractable on the 1000-bin integration grid; their size is quantified on the reporting grid by cov_reporting_ng."
        description: |
          CosmoCov's connected-trispectrum and super-sample terms,
          evaluated in the fixed 20-bin diagnostic only.
          The harmonic-space iNKA covariance remains Gaussian.

  mask_application:
    label: "Footprint window in non-Gaussian covariance"
    tags: [covariance_model]
    rationale: |
      The spectrum affects only the super-sample covariance (SSC) here:
      CosmoCov's survey_variance() sums its first 1000 multipoles after
      normalizing by C_0, with no minimum-length requirement.
      This decision governs only [the reporting G+NG diagnostic](#outputs.cov_reporting_ng).
      Non-Gaussian integration/version covariances are excluded as intractable.
      Without the spectrum, SSC uses CosmoCov's circular-area window.
      By contrast, Gaussian w_mask() requires 21,600 rows at 1 arcmin or
      43,200 at 0.5 arcmin; these nside-4096 spectra have only 12,288.
      All Gaussian covariances, including the fixed baseline mock reference,
      are therefore area-only, and no mask path is passed to Gaussian-only runs.
      Repairing the Gaussian boundary correction is post-paper work.
      These are data-side SSC alternatives against that fixed mock reference.
    default: masked
    options:
      masked:
        label: "Footprint SSC window (fiducial)"
        description: |
          The fiducial v1.4.6.3 footprint spectrum in the reporting diagnostic.
          Gaussian terms remain area-only.
      unmasked:
        label: "Circular-area SSC window"
        description: |
          CosmoCov's analytic circular-area SSC window, with no footprint file.
          Gaussian terms remain area-only.

analyses:

  cov_scan:
    path: ./analyses/cov_scan

prior_insights:

  fang20_2dfftlog_stable_real_space_covariance:
    id: fang20_2dfftlog_stable_real_space_covariance
    claim: |
      Analytic covariances are much faster and less noisy than
      estimates from data or simulations; the 2D-FFTLog algorithm
      released with CosmoCov makes the Bessel-integral transform to
      real space numerically stable and produces angular
      bin-averaged covariances accurate enough for cosmological
      inference.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/staa1726"
        quote:
          exact: "Among various approaches to obtaining the covariance, analytic computation is much faster and less noisy than estimation from data or simulations."
        location:
          page: 1
      - id: ev2
        doi: "10.1093/mnras/staa1726"
        quote:
          exact: "our algorithm can produce numerically stable angular bin-averaged covariances with the flat sky approximation, which are sufficiently accurate for inferring cosmological parameters."
        location:
          page: 1
    scope: |
      Fang, Eifler & Krause 2020, MNRAS 497, 2699; validated for
      DES-Y3- and LSST-Y1-like surveys.
