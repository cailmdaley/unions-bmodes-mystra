version: "0.0.14"
name: "Semi-analytical covariance and GLASS mock validation"

inputs:
  - id: mask_power_spectrum
    from: ../catalog.mask_power_spectrum

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

  # The fiducial catalog's n(z), read by the fiducial chain's CosmoCov runs.
  - id: redshift_distribution
    from: ../catalog.redshift_distribution

  - id: pseudo_cl_cov_script
    from: ../pseudo_cl_cov_script

  - id: cosmocov_binary
    from: ../cosmocov_binary

  - id: cosmocov_libgsl
    from: ../cosmocov_libgsl
    # The CosmoCov executable. `run_cosmocov_chain.sh` carries the path as a
    # shell default, which put it outside lc's view; the recipes below now pass
    # it as `--cosmocov {inputs.cosmocov_binary}` so the declaration is what
    # the chain actually runs.

  # survey_properties was removed: CosmoCov resolves area/n_eff/sigma_e
  # directly from cat_config.yaml rather than from that catalog output — no
  # recipe here ever referenced it.

  - id: redshift_distributions
    from: ../redshift_distributions
    # The catalog unit's `redshift_distribution` output was likewise dropped
    # from here, on the reasoning that the n(z) path resolves from
    # cat_config.yaml and no recipe spells `{inputs...}` for it. That reasoning
    # covered the recipe text but not the sandbox: lc binds only *declared*
    # inputs, so `generate_pseudo_cl_cov.py` — which follows
    # cat_config's `redshift_path` at runtime — hit FileNotFoundError on a file
    # plainly present on the host. This alias is what makes the read legal: the
    # family source's literal prefix (`/n17data/sguerrini/UNIONS/WL/nz`) is
    # bound, and the config-resolved path underneath it resolves. The root
    # family, not the catalog output, because the config names the raw tree.
    # The CosmoCov chain needs it too, by a second route:
    # `generate_cosmocov_ini.py` builds its own
    # `/n17data/sguerrini/UNIONS/WL/nz/...` path from the version string and
    # writes it into the `.ini` the binary then reads.

  - id: glass_mock_realisations
    from: ../glass_mock_realisations
    # Provenance handle only. The declared source spells the whole family
    # (`{xi,cl}_..._{seed:05d}_...{fits,npy}`), so it is not a path a recipe can
    # compose names inside — `{inputs.glass_mock_realisations}/xi_*.fits`
    # renders the pattern verbatim and the shell then brace-expands it into
    # nonsense. The two globs the stacking script actually opens are declared
    # below as their own inputs.

  - id: glass_mock_xi
    type: data
    description: |
      The ξ_± member of the
      [GLASS mock family](#../inputs.glass_mock_realisations): one
      20-bin TreeCorr FITS data vector per realisation, on the
      4096-patch reporting grid. Declared as its own input, with
      the glob spelled here, so that `{inputs.glass_mock_xi}` is a
      pattern the shell expands to the 350 real files and lc binds
      the containing directory.
    source: "/n09data/guerrini/glass_mock_v1.4.6/results/xi_glass_mock_*_4096_nbins=20.fits"

  - id: glass_mock_cl
    type: data
    description: |
      The pseudo-Cℓ member of the
      [GLASS mock family](#../inputs.glass_mock_realisations): one
      npy block (EE/BB among its rows) per realisation. Companion
      to [glass_mock_xi](#inputs.glass_mock_xi), declared the same
      way and for the same reason.
    source: "/n09data/guerrini/glass_mock_v1.4.6/results/cl_glass_mock_*_4096.npy"

  - id: footprint_mask_starhalo
    type: data
    description: |
      Star-halo-masked 2517 deg² footprint mask power spectrum
      (HEALPix nside=4096, apodised and normalised) — the v1.4.8
      counterpart of the standard footprint carried by
      [footprint_masks](#../inputs.footprint_masks). Declared as
      its own file input so that the
      [cov_scan sweep](#analyses.cov_scan), which selects a mask
      per catalog version, receives both footprints as lc-declared
      paths rather than a directory to compose names inside; the
      v1.4.8 members take this one, every other member the
      standard footprint.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask/mask_cls_footprint_starhalo_nside_4096_norm.txt"

outputs:
  - id: cosmology_snapshot
    type: data
    description: |
      Frozen JSON dump of `sp_validation.cosmology.PLANCK18`
      (Ω_m, σ_8, n_s, Ω_b, h, w_0, w_a, plus derived Ω_v) used
      to seed every CosmoCov `.ini`. Materialised by the
      `cosmology_params` rule so that the snakemake parse-time
      DAG does not import sp_validation; one snapshot per run.
    format: json
    recipe:
      # Dump the PLANCK18 snapshot (+ derived Omega_v) straight to {output}.
      # Source of truth remains sp_validation.cosmology.PLANCK18.
      command: >
        python -c "import json; from sp_validation.cosmology import PLANCK18; d = dict(PLANCK18); d['Omega_v'] = 1 - PLANCK18['Omega_m']; json.dump(d, open('{output}', 'w'), indent=2)"

  - id: cov_blocks
    type: data
    description: |
      Concatenated CosmoCov covariance matrix assembled from the
      three shear-shear block pairs (`++`, `--`, `+-`) per
      `(version, blind, gaussian, grid, mask)` tuple. The three
      blocks are each computed independently by
      `rule covariance_cosmocov` (one Slurm task per block,
      running the CosmoCov C++ binary), then joined by
      `rule covariance_cat` into the single matrix consumed
      downstream. Block runtimes range from minutes on the
      reporting grid to hours on the integration grid.
    decisions: [fiducial_catalog, fiducial_blind, covariance_class]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Same reporting-grid CosmoCov chain as cov_reporting_ng, emitting the
      # concatenated raw blocks (++/--/+-) — one file, written to {output}.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit blocks --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_g
    type: data
    description: |
      Reporting-grid 20-bin Gaussian-only CosmoCov covariance for
      the [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the standard
      footprint mask applied. Used as the Gaussian seed for
      reporting-grid Monte-Carlo cross-checks and as the
      Gaussian-only diagonal extracted by `cosmocov_process.py`.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Same reporting-grid CosmoCov chain, emitting the Gaussian-only extract
      # (cosmocov_process's `_g` matrix) as this output's single file.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed_g --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_ng
    type: data
    description: |
      Reporting-grid 20-bin full Gaussian + non-Gaussian
      CosmoCov covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), masked. Includes
      connected-trispectrum and super-sample-covariance terms
      via CosmoCov's `cng = 1`. Reported in covariance
      diagnostics; the null-test PTEs use the
      [Gaussian-only flavour](#decisions.covariance_class)
      throughout, so this matrix is materialised for
      cross-checking variance ratios but does not enter the
      headline PTEs.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Primary reporting-grid CosmoCov run (20 bins, ng=1, masked). Emits the
      # processed G+NG matrix as this output's single file; the concatenated
      # blocks, the Gaussian extract and the QA plot are separate outputs
      # (cov_blocks / cov_reporting_g / cov_processed_qa), each selecting its
      # product from the same chain via --emit.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_integration_g
    type: data
    description: |
      Integration-grid 1000-bin Gaussian-only CosmoCov
      covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the
      standard footprint mask applied. This is the Gaussian
      draw source for the
      [2000 MC realisations](#../decisions.mc_samples) that
      propagate through the pure-mode and COSEBI filters; it is
      also the closed-form covariance the COSEBI linear
      transform uses. Non-Gaussian terms are not computed at
      this binning — the
      [Gaussian-only choice](#decisions.covariance_class) is
      forced by tractability on the 1000-bin integration grid.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Full CosmoCov chain (generate .ini from the cosmology snapshot +
      # cat_config cov_th -> 3 blocks ++/--/+- -> cat -> cosmocov_process).
      # Integration grid, Gaussian-only (ng=0), masked. Emits the processed
      # G matrix that pure_eb + cosebis MC-propagation consume.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian g
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_processed_qa
    type: figure
    description: |
      Per-`(version, blind, gaussian, grid, mask)` covariance
      structure plot generated by `cosmocov_process.py` showing
      the diagonal variance, off-diagonal correlation
      structure, and condition number diagnostics. Used in the
      covariance review notebooks; not a reported result.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: png
    recipe:
      # Same reporting-grid CosmoCov chain, emitting cosmocov_process's
      # correlation-structure QA figure (PNG, per the project figure convention)
      # as this output's single file.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit plot --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_glass_xi_reporting
    type: data
    description: |
      Sample covariance of ξ_± across the 350 GLASS mock
      realisations on the reporting grid (20 bins, 4096
      patches). Materialised once for v1.4.6 catalog
      properties (the geometry of v1.4.6.3 is identical at this
      level). Compared diagonally against
      [cov_reporting_ng](#outputs.cov_reporting_ng) for
      validation; not used as a production covariance source.
    decisions: [fiducial_catalog, glass_validation_strategy]
    inputs: [glass_mock_realisations, glass_mock_xi, glass_mock_cl]
    format: npy
    recipe:
      # compute_glass_mock_covariance.py stacks the 350 pre-computed mock data
      # vectors (xi_+/xi_- 20-bin + pseudo-Cl EE/BB) and writes the xi-only
      # sample covariance to {output}. Sub-second np.cov over 350x40 vectors;
      # the cost is loading 700 FITS/npy files. Globs expand in the shell.
      command: >
        python src/workflow/scripts/compute_glass_mock_covariance.py
        --xi-files {inputs.glass_mock_xi}
        --cl-files {inputs.glass_mock_cl}
        --xi-covariance {output}
      resources: { cpus: 4, memory: "8GB" }

  - id: cov_glass_cl_reporting
    type: data
    description: |
      Sample covariance of NaMaster pseudo-Cℓ across the 350
      GLASS mock realisations on the harmonic reporting grid
      (32 √ℓ-linear bandpowers). Validation companion to
      [cov_glass_xi_reporting](#outputs.cov_glass_xi_reporting);
      compared against the
      [pseudo-Cℓ bandpower covariance](#outputs.cl_cov_reporting)
      for reporting-grid agreement.
    decisions: [fiducial_catalog, glass_validation_strategy]
    inputs: [glass_mock_realisations, glass_mock_xi, glass_mock_cl]
    format: npy
    recipe:
      # Same stacking script as cov_glass_xi_reporting, selecting the pseudo-Cl
      # sample covariance as this output's single file (the stack is cheap; the
      # cost is the 700-file load, duplicated rather than projected from a
      # sibling output's directory).
      command: >
        python src/workflow/scripts/compute_glass_mock_covariance.py
        --xi-files {inputs.glass_mock_xi}
        --cl-files {inputs.glass_mock_cl}
        --cl-covariance {output}
      resources: { cpus: 4, memory: "8GB" }

  - id: cl_cov_reporting
    type: data
    description: |
      NaMaster pseudo-Cℓ bandpower covariance for the fiducial
      catalog at blind A on the harmonic reporting grid (32
      √ℓ-linear bandpowers). Produced inline with
      [cl_bb's pseudo-Cℓ data vector](#../analyses.cl_bb) by
      the `pseudo_cl_cov` rule under NaMaster's iNKA Gaussian
      framework (matching Paper IV's BB / EB covariance
      choice). Materialised here rather than in cl_bb so that
      it is co-located with the configuration-space CosmoCov
      runs as a single covariance package.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # generate_pseudo_cl_cov.py CLI: NaMaster iNKA Gaussian bandpower
      # covariance matching the reporting data-vector binning (powspace,
      # nbins=32), written to {output}. cosmo defaults to Planck18
      # (byte-identical to the cosmology snapshot).
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "16GB" }

  - id: cl_cov_fine
    type: data
    description: |
      Fiducial-catalog twin of
      [cl_cov_reporting](#outputs.cl_cov_reporting) on the 96-bin
      √ℓ-linear fine grid, matching
      [cl_bb.cl_bandpowers_fine](#../cl_bb.outputs.cl_bandpowers_fine).
      Required by the harmonic COSEBI cross-check: the compute pass
      of `harmonic_config_cosebis_comparison.py` needs both the
      96-bin bandpowers and their covariance, and the July run read
      the covariance from the canonical CosmoStat tree rather than
      reproducing it. Its per-version counterparts for the three
      non-fiducial leak-corrected catalogs come from the
      [cl_scan sweep](#../cl_bb.analyses.cl_scan).
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # Same generate_pseudo_cl_cov.py CLI as cl_cov_reporting, 96-bin fine
      # grid. Distinct {output} file, so no cache collision with the 32-bin run.
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 96 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cov_sweep
    # Re-export of the generated cov_scan sweep's gather output — the only edge
    # into the sweep. The bundle keeps the July-canonical per-version
    # `covariance_{ver}_A_g_..._masked/` subdirectory layout, so every
    # `--cov-dir` consumer is unchanged. Regenerate with
    #   scripts/sweep_expand.py -o analyses/covariance/analyses/cov_scan/astra.yaml \
    #       analyses/covariance/analyses/cov_scan/cov_scan.sweep.yaml
    from: cov_scan.cov_sweep_bundle

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  covariance_engine:
    label: "Semi-analytical covariance engine"
    tags: [covariance, method]
    rationale: |
      `CosmoCov` (Krause & Eifler 2017; Fang, Eifler & Krause
      2020) is the configuration-space covariance code adopted
      by Paper III for cosmological inference; the same engine is
      reused here for parity. CosmoCov computes
      shear-shear correlation-function covariances analytically
      with optional connected-trispectrum and super-sample
      terms, requires no simulations as a primary covariance
      source, and uses 2D-FFTLog (`fang.eifler.krause20`) for
      numerically stable real-space transforms on
      arcmin-scale grids. The harmonic-space pseudo-Cℓ
      covariance uses NaMaster's iNKA framework instead — this
      sub-analysis exposes both engines because the analysis
      ingests CosmoCov for ξ_± and iNKA for Cℓ_BB, matching
      Paper III and Paper IV respectively.
    default: cosmocov
    options:
      cosmocov:
        label: "CosmoCov (fiducial; configuration-space)"
        insights: [fang20_2dfftlog_stable_real_space_covariance]
        description: |
          Krause & Eifler 2017 covariance code; runs as a C++
          binary launched per `(block, .ini)` tuple from the
          `covariance_cosmocov` rule.
      namaster_inka:
        label: "NaMaster iNKA (fiducial; harmonic-space)"
        description: |
          NaMaster's improved Narrow Kernel Approximation
          Gaussian covariance; computed inline with the
          `pseudo_cl_cov` rule. Used for the BB and EB
          bandpower covariances directly. Paper IV validates it
          against 10,000 Gaussian sims (their Appendix C).
      mock_sample_covariance:
        label: "GLASS sample covariance"
        description: |
          Empirical sample covariance from the 350 GLASS mock
          realisations. Used as a validation reference, not a
          production covariance source.
        excluded: true
        excluded_reason: |
          350 mocks at data-vector dimension up to 40 leave
          enough Hartlap bias and noise on the inverse that
          the reported PTEs would be inflated; CosmoCov is
          unbiased at the price of a fixed cosmology
          assumption.

  covariance_class:
    label: "Gaussian vs Gaussian + non-Gaussian covariance"
    tags: [covariance, statistics, primary]
    rationale: |
      All B-mode null-test PTEs use Gaussian-only
      covariance: in configuration space because the
      non-Gaussian (cng) terms are intractable on the 1000-bin
      integration grid required for pure-mode and COSEBI
      filter integration, and in harmonic space because Paper
      IV's iNKA covariance for the BB and EB spectra is
      Gaussian by construction (non-Gaussian terms enter only
      Paper IV's EE cosmological likelihood, not the BB/EB
      null tests). The non-Gaussian connected-trispectrum and
      super-sample terms are positive-definite contributions
      to the variance, so their omission underestimates the
      true variance and the reported PTEs are conservative —
      a null test that passes with Gaussian-only covariance
      would generally pass with the full covariance.
    default: gaussian_only
    options:
      gaussian_only:
        label: "Gaussian only (fiducial for null tests)"
        description: |
          `ng = 0` and `cng = 0` in the CosmoCov `.ini`.
          Materialised at both reporting and integration grids.
          NaMaster iNKA covariance is Gaussian by default; no
          flag toggle.
      gaussian_plus_ng:
        label: "Gaussian + non-Gaussian"
        description: |
          `ng = 1` and `cng = 1` in the CosmoCov `.ini`;
          computed at reporting grid only. Used for variance
          ratio diagnostics in covariance review; not in
          the reported PTEs.

  mask_application:
    label: "Footprint mask in covariance"
    tags: [covariance, geometry]
    rationale: |
      CosmoCov can either ignore the survey footprint
      (`c_footprint_file = ""` in the `.ini`) or include it via
      a precomputed mask power spectrum. The fiducial
      runs use the
      [standard 2894 deg² or star-halo 2517 deg² mask
      power spectrum](#inputs.mask_power_spectrum) appropriate
      to the catalog version; the unmasked variant is retained
      to expose the geometry contribution to the covariance
      diagonal as a sanity check (the masked / unmasked
      variance ratio is a fixed-cosmology fingerprint of the
      footprint).
    default: masked
    options:
      masked:
        label: "Masked (fiducial)"
        description: |
          `_masked` suffix on the covariance directory; the
          standard footprint power spectrum or the star-halo
          variant is supplied via `c_footprint_file`. Standard
          footprint for v1.4.5 / v1.4.6.3 / v1.4.11.3;
          star-halo for v1.4.8.
      unmasked:
        label: "Unmasked"
        description: |
          No mask path; CosmoCov assumes a contiguous area of
          `area` deg². Used for diagnostic comparisons only.

  block_pairs:
    label: "Shear-shear block pairs computed by CosmoCov"
    tags: [covariance, structure]
    rationale: |
      CosmoCov computes the shear-shear covariance as three
      independent block pairs: ++ (ξ_+ auto), -- (ξ_- auto),
      and +- (ξ_+ × ξ_- cross). All three are required for the
      reported PTEs because the joint ξ_tot^B test concatenates ξ_+
      and ξ_- and weights against the full block matrix; pure
      E/B and COSEBI mode integration also samples the
      cross-block under the integral kernels. Computing fewer
      blocks is therefore not a viable production option; the
      decision is exposed for documentation rather than choice.
    default: all_three
    options:
      all_three:
        label: "All three: ++, --, +-"
        description: |
          `BLOCK_PAIRS = [("++", "1"), ("--", "2"),
          ("+-", "3")]` in the source Snakefile. Concatenated
          by `rule covariance_cat` into one text matrix.
      auto_only:
        label: "Auto blocks only (++, --)"
        description: |
          Sufficient for separate ξ_+^B and ξ_-^B PTEs;
          insufficient for the reported joint ξ_tot^B
          test.
        excluded: true
        excluded_reason: |
          Joint ξ_tot^B requires the cross-block; the joint PTE
          is reported.

  glass_validation_strategy:
    label: "GLASS mock-validation use"
    tags: [covariance, validation]
    rationale: |
      The 350 GLASS lognormal mocks are matched to v1.4.6
      catalog properties under the
      [Planck-18 fiducial](#../decisions.fiducial_cosmology) and
      contain no PSF systematics by construction. They serve a
      different role than the CosmoCov covariance: they
      validate that the
      [estimator pipeline as a whole](#../analyses.null_tests)
      recovers B-modes consistent with zero on a noise-only
      input. The quantitative validation claim is that
      COSEBI mean B_n over a 100-realisation subset is biased
      by less than 0.3σ per mode, while the mock scatter is
      comparable to the adopted fiducial error bars. The mocks
      also validate the diagonal of the analytic covariance
      against an independent sample. They are not a production
      covariance source — Hartlap bias on a 350-realisation
      sample inverse at data-vector dimension ≤ 40 would inflate
      the reported PTEs more than the missing non-Gaussian terms
      suppress them.
    default: validation_only
    options:
      validation_only:
        label: "Validation comparator (fiducial)"
        description: |
          Sample covariance compared diagonally against
          CosmoCov; ensemble-mean B-modes compared against
          zero. CosmoCov drives the reported PTEs.
      sample_covariance_production:
        label: "GLASS sample covariance as production"
        excluded: true
        excluded_reason: |
          Insufficient realisations for a production inverse
          covariance; would introduce Hartlap inflation
          exceeding the missing non-Gaussian effect.

