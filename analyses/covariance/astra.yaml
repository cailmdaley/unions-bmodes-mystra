version: "0.0.14"
name: "Semi-analytical covariance and GLASS mock validation"

inputs:
  - id: mask_power_spectrum
    from: ../catalog.mask_power_spectrum

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

  # The fiducial catalog's n(z), read by the fiducial chain's CosmoCov runs.
  - id: redshift_distribution
    from: ../catalog.redshift_distribution

  - id: pseudo_cl_cov_script
    from: ../pseudo_cl_cov_script

  - id: cosmocov_binary
    from: ../cosmocov_binary

  - id: cosmocov_libgsl
    from: ../cosmocov_libgsl
    # The recipes pass the binary and library explicitly (`--cosmocov`,
    # `--libgsl`) so the declared inputs are what the chain runs. CosmoCov reads
    # area / n_eff / sigma_e from cat_config.yaml, not from a catalog output.

  - id: redshift_distributions
    from: ../redshift_distributions
    # The raw n(z) tree. lc binds only declared inputs, and both
    # `generate_pseudo_cl_cov.py` (via cat_config's `redshift_path`) and
    # `generate_cosmocov_ini.py` (which writes an n(z) path under
    # `/n17data/sguerrini/UNIONS/WL/nz/` into the `.ini`) read files inside it.

  - id: glass_mock_realisations
    from: ../glass_mock_realisations
    # Provenance handle only. The declared source spells the whole family
    # (`{xi,cl}_..._{seed:05d}_...{fits,npy}`), so it is not a path a recipe can
    # compose names inside — `{inputs.glass_mock_realisations}/xi_*.fits`
    # renders the pattern verbatim and the shell then brace-expands it into
    # nonsense. The two globs the stacking script actually opens are declared
    # below as their own inputs.

  - id: glass_mock_xi
    type: data
    description: |
      ξ_± measured on each of the 350 realisations of the earlier
      v1.4.6 [GLASS mock suite](#../inputs.glass_mock_realisations)
      (the suite [mock_suite](#../glass_mocks.decisions.mock_suite)
      excludes): one 20-bin TreeCorr FITS data vector per
      realisation.
    source: "/n09data/guerrini/glass_mock_v1.4.6/results/xi_glass_mock_*_4096_nbins=20.fits"

  - id: glass_mock_cl
    type: data
    description: |
      Pseudo-Cℓ (EE and BB among the rows) of each realisation of
      the same v1.4.6 GLASS suite as
      [glass_mock_xi](#inputs.glass_mock_xi), one npy file per
      realisation.
    source: "/n09data/guerrini/glass_mock_v1.4.6/results/cl_glass_mock_*_4096.npy"

  - id: footprint_mask_starhalo
    type: data
    description: |
      Star-halo-masked 2517 deg² footprint mask power spectrum
      (HEALPix nside=4096, apodised and normalised) for the masked
      v1.4.8 catalog — the counterpart of the standard footprint in
      [footprint_masks](#../inputs.footprint_masks). The
      [cov_scan sweep](#analyses.cov_scan) uses it for v1.4.8 and
      the standard footprint for every other version.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask/mask_cls_footprint_starhalo_nside_4096_norm.txt"

outputs:
  - id: cosmology_snapshot
    type: data
    description: |
      The Planck 2018 fiducial cosmology
      (`sp_validation.cosmology.PLANCK18`: Ω_m, σ_8, n_s, Ω_b, h,
      w_0, w_a, plus derived Ω_v) as JSON, used to write every
      CosmoCov `.ini`.
    format: json
    recipe:
      # Dump the PLANCK18 snapshot (+ derived Omega_v) straight to {output}.
      # Source of truth remains sp_validation.cosmology.PLANCK18.
      command: >
        python -c "import json; from sp_validation.cosmology import PLANCK18; d = dict(PLANCK18); d['Omega_v'] = 1 - PLANCK18['Omega_m']; json.dump(d, open('{output}', 'w'), indent=2)"

  - id: cov_blocks
    type: data
    description: |
      Raw CosmoCov output for the fiducial catalog on the 20-bin
      reporting grid: the three [shear-shear blocks](#decisions.block_pairs)
      (`++`, `--`, `+-`) concatenated into one text file, before
      processing into a covariance matrix.
    decisions: [fiducial_catalog, fiducial_blind, covariance_class]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Same reporting-grid CosmoCov chain as cov_reporting_ng, emitting the
      # concatenated raw blocks (++/--/+-) — one file, written to {output}.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit blocks --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_g
    type: data
    description: |
      Reporting-grid 20-bin Gaussian-only CosmoCov covariance for
      the [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the standard
      footprint mask applied: the Gaussian part of the
      [Gaussian + non-Gaussian run](#outputs.cov_reporting_ng).
      Together they give the non-Gaussian share of the ξ_±
      diagonal variance quoted in the paper.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Same reporting-grid CosmoCov chain, emitting the Gaussian-only extract
      # (cosmocov_process's `_g` matrix) as this output's single file.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed_g --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_reporting_ng
    type: data
    description: |
      Reporting-grid 20-bin full Gaussian + non-Gaussian
      CosmoCov covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), masked, including
      connected-trispectrum and super-sample-covariance terms.
      It sets the non-Gaussian share of the diagonal variance
      quoted in the paper but does not enter the PTEs, which use
      the [Gaussian-only covariance](#decisions.covariance_class).
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Primary reporting-grid CosmoCov run (20 bins, ng=1, masked). Emits the
      # processed G+NG matrix as this output's single file; the concatenated
      # blocks, the Gaussian extract and the QA plot are separate outputs
      # (cov_blocks / cov_reporting_g / cov_processed_qa), each selecting its
      # product from the same chain via --emit.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_integration_g
    type: data
    description: |
      Integration-grid 1000-bin Gaussian-only CosmoCov
      covariance for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      [blind A](#../decisions.fiducial_blind), with the
      standard footprint mask applied, on 0.5–300 arcmin. The
      pure-mode and COSEBI covariances derive from it, by the
      linear transform and through the
      [2000 MC realisations](#../decisions.mc_samples). Only the
      [Gaussian part](#decisions.covariance_class) is tractable
      on this grid.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: txt
    recipe:
      # Full CosmoCov chain (generate .ini from the cosmology snapshot +
      # cat_config cov_th -> 3 blocks ++/--/+- -> cat -> cosmocov_process).
      # Integration grid, Gaussian-only (ng=0), masked. Emits the processed
      # G matrix that pure_eb + cosebis MC-propagation consume.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 0.5 --max-sep 300.0 --nbins 1000 --gaussian g
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit processed --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_processed_qa
    type: figure
    description: |
      Diagnostic plot of the fiducial reporting-grid CosmoCov
      covariance: diagonal variance, off-diagonal correlation
      structure and condition number. Not a reported result.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [cosmology_snapshot, mask_power_spectrum, redshift_distribution, redshift_distributions, cosmocov_binary, cosmocov_libgsl]
    format: png
    recipe:
      # Same reporting-grid CosmoCov chain, emitting cosmocov_process's
      # correlation-structure QA figure (PNG, per the project figure convention)
      # as this output's single file.
      command: >
        bash src/workflow/scripts/run_cosmocov_chain.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind {decisions.fiducial_blind}
        --min-sep 1.0 --max-sep 250.0 --nbins 20 --gaussian ng
        --planck18-json {inputs.cosmology_snapshot}
        --cat-config src/cosmo_val/cat_config.yaml
        --cosmocov {inputs.cosmocov_binary}
        --libgsl {inputs.cosmocov_libgsl}
        --mask-cls {inputs.mask_power_spectrum}
        --nz {inputs.redshift_distribution}
        --emit plot --out-file {output}
      resources: { cpus: 4, memory: "16GB" }

  - id: cov_glass_xi_reporting
    type: data
    description: |
      Sample covariance of the 20-bin ξ_± data vector across the
      350 realisations of the v1.4.6 GLASS suite
      ([glass_mock_xi](#inputs.glass_mock_xi)), a validation
      comparator for
      [cov_reporting_ng](#outputs.cov_reporting_ng); not a
      covariance source for the PTEs.
    decisions: [fiducial_catalog, glass_validation_strategy]
    inputs: [glass_mock_realisations, glass_mock_xi, glass_mock_cl]
    format: npy
    recipe:
      # compute_glass_mock_covariance.py stacks the 350 pre-computed mock data
      # vectors (xi_+/xi_- 20-bin + pseudo-Cl EE/BB) and writes the xi-only
      # sample covariance to {output}. Sub-second np.cov over 350x40 vectors;
      # the cost is loading 700 FITS/npy files. Globs expand in the shell.
      command: >
        python src/workflow/scripts/compute_glass_mock_covariance.py
        --xi-files {inputs.glass_mock_xi}
        --cl-files {inputs.glass_mock_cl}
        --xi-covariance {output}
      resources: { cpus: 4, memory: "8GB" }

  - id: cov_glass_cl_reporting
    type: data
    description: |
      Sample covariance of the pseudo-Cℓ bandpowers across the
      same 350 mocks as
      [cov_glass_xi_reporting](#outputs.cov_glass_xi_reporting), a
      validation comparator for the
      [pseudo-Cℓ bandpower covariance](#outputs.cl_cov_reporting).
    decisions: [fiducial_catalog, glass_validation_strategy]
    inputs: [glass_mock_realisations, glass_mock_xi, glass_mock_cl]
    format: npy
    recipe:
      # Same stacking script as cov_glass_xi_reporting, selecting the pseudo-Cl
      # sample covariance as this output's single file (the stack is cheap; the
      # cost is the 700-file load, duplicated rather than projected from a
      # sibling output's directory).
      command: >
        python src/workflow/scripts/compute_glass_mock_covariance.py
        --xi-files {inputs.glass_mock_xi}
        --cl-files {inputs.glass_mock_cl}
        --cl-covariance {output}
      resources: { cpus: 4, memory: "8GB" }

  - id: cl_cov_reporting
    type: data
    description: |
      Gaussian (NaMaster iNKA) covariance of the pseudo-Cℓ
      bandpowers for the fiducial catalog at blind A, on the
      32-bandpower √ℓ-spaced grid of
      [cl_bb's data vector](#../analyses.cl_bb) — the covariance
      Paper IV uses for its BB / EB null tests.
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # generate_pseudo_cl_cov.py CLI: NaMaster iNKA Gaussian bandpower
      # covariance matching the reporting data-vector binning (powspace,
      # nbins=32), written to {output}. cosmo defaults to Planck18
      # (byte-identical to the cosmology snapshot).
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "16GB" }

  - id: cl_cov_fine
    type: data
    description: |
      As [cl_cov_reporting](#outputs.cl_cov_reporting), on the 96-bin
      √ℓ-spaced fine grid of
      [cl_bb.cl_bandpowers_fine](#../cl_bb.outputs.cl_bandpowers_fine),
      for the harmonic-space COSEBI transform. The other three
      leak-corrected catalogs' counterparts come from the
      [cl_scan sweep](#../cl_bb.analyses.cl_scan).
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, pseudo_cl_cov_script]
    format: fits
    recipe:
      # Same generate_pseudo_cl_cov.py CLI as cl_cov_reporting, 96-bin fine
      # grid. Distinct {output} file, so no cache collision with the 32-bin run.
      command: >
        python src/workflow/scripts/generate_pseudo_cl_cov.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 96 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cov_sweep
    # Re-export of the generated cov_scan sweep's gather output — the only edge
    # into the sweep. The bundle uses the per-version
    # `covariance_{ver}_A_g_..._masked/` subdirectory layout that every
    # `--cov-dir` consumer reads. Regenerate with
    #   scripts/sweep_expand.py -o analyses/covariance/analyses/cov_scan/astra.yaml \
    #       analyses/covariance/analyses/cov_scan/cov_scan.sweep.yaml
    from: cov_scan.cov_sweep_bundle

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  covariance_engine:
    label: "Semi-analytical covariance engine"
    tags: [covariance, method]
    rationale: |
      Each B-mode statistic starts from the covariance
      prescription of its companion cosmology paper. For ξ_±
      (and the pure-mode and COSEBI statistics derived from it)
      that is `CosmoCov` (Krause & Eifler 2017; Fang, Eifler &
      Krause 2020), Paper III's analytic code, whose 2D-FFTLog
      transforms give numerically stable real-space covariances
      without simulations. For Cℓ^BB and Cℓ^EB it is NaMaster's
      iNKA Gaussian covariance, as in Paper IV's B-mode null
      tests. The GLASS mocks validate both rather than replace
      them.
    default: cosmocov
    options:
      cosmocov:
        label: "CosmoCov (fiducial; configuration-space)"
        insights: [fang20_2dfftlog_stable_real_space_covariance]
        description: |
          Analytic configuration-space covariance code of Krause
          & Eifler 2017.
      namaster_inka:
        label: "NaMaster iNKA (fiducial; harmonic-space)"
        description: |
          NaMaster's improved Narrow Kernel Approximation
          Gaussian bandpower covariance, which Paper IV validates
          against Gaussian simulations (their Appendix C).
      mock_sample_covariance:
        label: "GLASS sample covariance"
        description: |
          Sample covariance across the 350 GLASS mock
          realisations.
        excluded: true
        excluded_reason: |
          The mocks validate the analytic covariances; a
          350-realisation sample covariance is too noisy to
          invert for the PTEs without correction.

  covariance_class:
    label: "Gaussian vs Gaussian + non-Gaussian covariance"
    tags: [covariance, statistics, primary]
    rationale: |
      All B-mode null tests use only the Gaussian part of the
      covariance. In configuration space this keeps the
      calculation tractable on the 1000-bin integration grid;
      in harmonic space Paper IV likewise adds non-Gaussian
      terms only for its EE cosmology analysis. Omitting the
      connected-trispectrum and super-sample terms
      underestimates the variances (by about 11% of the ξ_±
      diagonal within the fiducial cuts), so the null tests are
      conservative: a test that passes with the Gaussian-only
      covariance would generally pass with a more complete one,
      as the GLASS mocks confirm.
    default: gaussian_only
    options:
      gaussian_only:
        label: "Gaussian only (fiducial for null tests)"
        description: |
          Gaussian CosmoCov terms on both grids; NaMaster iNKA
          is Gaussian by construction.
      gaussian_plus_ng:
        label: "Gaussian + non-Gaussian"
        description: |
          Adds connected-trispectrum and super-sample terms;
          computed on the 20-bin reporting grid only, to size
          the non-Gaussian contribution.

  mask_application:
    label: "Footprint mask in covariance"
    tags: [covariance, geometry]
    rationale: |
      CosmoCov either treats the survey as a contiguous area or
      includes the footprint geometry through a mask power
      spectrum. The fiducial runs use the
      [standard 2894 deg² or star-halo 2517 deg² mask
      power spectrum](#inputs.mask_power_spectrum) appropriate
      to the catalog version, since the footprint's shape sets
      the sample variance. The unmasked variant serves only as a
      diagnostic of the geometry's contribution to the
      covariance diagonal.
    default: masked
    options:
      masked:
        label: "Masked (fiducial)"
        description: |
          Standard footprint for v1.4.5 / v1.4.6.3 / v1.4.11.3;
          star-halo footprint for v1.4.8.
      unmasked:
        label: "Unmasked"
        description: |
          A contiguous area with no footprint geometry;
          diagnostic only.

  block_pairs:
    label: "Shear-shear block pairs computed by CosmoCov"
    tags: [covariance, structure]
    rationale: |
      CosmoCov computes the shear-shear covariance as three
      blocks: ++ (ξ_+ auto), -- (ξ_- auto) and +- (cross). The
      joint ξ_tot^B test needs the cross-block, and the pure-mode
      and COSEBI transforms mix ξ_+ and ξ_-, so all three are
      required; the decision documents the structure rather than
      offering a real choice.
    default: all_three
    options:
      all_three:
        label: "All three: ++, --, +-"
      auto_only:
        label: "Auto blocks only (++, --)"
        description: |
          Enough for separate ξ_+^B and ξ_-^B PTEs.
        excluded: true
        excluded_reason: |
          The reported joint ξ_tot^B test needs the cross-block.

  glass_validation_strategy:
    label: "GLASS mock-validation use"
    tags: [covariance, validation]
    rationale: |
      The GLASS lognormal mocks, generated under the
      [Planck-18 fiducial](#../decisions.fiducial_cosmology),
      carry no PSF leakage or other imaging systematics. They
      test whether the
      [estimators](#../analyses.null_tests) produce spurious
      B modes from a systematics-free input, and whether the
      analytic σ matches the scatter across realisations. The
      analytic covariances, not the mock sample covariance,
      enter the PTEs.
    default: validation_only
    options:
      validation_only:
        label: "Validation comparator (fiducial)"
        description: |
          Mock scatter is compared with the analytic σ and the
          ensemble-mean B modes with zero.
      sample_covariance_production:
        label: "GLASS sample covariance as production"
        excluded: true
        excluded_reason: |
          The mocks validate the analytic covariances; 350
          realisations give too noisy an inverse to replace
          them.

analyses:

  cov_scan:
    path: ./analyses/cov_scan

prior_insights:

  fang20_2dfftlog_stable_real_space_covariance:
    id: fang20_2dfftlog_stable_real_space_covariance
    claim: |
      Analytic covariances are much faster and less noisy than
      estimates from data or simulations; the 2D-FFTLog algorithm
      released with CosmoCov makes the Bessel-integral transform to
      real space numerically stable and produces angular
      bin-averaged covariances accurate enough for cosmological
      inference.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/staa1726"
        quote:
          exact: "Among various approaches to obtaining the covariance, analytic computation is much faster and less noisy than estimation from data or simulations."
        location:
          page: 1
      - id: ev2
        doi: "10.1093/mnras/staa1726"
        quote:
          exact: "our algorithm can produce numerically stable angular bin-averaged covariances with the flat sky approximation, which are sufficiently accurate for inferring cosmological parameters."
        location:
          page: 1
    scope: |
      Fang, Eifler & Krause 2020, MNRAS 497, 2699; validated for
      DES-Y3- and LSST-Y1-like surveys.
