id: cl_scan
version: '1.0'
name: Pseudo-Cℓ catalog-version scan
description: |
  Design-B producer sweep: pseudo-Cℓ data vector and its NaMaster
  iNKA Gaussian bandpower covariance (√ℓ-linear `powspace`
  binning, blind A) for every non-fiducial, non-ecut catalog
  version (7 variants — 3 leak-corrected + 4 uncorrected). Two
  bandpower grids: the 32-bin reporting grid for every version,
  and the 96-bin fine grid for the leak-corrected versions only,
  which exists to feed the
  [harmonic COSEBI scan](#../../cosebis.analyses.cosebis_harmonic_scan).
  Each (version, grid, product) is its own lc output; the gather
  bundles them under the canonical
  `pseudo_cl{,_cov}_{ver}_blind=A_powspace_nbins=N.fits` names
  that `cl_version_comparison` / `cl_data_vector` /
  `harmonic_space_pte_matrices` read via `--results-dir`.
  Per-version footprint masks resolve internally from cat_config,
  so no per-version mask wiring is needed here.
tags:
- sweep
- generated
- cl_bb
inputs:
- id: selected_config
  from: ../selected_config
- id: redshift_distribution
  from: ../redshift_distribution
- id: mask_power_spectrum
  from: ../mask_power_spectrum
- id: redshift_distributions
  from: ../redshift_distributions
- id: redshift_distributions_legacy
  from: ../redshift_distributions_legacy
- id: shapepipe_v14_catalogs
  from: ../shapepipe_v14_catalogs
- id: shapepipe_v145_rerun
  from: ../shapepipe_v145_rerun
decisions:
  noise_bias_correction:
    from: ../noise_bias_correction
  bandpower_binning:
    from: ../bandpower_binning
  estimator_choice:
    from: ../estimator_choice
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  harmonic_validation_binning:
    from: ../harmonic_validation_binning
outputs:
