# Design-B pseudo-Cℓ version scan. Expand with:
#   scripts/sweep_expand.py -o analyses/cl_bb/analyses/cl_scan/astra.yaml \
#       analyses/cl_bb/analyses/cl_scan/cl_scan.sweep.yaml
id: cl_scan
version: "1.0"
name: "Pseudo-Cℓ catalog-version scan"
description: |
  Design-B producer sweep: pseudo-Cℓ data vector and its NaMaster
  iNKA Gaussian bandpower covariance (√ℓ-linear `powspace`
  binning, blind A) for every non-fiducial, non-ecut catalog
  version (7 variants — 3 leak-corrected + 4 uncorrected). Two
  bandpower grids: the 32-bin reporting grid for every version,
  and the 96-bin fine grid for the leak-corrected versions only,
  which exists to feed the
  [harmonic COSEBI scan](#../../cosebis.analyses.cosebis_harmonic_scan).
  Each (version, grid, product) is its own lc output; the gather
  bundles them under the canonical
  `pseudo_cl{,_cov}_{ver}_blind=A_powspace_nbins=N.fits` names
  that `cl_version_comparison` / `cl_data_vector` /
  `harmonic_space_pte_matrices` read via `--results-dir`.
  Per-version footprint masks resolve internally from cat_config,
  so no per-version mask wiring is needed here.
tags: [sweep, generated, cl_bb]

inputs:
  - id: redshift_distribution
    from: ../redshift_distribution
  - id: mask_power_spectrum
    from: ../mask_power_spectrum
  # The raw n(z) trees. generate_pseudo_cl_cov.py follows cat_config's
  # per-version `redshift_path` at runtime, and lc binds only declared inputs,
  # so the cl_cov members need both trees the config names: the SOM tree for
  # v1.4.5 / v1.4.6.3, the legacy file for v1.4.8 / v1.4.11.3.
  - id: redshift_distributions
    from: ../redshift_distributions
  - id: redshift_distributions_legacy
    from: ../redshift_distributions_legacy
  # Every member opens its version's catalog through cat_config.
  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs
  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun

decisions:
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind

matrix:
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr
  nbins: [32, 96]
  product: [cl, cl_cov]
  # Per-product resource envelopes, from the fiducial single-version recipes
  # (cl_bandpowers_* 12/32GB/2h; cl_cov_reporting 12/16GB/3h), raised to cover
  # the 96-bin grid.
  mem: ["32GB", "16GB"]
  ptime: ["4h", "8h"]

zip: [[product, mem, ptime]]

# The 96-bin fine grid is only ever consumed for the leak-corrected versions
# (the harmonic COSEBI cross-check runs on leak-corrected catalogs only), so
# the four uncorrected variants are dropped from that grid.
exclude:
  - {version: SP_v1.4.5, nbins: 96}
  - {version: SP_v1.4.6.3, nbins: 96}
  - {version: SP_v1.4.8, nbins: 96}
  - {version: SP_v1.4.11.3, nbins: 96}

template:
  id: pseudo_${product}_${version}_nbins${nbins}
  type: data
  format: fits
  description: |
    Pseudo-Cℓ `${product}` product for catalog version
    `${version}` on the ${nbins}-bin √ℓ-linear bandpower grid at
    blind A (nside 1024, npatch 1). The per-version analogue of
    the fiducial `cl_bandpowers_*` / `cl_cov_*` outputs; same
    `generate_pseudo_${product}.py` invocation, different `--ver`.
  inputs: [redshift_distribution, mask_power_spectrum, shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distributions, redshift_distributions_legacy]
  decisions: [fiducial_catalog, fiducial_blind]
  recipe:
    # The per-version unit of work. generate_pseudo_cl.py and
    # generate_pseudo_cl_cov.py take an identical flag family, so one template
    # covers both products. The July driver (run_cl_sweep.py) looped these
    # serially and renamed their native filenames; lc schedules the members and
    # the gather does the canonical naming.
    command: >
      python src/workflow/scripts/generate_pseudo_${product}.py
      --ver ${version}
      --cat-config src/cosmo_val/cat_config.yaml
      --nside 1024 --npatch 1 --binning powspace --nbins ${nbins} --power 0.5 --blind A
      --out-file {output}
    resources: { cpus: 12, memory: "${mem}" }

gather:
  id: cl_sweep_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members bundled flat under their
    July-canonical
    `pseudo_cl{,_cov}_{ver}_blind=A_powspace_nbins=N.fits` names —
    the exact directory layout the harmonic-space consumers
    reconstruct. Re-exported by
    [cl_bb.cl_sweep](#../outputs.cl_sweep); consumers untar it into
    a temp dir and pass that as `--results-dir`, unchanged from the
    July contract.
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cl --config src/papers/bmodes/config/config.yaml
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
