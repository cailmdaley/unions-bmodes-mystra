version: "0.0.14"
name: "Harmonic-space pseudo-Cℓ^BB and Cℓ^EB"

inputs:
  - id: redshift_distribution
    from: ../catalog.redshift_distribution

  - id: mask_power_spectrum
    from: ../catalog.mask_power_spectrum

  - id: cl_cov_reporting
    from: ../covariance.cl_cov_reporting

  - id: redshift_distributions
    from: ../redshift_distributions
    # The raw n(z) tree, as distinct from `redshift_distribution` above (the
    # catalog unit's single fiducial copy). `generate_pseudo_cl_cov.py` reads
    # whatever `redshift_path` cat_config gives for its `--ver`, so the
    # [cl_scan sweep](#analyses.cl_scan)'s covariance members need the tree
    # itself bound, not one file out of it. Same reason as the covariance
    # unit's alias of the same name.

  - id: redshift_distributions_legacy
    from: ../redshift_distributions_legacy
    # The n(z) cat_config gives the v1.4.8 / v1.4.11.3 entries, which the
    # [cl_scan sweep](#analyses.cl_scan) covers. Promoted to a root input
    # once the pure_eb sweeps turned out to read it too.

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun
    # cat_config sends both v1.4.5 variants outside the v1.4.x family.

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: print_width_script
    from: ../print_width_script

  - id: cl_version_comparison_script
    from: ../cl_version_comparison_script

outputs:
  - id: cl_bandpowers_reporting
    type: data
    description: |
      Per-(version, blind) FITS file holding pseudo-Cℓ^EE,
      Cℓ^EB, Cℓ^BB bandpowers on the
      [32-bandpower √ℓ-linear grid](#decisions.bandpower_binning)
      over 8 ≤ ℓ ≤ 2048, NaMaster-decoupled and
      shot-noise-corrected. Generated by the source
      `pseudo_cl` rule with `binning = powspace`, `nbins = 32`,
      `power = 0.5`. The fiducial-version artifact is the
      source for the
      [paper Cℓ data-vector figure
      ](#../outputs.fig_cl_fiducial).
    format: fits
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distribution, mask_power_spectrum]
    recipe:
      # lc owns the container; bare `python`, scripts read from the vendored
      # src/ tree. Fiducial version + blind A hardcoded (single-version
      # output, faithful to the DAG). Writes the single decoupled-bandpower FITS
      # straight to {output}.
      command: >
        python src/workflow/scripts/generate_pseudo_cl.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_bandpowers_fine
    type: data
    description: |
      Per-(version, blind) FITS file holding pseudo-Cℓ^EE,
      Cℓ^EB, Cℓ^BB bandpowers on the 96-bandpower √ℓ-linear
      grid (`cl.cosebis_nbins = 96` in the source config).
      Sole consumer is the [COSEBI harmonic-validation binning
      choice](#../cosebis.decisions.harmonic_validation_binning)
      — the bin count is dense enough to resolve the W_n(ℓ)
      filter oscillations through n ≤ 6 modes (paper §3.2).
    format: fits
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distribution, mask_power_spectrum]
    recipe:
      # Same generate_pseudo_cl.py CLI as cl_bandpowers_reporting, 96-bandpower
      # fine grid (--nbins 96). Distinct {output} file, so no cache collision
      # with the 32-bin reporting run.
      command: >
        python src/workflow/scripts/generate_pseudo_cl.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 96 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_sweep
    # Re-export of the generated cl_scan sweep's gather output — the only edge
    # into the sweep. The bundle keeps the July-canonical
    # `pseudo_cl{,_cov}_{ver}_blind=A_powspace_nbins=N.fits` names, so
    # cl_data_vector / cl_version_comparison / harmonic_space_pte_matrices are
    # unchanged. It now additionally carries the 96-bin fine grid for the three
    # non-fiducial leak-corrected versions, which feeds
    # [cosebis_harmonic_scan](#../cosebis.analyses.cosebis_harmonic_scan).
    # Regenerate with
    #   scripts/sweep_expand.py -o analyses/cl_bb/analyses/cl_scan/astra.yaml \
    #       analyses/cl_bb/analyses/cl_scan/cl_scan.sweep.yaml
    from: cl_scan.cl_sweep_bundle

  - id: cl_data_vector_figure
    type: figure
    description: |
      Paper Figure 4: Cℓ^BB and Cℓ^EB normalised by uncertainty
      for the [fiducial catalog](#../decisions.fiducial_catalog)
      at blind A, with the
      [adopted ℓ-range](#../decisions.fiducial_scale_cuts) of
      300 < ℓ < 1600 shaded. Generated by `cl_data_vector`
      (the per-version QA variants of the source rule are not
      declared artifacts).
    format: png
    decisions: [fiducial_catalog]
    inputs: [cl_bandpowers_reporting, cl_cov_reporting, paper_mplstyle, print_width_script]
    recipe:
      # cl_data_vector.py CLI renders paper Figure 4 (fiducial) from the
      # fiducial data vector and its bandpower covariance, the two declared
      # cross-output inputs; no other version is read.
      command: >
        python src/papers/bmodes/scripts/cl_data_vector.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --fiducial-version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_version_comparison_figure
    type: figure
    description: |
      Per-bandpower Cℓ^BB overlay across the four leak-corrected
      catalog variants, contributing the harmonic-space row of
      the [paper Figure 5 stack](#../outputs.fig_versions_cl).
      Uncorrected variants not stacked.
    format: png
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting, paper_mplstyle, print_width_script, cl_version_comparison_script]
    recipe:
      # cl_version_comparison.py CLI overlays Cℓ^BB / Cℓ^EB across the 4
      # leak-corrected catalogs, writing the single PNG to {output}. Per-version
      # pseudo_cl / pseudo_cl_cov (32-bin, blind A) come from the untarred sweep
      # bundle by the canonical naming pattern.
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/cl_version_comparison.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $d
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_pte_per_cut
    type: data
    description: |
      Per-(version, blind) PTE evaluation of Cℓ^BB versus the
      iNKA Gaussian bandpower covariance from the
      [covariance sub-analysis](#../analyses.covariance), over
      a grid of (ℓ_min, ℓ_max) bandpower index pairs. The
      [adopted 300 < ℓ < 1600
      cut](#../decisions.fiducial_scale_cuts) is one row of
      this matrix; the full grid backs the
      [harmonic-space PTE composite
      ](#../outputs.fig_cl_pte_heatmap). Computed inside
      `harmonic_space_pte_matrices`, which materialises both
      the per-version data and the composite figure.
    format: npz
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting]
    recipe:
      # harmonic_space_pte_matrices.py CLI, run in its PTE-matrix mode: the single
      # .npz of per-version Cℓ^BB PTE grids is written to {output}. The heatmap
      # figures the July run also emitted here belong to their own declared
      # outputs (root fig_cl_pte_heatmap, null_tests.harmonic_space_pte_evidence),
      # which re-invoke the script in their respective plot modes.
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $d
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --emit matrices
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  estimator_choice:
    label: "Pseudo-Cℓ estimator"
    tags: [cl_bb, method, primary]
    rationale: |
      The Wolz et al. (2025) catalog-based estimator evaluates
      spin-2 spherical-harmonic transforms at source positions
      through the `ducc` library (Reinecke & Seljebotn 2023),
      avoiding the pixelization artifacts that map-based
      pseudo-Cℓ pipelines develop at the UNIONS footprint
      angular resolution. Paper IV's cosmological inference
      adopts the same estimator; this paper's null tests use
      it for parity. Map-based NaMaster pseudo-Cℓ is exposed
      as the alternative because it is the legacy
      Stage-III reference and the implementation against which
      Wolz et al. cross-validate.
    default: wolz25_catalog_based
    options:
      wolz25_catalog_based:
        label: "Wolz et al. 2025 catalog-based (paper fiducial)"
        description: |
          Discrete-source spin-2 transforms via `ducc`;
          NaMaster-decoupled bandpowers; analytic shot-noise
          subtraction.
        insights: [wolz25_catalog_based_pseudo_cl]
      map_based_pseudo_cl:
        label: "Map-based pseudo-Cℓ on HEALPix"
        description: |
          Standard map-based NaMaster pipeline; develops
          pixelization artifacts at the UNIONS footprint
          angular scale. Not used by the paper.

  bandpower_binning:
    label: "Bandpower binning scheme"
    tags: [cl_bb, binning, primary]
    rationale: |
      32 bandpowers with √ℓ-linear spacing
      (`binning = powspace`, `power = 0.5`) over 8 ≤ ℓ ≤ 2048
      is the paper data-vector grid: it gives constant
      fractional ℓ resolution and balances per-bandpower SNR
      against bandpower count (32 modes constrained at the
      fiducial cut leave a comfortable degrees-of-freedom
      margin). 96 bandpowers in the same √ℓ-linear scheme is
      the cross-check grid — required by the
      [cosebis harmonic path](#../analyses.cosebis) to resolve
      the W_n(ℓ) filter oscillations through n ≤ 6. Linear ℓ
      binning would bunch resolution at low ℓ; log-ℓ binning
      coarsens at high ℓ.
    default: bandpowers_32_powspace
    options:
      bandpowers_32_powspace:
        label: "32 √ℓ-linear over 8 ≤ ℓ ≤ 2048 (paper fiducial)"
      bandpowers_96_powspace:
        label: "96 √ℓ-linear over 8 ≤ ℓ ≤ 2048 (COSEBI cross-check)"
        description: |
          Paper-fiducial fine variant for paper Eq. 19; not
          used by the Cℓ^BB null test itself.
      bandpowers_16_powspace:
        label: "16 √ℓ-linear"
        description: |
          Coarser bandpowers; would compress the PTE
          degrees-of-freedom margin without an SNR gain
          commensurate with the loss of ℓ-resolution.
      bandpowers_64_powspace:
        label: "64 √ℓ-linear"
        description: |
          Higher resolution; per-bandpower SNR drops without
          a clear gain on the BB null test.

  noise_bias_correction:
    label: "Shot-noise / noise-bias correction"
    tags: [cl_bb, calibration]
    rationale: |
      Pseudo-Cℓ estimators on shear data carry a noise bias
      from the intrinsic ellipticity dispersion that scales
      with the inverse galaxy density. Paper IV implements an
      analytic shot-noise subtraction inside the catalog-based
      estimator (Wolz et al. 2025); this paper inherits that
      correction. A Monte-Carlo noise-bias estimator is
      available but not used because the analytic form is
      exact under the uncorrelated shape-noise model and avoids
      mock-noise injection.
    default: analytic_shot_noise
    options:
      analytic_shot_noise:
        label: "Analytic shot-noise subtraction (Paper IV; paper fiducial)"
        insights: [wolz25_catalog_based_pseudo_cl]
      mc_noise_bias:
        label: "Monte-Carlo noise-bias estimator"
        description: |
          Generates ellipticity-randomised mocks and subtracts
          their mean Cℓ; not used by the paper or Paper IV.

  pte_blind_strategy:
    label: "Per-blind PTE evaluation strategy"
    tags: [cl_bb, blinding, validation]
    rationale: |
      `harmonic_space_pte_matrices` consumes per-version
      pseudo-Cℓ data vectors at blind A only and uses the
      blind-A bandpower covariance for the PTE evaluation, by
      analogy with the
      [pure_eb PTE blind strategy](#../analyses.pure_eb).
      The bb_covariance_blind_independence cross-check
      generates per-blind bandpower covariances on the mock
      version (v1.4.6) to compare B-mode and E-mode covariance
      stability across blinds; that check lives in
      [null_tests](#../analyses.null_tests).
    default: blind_a_for_paper
    options:
      blind_a_for_paper:
        label: "Blind A for paper PTEs (paper fiducial)"
      all_blinds_for_paper:
        label: "All three blinds in paper PTEs"
        description: |
          Exposed but not used; would triple the PTE table
          width without revealing new B-mode information given
          the workflow blind-independence check.

prior_insights:

  wolz25_catalog_based_pseudo_cl:
    id: wolz25_catalog_based_pseudo_cl
    claim: |
      The Wolz, Alonso & Nicola (2025) catalog-based pseudo-Cℓ
      formalism extracts angular power spectra from fields
      sampled at a finite number of arbitrary source positions
      by forgoing pixelized maps and evaluating spherical
      harmonic transforms directly on the discrete catalog.
      Its analytic treatment of the discrete-mask shot-noise
      contribution makes the resulting estimator immune to
      small-scale pixelization and aliasing effects, and
      unbiased against measurement noise uncorrelated between
      sources. This is the methodological basis for Paper II's
      harmonic-space Cℓ^EB / Cℓ^BB bandpowers and their
      analytic shot-noise correction.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            We present a formalism to extract the angular
            power spectrum of fields sampled at a finite
            number of points with arbitrary positions -- a
            common situation for several catalog-based
            astrophysical probes -- through a simple extension
            of the standard pseudo-$C_\ell$ algorithm.
          prefix: "Abstract."
          suffix: "A key complication in this case is the need to handle the shot noise component of the associated discrete angular mask"
        location:
          page: 1
      - id: ev2
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            The resulting estimator is immune to small-scale
            pixelization effects and aliasing, and, more
            interestingly, unbiased against the contribution
            from measurement noise uncorrelated between
            different sources.
          prefix: "We show that this problem can be solved easily by estimating this contribution analytically and subtracting it."
          suffix: "We demonstrate the validity of the method in the context of cosmic shear datasets"
        location:
          page: 1
    scope: |
      Wolz, Alonso & Nicola 2025, JCAP 01, 028 — abstract.
      Source: arxiv 2407.21013 main.tex line 71. Cited as the
      methodological foundation for the [cl_bb sub-analysis
      ](#analyses.cl_bb)'s catalog-level pseudo-Cℓ estimator
      and the analytic shot-noise / noise-bias correction the
      paper inherits from Paper IV's implementation. Paper II's
      implementation evaluates spin-2 spherical-harmonic
      transforms at source positions through the `ducc` library
      (Reinecke & Seljebotn 2023), with NaMaster decoupling of
      the mode-coupling matrix.

analyses:

  cl_scan:
    path: ./analyses/cl_scan
