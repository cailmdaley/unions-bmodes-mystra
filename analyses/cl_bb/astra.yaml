version: "0.0.14"
name: "Harmonic-space pseudo-Cℓ^BB and Cℓ^EB"

inputs:
  - id: redshift_distribution
    from: ../catalog.redshift_distribution

  - id: mask_power_spectrum
    from: ../catalog.mask_power_spectrum

  - id: cl_cov_reporting
    from: ../covariance.cl_cov_reporting

  - id: redshift_distributions
    from: ../redshift_distributions
    # The raw n(z) tree, as distinct from `redshift_distribution` above (the
    # catalog unit's single fiducial copy). `generate_pseudo_cl_cov.py` reads
    # whatever `redshift_path` cat_config gives for its `--ver`, so the
    # [cl_scan sweep](#analyses.cl_scan)'s covariance members need the tree
    # itself bound, not one file out of it. Same reason as the covariance
    # unit's alias of the same name.

  - id: redshift_distributions_legacy
    from: ../redshift_distributions_legacy
    # The n(z) cat_config gives the v1.4.8 / v1.4.11.3 entries, which the
    # [cl_scan sweep](#analyses.cl_scan) covers; the pure_eb sweeps read it too.

  - id: shapepipe_v14_catalogs
    from: ../shapepipe_v14_catalogs

  - id: shapepipe_v145_rerun
    from: ../shapepipe_v145_rerun
    # cat_config sends both v1.4.5 variants outside the v1.4.x family.

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: print_width_script
    from: ../print_width_script

  - id: cl_version_comparison_script
    from: ../cl_version_comparison_script

outputs:
  - id: cl_bandpowers_reporting
    type: data
    description: |
      Pseudo-Cℓ^EE, Cℓ^EB and Cℓ^BB bandpowers of the fiducial
      catalog at blind A on the
      [32-bandpower √ℓ-spaced grid](#decisions.bandpower_binning)
      over 8 ≤ ℓ ≤ 2048, decoupled and noise-bias-corrected.
      They are the data vector of the
      [Cℓ figure](#../outputs.fig_cl_fiducial).
    format: fits
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distribution, mask_power_spectrum]
    recipe:
      # lc owns the container; bare `python`, scripts read from the vendored
      # src/ tree. Fiducial version + blind A hardcoded (single-version
      # output, faithful to the DAG). Writes the single decoupled-bandpower FITS
      # straight to {output}.
      command: >
        python src/workflow/scripts/generate_pseudo_cl.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 32 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_bandpowers_fine
    type: data
    description: |
      The same bandpowers on a 96-bandpower √ℓ-spaced grid, fine
      enough to resolve the oscillations of the W_n(ℓ) filters in
      the [harmonic-space COSEBI
      transform](#../cosebis.decisions.harmonic_validation_binning).
    format: fits
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [shapepipe_v14_catalogs, shapepipe_v145_rerun, redshift_distribution, mask_power_spectrum]
    recipe:
      # Same generate_pseudo_cl.py CLI as cl_bandpowers_reporting, 96-bandpower
      # fine grid (--nbins 96). Distinct {output} file, so no cache collision
      # with the 32-bin reporting run.
      command: >
        python src/workflow/scripts/generate_pseudo_cl.py
        --ver "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --cat-config src/cosmo_val/cat_config.yaml
        --nside 1024 --npatch 1 --binning powspace --nbins 96 --power 0.5 --blind {decisions.fiducial_blind}
        --out-file {output}
      resources: { cpus: 12, memory: "32GB" }

  - id: cl_sweep
    # Re-export of the generated cl_scan sweep's gather output — the only edge
    # into the sweep. The bundle uses the
    # `pseudo_cl{,_cov}_{ver}_blind=A_powspace_nbins=N.fits` names that
    # cl_data_vector / cl_version_comparison / harmonic_space_pte_matrices read.
    # It also carries the 96-bin fine grid for the three non-fiducial
    # leak-corrected versions, which feeds
    # [cosebis_harmonic_scan](#../cosebis.analyses.cosebis_harmonic_scan).
    # Regenerate with
    #   scripts/sweep_expand.py -o analyses/cl_bb/analyses/cl_scan/astra.yaml \
    #       analyses/cl_bb/analyses/cl_scan/cl_scan.sweep.yaml
    from: cl_scan.cl_sweep_bundle

  - id: cl_data_vector_figure
    type: figure
    description: |
      C_ℓ^BB/σ (top) and C_ℓ^EB/σ (bottom) for the [fiducial
      catalog](#../decisions.fiducial_catalog). C_ℓ^BB is
      predominantly positive across the fiducial range; C_ℓ^EB
      scatters symmetrically around zero, suggesting that any
      B-mode contamination is not strongly correlated with the
      lensing signal.
    format: png
    decisions: [fiducial_catalog]
    inputs: [cl_bandpowers_reporting, cl_cov_reporting, paper_mplstyle, print_width_script]
    recipe:
      # cl_data_vector.py CLI renders the Cℓ data-vector figure (fiducial) from the
      # fiducial data vector and its bandpower covariance, the two declared
      # cross-output inputs; no other version is read.
      command: >
        python src/papers/bmodes/scripts/cl_data_vector.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --fiducial-version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_version_comparison_figure
    type: figure
    description: |
      C_ℓ^BB/σ and C_ℓ^EB/σ across catalog versions: initial (red
      circles), size-cut/fiducial (gold squares), masked (teal
      diamonds) and relaxed-flags (purple triangles). Rectangles
      span each bin horizontally and the range across versions
      vertically; horizontal lines mark the fiducial value; shaded
      bands mark the fiducial scale cuts. Only the size-cut
      catalog passes all statistics at the fiducial scale cuts
      ([PTE table](#../outputs.pte_table_appendix)).
    format: png
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting, paper_mplstyle, print_width_script, cl_version_comparison_script]
    recipe:
      # cl_version_comparison.py CLI overlays Cℓ^BB / Cℓ^EB across the 4
      # leak-corrected catalogs, writing the single PNG to {output}. Per-version
      # pseudo_cl / pseudo_cl_cov (32-bin, blind A) come from the untarred sweep
      # bundle by the canonical naming pattern.
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/cl_version_comparison.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $d
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

  - id: cl_pte_per_cut
    type: data
    description: |
      Cℓ^BB null-test PTEs for each catalog version over a grid of
      (ℓ_min, ℓ_max) bandpower ranges, using the iNKA Gaussian
      bandpower covariance from the
      [covariance sub-analysis](#../analyses.covariance). The
      [adopted 300 < ℓ < 1600
      cut](#../decisions.fiducial_scale_cuts) is one cell of the
      grid, which the
      [harmonic-space PTE heatmap](#../outputs.fig_cl_pte_heatmap)
      shows.
    format: npz
    inputs: [cl_sweep, cl_bandpowers_reporting, cl_cov_reporting]
    recipe:
      # harmonic_space_pte_matrices.py CLI, run in its PTE-matrix mode: the single
      # .npz of per-version Cℓ^BB PTE grids is written to {output}. The heatmap
      # figures the July run also emitted here belong to their own declared
      # outputs (root fig_cl_pte_heatmap, null_tests.harmonic_space_pte_evidence),
      # which re-invoke the script in their respective plot modes.
      command: >
        d=$(mktemp -d) && tar xzf {inputs.cl_sweep} -C $d &&
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $d
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_reporting}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_reporting}
        --emit matrices
        --out-file {output}
      resources: { cpus: 2, memory: "8GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  estimator_choice:
    label: "Pseudo-Cℓ estimator"
    tags: [cl_bb, method, primary]
    rationale: |
      The Wolz et al. (2025) catalog-based estimator evaluates
      spin-2 spherical-harmonic transforms directly at source
      positions through the `ducc` library (Reinecke et al.
      2023), avoiding the pixelization artifacts of map-based
      pseudo-Cℓ. Paper IV measures its cosmic-shear spectra with
      the same estimator, so the null tests match the inference.
      Map-based pseudo-Cℓ, as used by DES and HSC, is the
      standard alternative.
    default: wolz25_catalog_based
    options:
      wolz25_catalog_based:
        label: "Wolz et al. 2025 catalog-based (fiducial)"
        description: |
          Spin-2 transforms at source positions via `ducc`, with
          NaMaster-decoupled bandpowers and analytic shot-noise
          subtraction.
        insights: [wolz25_catalog_based_pseudo_cl, hivon02_master_mode_coupling_deconvolution, alonso19_namaster_unbiased_spin2_pseudo_cl, reinecke23_sht_on_arbitrary_grids]
      map_based_pseudo_cl:
        label: "Map-based pseudo-Cℓ on HEALPix"
        insights: [hivon02_master_mode_coupling_deconvolution, alonso19_namaster_unbiased_spin2_pseudo_cl]
        description: |
          Shapes binned into HEALPix pixels before the transform,
          which introduces pixel-window and aliasing effects near
          the pixel scale.

  bandpower_binning:
    label: "Bandpower binning scheme"
    tags: [cl_bb, binning, primary]
    rationale: |
      The Cℓ^BB null tests use Paper IV's data-vector binning:
      32 square-root-spaced bandpowers (ℓ^0.5) over
      8 ≤ ℓ ≤ 2048, the scheme Paper IV adopts from DES Y3.
      Square-root spacing sits between linear binning, which
      spends most bandpowers at high ℓ, and logarithmic binning,
      which spends most at low ℓ. The
      [harmonic-space COSEBIs](#../analyses.cosebis) use 96
      bandpowers in the same scheme, fine enough to resolve the
      W_n(ℓ) filter oscillations.
    default: bandpowers_32_powspace
    options:
      bandpowers_32_powspace:
        label: "32 √ℓ-spaced over 8 ≤ ℓ ≤ 2048 (fiducial)"
      bandpowers_96_powspace:
        label: "96 √ℓ-spaced over 8 ≤ ℓ ≤ 2048 (COSEBI transform)"
        description: |
          Fine grid for the harmonic-space COSEBIs; not used by
          the Cℓ^BB null test.
      bandpowers_16_powspace:
        label: "16 √ℓ-spaced"
        description: |
          Coarser bandpowers, departing from Paper IV's data
          vector.
      bandpowers_64_powspace:
        label: "64 √ℓ-spaced"
        description: |
          Finer bandpowers, departing from Paper IV's data
          vector.

  noise_bias_correction:
    label: "Shot-noise / noise-bias correction"
    tags: [cl_bb, calibration]
    rationale: |
      Shape noise biases pseudo-Cℓ auto-spectra by an amount
      that scales with the inverse galaxy density. The paper
      subtracts an analytic shot-noise contribution following
      Paper IV's implementation of the catalog-based estimator,
      which Wolz et al. (2025) show is unbiased against noise
      uncorrelated between sources. A Monte-Carlo estimate is
      the standard alternative for map-based pipelines.
    default: analytic_shot_noise
    options:
      analytic_shot_noise:
        label: "Analytic shot-noise subtraction (as in Paper IV; fiducial)"
        insights: [wolz25_catalog_based_pseudo_cl]
      mc_noise_bias:
        label: "Monte-Carlo noise-bias estimator"
        description: |
          Subtracts the mean Cℓ of ellipticity-randomised
          realisations.

  pte_blind_strategy:
    label: "Per-blind PTE evaluation strategy"
    tags: [cl_bb, blinding, validation]
    rationale: |
      The reported Cℓ^BB PTEs use blind-A data vectors and the
      blind-A bandpower covariance, as for
      [the pure-mode PTEs](#../analyses.pure_eb). A side check in
      [null_tests](#../analyses.null_tests) compares covariances
      across the three blinds and finds the B-mode covariances
      closer to blind-independent than the E-mode ones.
    default: blind_a_for_paper
    options:
      blind_a_for_paper:
        label: "Blind A for the reported PTEs (fiducial)"
      all_blinds_for_paper:
        label: "All three blinds in the reported PTEs"
        description: |
          Would triple the PTE table without adding B-mode
          information, given the blind-independence check.

prior_insights:

  wolz25_catalog_based_pseudo_cl:
    id: wolz25_catalog_based_pseudo_cl
    claim: |
      The catalog-based pseudo-Cℓ estimator measures power
      spectra of fields sampled at arbitrary source positions,
      without pixelized maps; subtracting the discrete mask's
      shot noise analytically makes it immune to pixelization
      and aliasing and unbiased against noise uncorrelated
      between sources.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            We present a formalism to extract the angular
            power spectrum of fields sampled at a finite
            number of points with arbitrary positions -- a
            common situation for several catalog-based
            astrophysical probes -- through a simple extension
            of the standard pseudo-$C_\ell$ algorithm.
          prefix: "Abstract."
          suffix: "A key complication in this case is the need to handle the shot noise component of the associated discrete angular mask"
        location:
          page: 1
      - id: ev2
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            The resulting estimator is immune to small-scale
            pixelization effects and aliasing, and, more
            interestingly, unbiased against the contribution
            from measurement noise uncorrelated between
            different sources.
          prefix: "We show that this problem can be solved easily by estimating this contribution analytically and subtracting it."
          suffix: "We demonstrate the validity of the method in the context of cosmic shear datasets"
        location:
          page: 1
    scope: |
      Wolz, Alonso & Nicola 2025, JCAP 01, 028; the basis of the
      [cl_bb](#analyses.cl_bb) estimator and its shot-noise
      correction.


  hivon02_master_mode_coupling_deconvolution:
    id: hivon02_master_mode_coupling_deconvolution
    claim: |
      MASTER describes the mode coupling from incomplete sky
      coverage analytically through the harmonic transform of the
      sky window and corrects for it to obtain an unbiased C_ℓ.
      Both estimators considered here decouple their bandpowers
      this way.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1086/338126"
        quote:
          exact: "The harmonic mode-mode coupling induced by the incomplete sky coverage is described analytically by the SHT of the sky window and corrected for in order to obtain an unbiased estimate of the"
        location:
          page: 2
    scope: |
      Hivon et al. 2002, ApJ 567, 2; derived for CMB temperature
      maps, generalised to spin-2 by Alonso et al. 2019.

  alonso19_namaster_unbiased_spin2_pseudo_cl:
    id: alonso19_namaster_unbiased_spin2_pseudo_cl
    claim: |
      NaMaster provides a unified pseudo-Cℓ framework for any pair of
      spin-0 or spin-2 fields, and its validation suite recovers the
      input power spectra with no detectable bias in complex
      scenarios.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "provides a unified framework to compute angular cross-power spectra of any pair of spin-0 or spin-2 fields"
        location:
          page: 1
      - id: ev2
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "use it to show that the code is able to recover the input power spectra in the most complex scenarios with no detectable bias."
        location:
          page: 1
    scope: |
      Alonso, Sanchez & Slosar 2019, MNRAS 484, 4127; validated on
      maps, extended to catalogs by Wolz et al. 2025. Paper II uses
      it to decouple the bandpowers.

  reinecke23_sht_on_arbitrary_grids:
    id: reinecke23_sht_on_arbitrary_grids
    claim: |
      The `ducc` nonuniform-FFT code performs spherical harmonic
      transforms efficiently on completely arbitrary point sets,
      which is what makes evaluating spin-2 transforms directly at
      the ~10⁷ UNIONS source positions practical.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202346717"
        quote:
          exact: "This publicly available code enables de facto efficient spherical harmonic transforms on completely arbitrary grids, and it might be applied in other areas as well."
        location:
          page: 1
    scope: |
      Reinecke, Belkner & Carron 2023, A&A 678, A165, motivated by
      CMB lensing; applied to catalog pseudo-Cℓ by Wolz et al. 2025.

analyses:

  cl_scan:
    path: ./analyses/cl_scan
