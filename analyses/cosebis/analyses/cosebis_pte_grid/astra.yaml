- id: cosebis_pte_matrix
  type: data
  description: |
    The 20 rows reassembled into the single full-grid
    NPZ that
    [cosebis_pte_per_cut](#../../outputs.cosebis_pte_per_cut)
    re-exports — the exact artifact the serial loop wrote, keys
    in the same order with the same dtypes, shapes and NaN
    placement, so
    [fig_pte_heatmaps](#../../../outputs.fig_pte_heatmaps) reads it unchanged (`theta_grid`, `pte_B_6`, `pte_B_20`, and
    the full-range `[0, 20]` cell). `merge_cosebis_pte_rows.py`
    recomputes nothing: it rebuilds the global pair list from the
    same `_pte_scale_cut_pairs()` the members restrict and places
    each value by its `(i_min, i_max)` key, refusing to write if
    the members do not cover the grid exactly once or disagree on
    the version, blind, mode count or theta grid.
  inputs:
  - cosebis_pte_row_00
  - cosebis_pte_row_01
  - cosebis_pte_row_02
  - cosebis_pte_row_03
  - cosebis_pte_row_04
  - cosebis_pte_row_05
  - cosebis_pte_row_06
  - cosebis_pte_row_07
  - cosebis_pte_row_08
  - cosebis_pte_row_09
  - cosebis_pte_row_10
  - cosebis_pte_row_11
  - cosebis_pte_row_12
  - cosebis_pte_row_13
  - cosebis_pte_row_14
  - cosebis_pte_row_15
  - cosebis_pte_row_16
  - cosebis_pte_row_17
  - cosebis_pte_row_18
  - cosebis_pte_row_19
  recipe:
    command: |
      python src/papers/bmodes/scripts/merge_cosebis_pte_rows.py --members {inputs.cosebis_pte_row_00} {inputs.cosebis_pte_row_01} {inputs.cosebis_pte_row_02} {inputs.cosebis_pte_row_03} {inputs.cosebis_pte_row_04} {inputs.cosebis_pte_row_05} {inputs.cosebis_pte_row_06} {inputs.cosebis_pte_row_07} {inputs.cosebis_pte_row_08} {inputs.cosebis_pte_row_09} {inputs.cosebis_pte_row_10} {inputs.cosebis_pte_row_11} {inputs.cosebis_pte_row_12} {inputs.cosebis_pte_row_13} {inputs.cosebis_pte_row_14} {inputs.cosebis_pte_row_15} {inputs.cosebis_pte_row_16} {inputs.cosebis_pte_row_17} {inputs.cosebis_pte_row_18} {inputs.cosebis_pte_row_19} --out-file {output}
    resources:
