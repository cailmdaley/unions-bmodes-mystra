id: cosebis_pte_grid
version: '1.0'
name: COSEBI PTE matrix, one member per i_min row
description: |
  The fiducial COSEBI B-mode PTE matrix, decomposed the way the
  matrix itself is shaped: one member per i_min row of the
  `geomspace(1', 250', 21)` scale-cut grid
  ([scale_cut_pair_grid](#../../decisions.scale_cut_pair_grid)),
  each computing every stable `(i_min, j)` pair in its row. The
  same 206 pairs, the same theta grid, the same `nmodes = 20`,
  the same four excluded polynomial-root-unstable pairs, the same
  NaN-on-convergence-failure handling — only the loop bounds
  differ, and the gather puts the rows back.

  Previously the whole grid was one lc output running
  `compute_cosebis_pte_single.py` over all 206 pairs serially.
  That made it the wall-clock pole of the reproduction and, being
  a single output, something lc could not spread: one task, one
  node, one core's worth of forward progress. Twenty members let
  lc schedule the grid across the allocation — twenty task slots
  instead of one, which is where the win comes from. The
  in-member process pool over that row's pairs is a second level
  that multiplies against the first, so the recipe holds it at
  one worker per member; see the recipe comment for why the
  pool's own default is actively dangerous here.

  Rows are unequal — i_min = 0 carries 20 pairs, i_min = 19
  carries 1, mean 10.3 — so wall clock is set by row 0 at 20/206
  ≈ 9.7% of the serial loop, and less than that once the inner
  pool covers a row in ceil(20 / cpus) waves. Stride-balanced
  chunks of ~11 pairs would even that out, but chunk membership
  is a function of the whole exclusion set: adding or dropping
  one unstable pair reshuffles every chunk and invalidates every
  cached member, where the same change touches exactly one row.
  Rows also survive in a member id — `cosebis_pte_row_07` names
  the scientific object it computes — and a failed row is
  legible as a missing band of the matrix rather than an
  arbitrary scatter of cells.
tags:
- sweep
- generated
- cosebis
inputs:
- id: xi_integration
  from: ../xi_integration
- id: cov_integration
  from: ../cov_integration
decisions:
  pte_definition:
    from: ../pte_definition
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  scale_cut_pair_grid:
    from: ../scale_cut_pair_grid
  integration_grid:
    from: ../integration_grid
  leakage_correction:
    from: ../leakage_correction
  mode_count:
    from: ../mode_count
  reporting_binning:
    from: ../reporting_binning
outputs:
- id: cosebis_pte_row_00
  type: data
  description: |
    Row `i_min = 00` of the fiducial COSEBI PTE matrix: the
    E_n/B_n vectors, χ² and PTEs at both reported mode subsets
    (n ≤ 6, n ≤ 20) for every stable `(00, j)` scale-cut
    pair. An NPZ of the same shape and key order as the full-grid
    [cosebis_pte_per_cut](#../../outputs.cosebis_pte_per_cut),
    with `pairs` restricted to this row and every other cell left
    at its NaN initialiser. Not independently interesting — the
    science reads the assembled matrix.
  inputs:
  - xi_integration
  - cov_integration
  decisions:
  - fiducial_catalog
  - fiducial_blind
  - scale_cut_pair_grid
  - pte_definition
  - leakage_correction
  - reporting_binning
  - integration_grid
  - mode_count
  recipe:
    command: |
      python src/papers/bmodes/scripts/compute_cosebis_pte_single.py --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind {decisions.fiducial_blind} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count} --xi-integration {inputs.xi_integration} --cov-integration {inputs.cov_integration} --row 00 --out-file {output}
    resources:
      cpus: 1
