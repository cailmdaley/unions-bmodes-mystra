# Design-B COSEBI PTE-matrix version scan. Expand with:
#   scripts/sweep_expand.py -o analyses/cosebis/analyses/cosebis_pte_scan/astra.yaml \
#       analyses/cosebis/analyses/cosebis_pte_scan/cosebis_pte_scan.sweep.yaml
id: cosebis_pte_scan
version: "1.0"
name: "COSEBI PTE-matrix catalog-version scan"
description: |
  Design-B Tier-2 producer sweep: gathered COSEBI B_n PTE
  matrices (n ≤ 6, n ≤ 20) over the full scale-cut pair grid for
  every non-fiducial, non-ecut catalog version (7 variants — 3
  leak-corrected + 4 uncorrected). Replaces the July driver
  `run_cosebis_ptes_sweep.py`, which looped the same seven
  versions serially inside one lc output (~25 min/version, 206
  pairs — the pole of the cosebis unit); lc now schedules the
  members itself. Each member runs the *identical* per-pair
  compute the fiducial
  [cosebis_pte_per_cut](#../../outputs.cosebis_pte_per_cut) runs
  (`compute_cosebis_pte_single.py`, version-independent theta grid
  and nmodes read from `config["fiducial"]`), differing only in
  the ξ_±/covariance it reads and the version tag it stamps. The
  gather rebuilds the canonical `cosebis_ptes_{ver}_{blind}.npz`
  `tar.gz` that
  [cosebis_ptes](#../../outputs.cosebis_ptes) re-exports and the
  appendix config-space PTE heatmap reads via `--cosebis-pte-dir`.
  Members are not independently interesting; every consumer reads
  the bundle.
tags: [sweep, generated, cosebis]

inputs:
  - id: selected_config
    from: ../selected_config
  - id: xi_sweep
    from: ../xi_sweep
  - id: cov_sweep
    from: ../cov_sweep

decisions:
  pte_definition:
    from: ../pte_definition
  leakage_correction:
    from: ../leakage_correction
  fiducial_catalog:
    from: ../fiducial_catalog
  fiducial_blind:
    from: ../fiducial_blind
  scale_cut_pair_grid:
    from: ../scale_cut_pair_grid

matrix:
  slot: [SP_v1.4.5, SP_v1.4.5_leak_corr, fiducial_counterpart, SP_v1.4.8, SP_v1.4.8_leak_corr, SP_v1.4.11.3, SP_v1.4.11.3_leak_corr]
  version:
    - SP_v1.4.5
    - SP_v1.4.5_leak_corr
    - SP_v1.4.6.3
    - SP_v1.4.8
    - SP_v1.4.8_leak_corr
    - SP_v1.4.11.3
    - SP_v1.4.11.3_leak_corr

zip: [[version, slot]]

template:
  id: cosebis_ptes_${slot}
  type: data
  format: npz
  description: |
    Gathered COSEBI B_n / E_n PTE and χ² matrices over the stable
    (i_min, i_max) index pairs of `geomspace(1', 250', 21)`, for
    both reported mode subsets (n ≤ 6, n ≤ 20), for catalog
    version `${version}` at blind A. The per-version analogue of
    [cosebis_pte_per_cut](#../../outputs.cosebis_pte_per_cut);
    same `compute_cosebis_pte_single.py` invocation, different
    `--version` and a different pair of upstream files.
  inputs: [selected_config, xi_sweep, cov_sweep]
  decisions: [fiducial_catalog, fiducial_blind, scale_cut_pair_grid, pte_definition]
  recipe:
    # The two version-sweep bundles are untarred into temp dirs and this
    # version's 1000-bin integration ξ_± and Gaussian integration covariance
    # picked out by canonical filename — the sweep gathers are black boxes, so
    # members are addressed by name, never by member output id. Same addressing
    # the sibling cosebis_harmonic_scan members use.
    command: |
      # lc runs recipes as `bash -c` with no `set -e`, so without this a failed
      # compute would exit 0 via the trailing `rm` and lc would commit a
      # truncated artifact as successfully produced.
      set -e
      x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x
      c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c
      # NB: braced shell expansions cannot be used in a sweep template — the
      # expander claims that syntax. Bare $cb only.
      ver=$(python src/papers/bmodes/scripts/paper_config.py --config {inputs.selected_config} --scan-version ${version})
      cb=covariance_"$ver"_A_integration
      python src/papers/bmodes/scripts/compute_cosebis_pte_single.py \
        --config {inputs.selected_config} \
        --xi-integration "$x/$ver"_xi_minsep=0.5_maxsep=300.0_nbins=1000_npatch=1.txt \
        --cov-integration "$c/$cb/$cb"_processed.txt \
        --version $ver --blind A \
        --out-file {output}
      rm -rf "$x" "$c"
    # Mirrors the fiducial cosebis_pte_per_cut envelope exactly (8 cpus, 16GB,
    # 6h): a member is one version's run of that same 206-pair loop.
    resources: { cpus: 8, memory: "16GB" }

gather:
  id: cosebis_ptes_bundle
  type: data
  format: tar.gz
  description: |
    The ${n_members} scan members bundled flat under their
    July-canonical `cosebis_ptes_{ver}_{blind}.npz` names — the
    exact directory layout `config_space_pte_matrices.py` reads
    via `--cosebis-pte-dir`, adapting each gathered NPZ back to a
    per-pair PTE matrix through `_cosebis_matrix_from_npz`, so
    fiducial and sweep versions share provenance. Re-exported by
    [cosebis.cosebis_ptes](#../../outputs.cosebis_ptes); consumers
    untar it into a temp dir, unchanged from the July contract.
    The fiducial version is not a member — it stays in
    [cosebis_pte_per_cut](#../../outputs.cosebis_pte_per_cut) and
    reaches the heatmap through
    `--fiducial-cosebis-pte-path`.
  decisions: [fiducial_catalog, leakage_correction]
  recipe:
    command: >
      python src/papers/bmodes/scripts/bundle_sweep.py
      --layout cosebis_ptes --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
      --leakage-correction {decisions.leakage_correction}
      --names ${members}
      --members ${member_refs}
      --out-file {output}
    resources: { cpus: 1, memory: "4GB" }
