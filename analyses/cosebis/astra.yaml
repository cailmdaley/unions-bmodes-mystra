version: "0.0.14"
name: "COSEBI B-mode amplitudes"

inputs:
  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_integration_convergence
    from: ../two_point.xi_integration_convergence

  - id: xi_sweep
    from: ../two_point.xi_sweep

  - id: cov_integration_g
    from: ../covariance.cov_integration_g

  - id: cov_sweep
    from: ../covariance.cov_sweep

  - id: cl_bandpowers_fine
    from: ../cl_bb.cl_bandpowers_fine

  - id: cl_cov_fine
    from: ../covariance.cl_cov_fine

  # The pseudo-Cℓ sweep bundle: the harmonic COSEBI scan reads each
  # non-fiducial leak-corrected version's 96-bin bandpowers + covariance out
  # of it by canonical filename.
  - id: cl_sweep
    from: ../cl_bb.cl_sweep

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: print_width_script
    from: ../print_width_script

  - id: cosebis_version_comparison_script
    from: ../cosebis_version_comparison_script

outputs:
  - id: cosebis_modes_data
    type: data
    format: npz
    description: |
      NPZ for the [fiducial catalog](#../decisions.fiducial_catalog)
      at blind A holding the E_n / B_n vectors for n = 1 … 20, the
      mode covariance matrix obtained from the linear transform
      `T^T C_ξ T`, and the diagonal σ_n used for the B_n / σ_n
      normalisation in the paper figure. Rendered by
      [fig_cosebis_data_vector](#outputs.fig_cosebis_data_vector),
      which is the artifact behind the
      [paper data-vector figure](#../outputs.fig_cosebis_fiducial).
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention]
    inputs: [xi_integration, cov_integration_g]
    recipe:
      # cosebis_data_vector.py computes the fiducial E_n/B_n data vector and the
      # T^T C_xi T mode covariance at both scale cuts, writing the NPZ payload
      # directly to {output}. Upstream xi/cov arrive as declared lc inputs.
      # The paper figure is a separate declared output (fig_cosebis_data_vector).
      command: >
        python src/papers/bmodes/scripts/cosebis_data_vector.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: fig_cosebis_data_vector
    type: figure
    format: png
    description: |
      Paper Figure 3: the COSEBI B_n / σ_n data vector for the
      [fiducial catalog](#../decisions.fiducial_catalog) at blind A,
      n = 1 … 20, with the fiducial and full-range scale cuts shown.
      Rendered from the already-computed
      [cosebis_modes_data](#outputs.cosebis_modes_data) NPZ rather
      than recomputing the modes; the root
      [fig_cosebis_fiducial](#../outputs.fig_cosebis_fiducial)
      is this artifact.
    decisions: [fiducial_catalog, fiducial_blind, mode_subsets, scale_cut_convention]
    inputs: [cosebis_modes_data, paper_mplstyle, print_width_script]
    recipe:
      # Plot-only pass of the same CLI: reads the E_n/B_n/covariance payload back
      # from the modes NPZ and writes the single rendered PNG to {output}.
      command: >
        python src/papers/bmodes/scripts/cosebis_data_vector.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --plot-from-modes {inputs.cosebis_modes_data}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_pte_per_cut
    # NPZ for the fiducial catalog at blind A holding the COSEBI B_n PTE
    # matrices over the full scale-cut pair grid — all stable index pairs of
    # `geomspace(1', 250', 21)` from scale_cut_pair_grid — for both reported
    # mode subsets (n <= 6, n <= 20); the config-space PTE composite
    # (../outputs.fig_pte_heatmaps) assembles it with the pure-mode matrices.
    #
    # Re-export of the generated cosebis_pte_grid sweep's gather output — the
    # only edge into that sweep. The 206-pair loop was one lc output and the
    # wall-clock pole of the reproduction; it is now one member per i_min row
    # plus a gather that reassembles the identical NPZ, so every consumer is
    # unchanged. Regenerate with
    #   scripts/sweep_expand.py -o analyses/cosebis/analyses/cosebis_pte_grid/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_pte_grid/cosebis_pte_grid.sweep.yaml
    from: cosebis_pte_grid.cosebis_pte_matrix

  - id: cosebis_ptes
    # Re-export of the generated cosebis_pte_scan sweep's gather output — the
    # only edge into that sweep. Was a single serial output looping the seven
    # non-fiducial versions inside one recipe; each version is now its own lc
    # output and the gather rebuilds the identical tar.gz. Regenerate with
    #   scripts/sweep_expand.py \
    #       -o analyses/cosebis/analyses/cosebis_pte_scan/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_pte_scan/cosebis_pte_scan.sweep.yaml
    from: cosebis_pte_scan.cosebis_ptes_bundle

  - id: cosebis_binning_convergence
    type: figure
    format: png
    description: |
      One-shot 1000-bin vs 10,000-bin comparison of B_n and
      n ≤ 6 / n ≤ 20 PTEs for the
      [fiducial catalog](#../decisions.fiducial_catalog) at
      blind A. The null-test verdicts are stable between the
      grids (fiducial n ≤ 20 PTE 0.94 → 0.75; full range
      1.1e-4 → 4.1e-4) while individual high-n B_n move by up
      to ~1σ — a re-measurement effect (TreeCorr fine-bin pair
      placement) plus the interval convention, not filter
      quadrature, which is converged to ~1e-7σ at 1000 bins
      (see convergence.tenk_grid_comparison). Justifies 1000
      bins as the production integrand grid. Materialised once;
      not re-run per iteration.
    decisions: [fiducial_catalog, fiducial_blind, mode_subsets, scale_cut_convention]
    inputs: [xi_integration, xi_integration_convergence, cov_integration_g]
    recipe:
      # Diagnostic (not in the paper): cosebis_binning_comparison.py computes B_n
      # from the 1000-bin and 10000-bin integration grids and writes the single
      # rendered PNG to {output}. All three inputs are declared lc inputs.
      command: >
        python src/papers/bmodes/scripts/cosebis_binning_comparison.py
        --config src/papers/bmodes/config/config.yaml
        --xi-1k {inputs.xi_integration}
        --xi-10k {inputs.xi_integration_convergence}
        --cov-1k {inputs.cov_integration_g}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_version_comparison
    type: figure
    format: png
    description: |
      Per-mode B_n stack across the four leak-corrected catalog
      variants (size-cut, initial, masked, relaxed-flags),
      contributing the COSEBI row of the
      [paper Figure 5 version composite
      ](#../outputs.fig_versions_cosebis). Uncorrected variants
      are not stacked — the comparison plot is leak-corrected
      only.
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention]
    inputs: [xi_sweep, cov_sweep, xi_integration, cov_integration_g, paper_mplstyle, print_width_script, cosebis_version_comparison_script]
    recipe:
      # cosebis_version_comparison.py overlays B_n across the 4 leak-corrected
      # catalogs. The version sweep lives inside the plotter: it reconstructs each
      # version's integration-grid xi and Gaussian covariance by the canonical
      # naming pattern from the unpacked sweep bundles and recomputes COSEBIs per
      # version. Writes the single stacked PNG to {output}.
      command: >
        x=$(mktemp -d) && c=$(mktemp -d) &&
        tar xzf {inputs.xi_sweep} -C $x &&
        tar xzf {inputs.cov_sweep} -C $c &&
        python src/papers/bmodes/scripts/cosebis_version_comparison.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $x
        --cov-dir $c
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration_g}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_modes
    type: data
    format: npz
    description: |
      Harmonic-path B_n via paper Eq. 19, summing FFT-log
      Fourier-dual W_n(ℓ) filters against the 96-bin √ℓ-linear
      pseudo-Cℓ bandpowers
      ([harmonic_validation_binning](#decisions.harmonic_validation_binning)).
      Compared mode-by-mode against the angular-space
      [cosebis_modes_data](#outputs.cosebis_modes_data) for
      the [paper cross-check figure
      ](#../outputs.fig_harmonic_config_cosebis); GLASS
      validation underwrites the agreement at n ≤ 6. The NPZ
      carries E_n/B_n/covariance for both paths at both scale
      cuts; the PTE/χ² summary is promoted to
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics).
      The 96-bin pseudo-Cℓ input is
      [cl_bandpowers_fine](#inputs.cl_bandpowers_fine).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cl_bandpowers_fine, cl_cov_fine, xi_integration, cov_integration_g]
    recipe:
      # harmonic_config_cosebis_comparison.py computes the harmonic-path (96-bin
      # pseudo-Cl -> cosebis_from_Cell, Eq. 19) and config-path COSEBIs for the
      # fiducial catalog at both scale cuts, writing the En/Bn/cov NPZ for both
      # paths to {output}. The combined Figure 8 render is the root
      # fig_harmonic_config_cosebis output; the PTE dict is the metrics output.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --angular-range fiducial --blind A
        --fiducial-version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_fine}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_fine}
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration_g}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_metrics
    type: metric
    format: json
    description: |
      The `harmonic_b_mode_ptes` / `config_b_mode_ptes` PTE + χ²
      dictionaries for the fiducial angular range, extracted from
      the same run that produces
      [cosebis_harmonic_modes](#outputs.cosebis_harmonic_modes).
      Promoted from the July `evidence.json` because the report
      discussion consumes these values directly (`{astra:value}`
      references against
      [cosebis_harmonic_config](#../outputs.cosebis_harmonic_config)).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes]
    recipe:
      # Metrics-only pass: reads the modes NPZ back and emits the PTE/chi2 JSON.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --angular-range fiducial --blind A
        --metrics-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_modes_full
    type: data
    format: npz
    description: |
      Full-angular-range twin of
      [cosebis_harmonic_modes](#outputs.cosebis_harmonic_modes):
      the same harmonic-path Eq. 19 vs. config-path COSEBI
      cross-check, run with `--angular-range full` instead of
      `fiducial`. Feeds the [full-range cross-check
      figure](#../outputs.fig_harmonic_config_cosebis_full)
      (paper Figure 8, `fig:harmonic_config_cosebis_full`); its
      PTE payload is
      [cosebis_harmonic_metrics_full](#outputs.cosebis_harmonic_metrics_full).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cl_bandpowers_fine, cl_cov_fine, xi_integration, cov_integration_g]
    recipe:
      # Same CLI as cosebis_harmonic_modes, --angular-range full instead of
      # fiducial. Identical inputs; only the flag differs.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --angular-range full --blind A
        --fiducial-version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_fine}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_fine}
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration_g}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_metrics_full
    type: metric
    format: json
    description: |
      Full-range twin of
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics).
      The script computes both scale cuts internally per invocation
      (the NPZ payload already carries `full_*`/`fiducial_*` fields
      either way), but the `harmonic_b_mode_ptes` /
      `config_b_mode_ptes` PTE + χ² dicts are keyed to whichever cut
      was passed via `--angular-range`. This is the only carrier for
      the harmonic-space full-range COSEBI PTE
      ([harmCosebisPteSixThreeFull](#../findings.cosebis_full_range_failure),
      quoted in the paper §5) and its χ², and (redundantly with
      [null_tests.config_space_pte_evidence](#../null_tests.outputs.config_space_pte_evidence))
      the config-space full-range COSEBI χ² — see
      `work/transpile-map.md` §2c/§2d for the gap this closes.
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes_full]
    recipe:
      # Metrics-only pass on the full-range modes NPZ.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --angular-range full --blind A
        --metrics-from-modes {inputs.cosebis_harmonic_modes_full}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_version_ptes
    # Re-export of the generated cosebis_harmonic_scan sweep's gather output —
    # the only edge into that sweep. Restores the non-fiducial leak-corrected
    # versions' harmonic COSEBI B-mode PTEs, which the root
    # `cosebis_harmonic_config` table needs and which the per-version compute
    # split had reduced to the fiducial row alone. Regenerate with
    #   scripts/sweep_expand.py \
    #       -o analyses/cosebis/analyses/cosebis_harmonic_scan/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_harmonic_scan/cosebis_harmonic_scan.sweep.yaml
    from: cosebis_harmonic_scan.cosebis_harmonic_version_ptes

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  mode_count:
    label: "Number of COSEBI modes computed"
    tags: [cosebis, modes]
    rationale: |
      n_max = 20 is the production mode count: the orthogonal
      basis fully covers the ξ_±(θ) information on
      [θ_min, θ_max] in the limit n → ∞, but the cosmological
      E-mode amplitude saturates by n ≈ 5–6 at this survey's
      depth (paper §3.2). 20 modes is therefore conservative
      relative to information saturation while staying inside
      the numerically stable regime — beyond ~25 modes,
      polynomial-root accuracy in the T_{±n} construction
      degrades on standard double precision. Lower mode counts
      exclude information needed for the full-range
      oscillatory diagnostic the paper reports as
      [the COSEBI failure signature
      ](#../findings.cosebis_full_range_failure).
    default: n_max_20
    options:
      n_max_20:
        label: "20 modes (paper fiducial)"
      n_max_15:
        label: "15 modes"
        description: |
          Drops information at the high-n end where the
          full-range repeating-additive signature is most
          visible.
      n_max_30:
        label: "30 modes"
        description: |
          Polynomial-root construction degrades; not used.
        excluded: true
        excluded_reason: |
          Numerical instability at n > 25 in the T_{±n}
          double-precision construction.

  mode_subsets:
    label: "PTE-reported mode subsets"
    tags: [cosebis, statistics, primary]
    rationale: |
      The paper reports COSEBI PTEs for two mode subsets: n ≤ 6
      and n ≤ 20. n ≤ 6 is the cosmologically informative range
      where the E-mode amplitude has saturated; PTEs in this
      subset weight the modes most likely to carry residual
      systematic content visible at the survey-deep angular
      scales the paper probes. n ≤ 20 reports the full
      orthogonal basis for transparency, especially for the
      full-range oscillatory pattern that motivates the lower
      angular cut. Subsets larger than 20 are not exposed
      because the [mode count](#decisions.mode_count) is
      capped at 20.
    default: n_le_6_and_n_le_20
    options:
      n_le_6_and_n_le_20:
        label: "Both subsets (paper fiducial)"
      n_le_6_only:
        label: "n ≤ 6 only"
        description: |
          Hides the n ≤ 20 transparency check; not used by the
          paper but exposed for sensitivity analyses.
      n_le_20_only:
        label: "n ≤ 20 only"
        description: |
          Hides the cosmologically informative subset; not
          used.

  harmonic_validation_binning:
    label: "Pseudo-Cℓ bandpower count for the harmonic COSEBI path"
    tags: [cosebis, harmonic, validation]
    rationale: |
      The harmonic-path COSEBI evaluation (paper Eq. 19) sums
      the W_n(ℓ) filters against pseudo-Cℓ bandpowers. The bin
      count balances two competing requirements: too few bins
      cannot resolve the W_n(ℓ) oscillations at high n, while
      too many bins lead to an unstable mode-coupling matrix
      deconvolution at the NaMaster step. 96 √ℓ-linear bins
      were chosen and validated on GLASS simulations to
      recover the n ≤ 6 angular-space modes within 2%
      (paper §3.2). 32 bins (the harmonic-space PTE binning,
      [cl_bb](#../analyses.cl_bb)) cannot resolve the
      oscillations beyond n ≈ 4 and is reserved for the
      Cℓ^BB null test itself.
    default: bins_96
    options:
      bins_96:
        label: "96 √ℓ-linear bandpowers (paper fiducial)"
      bins_128:
        label: "128 √ℓ-linear bandpowers"
        description: |
          Higher resolution, but the W_n(ℓ) oscillation
          benefit saturates and the deconvolution is
          incrementally less stable; <1% gain.
      bins_32:
        label: "32 √ℓ-linear bandpowers (cl_bb fiducial)"
        excluded: true
        excluded_reason: |
          Insufficient resolution for W_n(ℓ) at n > 4; would
          break the harmonic cross-check the paper reports.

  scale_cut_pair_grid:
    label: "Scale-cut pair grid for COSEBI PTE matrices"
    tags: [cosebis, scale_cuts, statistics]
    rationale: |
      The scatter-gather PTE pipeline evaluates COSEBIs over a
      grid of [i_min, i_max] index pairs of the 21-bin
      `geomspace(1', 250')` reporting grid, excluding numerically
      unstable subsets where the polynomial-root construction
      of T_{±n}(θ) fails (the (9, 10), (10, 11), (11, 12), (13,
      14) pairs in the production list `PTE_SCALE_CUT_PAIRS`).
      The grid is dense enough to render the
      [PTE composite figure](#../outputs.fig_pte_heatmaps) at
      the resolution the paper shows; it is not exhaustive
      because the unstable pairs would inject NaNs into the
      composite without informational gain.
    default: production_grid
    options:
      production_grid:
        label: "Stable index pairs of geomspace(1', 250', 21) (paper fiducial)"
        description: |
          ~110 stable pairs; excludes (9,10), (10,11), (11,12),
          (13,14) for polynomial-root instability. Defined in
          the source Snakefile as `PTE_SCALE_CUT_PAIRS`.
      single_fiducial_pair:
        label: "Single fiducial pair only (i=9, j=16)"
        description: |
          Reports only the
          [adopted 12'–83' fiducial cut
          ](#../decisions.fiducial_scale_cuts); hides scale-cut
          sensitivity — not used by the paper, but exposed
          as a multiverse minimal cut.

analyses:

  cosebis_harmonic_scan:
    path: ./analyses/cosebis_harmonic_scan

  cosebis_pte_scan:
    path: ./analyses/cosebis_pte_scan

  cosebis_pte_grid:
    path: ./analyses/cosebis_pte_grid
