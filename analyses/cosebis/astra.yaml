version: "0.0.14"
name: "COSEBI B-mode amplitudes"

inputs:
  - id: primary_report_script
    type: data
    source: ./src/papers/bmodes/scripts/primary_null_test_report.py
    description: Selects the reported test family and recalibrates its minimum.
  - id: mock_min_pte_calibration
    from: ../glass_mocks.mock_min_pte_calibration
  - id: mock_per_mock_statistics
    from: ../glass_mocks.mock_per_mock_statistics
  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_sweep
    from: ../two_point.xi_sweep

  - id: cov_integration
    from: ../covariance.cov_integration

  - id: cov_sweep
    from: ../covariance.cov_sweep

  - id: cl_bandpowers_fine
    from: ../cl_bb.cl_bandpowers_fine

  - id: cl_cov_fine
    from: ../covariance.cl_cov_fine

  # The pseudo-Cℓ sweep bundle: the harmonic COSEBI scan reads each
  # non-fiducial leak-corrected version's 96-bin bandpowers + covariance out
  # of it by canonical filename.
  - id: cl_sweep
    from: ../cl_bb.cl_sweep

  - id: cosebis_version_comparison_script
    from: ../cosebis_version_comparison_script

  - id: numerics_script
    from: ../numerics_script

  - id: decision_values_script
    from: ../decision_values_script

  - id: scale_cuts_script
    from: ../scale_cuts_script

  - id: catalog_versions_script
    from: ../catalog_versions_script

  - id: mock_min_pte_calibration_script
    from: ../mock_min_pte_calibration_script

  - id: harmonic_config_cosebis_comparison_figure_script
    from: ../harmonic_config_cosebis_comparison_figure_script

  - id: compute_cosebis_pte_single_script
    from: ../compute_cosebis_pte_single_script

outputs:
  - id: primary_null_test_report
    type: metric
    format: json
    description: |
      Primary reported range and COSEBI test-family selection, with the global
      minimum-PTE threshold recalibrated from the stored mock PTE columns.
      The complete six-test, two-range evidence remains available for comparison.
    inputs: [mock_min_pte_calibration, mock_per_mock_statistics, primary_report_script, numerics_script, decision_values_script, scale_cuts_script, mock_min_pte_calibration_script]
    decisions: [fiducial_scale_cuts, mode_subsets]
    recipe:
      command: >
        python src/papers/bmodes/scripts/primary_null_test_report.py
        --calibration {inputs.mock_min_pte_calibration}
        --per-mock-statistics {inputs.mock_per_mock_statistics}
        --fiducial-scale-cuts {decisions.fiducial_scale_cuts}
        --mode-subsets {decisions.mode_subsets}
        --out-file {output}
      resources: { cpus: 1, memory: "2GB" }

  - id: cosebis_modes_data
    type: data
    format: npz
    description: |
      COSEBI E_n and B_n (n = 1 … 20) for the
      [fiducial catalog](#../decisions.fiducial_catalog) at both scale
      cuts, with the mode covariance T^T C_ξ T and the σ_n that
      normalise B_n / σ_n in the
      [COSEBI data-vector figure](#../outputs.fig_cosebis_fiducial).
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention, pte_definition, leakage_correction, reporting_binning, integration_grid]
    inputs: [xi_integration, cov_integration, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      command: >
        python src/papers/bmodes/scripts/cosebis_data_vector.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: fig_cosebis_data_vector
    type: figure
    format: png
    description: |
      COSEBI B-mode amplitudes for the [fiducial
      catalog](#../decisions.fiducial_catalog), normalized by
      uncertainty (B_n/σ_n), at the fiducial scale cuts of 12–83 arcmin
      (filled circles) and over the full angular range of 1–250 arcmin
      (open diamonds). Modes n > 6 are shaded; the n ≤ 6 subset captures
      nearly all cosmological information.
    decisions: [fiducial_catalog, fiducial_blind, scale_cut_convention]
    inputs: [cosebis_modes_data, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      # Plot-only pass of the same CLI.
      command: >
        python src/papers/bmodes/scripts/cosebis_data_vector.py
        --plot-from-modes {inputs.cosebis_modes_data}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_pte_per_cut
    # NPZ for the fiducial catalog at blind A holding the COSEBI B_n PTE
    # matrices over the full scale-cut pair grid — all stable index pairs of
    # `geomspace(1', 250', 21)` from scale_cut_pair_grid — for both reported
    # mode subsets (n <= 6, n <= 20); the config-space PTE composite
    # (../outputs.fig_pte_heatmaps) assembles it with the pure-mode matrices.
    #
    # Re-export of the generated cosebis_pte_grid sweep's gather output — the
    # only edge into that sweep: one member per i_min row plus a gather that
    # assembles the NPZ. Regenerate with
    #   scripts/sweep_expand.py -o analyses/cosebis/analyses/cosebis_pte_grid/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_pte_grid/cosebis_pte_grid.sweep.yaml
    from: cosebis_pte_grid.cosebis_pte_matrix

  - id: cosebis_ptes
    # Re-export of the generated cosebis_pte_scan sweep's gather output — the
    # only edge into that sweep: one member per non-fiducial version plus a
    # gather into one tar.gz. Regenerate with
    #   scripts/sweep_expand.py \
    #       -o analyses/cosebis/analyses/cosebis_pte_scan/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_pte_scan/cosebis_pte_scan.sweep.yaml
    from: cosebis_pte_scan.cosebis_ptes_bundle

  - id: cosebis_version_comparison
    type: figure
    format: png
    description: |
      B-mode data vectors across catalog versions: initial (red
      circles), size-cut/fiducial (gold squares), masked (teal
      diamonds), and relaxed-flags (purple triangles). Rectangles
      delineate each bin in the horizontal direction and span the range
      of values across versions in the vertical direction; horizontal
      lines mark the fiducial value. COSEBI B-mode amplitudes B_n/σ_n at
      full range (upper) and fiducial cuts (lower). Only the size-cut
      catalog passes all statistics at the fiducial scale cuts ([PTE
      table](#../outputs.pte_table_appendix)).
    decisions: [fiducial_catalog, fiducial_blind, mode_count, scale_cut_convention, pte_definition, leakage_correction, reporting_binning, integration_grid]
    inputs: [xi_sweep, cov_sweep, xi_integration, cov_integration, cosebis_version_comparison_script, numerics_script, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      # The plotter recomputes COSEBIs per version from the unpacked xi and
      # covariance sweep bundles, found by canonical filename.
      command: >
        x=$(mktemp -d) && c=$(mktemp -d) &&
        tar xzf {inputs.xi_sweep} -C $x &&
        tar xzf {inputs.cov_sweep} -C $c &&
        python src/papers/bmodes/scripts/cosebis_version_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --results-dir $x
        --cov-dir $c
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_modes
    type: data
    format: npz
    description: |
      COSEBI E_n, B_n and covariance at both scale cuts from two
      paths: the harmonic path, summing the FFT-log W_n(ℓ) filters
      against the 96-bin pseudo-Cℓ bandpowers
      ([cl_bandpowers_fine](#inputs.cl_bandpowers_fine);
      [harmonic_validation_binning](#decisions.harmonic_validation_binning)),
      and the configuration path of
      [cosebis_modes_data](#outputs.cosebis_modes_data). Feeds the
      [harmonic/configuration cross-check figure](#../outputs.fig_harmonic_config_cosebis_full);
      PTEs are in
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention, pte_definition, leakage_correction, reporting_binning, integration_grid, mode_count]
    inputs: [cl_bandpowers_fine, cl_cov_fine, xi_integration, cov_integration, numerics_script, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --angular-range fiducial --blind {decisions.fiducial_blind}
        --harmonic-validation-binning {decisions.harmonic_validation_binning}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_fine}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_fine}
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_metrics
    type: metric
    format: json
    description: |
      COSEBI B-mode χ² and PTEs at the fiducial scale cuts for the
      harmonic and configuration paths of
      [cosebis_harmonic_modes](#outputs.cosebis_harmonic_modes),
      quoted in the
      [harmonic/configuration COSEBI table](#../outputs.cosebis_harmonic_config).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes, numerics_script, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      # Metrics-only pass: reads the modes NPZ back and emits the PTE/chi2 JSON.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range fiducial
        --metrics-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_modes_full
    type: data
    format: npz
    description: |
      [cosebis_harmonic_modes](#outputs.cosebis_harmonic_modes) over
      the full angular range, for the
      [full-range cross-check figure](#../outputs.fig_harmonic_config_cosebis_full);
      PTEs are in
      [cosebis_harmonic_metrics_full](#outputs.cosebis_harmonic_metrics_full).
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention, pte_definition, leakage_correction, reporting_binning, integration_grid, mode_count]
    inputs: [cl_bandpowers_fine, cl_cov_fine, xi_integration, cov_integration, numerics_script, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      # Same CLI as cosebis_harmonic_modes, --angular-range full instead of
      # fiducial. Identical inputs; only the flag differs.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning} --integration-grid {decisions.integration_grid} --mode-count {decisions.mode_count}
        --angular-range full --blind {decisions.fiducial_blind}
        --harmonic-validation-binning {decisions.harmonic_validation_binning}
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pseudo-cl-path {inputs.cl_bandpowers_fine}
        --fiducial-pseudo-cl-cov-path {inputs.cl_cov_fine}
        --fiducial-xi-path {inputs.xi_integration}
        --fiducial-cov-path {inputs.cov_integration}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 8, memory: "16GB" }

  - id: cosebis_harmonic_metrics_full
    type: metric
    format: json
    description: |
      [cosebis_harmonic_metrics](#outputs.cosebis_harmonic_metrics)
      over the full angular range: the harmonic-path full-range COSEBI
      PTE behind the
      [CCD-scale COSEBI pattern](#../findings.ccd_scale_cosebi_pattern)
      and the configuration-path χ².
    decisions: [fiducial_catalog, fiducial_blind, harmonic_validation_binning, scale_cut_convention]
    inputs: [cosebis_harmonic_modes_full, numerics_script, decision_values_script, scale_cuts_script, catalog_versions_script]
    recipe:
      # Metrics-only pass on the full-range modes NPZ.
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range full
        --metrics-from-modes {inputs.cosebis_harmonic_modes_full}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

  - id: cosebis_harmonic_version_ptes
    # Re-export of the generated cosebis_harmonic_scan sweep's gather output —
    # the only edge into that sweep: harmonic COSEBI B-mode PTEs of the
    # non-fiducial leak-corrected versions for the root
    # `cosebis_harmonic_config` table. Regenerate with
    #   scripts/sweep_expand.py \
    #       -o analyses/cosebis/analyses/cosebis_harmonic_scan/astra.yaml \
    #       analyses/cosebis/analyses/cosebis_harmonic_scan/cosebis_harmonic_scan.sweep.yaml
    from: cosebis_harmonic_scan.cosebis_harmonic_version_ptes

decisions:
  pte_definition:
    from: ../pte_definition
  leakage_correction:
    from: ../leakage_correction

  fiducial_scale_cuts:
    from: ../fiducial_scale_cuts

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  mode_count:
    from: ../mode_count

  mode_subsets:
    label: "PTE-reported mode subsets"
    tags: [estimator]
    rationale: |
      n ≤ 6 is the cosmologically informative range, where the
      E-mode amplitude has saturated; n ≤ 20 tests the B modes over
      the full computed basis, which matters for the full-range
      oscillatory pattern that motivates the lower angular cut.
      The selection acts in [primary_null_test_report](#outputs.primary_null_test_report),
      recalibrating its minimum from the selected stored mock PTE columns;
      the complete reference products and mode-vector figures retain both subsets.
      Larger subsets are unavailable because the
      [mode count](#decisions.mode_count) is 20.
    default: n_le_6_and_n_le_20
    options:
      n_le_6_and_n_le_20:
        label: "Both subsets (fiducial)"
        insights: [asgari12_few_cosebis_modes_saturate_information, asgari19a_cosebis_nmax20_for_systematics]
      n_le_6_only:
        label: "n ≤ 6 only"
        description: |
          Drops the n ≤ 20 test.
      n_le_20_only:
        label: "n ≤ 20 only"
        description: |
          Drops the cosmologically informative subset.

  harmonic_validation_binning:
    from: ../harmonic_validation_binning

  scale_cut_pair_grid:
    label: "COSEBI PTE scale-cut grid"
    tags: [scale_cuts]
    rationale: |
      The COSEBI PTE matrix is evaluated on every [i_min, i_max] pair
      of edges of the 20-bin `geomspace(1', 250', 21)` reporting
      grid, to show sensitivity to the scale cut in the
      [PTE composite figure](#../outputs.fig_pte_heatmaps). Four
      pairs, (9, 10), (10, 11), (11, 12) and (13, 14), are excluded
      because the polynomial-root construction of T_{±n}(θ) fails
      on them.
    default: production_grid
    options:
      production_grid:
        label: "Stable index pairs of geomspace(1', 250', 21) (fiducial)"
        description: |
          206 pairs: all 210 edge pairs minus the four unstable ones.
      single_fiducial_pair:
        excluded: true
        excluded_reason: "Full-range PTE reporting and mock calibration require the full-range cell absent from this grid."
        label: "Single fiducial pair only (i=9, j=16)"
        description: |
          Only the
          [adopted 12'–83' fiducial cut](#../decisions.fiducial_scale_cuts);
          no scale-cut sensitivity.
  integration_grid:
    from: ../integration_grid
  reporting_binning:
    from: ../reporting_binning

analyses:

  cosebis_harmonic_scan:
    path: ./analyses/cosebis_harmonic_scan

  cosebis_pte_scan:
    path: ./analyses/cosebis_pte_scan

  cosebis_pte_grid:
    path: ./analyses/cosebis_pte_grid

prior_insights:

  asgari12_few_cosebis_modes_saturate_information:
    id: asgari12_few_cosebis_modes_saturate_information
    claim: |
      A relatively small number of COSEBI modes always saturates the
      available cosmological information, fewer for logarithmic than
      for linear COSEBIs. Restricting the cosmologically informative
      PTE subset to the first few modes loses no E-mode information.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201218828"
        quote:
          exact: "We find that a relatively small number of COSEBIs modes is always enough to saturate to the maximum information level."
        location:
          page: 1
    scope: |
      Fisher forecasts (Asgari, Schneider & Simon 2012); the
      saturation point depends on survey and parameters, and Paper
      II's n ≈ 5–6 comes from its own E-mode data vector.

  asgari19a_cosebis_nmax20_for_systematics:
    id: asgari19a_cosebis_nmax20_for_systematics
    claim: |
      COSEBI E-mode predictions vanish beyond the first ~7 modes, so
      high modes carry no cosmological information, but systematic
      signals need not follow that behaviour and can be significant
      at large n. Truncating at n = 20 covers both the cosmological
      and the systematic-diagnostic range.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "Therefore, we do not expect to gain any cosmological information from these modes."
        location:
          page: 7
      - id: ev2
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "On the other hand the signal from systematic effects does not necessarily follow the same behaviour."
        location:
          page: 7
      - id: ev3
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "which encompasses modes that are important for both cosmological and systematic analyses."
        location:
          page: 7
    scope: |
      COSEBI B-mode analysis of KiDS-450, DES-SV and CFHTLenS
      (Asgari et al. 2019a, §4); same n_max = 20 as Paper II.
