version: "0.0.14"
name: "Pure E/B-mode decomposition"
description: |
  Decomposes the measured ξ_± into pure E, pure B and ambiguous modes
  with the Schneider et al. (2022) transform, propagates their
  covariance, and evaluates B-mode χ² PTEs over every window of
  reporting bins, for the fiducial catalog and across catalog versions.
  It stands on its own as the null test localized in angular
  separation, which shows where in θ any B modes sit.

inputs:
  - id: xi_reporting
    from: ../two_point.xi_reporting

  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_sweep
    from: ../two_point.xi_sweep

  - id: cov_integration
    from: ../covariance.cov_integration

  - id: cov_reporting_ng
    from: ../covariance.cov_reporting_ng

  - id: cov_sweep
    from: ../covariance.cov_sweep

  # n(z) enters only the Monte Carlo covariance, whose draws of ξ_± scatter
  # about a theory mean built from each catalog's n(z); the exact covariance
  # does not read it. The masked (v1.4.8) and relaxed-flags (v1.4.11.3)
  # catalogs in the sweep use the pre-SOM n(z).
  - id: redshift_distributions
    from: ../redshift_distributions

  - id: redshift_distributions_legacy
    from: ../redshift_distributions_legacy

outputs:
  - id: pure_eb_semianalytic_data
    type: data
    description: |
      Pure E/B data vectors ξ_±^{E,B,amb} for the fiducial catalog
      (blind A) on the 20-bin reporting grid, with their 120×120
      covariance (six 20-bin blocks) built by the selected
      [covariance method](#decisions.pure_eb_covariance_method).
      The file records that construction (and the draw count, for
      the Monte Carlo) so χ² consumers apply the matching Hartlap
      treatment. The
      [pure-mode PTE matrix](#outputs.pure_eb_pte_per_cut)
      uses its B-mode block.
    format: npz
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method, leakage_correction]
    inputs: [xi_reporting, xi_integration, cov_integration, redshift_distributions]
    recipe:
      command: >
        bash src/papers/bmodes/scripts/run_pure_eb_semianalytic.sh
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration}
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})"
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_data_vector_figure
    type: figure
    description: |
      Pure E/B decomposition (Schneider et al. 2022) of the measured
      ξ_+ (left) and ξ_- (right) for the [fiducial
      catalog](#../decisions.fiducial_catalog), plotted as θξ × 10⁴:
      total (black circles), E mode (blue squares), B mode (crimson
      crosses) and ambiguous (grey triangles). B modes should vanish
      for pure lensing and so diagnose systematics; ambiguous modes
      capture boundary effects from the finite angular range. Error
      bars on the total come from the
      [reporting-grid CosmoCov covariance](#inputs.cov_reporting_ng),
      those on the modes from the pure-mode covariance. Grey shading
      marks scales outside the fiducial cuts.
    format: png
    decisions: [fiducial_catalog, scale_cut_convention, pte_definition, leakage_correction, fiducial_blind, reporting_binning]
    inputs: [pure_eb_semianalytic_data, cov_reporting_ng]
    recipe:
      command: >
        python src/papers/bmodes/scripts/pure_eb_data_vector.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind} --reporting-binning {decisions.reporting_binning}
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --reporting-cov {inputs.cov_reporting_ng}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  - id: pure_eb_covariance_figure
    type: figure
    description: |
      Correlation matrix of the pure E/B covariance for the [fiducial
      catalog](#../decisions.fiducial_catalog), propagated from the
      CosmoCov ξ_± covariance, in six 20-bin blocks: ξ_+^E,
      ξ_-^E, ξ_+^B, ξ_-^B, ξ_+^amb, ξ_-^amb. Off-diagonal correlations
      arise from integral coupling in the pure-mode filters.
    format: png
    decisions: [fiducial_catalog, leakage_correction]
    inputs: [pure_eb_semianalytic_data]
    recipe:
      command: >
        python src/papers/bmodes/scripts/pure_eb_covariance.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --out-file {output}

  - id: pure_eb_version_comparison_figure
    type: figure
    description: |
      Pure-mode data vectors across catalog versions: initial (red
      circles), size-cut/fiducial (olive squares), masked (teal
      diamonds) and relaxed-flags (purple triangles). Upper panels show
      the total θξ_+ and θξ_-, with the pure E-mode σ as error bars;
      lower panels the B modes ξ_±^B/σ. Rectangles span the range
      across versions in each bin, horizontal lines mark the fiducial
      value, and grey shading marks scales outside the fiducial cuts.
      Only the size-cut catalog passes all statistics at the fiducial
      scale cuts ([PTE table](#../outputs.pte_table_appendix)).
    format: png
    decisions: [scale_cut_convention, pte_definition, fiducial_catalog, leakage_correction, fiducial_blind, reporting_binning]
    inputs: [pure_eb_semianalytic_data, pure_eb_sweep]
    recipe:
      command: >
        d=$(mktemp -d) && tar xzf {inputs.pure_eb_sweep} -C $d &&
        python src/papers/bmodes/scripts/pure_eb_version_comparison.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --blind {decisions.fiducial_blind} --reporting-binning {decisions.reporting_binning}
        --results-dir $d
        --fiducial-version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})"
        --fiducial-pure-eb-data {inputs.pure_eb_semianalytic_data}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  - id: pure_eb_pte_per_cut
    type: data
    description: |
      ξ_+^B, ξ_-^B and joint ξ_tot^B χ² PTE matrices for the
      fiducial catalog (blind A) over every (θ_min, θ_max) index pair
      of the 20-bin `geomspace(1', 250', 21)` grid; the COSEBI
      [scale-cut pair grid](#../analyses.cosebis) is a subset of it.
      The χ² applies the [Hartlap finite-sample
      correction](#decisions.pure_eb_covariance_method) when the
      covariance is a Monte Carlo estimate and none when it is exact.
    format: npz
    decisions: [fiducial_catalog, fiducial_blind, pte_blind_strategy, pte_definition, leakage_correction]
    inputs: [pure_eb_semianalytic_data, cov_integration]
    recipe:
      # The χ² uses the B-mode blocks of the pure-mode covariance. The
      # integration covariance is passed but its contents are not read.
      command: >
        python src/papers/bmodes/scripts/calculate_pure_eb_ptes.py
        --version "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction})" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --cov-integration {inputs.cov_integration}
        --npatch 1
        --out-file {output}

  - id: pure_eb_sweep
    type: data
    description: |
      Pure E/B data vectors and covariances for the seven
      non-fiducial catalog versions (the other three variants with and
      without the leakage correction, and the fiducial variant with
      the opposite treatment), one `{ver}_A_pure_eb_semianalytic.npz`
      each, built as
      [pure_eb_semianalytic_data](#outputs.pure_eb_semianalytic_data)
      is, under the same
      [covariance method](#decisions.pure_eb_covariance_method), from
      that version's ξ_± ([xi_sweep](#../two_point.outputs.xi_sweep))
      and Gaussian integration covariance
      ([cov_sweep](#../covariance.outputs.cov_sweep)). Feeds the
      [version comparison](#outputs.pure_eb_version_comparison_figure).
    format: tar.gz
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method, mc_samples, decomposition_method, leakage_correction]
    inputs: [xi_sweep, cov_sweep, redshift_distributions, redshift_distributions_legacy]
    recipe:
      command: >
        x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x &&
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c &&
        o=$(mktemp -d) &&
        bash src/papers/bmodes/scripts/run_pure_eb_sweep.sh
        --versions "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --nonfiducial)" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-sweep-dir $x
        --cov-sweep-dir $c
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --n-samples "$(python src/workflow/scripts/decision_values.py mc_samples {decisions.mc_samples})"
        --out $o
        && tar czf {output} -C $o .
      resources: { cpus: 16, memory: "60GB" }

  - id: pure_eb_ptes
    type: data
    description: |
      Pure-mode PTE matrices (ξ_+^B, ξ_-^B, joint ξ_tot^B over the
      (θ_min, θ_max) scale-cut grid) for the seven catalog versions of
      [pure_eb_sweep](#outputs.pure_eb_sweep), one
      `{ver}_A_pure_eb_ptes.npz` each, computed as
      [pure_eb_pte_per_cut](#outputs.pure_eb_pte_per_cut) is, with the
      [covariance-dependent Hartlap
      treatment](#decisions.pure_eb_covariance_method), from that
      version's data vector and pure-mode covariance. Feeds the
      per-version [PTE
      heatmaps](#../outputs.fig_pte_heatmaps).
    format: tar.gz
    decisions: [fiducial_catalog, fiducial_blind, pte_blind_strategy, pte_definition, leakage_correction]
    inputs: [pure_eb_sweep, cov_sweep]
    recipe:
      command: >
        p=$(mktemp -d) && tar xzf {inputs.pure_eb_sweep} -C $p &&
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c &&
        o=$(mktemp -d) &&
        bash src/papers/bmodes/scripts/run_pure_eb_ptes_sweep.sh
        --versions "$(python src/papers/bmodes/scripts/catalog_versions.py {decisions.fiducial_catalog} {decisions.leakage_correction} --nonfiducial)" --blind "$(python src/workflow/scripts/decision_values.py fiducial_blind {decisions.fiducial_blind})"
        --cat-config src/cosmo_val/cat_config.yaml
        --pure-eb-sweep-dir $p
        --cov-sweep-dir $c
        --out $o
        && tar czf {output} -C $o .
      resources: { cpus: 4, memory: "16GB" }

decisions:
  pte_definition:
    from: ../pte_definition

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  pure_eb_integration_method:
    from: ../pure_eb_integration_method

  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights

  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits

  pure_eb_covariance_method:
    from: ../pure_eb_covariance_method

  mc_samples:
    from: ../mc_samples

  decomposition_method:
    from: ../decomposition_method

  pte_blind_strategy:
    from: ../pte_blind_strategy
  leakage_correction:
    from: ../leakage_correction
  reporting_binning:
    from: ../reporting_binning

prior_insights:

  hartlap07_correction:
    id: hartlap07_correction
    claim: |
      For an inverse covariance estimated from N independent
      Gaussian samples on a data vector of length p, the
      maximum-likelihood inverse is biased; the unbiased
      estimator multiplies it by (N - p - 2) / (N - 1). For
      semi-analytical (theory) covariances the correction does
      not apply because no sample uncertainty enters.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361:20066170"
        quote:
          exact: |
            We find that the inverse of the maximum-likelihood
            estimator of the covariance is biased, the amount of
            bias depending on the ratio of the number of bins
            (data vector variables), p, to the number of data
            sets, n. This bias inevitably leads to an -- in
            extreme cases catastrophic -- underestimation of
            the size of the confidence regions.
          prefix: "Methods. We perform Monte-Carlo simulations to investigate the behaviour of estimators for the inverse covariance matrix"
          suffix: "We report on a method to remove this bias for the idealised case of Gaussian errors and statistically independent data vectors."
        location:
          page: 1
    scope: "Sample covariances of Gaussian data, not theory covariances (Hartlap et al. 2007, Eq. 17)."

