version: "0.0.14"
name: "Pure E/B-mode decomposition"

inputs:
  - id: xi_reporting
    from: ../two_point.xi_reporting

  - id: xi_integration
    from: ../two_point.xi_integration

  - id: xi_sweep
    from: ../two_point.xi_sweep

  - id: cov_integration_g
    from: ../covariance.cov_integration_g

  - id: cov_reporting_ng
    from: ../covariance.cov_reporting_ng

  - id: cov_sweep
    from: ../covariance.cov_sweep

  # The n(z) trees. `precompute_pure_eb_chunk.py` — the MC-propagation worker
  # behind the three `run_pure_eb_*.sh` drivers — builds a CosmologyValidation
  # and calls `cv.get_redshift(version)`, which opens cat_config's
  # `redshift_path` for that version. The fiducial output needs only the SOM
  # tree; the two sweeps run every version in `config.yaml`, which includes the
  # v1.4.8 and v1.4.11.3 entries that cat_config still points at the legacy
  # file.
  - id: redshift_distributions
    from: ../redshift_distributions

  - id: redshift_distributions_legacy
    from: ../redshift_distributions_legacy

  - id: paper_mplstyle
    from: ../paper_mplstyle

  - id: print_width_script
    from: ../print_width_script

  - id: pure_eb_version_comparison_script
    from: ../pure_eb_version_comparison_script

outputs:
  - id: pure_eb_semianalytic_data
    type: data
    description: |
      Per-(version, blind) NPZ: ξ_±^{E,B,amb} data vectors on
      the 20-bin reporting grid and the 6-block 120×120
      pure-mode covariance, built as the
      [covariance method](#decisions.pure_eb_covariance_method)
      selects and recording that construction (with the draw
      count, for the Monte Carlo) so χ² consumers apply the
      matching Hartlap treatment. The
      consumed artifact for the data-vector and covariance figures
      (fiducial catalog only) and for the version-comparison figure
      (all leak-corrected versions). The
      [pure-mode PTE matrix](#outputs.pure_eb_pte_per_cut)
      reads the B-block of this matrix.

      Also carries the per-block condition numbers rendered into `paper/claims_macros.tex` as
      `\ebcovCondE` (1.5×10⁵), `\ebcovCondB` (2.0×10⁵),
      `\ebcovCondAmb` (1.8×10¹⁰), and `\ebcovCondFull`
      (2.7×10¹⁰) — diagnostics for the conditioning of the
      Monte Carlo pure-mode covariance, with the
      ambiguous-mode block being the worst-conditioned and the
      reason PTEs are reported on the B-block alone rather
      than on the full 6×6 stacked covariance.
    format: npz
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method]
    inputs: [xi_reporting, xi_integration, cov_integration_g, redshift_distributions]
    recipe:
      # run_pure_eb_semianalytic.sh: under monte_carlo it runs the 20 MC chunks
      # in parallel (each a fresh process, deterministic seed 42+chunk_id) then
      # gathers them, bit-exact to the original scatter-gather; under
      # exact_linear the gather step builds M C Mᵀ directly. One npz written
      # straight to {output}. Fiducial hardcoded.
      command: >
        bash src/papers/bmodes/scripts/run_pure_eb_semianalytic.sh
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind A
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-reporting {inputs.xi_reporting}
        --xi-integration {inputs.xi_integration}
        --cov-integration {inputs.cov_integration_g}
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --out-file {output}
      resources: { cpus: 24, memory: "60GB" }

  - id: pure_eb_data_vector_figure
    type: figure
    description: |
      Pure E/B-mode decomposition of the measured shear correlation
      functions for the [fiducial
      catalog](#../decisions.fiducial_catalog). Panels show ξ_+ (left)
      and ξ_- (right) decomposed into total (black circles), E-mode
      (teal squares), B-mode (crimson ×), and ambiguous (purple
      triangles) components following Schneider et al. (2022). The E
      modes trace the lensing signal, while B modes—which should vanish
      for pure gravitational lensing—diagnose systematic contamination.
      Ambiguous modes capture boundary effects from the finite angular
      range. Shaded regions indicate fiducial scale cuts.
    format: png
    decisions: [fiducial_catalog, scale_cut_convention]
    inputs: [pure_eb_semianalytic_data, cov_reporting_ng, paper_mplstyle]
    recipe:
      # pure_eb_data_vector.py: pure E/B data-vector figure, fiducial only. Reads the
      # semianalytic NPZ and the reporting-grid masked ng CosmoCov ξ±
      # covariance (the total-curve error bars); renders one 300-dpi PNG.
      command: >
        python src/papers/bmodes/scripts/pure_eb_data_vector.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --reporting-cov {inputs.cov_reporting_ng}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  - id: pure_eb_covariance_figure
    type: figure
    description: |
      Pure E/B-mode correlation-function covariance matrix for the
      [fiducial catalog](#../decisions.fiducial_catalog), propagated
      linearly from the CosmoCov ξ_± covariance. The matrix is organized
      into six blocks: ξ_+^E, ξ_-^E, ξ_+^B, ξ_-^B, ξ_+^amb, ξ_-^amb,
      with 20 angular bins per block. Off-diagonal correlations arise
      from integral coupling in the pure-mode filters.
    format: png
    decisions: [fiducial_catalog]
    inputs: [pure_eb_semianalytic_data, paper_mplstyle]
    recipe:
      # pure_eb_covariance.py: pure E/B covariance figure, fiducial only. Reads the
      # semianalytic NPZ; renders one 300-dpi PNG of the 6-block correlation
      # matrix.
      command: >
        python src/papers/bmodes/scripts/pure_eb_covariance.py
        --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --out-file {output}

  - id: pure_eb_version_comparison_figure
    type: figure
    description: |
      B-mode data vectors across catalog versions: initial (red
      circles), size-cut/fiducial (gold squares), masked (teal
      diamonds), and relaxed-flags (purple triangles). Rectangles
      delineate each bin in the horizontal direction and span the range
      of values across versions in the vertical direction; horizontal
      lines mark the fiducial value. Shaded bands mark fiducial scale
      cuts. Pure E/B-mode correlation functions: upper panels show ξ_+
      and ξ_- scaled by θ; lower panels show B-mode components ξ_±^B/σ.
      Only the size-cut catalog passes all statistics at the fiducial
      scale cuts ([PTE table](#../outputs.pte_table_appendix)).
    format: png
    decisions: [scale_cut_convention]
    inputs: [pure_eb_semianalytic_data, pure_eb_sweep, paper_mplstyle, print_width_script, pure_eb_version_comparison_script]
    recipe:
      # pure_eb_version_comparison.py: pure-mode row of the version-comparison stack. The
      # non-fiducial versions come from the pure_eb_sweep tarball (unpacked to a
      # temp dir and passed as --results-dir); the FIDUCIAL row is repointed to
      # the single-version lc output via --fiducial-*.
      command: >
        d=$(mktemp -d) && tar xzf {inputs.pure_eb_sweep} -C $d &&
        python src/papers/bmodes/scripts/pure_eb_version_comparison.py
        --config src/papers/bmodes/config/config.yaml
        --results-dir $d
        --fiducial-version SP_v1.4.6.3_leak_corr
        --fiducial-pure-eb-data {inputs.pure_eb_semianalytic_data}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  - id: pure_eb_pte_per_cut
    type: data
    description: |
      Per-(version, blind) NPZ holding the ξ_+^B, ξ_-^B, and
      joint ξ_tot^B PTE matrices over the
      [scale-cut pair grid](#../analyses.cosebis) — the same
      stable index pairs of `geomspace(1', 250', 21)` that
      drive the COSEBI PTE matrix. Generated by
      `calculate_pure_eb_ptes` with the
      [Hartlap finite-sample
      correction](#decisions.pure_eb_covariance_method) on the
      inverse covariance when that covariance is a Monte Carlo
      estimate, and none when it is exact.
    format: npz
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [pure_eb_semianalytic_data, cov_integration_g]
    recipe:
      # calculate_pure_eb_ptes.py reads the gathered semianalytic npz +
      # integration cov, evaluates the ξ_+^B/ξ_-^B/ξ_tot^B χ² PTE matrices over
      # the scale-cut grid into a single npz. The Hartlap factor follows the
      # covariance artifact; --n-samples covers artifacts that record none.
      command: >
        python src/papers/bmodes/scripts/calculate_pure_eb_ptes.py
        --version "$(python src/papers/bmodes/scripts/paper_config.py --config src/papers/bmodes/config/catalogs/{decisions.fiducial_catalog}.yaml --get fiducial.version)" --blind A
        --pure-eb-data {inputs.pure_eb_semianalytic_data}
        --cov-integration {inputs.cov_integration_g}
        --npatch 1 --n-samples 2000
        --out-file {output}

  - id: pure_eb_sweep
    type: data
    description: |
      Design-B producer sweep: Schneider-2022 pure E/B
      data vector and covariance for every non-fiducial,
      non-ecut catalog version (7 variants — 3 leak-corrected +
      4 uncorrected), each gathered into the canonical
      `{ver}_A_pure_eb_semianalytic.npz` that
      [pure_eb_version_comparison](#outputs.pure_eb_version_comparison_figure)
      (`--results-dir`) reads. This is the version-swept analogue
      of [pure_eb_semianalytic_data](#outputs.pure_eb_semianalytic_data):
      per version it runs the same construction under the same
      [covariance method](#decisions.pure_eb_covariance_method),
      reading that version's reporting+integration
      ξ_± from [xi_sweep](#../two_point.outputs.xi_sweep) and its
      Gaussian integration covariance from
      [cov_sweep](#../covariance.outputs.cov_sweep) via the declared
      `xi_sweep` / `cov_sweep` inputs (both untarred into temp dirs
      by the recipe). The fiducial version stays in the
      single-output recipe above and is passed to the comparison
      plotter via `--fiducial-pure-eb-data`.
    format: tar.gz
    decisions: [fiducial_catalog, fiducial_blind, pure_eb_integration_method, pure_eb_rebinning_weights, pure_eb_integration_limits, pure_eb_covariance_method]
    inputs: [xi_sweep, cov_sweep, redshift_distributions, redshift_distributions_legacy]
    recipe:
      # run_pure_eb_sweep.sh loops the non-fiducial version list (sweep_versions.py)
      # and calls run_pure_eb_semianalytic.sh once per version, reading per-version
      # xi and cov from the unpacked upstream sweep bundles and writing the
      # gathered canonical npz per version; the whole set is bundled into
      # {output}. Serial over versions; each version's 20 MC chunks run in
      # parallel inside the sub-driver.
      command: >
        x=$(mktemp -d) && tar xzf {inputs.xi_sweep} -C $x &&
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c &&
        o=$(mktemp -d) &&
        bash src/papers/bmodes/scripts/run_pure_eb_sweep.sh
        --config src/papers/bmodes/config/config.yaml
        --cat-config src/cosmo_val/cat_config.yaml
        --xi-sweep-dir $x
        --cov-sweep-dir $c
        --integration-method {decisions.pure_eb_integration_method}
        --integration-limits {decisions.pure_eb_integration_limits}
        --rebinning-weights {decisions.pure_eb_rebinning_weights}
        --covariance-method {decisions.pure_eb_covariance_method}
        --out $o
        && tar czf {output} -C $o .
      resources: { cpus: 16, memory: "60GB" }

  - id: pure_eb_ptes
    type: data
    description: |
      Design-B Tier-2 producer sweep: pure E/B χ² PTE matrices
      (ξ_+^B, ξ_-^B, joint ξ_tot^B over the (θ_min, θ_max)
      scale-cut grid) for every non-fiducial, non-ecut catalog
      version (7 variants — 3 leak-corrected + 4 uncorrected),
      each gathered into the canonical
      `{ver}_A_pure_eb_ptes.npz` that the per-version config-space
      PTE heatmap
      ([config_space_pte_evidence](#../null_tests.outputs.config_space_pte_evidence),
      [fig_pte_heatmaps](#../outputs.fig_pte_heatmaps)) reads via
      `--pte-intermediate-dir`. This is the version-swept analogue
      of [pure_eb_pte_per_cut](#outputs.pure_eb_pte_per_cut): per
      version it runs the same
      `calculate_pure_eb_ptes` compute, with the
      [covariance-dependent Hartlap
      treatment](#decisions.pure_eb_covariance_method), reading that
      version's gathered semi-analytic NPZ from
      [pure_eb_sweep](#outputs.pure_eb_sweep) and its Gaussian
      integration covariance from
      [cov_sweep](#../covariance.outputs.cov_sweep) via the declared
      `pure_eb_sweep` / `cov_sweep` inputs (both untarred into temp
      dirs by the recipe). The fiducial version stays in the
      single-output recipe above and is passed to the heatmap via
      `--fiducial-pure-eb-pte-path`.
    format: tar.gz
    decisions: [fiducial_catalog, fiducial_blind]
    inputs: [pure_eb_sweep, cov_sweep, redshift_distributions, redshift_distributions_legacy]
    recipe:
      # run_pure_eb_ptes_sweep.sh loops the non-fiducial version list
      # (sweep_versions.py) and calls calculate_pure_eb_ptes.py once per version,
      # reading each version's semi-analytic npz from the unpacked pure_eb_sweep
      # bundle and its integration cov from the unpacked cov_sweep bundle,
      # emitting the canonical {ver}_A_pure_eb_ptes.npz per version; the set is
      # bundled into {output}. Serial; each version is fast (206-pair grid).
      command: >
        p=$(mktemp -d) && tar xzf {inputs.pure_eb_sweep} -C $p &&
        c=$(mktemp -d) && tar xzf {inputs.cov_sweep} -C $c &&
        o=$(mktemp -d) &&
        bash src/papers/bmodes/scripts/run_pure_eb_ptes_sweep.sh
        --config src/papers/bmodes/config/config.yaml
        --cat-config src/cosmo_val/cat_config.yaml
        --pure-eb-sweep-dir $p
        --cov-sweep-dir $c
        --out $o
        && tar czf {output} -C $o .
      resources: { cpus: 4, memory: "16GB" }

decisions:

  fiducial_catalog:
    from: ../fiducial_catalog

  fiducial_blind:
    from: ../fiducial_blind

  scale_cut_convention:
    from: ../scale_cut_convention

  pure_eb_integration_method:
    from: ../pure_eb_integration_method

  pure_eb_rebinning_weights:
    from: ../pure_eb_rebinning_weights

  pure_eb_integration_limits:
    from: ../pure_eb_integration_limits

  pure_eb_covariance_method:
    from: ../pure_eb_covariance_method

  decomposition_method:
    label: "Pure-mode integral-transform construction"
    tags: [pure_eb, method, primary]
    rationale: |
      The Schneider et al. (2022) construction
      decomposes ξ_±(θ) into pure E, pure B, and ambiguous
      components via integral transforms over the measured
      ξ_±(θ) augmented by auxiliary boundary functions S_±(θ)
      and V_±(θ) that absorb the ambiguous-mode polynomials
      a + b θ², c θ⁻² + d θ⁻⁴ on a finite [θ_min, θ_max]. This
      is the adopted construction. The alternative —
      reconstructing pure-mode ξ_±^X from the COSEBI
      coefficients — is mathematically
      equivalent but tied to consistent ξ_+ and ξ_- angular
      ranges; the integral-transform path lets ξ_+ and ξ_-
      carry independent scale cuts, so the direct path is used, with the
      [cosmo_numba implementation](#decisions.implementation).
    default: schneider22_integral_transform
    options:
      schneider22_integral_transform:
        label: "Schneider et al. 2022 integral transform (fiducial)"
        insights: [pure_mode_decomposition_unique_on_finite_interval, schneider22_pure_modes_direct_from_xi]
      cosebi_reconstruction:
        label: "COSEBI-coefficient reconstruction"
        description: |
          Mathematically equivalent on a single shared
          [θ_min, θ_max] but does not permit independent
          ξ_+ / ξ_- scale cuts. Not used.

  implementation:
    label: "Pure-mode integral-transform implementation"
    tags: [pure_eb, software]
    rationale: |
      `cosmo_numba` (Guinot et al. 2026,
      <https://github.com/aguinot/cosmo-numba>) is the JIT
      implementation of the Schneider 22 kernels used here. The package handles the boundary functions
      S_± and V_± as well as the integral kernel evaluation
      on the 1000-bin grid; it is the only production
      implementation maintained against the same project's
      `sp_validation` framework. No alternative implementation
      is exposed.
    default: cosmo_numba
    options:
      cosmo_numba:
        label: "cosmo_numba (Guinot et al. 2026; fiducial)"
        insights: [guinot26_cosmo_numba_precision]

  pte_blind_strategy:
    label: "Per-blind PTE evaluation strategy"
    tags: [pure_eb, blinding, validation]
    rationale: |
      `calculate_pure_eb_ptes` accepts a `{blind}` wildcard so
      that the BB blind-independence check can compare χ² across
      blinds A / B / C using each blind's
      [integration covariance](#../analyses.covariance). The
      data-vector PTEs use blind A only; the per-blind
      evaluation feeds the
      [bb_covariance_blind_independence
      check](#../analyses.null_tests) where it compares B-mode
      and E-mode covariance stability across blinds.
    default: blind_a_only_for_paper
    options:
      blind_a_only_for_paper:
        label: "Blind A for the reported PTEs; per-blind for the BB-cov check (fiducial)"
      all_blinds_for_paper:
        label: "All three blinds in the reported PTEs"
        description: |
          Exposed but not used; would triple the PTE table
          width without revealing new B-mode information given
          the workflow blind-independence check.

prior_insights:

  hartlap07_correction:
    id: hartlap07_correction
    claim: |
      For an inverse covariance estimated from N independent
      Gaussian samples on a data vector of length p, the
      maximum-likelihood inverse is biased; the unbiased
      estimator multiplies it by (N - p - 2) / (N - 1). For
      semi-analytical (theory) covariances the correction does
      not apply because no sample uncertainty enters.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361:20066170"
        quote:
          exact: |
            We find that the inverse of the maximum-likelihood
            estimator of the covariance is biased, the amount of
            bias depending on the ratio of the number of bins
            (data vector variables), p, to the number of data
            sets, n. This bias inevitably leads to an -- in
            extreme cases catastrophic -- underestimation of
            the size of the confidence regions.
          prefix: "Methods. We perform Monte-Carlo simulations to investigate the behaviour of estimators for the inverse covariance matrix"
          suffix: "We report on a method to remove this bias for the idealised case of Gaussian errors and statistically independent data vectors."
        location:
          page: 1
    scope: "Sample-based covariance estimators on Gaussian data; not applicable to theory covariances. Source: arxiv astro-ph/0608064, §3.1 Eq. (17)."

  pure_mode_decomposition_unique_on_finite_interval:
    id: pure_mode_decomposition_unique_on_finite_interval
    claim: |
      The pure-mode shear correlation functions ξ_±^E, ξ_±^B,
      ξ_±^amb can be derived from measured ξ_±(θ) on a finite
      angular interval [θ_min, θ_max] such that ξ_+ = ξ_+^E +
      ξ_+^B + ξ_+^amb and ξ_- = ξ_-^E − ξ_-^B + ξ_-^amb
      decompose uniquely. This is the foundation of the
      configuration-space pure-mode B-mode null test used here.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: |
            we derive explicit equations for the pure-mode
            shear correlation functions, ξ_±^E/B(θ), and their
            ambiguous components, ξ_±^amb(θ), that can be
            derived from the measured ξ_±(θ) on a finite
            angular interval, θ_min ≤ θ ≤ θ_max, such that
            ξ_±(θ) can be decomposed uniquely into pure-mode
            functions as ξ_+ = ξ_+^E + ξ_+^B + ξ_+^amb and
            ξ_- = ξ_-^E − ξ_-^B + ξ_-^amb.
          prefix: "ambiguous modes that cannot uniquely be assigned to either E- or B-mode shear. In this paper"
          suffix: "The derivation is obtained by defining a new set of Complete Orthogonal Sets of E and B mode-separating Integrals (COSEBIs)"
        location:
          page: 1
    scope: "Schneider, Asgari, Heydenreich & Joachimi 2022, A&A 664, A77 — abstract."


  schneider22_pure_modes_direct_from_xi:
    id: schneider22_pure_modes_direct_from_xi
    claim: |
      Pure-mode correlation functions and COSEBIs carry the same
      information, but the pure modes can be computed directly from
      ξ_± without first computing the (infinite) COSEBI set. In
      practice the equivalence is only approximate because of the
      finite number of COSEBI modes and the finite ξ_± binning, which
      favours the direct integral transform over reconstruction from
      COSEBI coefficients.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: "However, as we show here, they can also be obtained without first calculating the (infinite) set of COSEBIs."
        location:
          page: 6
      - id: ev2
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: "In practice, this exact equivalence will apply only approximately, due to the finite number of COSEBI modes and the finite binning of the correlation functions"
        location:
          page: 6
    scope: |
      Schneider, Asgari, Heydenreich & Joachimi 2022, A&A 664, A77 —
      §3.3–3.4. Source: arxiv 2110.09774 newCOS.tex lines 938–953.
      Paper II's own reason for the direct path is that it allows
      independent ξ_+ / ξ_- scale cuts (paper TeX lines 366–367).

  guinot26_cosmo_numba_precision:
    id: guinot26_cosmo_numba_precision
    claim: |
      `cosmo-numba` computes COSEBIs and the Schneider et al. 2022
      pure-mode correlation functions. The COSEBI weight functions
      need ~80 decimal places: float64 precision is not sufficient,
      while the high-precision default reproduces the original
      Mathematica implementation exactly. The pure-mode integrals are
      less numerically demanding but need a fast implementation.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2603.18419"
        quote:
          exact: "We can see that classic float64 precision would not be sufficient, and with a precision of 80 our code exactly recovers the results from the original implementation."
        location:
          page: 3
      - id: ev2
        doi: "10.48550/arXiv.2603.18419"
        quote:
          exact: "Those integrals are less numerically challenging than the COSEBIs, but having a fast computation is necessary for their integration in an inference pipeline."
        location:
          page: 2
    scope: |
      Guinot et al. 2026, arXiv 2603.18419 — "Statement of need" and
      "State of the field". Source: paper.tex lines 189–195 and
      278–283. Software paper by a Paper II co-author (paper TeX
      line 327).

