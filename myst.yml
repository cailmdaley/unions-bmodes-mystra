site:
  # The template URL MUST end in `.git` (or `.zip`). myst only treats a URL as a
  # downloadable template when it does; otherwise it GETs the URL expecting JSON
  # template metadata and dies on GitHub's HTML with
  # `Unexpected token '<' ... is not valid JSON`.
  template: https://github.com/EiffL/astra-article-theme.git
  title: "UNIONS-3500 Weak Lensing II — B-mode validation"
  options:
    # Lightcone Research brand marks (mirrored from EiffL/myst_proto); the dark
    # variant swaps the wordmark so it reads on charcoal.
    logo: images/logo-primary.svg
    logo_dark: images/logo-primary-dark.svg
    logo_alt: Lightcone Research
    favicon: images/logo-mark-gold.svg
