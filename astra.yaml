      including noise". Source: arxiv astro-ph/0307515
      mn_paper.tex line 1577. Stated for the deconvolved
      pseudo-Cℓ covariance with noise; it is the origin of the
      approximation NaMaster's `gaussian_covariance` implements.

  alonso19_unpurified_bb_variance_dominated_by_leaked_e:
    id: alonso19_unpurified_bb_variance_dominated_by_leaked_e
    claim: |
      Without map-level E/B purification, the pseudo-Cℓ B-mode
      estimator is sub-optimal: removing the mask-induced E→B
      leakage only at the power-spectrum level leaves the
      variance of Cℓ^BB dominated by the variance of the leaked
      E modes. Purification removes that contribution at the map
      level and, in the NaMaster CMB validation suite, reduces
      the BB uncertainties by up to a factor of ~10 on large
      scales — with essentially no gain for EE. The E→B leakage
      term is therefore the dominant and the most fragile part
      of an unpurified Cℓ^BB error budget at low ℓ.
    created_at: "2026-09-13T00:00:00Z"
