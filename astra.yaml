      - id: ev2
        doi: "10.48550/arXiv.2607.14843"
        quote:
          exact: "The Narrow Kernel Approximation, which may hold less well for very sparse masks"
        location:
          page: 10
    scope: |
      Alonso et al. 2026, "Analytical covariances for
      catalogue-based pseudo-Cℓs" — §4.2 (dense catalogues:
      cosmic shear) and §4.1. Source: arxiv 2607.14843 main.tex
      lines 468 and 442. DES Y3 bin 3, ~2.5e7 sources over
      ~4000 deg² (f_sky ≈ 0.1), Gaussian shear realisations
      with and without shape noise, bandpowers to ℓ_max =
