# -----------------------------------------------------------------------------
# Sub-analyses. Each lives in analyses/<id>/astra.yaml. Inheritance flows
# through `from: ../<root_id>` for shared inputs/decisions; cross-sub-analysis
# data dependencies are declared at each child's analysis-level `inputs:` block
# (the `recipe.inputs` slot is restricted to same-analysis outputs by the
# validator — see implementation-notes.md).
# -----------------------------------------------------------------------------
analyses:

  catalog:
    path: ./analyses/catalog

  two_point:
    path: ./analyses/two_point

  pure_eb:
    path: ./analyses/pure_eb

  cosebis:
    path: ./analyses/cosebis

  cl_bb:
    path: ./analyses/cl_bb

  covariance:
    path: ./analyses/covariance

  null_tests:
    path: ./analyses/null_tests

  glass_mocks:
    path: ./analyses/glass_mocks

  convergence:
    path: ./analyses/convergence
