  gg19_nka_bb_covariance_unreliable:
    id: gg19_nka_bb_covariance_unreliable
    claim: |
      The narrow-kernel approximation does not accurately
      describe the pseudo-Cℓ covariance of any spectrum
      involving B modes. The mechanism is the mask's E/B mixing:
      leaked E modes contribute to the B-mode variance, and
      because C_ℓ^EE greatly exceeds C_ℓ^BB — especially at
      ℓ ≲ 200 — mis-modelling that leakage term mis-estimates
      sigma(C_ℓ^BB) directly. In García-García et al.'s Gaussian
      simulations the standard NKA (uncoupled input spectra)
      errs by 30–50 % on BB covariance elements, in the
      direction of *under*predicting the uncertainties, and the
      authors conclude the approach cannot be used to estimate
      B-mode power-spectrum uncertainties reliably.
