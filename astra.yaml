  nicola21_inka_lowest_bandpower_overestimate:
    id: nicola21_inka_lowest_bandpower_overestimate
    claim: |
      The improved NKA (iNKA) of Nicola et al. 2021 replaces the
      input C_ℓ in the NKA covariance by its mode-coupled
      counterpart; this is the estimator NaMaster's
      `gaussian_covariance` implements with coupled fiducial
      spectra. The improvement is large — the standard NKA
      over-estimates the *signal* part of the covariance by more
      than a factor of 2 in noiseless HSC-like simulations,
      while iNKA recovers it to ~10 %. Two residual failures
      survive and both apply to Paper II's regime: the analytic
      uncertainties are still *over*estimated at the lowest
      bandpower, and the largest analytic-versus-simulated
      discrepancies of all are in the spectra built from E/B
      mixing, because the NKA for spin-2 fields neglects the
      spatial derivatives of the weight map. The authors note
      the NKA is expected to break down for sufficiently
      complicated weight maps, and recommend fast low-resolution
      Gaussian simulations for the covariance at large angular
      scales.
    created_at: "2026-09-13T00:00:00Z"
