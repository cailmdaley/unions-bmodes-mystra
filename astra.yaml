  cosebis_complete_eb_separation:
    id: cosebis_complete_eb_separation
    claim: |
      Complete Orthogonal Sets of E-/B-mode Integrals (COSEBIs)
      give a complete E-/B-mode decomposition of the cosmic
      shear two-point correlation functions ξ_±(θ) on a finite
      angular interval, via weight functions T_±,n(θ) that are
      either polynomials in θ (linear) or polynomials in ln θ
      (logarithmic). The logarithmic basis converges to the
      asymptotic information limit in fewer modes — for ξ_± on
      [1', 400'] the full (Ω_m, σ_8) information is recovered
      in ≈5 logarithmic modes versus ≈25 linear modes.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/200913577"
        quote:
          exact: |
            Here we aim at a complete E-/B-mode decomposition of
            the cosmic shear information contained in the ξ_± on
            a finite angular interval. We construct two sets of
            such E-/B-mode measures, namely Complete Orthogonal
            Sets of E-/B-mode Integrals (COSEBIs), characterized
            by weight functions between the ξ_± and the COSEBIs
            which are polynomials in θ or polynomials in ln θ,
            respectively.
          prefix: "several statistics have been defined before."
          suffix: "Considering the likelihood in cosmological parameter space, constructed from the COSEBIs, we study their information content."
        location:
          page: 1
      - id: ev2
        doi: "10.1051/0004-6361/200913577"
        quote:
          exact: |
            For example, for ξ_± on the interval 1' ≤ θ ≤ 400',
            the asymptotic limit for the parameter pair (Ω_m,
            σ_8) is reached for ~25 modes in the linear case,
            but already for 5 modes in the logarithmic case.
          prefix: "We show that this limit is reached the earlier (i.e., for a smaller number of modes considered) the narrower the angular range is over which ξ_± are measured, and it is reached much earlier for logarithmic weight functions."
          suffix: "The COSEBIs form a natural discrete set of quantities, which we suggest as method of choice in future cosmic shear likelihood analyses."
        location:
          page: 1
    scope: |
      Schneider, Eifler & Krause 2010, A&A 520, A116 — paper
      introducing the COSEBI basis. Source: arxiv 1002.2136
      COSEBIS2.tex abstract. Underwrites the choice of
      logarithmic basis used in the [cosebis sub-analysis](#analyses.cosebis).

  hybrideb_filter_optimisation_alternative:
    id: hybrideb_filter_optimisation_alternative
    claim: |
      The Hybrid E/B (HybridEB) Fourier band-power estimator of
      Becker & Rozo 2016 is a linear combination of binned
      shear two-point correlations ξ_±(θ) over a finite angular
      range that performs E/B-mode separation with apodised
      Fourier-space band windows. It belongs to the same family
      as pure-mode CFs and COSEBIs — all are linear functionals
      of ξ_± with explicit ambiguous-mode projection — but
      optimises filter compactness in ℓ rather than in θ.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/stv3018"
