# ASTRA Analysis Specification
# Documentation: https://github.com/LightconeResearch/ASTRA
#
# UNIONS-3500 Paper II, B-mode validation (Daley et al. 2026): pure-mode, COSEBI
# and harmonic-space null tests of the ShapePipe v1.4 catalogs, from the catalogs
# to each reported figure, table and finding.

version: "0.0.14"
name: "UNIONS-3500 B-mode Validation"
description: |
  B-mode null tests of the UNIONS-3500 ShapePipe v1.4 shear catalogs (Daley et
  al. 2026). Pure-mode correlation functions, COSEBIs and harmonic-space power
  spectra, with covariances validated on GLASS mocks, fix
  the fiducial catalog and scale cuts for the UNIONS cosmology papers.

# -----------------------------------------------------------------------------
# Top-level inputs (shared across sub-analyses).
# -----------------------------------------------------------------------------
inputs:
  - id: shapepipe_v14_catalogs
    type: data
    description: |
      ShapePipe v1.4 cosmic-shear catalogs from Paper I
      (Hervas-Peters et al. 2026, Table H.1). Four variants enter:
      initial (size cut r_h,gal/r_h,psf > 0.5), size-cut (> 0.707;
      fiducial), masked (size-cut plus stellar-halo masking, 13%
      area loss) and relaxed-flags (size-cut with relaxed
      SExtractor deblending flags, +26% n_eff). Each comes with and
      without the object-wise PSF-leakage correction; the corrected
      versions are fiducial.
    source: "/n17data/UNIONS/WL/v1.4.x/v{version}/unions_shapepipe_cut_struc_2024_v{version}.fits"

  - id: shapepipe_v145_rerun
    type: data
    description: |
      The initial (v1.4.5) ShapePipe catalog of the
      [v1.4 family](#inputs.shapepipe_v14_catalogs), used in the
      catalog-version comparisons.
    source: "/n17data/sguerrini/unions_shapepipe_cut_struc_2024_v1.4.5_rerun.fits"

  - id: redshift_distributions
    type: data
    description: |
      SOM-calibrated photometric n(z), one per blind (A / B / C)
      and per base catalog version; the relaxed-flags catalog
      (v1.4.11.3) uses the v1.4.6 one. The leakage correction acts on
      ellipticities, not photometry, so corrected and uncorrected
      catalogs share one n(z).
    source: "/n17data/sguerrini/UNIONS/WL/nz/v{base_version}/nz_{base_version}_{blind}.txt"

  - id: redshift_distributions_pre_som
    type: data
    description: |
      A pre-SOM n(z) that the masked (v1.4.8) and relaxed-flags
      (v1.4.11.3) catalogs use for the theory in their Cℓ
      covariances and Monte Carlo pure-mode draws. Their CosmoCov
      covariances use
      [redshift_distributions](#inputs.redshift_distributions). It
      enters only the catalog-version comparisons; every fiducial
      result uses the SOM n(z).
    source: "/n17data/mkilbing/astro/data/CFIS/v1.0/nz/dndz_SP_A.txt"

  - id: footprint_masks
    type: data
    description: |
      Power spectrum of the fiducial 2894 deg² survey footprint mask
      (HEALPix nside 4096, normalised). CosmoCov uses it only for the
      super-sample window of the reporting-grid non-Gaussian
      covariance; the Gaussian covariances behind the PTEs depend on
      the survey area alone.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/mask/mask_cls_footprint_nside_4096_norm.txt"

  - id: blind_check_pure_eb
    type: data
    description: |
      Per-version, per-blind pure E/B covariance blocks for the blind-independence check.
    source: "/automnt/n17data/cdaley/unions/analyses/shear_2d/bmodes_2d/results/paper_plots/intermediate/{version}_{blind}_pure_eb_semianalytic.npz"

  - id: blind_check_harmonic_cov
    type: data
    description: |
      Per-version, per-blind Cℓ covariance FITS files for the blind-independence check.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_val/output/pseudo_cl_cov_{version}_blind={blind}_powspace_nbins=32.fits"

  - id: blind_check_cosmocov
    type: data
    description: |
      Per-version, per-blind processed Gaussian CosmoCov integration-grid covariances for the blind-independence check.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_inference/data/covariance/covariance_{version}_{blind}_g_minsep=0.5_maxsep=300.0_nbins=1000_masked/covariance_{version}_{blind}_g_minsep=0.5_maxsep=300.0_nbins=1000_masked_processed.txt"

  - id: blind_check_xi
    type: data
    description: |
      Per-version ξ± integration-grid measurements for the blind-independence check.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_val/output/{version}_xi_minsep=0.5_maxsep=300.0_nbins=1000_npatch=1.txt"

  - id: blind_check_cl
    type: data
    description: |
      Per-version blind-A Cℓ bandpowers for the blind-independence check.
    source: "/n17data/cdaley/unions/code/sp_validation/cosmo_val/output/pseudo_cl_{version}_blind=A_powspace_nbins=32.fits"

# -----------------------------------------------------------------------------
# Top-level outputs: the reported figures, tables and metrics, each built from
# sub-analysis outputs.
# -----------------------------------------------------------------------------
outputs:
  - {id: primary_null_test_report, from: null_tests.primary_null_test_report}

  # ---------------------------------------------------------------------------
  # Sub-analysis results that the root tables and figures read.
  # ---------------------------------------------------------------------------
  - {id: paper_claims, from: null_tests.paper_claims}
  - {id: bb_covariance_blind_independence_evidence, from: validation.bb_covariance_blind_independence_evidence}
  - {id: tenk_grid_comparison, from: validation.tenk_grid_comparison}
  - {id: config_space_pte_data, from: null_tests.config_space_pte_data}
  - {id: harmonic_space_pte_data, from: null_tests.harmonic_space_pte_data}
  - {id: mock_min_pte_calibration, from: validation.mock_min_pte_calibration}
  # PTEs and χ² of the harmonic-vs-configuration COSEBI comparison, and the
  # E_n/B_n vectors behind its figures.
  - {id: cosebis_harmonic_modes_evidence, from: validation.cosebis_harmonic_metrics}
  - {id: cosebis_harmonic_modes_full_evidence, from: validation.cosebis_harmonic_metrics_full}
  - {id: cosebis_harmonic_version_ptes, from: validation.cosebis_harmonic_version_ptes}
  - {id: cosebis_harmonic_modes, from: validation.cosebis_harmonic_modes}
  - {id: cosebis_modes_data, from: data_vectors.cosebis_modes_data}

  # ---------------------------------------------------------------------------
  # Tables and metrics.
  # ---------------------------------------------------------------------------
  - id: pte_table_appendix
    type: table
    format: csv
    # Columns: `version` (Initial / Size_cuts / Masked / Relaxed_flags),
    # `version_full` (catalog version), `cut` (Fiducial / Full_range), and the six
    # statistics `cosebis_n6`, `cosebis_n20`, `xip_B`, `xim_B`, `xitot_B`, `cl_BB`.
    # Configuration-space cells come from config_space_pte_data, the cl_BB column
    # from harmonic_space_pte_data.
    description: |
      B-mode PTE values across catalog versions at fiducial and
      full-range scale cuts. Fiducial scale cuts are 12–83 arcmin in
      configuration space and 300 < ℓ < 1600 in harmonic space; the full
      range is 1–250 arcmin / 8 ≤ ℓ ≤ 2048. A row passes the null test
      when its minimum PTE is at least p_thr = 0.01; only the fiducial
      catalog at the adopted cuts passes.
    inputs: [config_space_pte_data, harmonic_space_pte_data]
    decisions: [fiducial_catalog, leakage_correction]
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_paper_macros.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --emit table
        --out-file {output}

  - id: pte_table_tex
    type: data
    format: tex
    description: |
      LaTeX version of the [PTE table](#outputs.pte_table_appendix),
      with an added column for each row's minimum PTE.
    inputs: [pte_table_appendix]
    recipe:
      command: >
        python src/papers/bmodes/scripts/generate_pte_table_tex.py
        --pte-csv {inputs.pte_table_appendix}
        --out-file {output}

  - id: cosebis_harmonic_config
    type: table
    format: csv
    description: |
      COSEBI B-mode PTEs computed two ways — from ξ± in
      configuration space and from Cℓ bandpowers in harmonic space —
      for the four catalog versions at fiducial and full-range cuts.
      The [PTE table](#outputs.pte_table_appendix) carries only the
      configuration-space COSEBIs; this table adds the harmonic path.
      Columns: `version` (initial / size_cuts / masked /
      relaxed_flags), `path` (harmonic / config), `cut` (fiducial /
      full_range), `pte`, `chi2`, `dof`; `chi2` and `dof` are filled
      only for the harmonic path, a χ²(ν=6) test. Configuration-space
      values come from
      [config_space_pte_data](#outputs.config_space_pte_data).
    inputs:
      - config_space_pte_data
      - cosebis_harmonic_modes_evidence
      - cosebis_harmonic_modes_full_evidence
      - cosebis_harmonic_version_ptes
    decisions: [leakage_correction]
    recipe:
      # The fiducial catalog's harmonic PTEs come from the two metrics outputs,
      # the other three catalogs' from the harmonic COSEBI scan.
      command: >
        python src/papers/bmodes/scripts/emit_cosebis_harmonic_config.py
        --leakage-correction {decisions.leakage_correction}
        --config-space-evidence {inputs.config_space_pte_data}
        --cosebis-evidence {inputs.cosebis_harmonic_modes_evidence}
        --cosebis-evidence-full {inputs.cosebis_harmonic_modes_full_evidence}
        --harmonic-version-ptes {inputs.cosebis_harmonic_version_ptes}
        --out-file {output}

  - id: cosebis_first_mode_significance
    type: metric
    format: json
    description: |
      First-mode COSEBI B-mode significance B_1/σ_1 for the
      fiducial catalog, from
      [cosebis_modes_data](#outputs.cosebis_modes_data). The
      `value` is the full-range (1–250 arcmin) significance, the
      >4σ first-mode excess visible in
      [fig_cosebis_fiducial](#outputs.fig_cosebis_fiducial); the
      JSON also carries the fiducial-cut significance, below 1σ.
    inputs: [cosebis_modes_data]
    recipe:
      command: >
        python src/papers/bmodes/scripts/emit_cosebis_first_mode_significance.py
        --cosebis-modes-npz {inputs.cosebis_modes_data}
        --out-file {output}

  - id: nu_penalty_verdicts
    type: table
    format: csv
    description: |
      The ν → ν−2 penalty for treating the two scale-cut boundaries
      as fitted parameters, applied across the whole
      [PTE table](#outputs.pte_table_appendix).
      One row per catalog version × statistic × cut (4 × 6 × 2 = 48).
      χ²_obs is recovered from each stored PTE and re-evaluated at
      ν−2; ν counts θ bins for ξ_±^B (twice that for ξ_tot^B; 7 at
      the fiducial cut), COSEBI modes (6 or 20), or bandpowers for
      C_ℓ^BB (17 at the fiducial cut).

      Columns: `version`, `version_full`, `cut`, `statistic`, `nu`,
      `nu_penalized`, `chi2`, `pte`, `pte_penalized`, `pte_decrease`,
      `passes`, `passes_penalized`, `verdict_change` (the last three
      against a fixed 0.05 level, not the
      [adopted p_thr](#decisions.pte_threshold)).
    decisions: [scale_cut_convention, pte_definition, reporting_binning, leakage_correction]
    inputs:
      - config_space_pte_data
      - harmonic_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/emit_nu_penalty_verdicts.py
        --config-space-evidence {inputs.config_space_pte_data}
        --harmonic-space-evidence {inputs.harmonic_space_pte_data}
        --reporting-binning {decisions.reporting_binning} --leakage-correction {decisions.leakage_correction}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}

  # ---------------------------------------------------------------------------
  # Figures. Most are sub-analysis figures.
  # ---------------------------------------------------------------------------

  # Pure E/B decomposition of ξ± for the fiducial catalog.
  - {id: fig_pure_eb_decomposition, from: data_vectors.pure_eb_data_vector_figure}

  # COSEBI B_n / σ_n for the first 20 modes, fiducial catalog —
  # full angular range (1'–250') overlaid on fiducial cuts (12'–83'). The >4σ
  # first-mode amplitude at full range and its near-zero amplitude at fiducial
  # cuts are the visible evidence behind `ccd_scale_cosebi_pattern`.
  - {id: fig_cosebis_fiducial, from: data_vectors.fig_cosebis_data_vector}

  # Cℓ^BB and Cℓ^EB normalised by uncertainty, fiducial catalog.
  - {id: fig_cl_fiducial, from: data_vectors.cl_data_vector_figure}

  # The version comparison is three figures: pure-mode ξ_±^B, harmonic Cℓ^BB and
  # COSEBI B_n across the four catalog variants.
  - {id: fig_versions_pure_eb, from: data_vectors.pure_eb_version_comparison_figure}
  - {id: fig_versions_cl, from: data_vectors.cl_version_comparison_figure}
  - {id: fig_versions_cosebis, from: data_vectors.cosebis_version_comparison}

  - id: fig_pte_heatmaps
    type: figure
    format: png
    description: |
      Configuration-space PTE maps for all four catalog versions.
      Columns show ξ_+^B, ξ_-^B, and COSEBI B_n (n ≤ 6) PTEs as a
      function of angular scale cuts; rows show different catalog
      versions. Solid blue cells indicate PTE < p_thr ([global PTE
      threshold](#decisions.pte_threshold)); whites and reds indicate
      consistency with zero. Black squares mark the adopted cuts (12–83
      arcmin). The size cut (fiducial versus initial) expands the
      acceptance region, while stellar masking contracts it.
    decisions: [scale_cut_convention, pte_threshold, fiducial_catalog, leakage_correction, reporting_binning]
    inputs:
      - config_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/config_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction} --reporting-binning {decisions.reporting_binning}
        --from-evidence {inputs.config_space_pte_data}
        --figure appendix
        --scale-cut-convention {decisions.scale_cut_convention}
        --pte-threshold {decisions.pte_threshold}
        --out-file {output}

  - id: fig_cl_pte_heatmap
    type: figure
    format: png
    description: |
      Harmonic-space C_ℓ^BB PTE maps for all four catalog versions.
      Solid blue cells indicate failing PTEs ([global PTE
      threshold](#decisions.pte_threshold)); whites and reds indicate
      consistency with zero. The initial and relaxed-flags catalogs show
      widespread failures across multipole ranges; the fiducial and
      masked catalogs pass across nearly all multipole combinations.
    decisions: [pte_threshold, fiducial_catalog, leakage_correction]
    inputs:
      - harmonic_space_pte_data
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_space_pte_matrices.py
        --fiducial-catalog {decisions.fiducial_catalog} --leakage-correction {decisions.leakage_correction}
        --from-evidence {inputs.harmonic_space_pte_data}
        --figure appendix
        --pte-threshold {decisions.pte_threshold}
        --out-file {output}

  - id: fig_harmonic_config_cosebis_full
    type: figure
    format: png
    description: |
      COSEBI E_n (top row) and B_n/σ_n (bottom row) for the [fiducial
      catalog](#decisions.fiducial_catalog), computed from
      configuration-space ξ_± (filled circles) and harmonic-space
      bandpowers (open squares). Modes n > 6 are shaded; for n ≤ 6,
      where the cosmological information is concentrated, we confirm
      consistency between the two paths on GLASS simulations.
    decisions: [fiducial_catalog, scale_cut_convention]
    inputs:
      - cosebis_harmonic_modes
    recipe:
      command: >
        python src/papers/bmodes/scripts/harmonic_config_cosebis_comparison.py
        --angular-range full
        --figure-from-modes {inputs.cosebis_harmonic_modes}
        --scale-cut-convention {decisions.scale_cut_convention}
        --out-file {output}
      resources: { cpus: 1, memory: "4GB" }

# -----------------------------------------------------------------------------
# Top-level decisions: the choices shared across the analysis (catalog,
# cosmology, scale cuts, blind, pure-mode estimator, PTE conventions), which
# sub-analyses inherit via `from: ../<id>`.
# -----------------------------------------------------------------------------
decisions:

  fiducial_catalog:
    label: "Fiducial catalog variant"
    tags: [data_selection]
    rationale: |
      Which ShapePipe v1.4 variant the reported results rest on.
      The size-cut catalog is adopted because null tests on the
      initial catalog fail in ξ_-^B (PTE 0.0012) and Cℓ^BB (0.0031),
      and tightening the size cut from > 0.5 to > 0.707 removes both
      failures. The masked and relaxed-flags variants
      are compared alongside it; the [PTE table](#outputs.pte_table_appendix)
      shows that none of the others passes all statistics at the
      fiducial cuts. All four are leakage-corrected
      ([leakage_correction](#decisions.leakage_correction)).
    default: size_cut
    options:
      size_cut:
        label: "Size-cut (v1.4.6.3)"
        description: |
          Size cut r_h,gal/r_h,psf > 0.707 on the 2894 deg²
          footprint, including the v1.4.6.3 PSF-size fix.
      initial:
        label: "Initial (v1.4.5)"
        excluded: true
        excluded_reason: "Reported beside the fiducial catalog in every version comparison rather than selected: it fails the null tests at the adopted cuts, and the GLASS mock validation and 10,000-bin convergence run exist only for v1.4.6.3."
        description: |
          The looser size cut r_h,gal/r_h,psf > 0.5, the reference
          the size cut is tested against.
      masked:
        label: "Masked (v1.4.8)"
        excluded: true
        excluded_reason: "Reported beside the fiducial catalog in every version comparison rather than selected: it fails the null tests at the adopted cuts, and the GLASS mock validation and 10,000-bin convergence run exist only for v1.4.6.3."
        description: |
          Size-cut sample with bright (r < 12) and faint
          (12 < r < 18) stellar-halo masking, leaving 2517 deg².
      relaxed_flags:
        label: "Relaxed flags (v1.4.11.3)"
        excluded: true
        excluded_reason: "Reported beside the fiducial catalog in every version comparison rather than selected: it fails the null tests at the adopted cuts, and the GLASS mock validation and 10,000-bin convergence run exist only for v1.4.6.3."
        description: |
          Size-cut sample with relaxed SExtractor deblending flags,
          raising n_eff by 26% on the 2894 deg² footprint.

  fiducial_cosmology:
    label: "Fiducial cosmology for covariance theory"
    tags: [covariance_model]
    rationale: |
      The analytic covariance needs a fixed cosmology for
      its matter power spectrum. Planck 2018 + BAO ΛCDM is the
      community reference and is shared with the covariances of
      Papers III and IV. No alternative is exposed: the B modes are
      tested against zero, so the cosmology enters only through the
      covariance.
    default: planck18
    options:
      planck18:
        label: "Planck 2018 + BAO"
        description: |
          Ω_m=0.30966, σ_8=0.8102, n_s=0.9665, Ω_b=0.04897,
          h=0.6766 (astropy `Planck18`).
        insights: [planck18_fiducial_cosmology]

  fiducial_blind:
    label: "Fiducial blind for reported data vectors"
    tags: [blinding]
    rationale: |
      Blinding acts on the source n(z): an external coordinator
      produced three variants (A, B, C), two with random shifts. The
      n(z) does not enter the B-mode data vectors and only the
      covariances depend on it: identical across blinds in
      configuration space (the Gaussian B-mode covariance of a null
      signal is pure shape noise), within 0.5% in harmonic space over
      the fiducial ℓ range. A single blind therefore serves
      throughout; blind A is used.
    default: blind_a
    options:
      blind_a:
        label: "Blind A"
      blind_b:
        label: "Blind B"
        excluded: true
        excluded_reason: "The paper reports blind A; B-mode covariances are blind-independent, shown by validation.bb_covariance_blind_independence_evidence."
      blind_c:
        label: "Blind C"
        excluded: true
        excluded_reason: "The paper reports blind A; B-mode covariances are blind-independent, shown by validation.bb_covariance_blind_independence_evidence."

  fiducial_scale_cuts:
    label: "Scale cuts for the B-mode null tests"
    tags: [scale_cuts]
    rationale: |
      Which angular and multipole ranges the null tests (and Papers
      III and IV's inference) use: 12 < θ < 83 arcmin in
      configuration space and 300 < ℓ < 1600 in harmonic space. The
      12′ lower bound excludes most pair separations at the 6–14
      arcmin MegaCam CCD scale, suppressing the
      [repeating-additive-bias](#findings.ccd_scale_cosebi_pattern)
      pattern. The cuts were chosen from the B-mode tests together
      with additional systematics checks and blinded
      inference-stability checks in Papers III and IV. Treating the
      two boundaries as fitted parameters lowers the minimum PTE
      (ξ_-^B) from 0.019 to 0.005, just below the 0.006 threshold
      calibrated at these cuts
      ([finding](#findings.bmodes_null_at_adopted_cuts)).
      Scale cuts are preferred to subtracting the B modes because
      the relation between E- and B-mode contamination depends on
      the physical mechanism. No look-elsewhere correction is applied
      for the many cuts tested, because the B modes were only one of
      four factors behind the choice, with PSF leakage, modeling
      systematics and the scale-cut dependence of the blinded
      constraints.

      The tables and heatmaps always show both ranges; this decision
      selects which one
      [primary_null_test_report](#outputs.primary_null_test_report)
      treats as primary.
    default: adopted
    options:
      adopted:
        label: "12'–83', 300 < ℓ < 1600"
        insights: [asgari19a_bmode_subtraction_insufficient]
        description: |
          Configuration space: edges 9 and 16 of the 21-edge
          geomspace(1', 250') reporting grid, read as set by
          [scale_cut_convention](#decisions.scale_cut_convention).
          Harmonic: 300 < ℓ < 1600.
      full_range:
        label: "Full range (1'–250', 8 ≤ ℓ ≤ 2048)"
        description: |
          Makes the full range the primary report. It is always
          shown beside the fiducial cut in the
          [PTE table](#outputs.pte_table_appendix) to expose
          contamination at small and large scales.
      bmode_bias_subtraction:
        label: "Subtract a B-mode template"
        excluded: true
        excluded_reason: |
          The B-mode amplitude does not determine the E-mode
          contamination, since the E/B ratio depends on the
          systematic; scale cuts need no such assumption.

  scale_cut_convention:
    label: "θ-cut convention"
    tags: [scale_cuts]
    rationale: |
      What the stated 12'–83' [configuration-space
      cut](#decisions.fiducial_scale_cuts) denotes. The cut is edges 9
      and 16 of the reporting grid geomspace(1', 250', 21),
      θ ∈ (11.997', 82.861'), and 12' and 83' are those edges rounded
      to the arcminute. The pure-mode tests take whole reporting bins
      (9–15) under either reading, so only the COSEBIs respond, since
      their filters are built on the cut itself: reading the rounded
      values literally moves the directly computed configuration-space
      fiducial χ²/PTE from 3.25/0.78 to 4.679/0.586. The
      [PTE table](#outputs.pte_table_appendix) reads its COSEBI values
      from the grid cell at edges 9 and 16, so it keeps 0.78. The ℓ cut
      selects whole bandpowers and the full 1'–250' range is the same,
      so neither depends on the reading.
    default: grid_bin_edges
    options:
      grid_bin_edges:
        label: "Reporting-grid bin edges"
        description: |
          θ ∈ (11.997', 82.861'), edges 9 and 16 of
          geomspace(1', 250', 21); reproduces the reported
          fiducial PTEs.
      rounded_arcmin:
        label: "Rounded 12'–83'"
        description: |
          The stated values taken literally; shifts the directly
          computed configuration-space COSEBI fiducial χ²/PTE from
          3.25/0.78 to 4.679/0.586 and the harmonic one from
          4.58/0.60 to 4.637/0.591.

  integration_grid:
    label: "ξ± integration grid for B-mode filters"
    tags: [integration]
    rationale: |
      The pure-mode and COSEBI filters are integrated against ξ±
      measured on a grid much finer than the 20 reporting bins:
      1000 logarithmic bins over θ = 0.5'–300'. A 10,000-bin run on
      the fiducial catalog finds the B_n amplitudes and their
      significance stable (COSEBI n ≤ 6 PTE 0.78 → 0.71 at the fiducial
      cuts; individual high modes move further, as
      [the convergence finding](#analyses.validation.analyses.estimator_checks.findings.cosebis_verdicts_stable_at_1000_bins)
      records).
    default: bins_1000
    options:
      bins_1000:
        label: "1000 bins"
        description: |
          One TreeCorr run per catalog variant.
      bins_10000:
        excluded: true
        excluded_reason: "Used only as the convergence check in validation.tenk_grid_comparison; the mock measurements and covariance exist on the 1000-bin grid."
        label: "10,000 bins (convergence test)"
        description: |
          Fiducial catalog only.

  pure_eb_integration_method:
    label: "Pure E/B transform quadrature"
    tags: [integration]
    rationale: |
      The Schneider (2022) transform, as implemented in
      `cosmo_numba`, lays a degree-5 local interpolant through the
      integrand samples. The interpolant depends linearly on the
      samples, so the transform is a fixed linear map on ξ_± as long
      as the integration rule does not depend on the data. QUADPACK's
      `dqags` subdivides adaptively according to the sampled values,
      so under it the map is weakly non-linear:
      on noisy input the quadrature error correlates with the noise
      and rectifies into a spurious signal, the ≈ −0.6 σ mean ξ_+^B
      residual at θ < 3' on the GLASS mocks.

      Integrating the same interpolant with fixed Gauss-Legendre
      quadrature cell by cell makes the transform exactly linear,
      `out = M · [ξ_+ ; ξ_-]`, with `M` set by the grid and kernels
      alone. It agrees with a brute-force integration to
      ≤ 3 × 10⁻¹⁵ of max|ξ|. On Monte Carlo noise draws outside this
      analysis's outputs, the small-θ ξ_+^B bias falls from
      −25.7 σ_MC under `dqags` to
      −0.9 σ_MC, a residual proportional to the injected noise and
      so finite-draw error. `dqags` is itself the inaccurate side,
      up to 15.6% wrong on V_- at 1000 integration bins, worsening
      under grid refinement.

      The `dqags` error is independent noise in every realisation,
      so it also inflates every Monte-Carlo-propagated covariance:
      ξ_-^B bin 0 by ×3.3, ξ_-^amb by ×17 at all scales, ξ_+^B bin 0
      by ×1.13. This decision therefore forks the data vectors, the
      mock scatter and the covariance together. The fixed operator
      is preferred because it is accurate and, being linear, cannot
      rectify noise.
    default: fixed_operator
    options:
      adaptive_dqags:
        label: "Adaptive dqags"
        description: |
          `cosmo_numba`'s `get_pure_EB_modes` with tolerances
          epsabs = epsrel = 1e-10, evaluated pointwise at the 20
          reporting-bin centres. Its data-dependent subdivision
          rectifies noise into a spurious small-θ B mode and
          inflates propagated covariances.
      fixed_operator:
        label: "Fixed-quadrature operator M"
        description: |
          The same interpolant and kernels integrated with a
          16-node Gauss-Legendre rule per grid cell, assembled once
          per grid and applied as a matrix product, so noise cannot
          rectify.

          The operator is evaluated on the fine-grid nodes and its
          output averaged into the reporting bins (weighted per
          [pure_eb_rebinning_weights](#decisions.pure_eb_rebinning_weights)),
          with integration limits from the fine-grid extent: the
          operator evaluates only on grid nodes, the reporting-bin
          centres sit up to 0.32% off them, and the reporting data
          vector is itself a bin average rather than a point
          sample. The two options therefore differ in
          geometry as well as quadrature; the validation shows the
          quadrature term dominates. Rows with fewer than six support
          nodes, too few for the degree-5 interpolant, are rejected;
          none occur on the 1000-bin grid, where the smallest support
          is 29 nodes.

  pure_eb_rebinning_weights:
    label: "Pure-mode rebinning weights"
    tags: [binning]
    rationale: |
      The [averaged geometry](#decisions.pure_eb_integration_method)
      leaves the pure modes on 1000 fine nodes, which must be
      averaged into the 20 reporting bins. The pure-mode identity
      holds pointwise in θ, so the local and integral terms must be
      averaged with the *same* weights: on 350 GLASS mocks every
      hybrid that averages them differently is biased and every
      consistent estimator is unbiased.

      The two consistent candidates differ by 2.7% on rebinned ξ_+
      but are statistically indistinguishable (mock scatter 0.98×;
      under the Monte Carlo covariance, data ξ_-^B PTE 0.023 with
      pair-count weights vs 0.026 uniform): the integral term is
      smooth and nearly fully correlated across the ~43 fine nodes
      of a bin, so any
      weighting gives it the same value. The weights matter only for
      the local term, the measured ξ_±, and there the
      pair-count-weighted mean over fine bins is by construction the
      reporting-bin estimator ξ-hat_± itself (Asgari et al. 2019,
      Appendix A). The unweighted mean is a different, mildly
      noisier estimator that is neither the measured correlation
      function nor the bin average of theory. Pair-count weighting
      is adopted. A transform evaluated pointwise does no rebinning
      (`none`).
    default: npairs
    options:
      npairs:
        label: "Pair-count weighted"
        description: |
          Each fine node is weighted by its TreeCorr pair count, so
          the averaged local term is exactly the reporting-bin
          ξ-hat_±.
      uniform:
        label: "Unweighted"
        description: |
          Equal weight per fine node; unbiased and equally
          powerful on mocks, but its local term is not the measured
          correlation function.
      none:
        label: "None (pointwise)"
        description: |
          The transform is evaluated directly at the 20 reporting
          bin centres, so no rebinning occurs; the only selection
          consistent with
          [adaptive_dqags](#decisions.pure_eb_integration_method).

  pure_eb_integration_limits:
    label: "Pure-mode integration limits"
    tags: [integration]
    rationale: |
      The Schneider (2022) decomposition is defined on a finite
      [θ_min, θ_max]. A wide interval lets small-θ contamination
      into every reporting bin (ξ_-^B at θ mixes in ξ measured below
      θ); a narrow one discards information and moves the
      estimator. Shrinking the limits inward bin by bin finds no
      plateau: the data vector keeps moving, non-monotonically,
      driven entirely by ξ_-^B (ξ_+^B stays null at 0.72–0.91),
      while σ shifts by ≤ 5.6% (ξ_+) and ≤ 1.3% (ξ_-). The combined
      pure-mode p-value spans 0.018–0.064 across that scan, which is
      not an output here, so the scan measures an operator systematic
      of ~±0.02 on p rather
      than singling out a window (the scan used a separate Monte
      Carlo covariance, whose p-values differ from the reported
      ones by 0.01–0.02).

      The [averaged geometry](#decisions.pure_eb_integration_method)
      keeps the full fine-grid extent, capped at 300'. It cannot
      start at the 1' reporting floor: nodes next to θ_min would
      have fewer than the six support nodes the degree-5 interpolant
      needs, and a 1' floor leaves five under-determined ξ_- edge
      rows. Only the pointwise chain, which evaluates at the interior
      bin centres, can use the reporting edges. Each geometry
      therefore has one valid option and any other pairing is
      rejected, so this decision follows the integration method.
    default: fine_grid_extent
    options:
      fine_grid_extent:
        label: "Fine-grid extent, 0.5'–300'"
        description: |
          Averaged geometry: fine-grid nodes from the 0.5' grid
          floor to 300' (the mock grid's native 500' upper edge is
          capped at 300'); support below 1' keeps the edge rows
          determined.
      reporting_extent:
        label: "Reporting-grid extent, 1'–250'"
        description: |
          Pointwise only: the reporting limits [1', 250'], which the
          `adaptive_dqags` chain integrates over.

  pure_eb_covariance_method:
    label: "Pure-mode covariance construction"
    tags: [covariance_model]
    rationale: |
      The [fixed-quadrature estimator](#decisions.pure_eb_integration_method)
      is exactly linear in the fine ξ_± vector, ξ^{E/B/amb} =
      M · [ξ_+; ξ_−], so its covariance is M C_ξ Mᵀ with C_ξ the
      CosmoCov covariance. The two options are two ways of
      evaluating that matrix.

      The Monte Carlo pushes 2000 Gaussian draws of ξ_±
      through the transform and applies the Hartlap factor at χ²
      time. It equals M Ĉ_ξ Mᵀ with Ĉ_ξ the draws' sample covariance
      (reproduced to 1e-15), so it differs from the exact matrix only
      by sampling noise, and the measured differences sit at that
      level: all ≤ 1.5σ of the simulated MC scatter (fiducial ξ_−^B
      PTE 0.025 MC vs 0.019 exact, MC scatter 0.004).

      The exact matrix is adopted. It is noise-free, so no Hartlap
      factor enters, and it removes a noise term from every
      pure-mode PTE and from the mock-calibrated threshold built
      under the same covariance. It also shows that the
      data/mock-matched B variance ratio is a constant 1.353 across
      ξ^B bins, as expected for a shape-noise B-mode covariance; the
      MC's per-bin 1.23–1.43 spread is noise. It requires a linear
      operator, so `adaptive_dqags` can only use the Monte Carlo.
    default: exact_linear
    options:
      exact_linear:
        label: "Exact M C_ξ Mᵀ"
        description: |
          M from the averaged transform applied to the 2000 fine-grid
          unit vectors; C_ξ is the CosmoCov covariance (data) or its
          mock-matched twin. No Hartlap factor.
      monte_carlo:
        label: "Monte Carlo, Hartlap-corrected"
        description: |
          Sample covariance of [2000 draws](#decisions.mc_samples)
          from C_ξ through the same transform, with the Hartlap
          factor (N − p − 2)/(N − 1) on its inverse; the only option
          available to `adaptive_dqags`.
        insights: [hartlap07_correction]

  harmonic_validation_binning:
    label: "Harmonic COSEBI bandpower count"
    tags: [binning]
    rationale: |
      The harmonic COSEBI path sums W_n(ℓ) filters against Cℓ
      bandpowers, so its measurement, covariance and transform must share
      one bin count. Too few bins cannot resolve the filters' oscillations;
      too many make mode-coupling deconvolution unstable.
      The paper validates 96 √ℓ-spaced bins on GLASS mocks, where modes
      n ≤ 6 agree with the configuration-space path.
      The 32 bandpowers of the [Cℓ null test](#analyses.data_vectors.analyses.harmonic_space) do not
      resolve the oscillations beyond n ≈ 4.
    default: bins_96
    options:
      bins_96:
        label: "96 √ℓ-linear bandpowers"
      bins_128:
        label: "128 √ℓ-linear bandpowers"
        description: "Finer bins than the 96 validated on the mocks."
      bins_32:
        label: "32 √ℓ-linear bandpowers"
        excluded: true
        excluded_reason: "Cannot resolve W_n(ℓ) beyond n ≈ 4."

  mc_samples:
    label: "Monte-Carlo sample count"
    tags: [covariance_model]
    rationale: |
      How many Gaussian draws of ξ± from the CosmoCov covariance the
      [Monte-Carlo pure-mode covariance](#decisions.pure_eb_covariance_method)
      pushes through the filters. The exact construction makes no
      draws, so this count matters only under `monte_carlo`. The
      default is 2000 draws; 1000 and 5000 test sample-count
      sensitivity. It does not touch the COSEBI
      covariances, which are propagated linearly.
    default: n_2000
    options:
      n_2000:
        label: "2000"
      n_1000:
        label: "1000"
      n_5000:
        label: "5000"
        description: "2.5× as many draws as the default, to test sample-count sensitivity."

  pte_definition:
    label: "PTE statistical convention"
    tags: [statistics]
    rationale: |
      Every PTE is the χ² tail probability of the measured χ² with
      ν equal to the number of data points in the range, valid for
      linear estimators of Gaussian data. Anderson-Darling or KS
      tests would be harder to interpret as calibrated tails. On the
      GLASS mocks the C_ℓ^BB PTEs are uniform, while the
      configuration-space PTEs skew mildly low
      (⟨χ²⟩/ν = 1.07–1.20), which calibrating
      [p_thr](#decisions.pte_threshold) on the same realizations
      partially absorbs.
    default: chi2_tail
    options:
      chi2_tail:
        label: "χ² tail probability"
        insights: [stebbins96_scalar_perturbations_give_no_bmodes, higher_order_lensing_bmodes_negligible]
      anderson_darling:
        label: "Anderson-Darling"
        excluded: true
        excluded_reason: "Paper II computes χ² tails; no Anderson–Darling null statistic or calibration is implemented."
        description: "Not used; harder to interpret as a calibrated tail."
      kolmogorov_smirnov:
        label: "Kolmogorov-Smirnov"
        excluded: true
        excluded_reason: "Paper II computes χ² tails; no Kolmogorov–Smirnov null statistic or calibration is implemented."
        description: "Not used."

  pte_threshold:
    label: "PTE pass threshold p_thr"
    tags: [statistics]
    rationale: |
      The test statistic is the minimum PTE over the six B-mode
      statistics, and p_thr is set on the systematics-free GLASS
      realizations so that a clean sample fails 5% of the time, as a
      single test at PTE = 0.05 would. The six are correlated but not
      perfectly, so the minimum skews low and p_thr sits below 0.05:
      0.0058 at the fiducial 12–83′ window on 350 mocks (68% interval
      0.0044–0.0076;
      [mock_min_pte_calibration](#analyses.validation.analyses.glass_mocks.outputs.mock_min_pte_calibration)).
      It stays ≤ 0.0093 over every window with θ_min ≥ 5.24′ and
      θ_max ≥ 36.20′, a region containing the fiducial window with
      margin ([scale-cut scan](#analyses.validation.analyses.glass_mocks.outputs.mock_min_pte_scale_cut_scan));
      the excursions at the plane's extremes come from few, highly
      correlated degrees of freedom at small θ and the known
      large-scale contamination at large θ_max. A single
      representative 0.01 is adopted everywhere — a clean sample
      fails it 7% of the time at the fiducial cuts — matching the
      value Paper III uses. A
      [PTE table](#outputs.pte_table_appendix) row passes when its
      minimum PTE is at least p_thr. This decision sets the heatmap
      colour scale, the threshold marked on the calibration figure
      and the value quoted in the report; the PTEs themselves do not
      depend on it.
    default: calibrated_0p01
    options:
      nominal_0p05:
        label: "0.05 per statistic"
        description: "Each of the six statistics tested against 0.05. The minimum over the six skews low, so a clean sample fails at least one more than 5% of the time."
      calibrated_0p01:
        label: "0.01 on the minimum PTE"
        insights: [asgari19a_bmode_verdict_depends_on_statistic, jefferson25_estimators_disagree_on_same_data]
        description: |
          Conservative rounding of the 350-mock minimum-PTE
          calibration.

  leakage_correction:
    label: "PSF-leakage correction"
    tags: [data_selection]
    rationale: |
      Each catalog variant exists with and without Paper I's
      object-wise PSF-leakage correction (binned regression in S/N
      and galaxy-PSF size ratio). Results are reported
      leakage-corrected, as in Papers III and IV. The correction
      shifts individual PTEs by at most 0.093 across all catalog
      versions and statistics, and no pass/fail conclusion changes.
    default: applied
    options:
      applied:
        label: "Applied"
        insights: [guerrini25_psf_errors_contaminate_xi]
      uncorrected:
        label: "Uncorrected"
        description: |
          Ellipticities without the leakage correction; used for
          cross-checks only.

  bandpower_binning:
    label: "Bandpower binning scheme"
    tags: [binning]
    rationale: |
      The Cℓ^BB null tests use Paper IV's data-vector binning:
      32 square-root-spaced bandpowers (ℓ^0.5) over
      8 ≤ ℓ ≤ 2048, the scheme Paper IV adopts from DES Y3.
      Square-root spacing sits between linear binning, which
      spends most bandpowers at high ℓ, and logarithmic binning,
      which spends most at low ℓ. The
      [harmonic-space COSEBIs](#analyses.validation.analyses.estimator_checks) use 96
      bandpowers in the same scheme, fine enough to resolve the
      W_n(ℓ) filter oscillations.
    default: bandpowers_32_powspace
    options:
      bandpowers_32_powspace:
        label: "32 √ℓ-spaced over 8 ≤ ℓ ≤ 2048"
      bandpowers_96_powspace:
        excluded: true
        excluded_reason: "Used for the harmonic COSEBI transform, not the BB null test; the mock Cℓ spectra and covariance exist only at 32 bands."
        label: "96 √ℓ-spaced over 8 ≤ ℓ ≤ 2048 (COSEBI transform)"
        description: |
          Fine grid for the harmonic-space COSEBIs; not used by
          the Cℓ^BB null test.
      bandpowers_16_powspace:
        excluded: true
        excluded_reason: "The mock Cℓ spectra and covariance exist only at 32 bands."
        label: "16 √ℓ-spaced"
        description: |
          Coarser bandpowers, departing from Paper IV's data
          vector.
      bandpowers_64_powspace:
        excluded: true
        excluded_reason: "The mock Cℓ spectra and covariance exist only at 32 bands."
        label: "64 √ℓ-spaced"
        description: |
          Finer bandpowers, departing from Paper IV's data
          vector.

  noise_bias_correction:
    label: "Shot-noise / noise-bias correction"
    tags: [estimator]
    rationale: |
      Shape noise biases Cℓ auto-spectra by an amount
      that scales with the inverse galaxy density. The paper
      subtracts an analytic shot-noise contribution following
      Paper IV's implementation of the catalog-based estimator,
      which Wolz et al. (2025) show is unbiased against noise
      uncorrelated between sources. A Monte-Carlo estimate is
      the standard alternative for map-based pipelines.
    default: analytic_shot_noise
    options:
      analytic_shot_noise:
        label: "Analytic shot-noise subtraction"
        insights: [wolz25_catalog_based_pseudo_cl]
      mc_noise_bias:
        excluded: true
        excluded_reason: "Not used: the analytic subtraction is unbiased against noise uncorrelated between sources, and no matching mock covariance exists for a Monte Carlo estimate."
        label: "Monte-Carlo noise-bias estimator"
        description: |
          Subtracts the mean Cℓ of ellipticity-randomised
          realisations.

  pte_blind_strategy:
    label: "Blinds evaluated for the reported PTEs"
    tags: [blinding]
    rationale: |
      The reported PTEs, pure-mode and harmonic, use blind A. They are
      not re-evaluated per blind: the check in
      [null_tests](#analyses.null_tests) instead compares the E- and
      B-mode covariances across the three blinds.
    default: blind_a_for_paper
    options:
      blind_a_for_paper:
        label: "Blind A for the reported PTEs"
      all_blinds_for_paper:
        excluded: true
        excluded_reason: "The paper reports blind A; independence is tested by validation.bb_covariance_blind_independence_evidence."
        label: "All three blinds in the reported PTEs"
        description: |
          Would triple the PTE table without adding B-mode
          information, given the blind-independence check.

  reporting_binning:
    label: "Reporting-grid angular binning"
    tags: [binning]
    rationale: |
      20 logarithmic bins over [1', 250'] match the
      configuration-space data vector of Paper III. The bin edges
      define the
      [adopted scale cuts](#decisions.fiducial_scale_cuts):
      the fiducial 12'–83' window spans edges 9 to 16 of
      `geomspace(1, 250, 21)`.
    default: bins_20
    options:
      bins_20:
        label: "20 log bins over [1', 250']"
        description: |
          The binning of the paper and of Paper III.
      bins_40:
        excluded: true
        excluded_reason: "The mock reporting measurements and their matched covariance exist only at 20 bins."
        label: "40 log bins over [1', 250']"
        description: |
          Finer reporting grid for sensitivity studies; not used
          in the paper.

  decomposition_method:
    label: "Pure-mode integral-transform construction"
    tags: [estimator]
    rationale: |
      Schneider et al. (2022) decompose ξ_±(θ) on a finite
      [θ_min, θ_max] into pure E, pure B and ambiguous components
      by integral transforms of the measured ξ_±, with boundary
      functions S_±(θ) and V_±(θ) absorbing the ambiguous-mode
      polynomials a + b θ², c θ⁻² + d θ⁻⁴. Reconstructing the pure
      modes from COSEBI coefficients is mathematically equivalent
      but needs the same angular range for ξ_+ and ξ_-; the direct
      transform lets each carry its own scale cuts, so it is used.
      The transform runs through `cosmo_numba` (Guinot et al. 2026,
      <https://github.com/aguinot/cosmo-numba>), a JIT implementation of
      the Schneider et al. (2022) kernels covering the boundary functions
      S_± and V_± and the integral kernels on the 1000-bin grid.
    default: schneider22_integral_transform
    options:
      schneider22_integral_transform:
        label: "Schneider et al. 2022 integral transform"
        insights: [pure_mode_decomposition_unique_on_finite_interval, schneider22_pure_modes_direct_from_xi, guinot26_cosmo_numba_precision]
      cosebi_reconstruction:
        label: "COSEBI-coefficient reconstruction"
        excluded: true
        excluded_reason: "Paper II implements the direct Schneider (2022) transform; reconstructing ξ E/B from COSEBI coefficients has no implementation."
        description: |
          Equivalent on a shared [θ_min, θ_max], but does not
          allow independent ξ_+ / ξ_- scale cuts.

  mode_count:
    label: "Number of COSEBI modes computed"
    tags: [estimator]
    rationale: |
      The cosmological E-mode amplitude saturates by n ≈ 5–6, but
      systematics need not, so n_max = 20 is conservative for
      information and matches the mode count used to test COSEBI
      B modes for systematics. The filter roots are computed at
      120-digit precision, so numerics do not set the limit. Fewer
      modes would lose the high-n end of the full-range
      [COSEBI failure signature](#findings.ccd_scale_cosebi_pattern).
      The [convergence test](#analyses.validation.analyses.estimator_checks) covers every
      mode the COSEBI analysis reports, so it takes the same n_max.
    default: n_max_20
    options:
      n_max_20:
        label: "20 modes"
        insights: [asgari19a_cosebis_nmax20_for_systematics]
      n_max_15:
        excluded: true
        excluded_reason: "The null tests and their mock calibration are defined for n ≤ 6 and n ≤ 20; there is no 15-mode test."
        label: "15 modes"
        description: |
          Drops the high-n modes where the full-range
          repeating-additive signature is most visible.
      n_max_30:
        label: "30 modes"
        description: |
          Not computed.
        excluded: true
        excluded_reason: |
          Beyond the n ≤ 20 used for B-mode systematics tests; adds
          noise-dominated degrees of freedom.

# -----------------------------------------------------------------------------
# Findings: claims derived from this analysis's own measurements. Evidence
# anchors the reported artifacts.
# -----------------------------------------------------------------------------
findings:

  bmodes_null_at_adopted_cuts:
    id: bmodes_null_at_adopted_cuts
    label: "B modes are consistent with zero at the adopted scale cuts"
    claim: |
      UNIONS-3500 weak-lensing B modes are consistent with zero at the
      adopted scale cuts across pure-mode correlation functions,
      COSEBIs, and harmonic-space power spectra. Without scale cuts,
      ξ_+^B and the COSEBIs show significant B modes on small scales,
      whereas ξ_-^B and C_ℓ^BB show a broad, low-level excess with
      little scale dependence; this excess is significant in ξ_-^B on
      large scales and marginal at the fiducial cuts.
    notes: |
      Size-cut catalog at the fiducial cuts: ξ_+^B 0.82, ξ_-^B 0.019,
      ξ_tot^B 0.039, COSEBIs n ≤ 6 0.78, C_ℓ^BB 0.30. The minimum,
      0.019, passes the 0.01 threshold; 38 of 350 systematics-free
      GLASS realizations (11%) have a lower minimum PTE. On the full
      range ξ_+^B (0.0026), ξ_-^B (0.0019) and COSEBIs n ≤ 6 (1.4×10⁻⁵)
      fail. Treating the two scale-cut boundaries as fitted parameters
      (ν → ν−2) is the most pessimistic degrees-of-freedom treatment;
      it lowers every PTE, and only ξ_-^B falls below 0.01, to 0.005
      ([nu_penalty_verdicts](#outputs.nu_penalty_verdicts)), just below
      the 0.006 threshold calibrated at these cuts.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        artifact: pte_table_appendix
        quote:
          exact: "Size_cuts,SP_v1.4.6.3_leak_corr,Fiducial,0.777,0.943,0.823,0.0193,0.0387,0.299"
      - id: ev2
        artifact: mock_min_pte_calibration
        quote:
          exact: '"p_global_one_sided_count": 38'
      - id: ev3
        artifact: fig_pure_eb_decomposition
      - id: ev4
        artifact: nu_penalty_verdicts
        quote:
          exact: "Size_cuts,SP_v1.4.6.3_leak_corr,fiducial,xim_B,7,5,16.7177,0.0193098,0.00506742,0.0142423,0,0,0"
    scope: "Size-cut catalog; 12′–83′ in configuration space, 300 < ℓ < 1600 in harmonic space."

  ccd_scale_cosebi_pattern:
    id: ccd_scale_cosebi_pattern
    label: "A CCD-scale COSEBI B-mode pattern, suppressed by the 12′ cut"
    claim: |
      On the full angular range, all catalog versions show an
      oscillatory COSEBI B-mode pattern plausibly caused by a repeating
      additive shear bias at CCD angular scales, as also seen in
      CFHTLenS on the same MegaCam camera. The adopted lower cut
      suppresses this pattern without discarding the angular scales
      that carry most of the cosmological signal.
    notes: |
      The first COSEBI mode of the size-cut catalog reaches 4.1σ on
      the full range and 0.8σ at the fiducial cuts. MegaCam's 40 CCDs
      span 6–14′ individually, and the B-mode contamination
      concentrates at θ_min ≲ 12′
      ([fig_pte_heatmaps](#outputs.fig_pte_heatmaps)). PSF-leakage
      correction does not significantly change the pattern, so its
      origin is either not leakage or leakage beyond the second-order
      model. Whether it arises from the propagation of exposure offsets
      in multi-exposure shape fitting (Paper V) remains open.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        artifact: fig_cosebis_fiducial
      - id: ev2
        artifact: cosebis_first_mode_significance
        quote:
          exact: '"full_range_significance": 4.08998422120677'
      - id: ev3
        artifact: fig_pte_heatmaps
    scope: "All four ShapePipe v1.4 variants, 1′–250′ and the fiducial cuts."

  filter_functions_set_sensitivity:
    id: filter_functions_set_sensitivity
    label: "Filter functions, not the basis, set null-test sensitivity"
    claim: |
      C_ℓ^BB passes where COSEBIs computed from the same harmonic-space
      bandpowers fail, because the COSEBI filter functions concentrate
      sensitivity on the contaminated scales; COSEBIs from
      configuration and harmonic space agree with each other. A null
      test in one representation therefore cannot validate another,
      and a B-mode failure in any framework warrants scrutiny across
      all of them.
    notes: |
      Size-cut catalog, COSEBIs n ≤ 6: PTE 0.78 (configuration) and
      0.60 (harmonic) at the fiducial cuts, 1.4×10⁻⁵ and 1.6×10⁻⁵ on
      the full range, while C_ℓ^BB passes at 300 < ℓ < 1600 (0.30).
      This supports Asgari et al. (2019) and matches Jefferson et al.
      (2025), who found tomographic bins passing pseudo-C_ℓ tests
      failing under HybridEB.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        artifact: fig_harmonic_config_cosebis_full
      - id: ev2
        artifact: cosebis_harmonic_config
        quote:
          exact: |
            size_cuts,harmonic,fiducial,0.598,4.58,6
            size_cuts,harmonic,full_range,1.62e-05,32.0,6
            size_cuts,config,fiducial,0.777,,
            size_cuts,config,full_range,1.37e-05,,
    scope: "Size-cut catalog, fiducial and full-range cuts."

  only_size_cut_catalog_passes:
    id: only_size_cut_catalog_passes
    label: "Only the size-cut catalog passes in every representation"
    claim: |
      Of the four catalog variants, only the size-cut catalog passes
      every statistic: tightening the size cut suppresses B-mode power
      in ξ_-^B and harmonic space, adding stellar-halo masks causes a
      failure in ξ_-^B, and COSEBIs (n ≤ 6) pass for all versions.
      Because the same contamination projects differently into
      angular, modal, and multipole representations, demanding that
      all three pass places tighter constraints than any single null
      test.
    notes: |
      Fiducial-cut failures (PTE < 0.01): initial ξ_-^B 0.0012,
      ξ_tot^B 0.0014, C_ℓ^BB 0.0031; masked ξ_-^B 0.0036; relaxed
      flags ξ_-^B 7.5×10⁻⁵, ξ_tot^B 6.7×10⁻⁵, C_ℓ^BB 5.9×10⁻¹⁰. Why
      masking fails ξ_-^B is undetermined: the irregular mask may
      leave more modes ambiguous, or removing noisy regions near bright
      stars may raise the significance of contamination elsewhere. The
      relaxed-flags catalog also raises the total ξ_+ beyond 16′,
      suggesting the admitted objects affect the signal itself.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        artifact: pte_table_appendix
        quote:
          exact: "Masked,SP_v1.4.8_leak_corr,Fiducial,0.604,0.811,0.864,0.00359,0.0401,0.441"
      - id: ev2
        artifact: pte_table_appendix
        quote:
          exact: "Relaxed_flags,SP_v1.4.11.3_leak_corr,Fiducial,0.824,0.831,0.418,7.48e-05,6.68e-05,5.85e-10"
      - id: ev3
        artifact: pte_table_appendix
        quote:
          exact: "Initial,SP_v1.4.5_leak_corr,Fiducial,0.938,0.611,0.526,0.00119,0.00138,0.00311"
      - id: ev4
        artifact: fig_versions_pure_eb
    scope: "Four ShapePipe v1.4 leakage-corrected variants at the fiducial cuts."

# -----------------------------------------------------------------------------
# Prior insights: quote evidence from the literature. Covers the three
# estimator families' foundational methods papers (Schneider 2022 for pure-mode
# ξ_±, Schneider/Eifler/Krause 2010 for COSEBIs, Wolz/Alonso/Nicola 2025 for
# catalog-based pseudo-Cℓ, with Becker/Rozo 2016 as a related estimator),
# Hartlap 2007 for the sample-covariance bias correction, Asgari 2019a for
# the repeating-additive B-mode signature, and Planck 2020 for the fiducial
# cosmology. The 1000-bin integration-grid choice is supported by
# its own 10,000-bin convergence check and does not carry a prior
# insight.
#
# A second group covers the accuracy of the analytic pseudo-Cℓ Gaussian
# covariance that the harmonic-space B-mode null test relies on: Efstathiou
# 2004 for the narrow-kernel assumption itself, García-García 2019 for the
# NKA's failure on B-mode spectra and at ℓ ≲ 50, Nicola 2021 for the improved
# NKA (the estimator actually used) and its residual low-ℓ and E/B-mixing
# errors, Alonso 2019 for why an unpurified Cℓ^BB variance is dominated by
# leaked E modes, and Alonso 2026 for the catalogue-based iNKA's ℓ ≳ 10
# B-mode validity floor. Together these motivate validating the covariance on
# the GLASS mocks; none of them predicts the size of the effect for a footprint
# as small and fragmented as UNIONS.
# -----------------------------------------------------------------------------
prior_insights:
  asgari19a_cosebis_nmax20_for_systematics:
    id: asgari19a_cosebis_nmax20_for_systematics
    claim: |
      COSEBI E-mode predictions vanish beyond the first ~7 modes, so
      high modes carry no cosmological information, but systematic
      signals need not follow that behaviour and can be significant
      at large n. Truncating at n = 20 covers both the cosmological
      and the systematic-diagnostic range.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "Therefore, we do not expect to gain any cosmological information from these modes."
        location:
          page: 7
      - id: ev2
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "On the other hand the signal from systematic effects does not necessarily follow the same behaviour."
        location:
          page: 7
      - id: ev3
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "which encompasses modes that are important for both cosmological and systematic analyses."
        location:
          page: 7
    scope: |
      COSEBI B-mode analysis of KiDS-450, DES-SV and CFHTLenS
      (Asgari et al. 2019a, §4); same n_max = 20 as Paper II.

  schneider22_pure_modes_direct_from_xi:
    id: schneider22_pure_modes_direct_from_xi
    claim: |
      Pure-mode correlation functions and COSEBIs carry the same
      information, but the pure modes can be computed directly from
      ξ_± without the (infinite) COSEBI set; in practice the
      equivalence is only approximate, because of the finite number
      of COSEBI modes and the finite ξ_± binning.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: "However, as we show here, they can also be obtained without first calculating the (infinite) set of COSEBIs."
        location:
          page: 6
      - id: ev2
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: "In practice, this exact equivalence will apply only approximately, due to the finite number of COSEBI modes and the finite binning of the correlation functions"
        location:
          page: 6
    scope: "Schneider, Asgari, Heydenreich & Joachimi 2022, A&A 664, A77 — §3.3–3.4."

  guinot26_cosmo_numba_precision:
    id: guinot26_cosmo_numba_precision
    claim: |
      `cosmo-numba` computes COSEBIs, whose weight functions need
      ~80-digit precision (float64 is not sufficient; at that
      precision it reproduces the original implementation exactly),
      and the Schneider et al. 2022 pure-mode correlation functions,
      which are less numerically demanding but need a fast implementation.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2603.18419"
        quote:
          exact: "We can see that classic float64 precision would not be sufficient, and with a precision of 80 our code exactly recovers the results from the original implementation."
        location:
          page: 3
      - id: ev2
        doi: "10.48550/arXiv.2603.18419"
        quote:
          exact: "Those integrals are less numerically challenging than the COSEBIs, but having a fast computation is necessary for their integration in an inference pipeline."
        location:
          page: 2
    scope: "Guinot et al. 2026, arXiv 2603.18419 — software paper by a Paper II co-author."


  hartlap07_correction:
    id: hartlap07_correction
    claim: |
      The inverse of a covariance estimated from N independent
      Gaussian samples of a length-p data vector is biased; the
      factor (N - p - 2) / (N - 1) removes the bias. An
      analytic covariance has no sampling noise and needs no
      correction.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361:20066170"
        quote:
          exact: |
            We find that the inverse of the maximum-likelihood
            estimator of the covariance is biased, the amount of
            bias depending on the ratio of the number of bins
            (data vector variables), p, to the number of data
            sets, n. This bias inevitably leads to an -- in
            extreme cases catastrophic -- underestimation of
            the size of the confidence regions.
          prefix: "Methods. We perform Monte-Carlo simulations to investigate the behaviour of estimators for the inverse covariance matrix"
          suffix: "We report on a method to remove this bias for the idealised case of Gaussian errors and statistically independent data vectors."
        location:
          page: 1
    scope: "Sample covariances of Gaussian data (Hartlap et al. 2007, Eq. 17)"

  pure_mode_decomposition_unique_on_finite_interval:
    id: pure_mode_decomposition_unique_on_finite_interval
    claim: |
      Measured ξ_±(θ) on a finite interval [θ_min, θ_max]
      decompose uniquely into pure-mode functions, ξ_+ = ξ_+^E +
      ξ_+^B + ξ_+^amb and ξ_- = ξ_-^E − ξ_-^B + ξ_-^amb. This is the
      basis of the configuration-space pure-mode null test.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202142450"
        quote:
          exact: |
            we derive explicit equations for the pure-mode
            shear correlation functions, ξ_±^E/B(θ), and their
            ambiguous components, ξ_±^amb(θ), that can be
            derived from the measured ξ_±(θ) on a finite
            angular interval, θ_min ≤ θ ≤ θ_max, such that
            ξ_±(θ) can be decomposed uniquely into pure-mode
            functions as ξ_+ = ξ_+^E + ξ_+^B + ξ_+^amb and
            ξ_- = ξ_-^E − ξ_-^B + ξ_-^amb.
          prefix: "ambiguous modes that cannot uniquely be assigned to either E- or B-mode shear. In this paper"
          suffix: "The derivation is obtained by defining a new set of Complete Orthogonal Sets of E and B mode-separating Integrals (COSEBIs)"
        location:
          page: 1
    scope: "Shear correlation functions on a finite interval (Schneider et al. 2022, A&A 664, A77)"

  repeating_additive_bias_signature:
    id: repeating_additive_bias_signature
    claim: |
      A repeating additive shear pattern fixed in instrument
      coordinates (CCD scale) produces an oscillatory COSEBI B-mode
      signature, with E- and B-mode responses that differ strongly,
      unlike PSF leakage or random PSF residuals.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "As we have seen from our repeating additive bias systematic, where the E and B mode behaviour is very different, it will be crucial to look"
          prefix: "it is not sufficient to correct data by simply subtracting the B-modes from the E-modes."
          suffix: "at both a COSEBIs and CCOSEBIs analysis and return to correct the input catalogues"
        location:
          page: 22
    scope: "KiDS-450, DES-SV and CFHTLenS B modes with COSEBIs (Asgari et al. 2019a, A&A 624, A134)"

  cosebis_complete_eb_separation:
    id: cosebis_complete_eb_separation
    claim: |
      COSEBIs give a complete E/B decomposition of ξ_±(θ) on a
      finite interval, with weight functions polynomial in θ
      (linear) or in ln θ (logarithmic). The logarithmic basis
      needs far fewer modes: on [1', 400'] it reaches the (Ω_m, σ_8)
      information limit in ≈5 modes versus ≈25 linear ones.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/200913577"
        quote:
          exact: |
            Here we aim at a complete E-/B-mode decomposition of
            the cosmic shear information contained in the ξ_± on
            a finite angular interval. We construct two sets of
            such E-/B-mode measures, namely Complete Orthogonal
            Sets of E-/B-mode Integrals (COSEBIs), characterized
            by weight functions between the ξ_± and the COSEBIs
            which are polynomials in θ or polynomials in ln θ,
            respectively.
          prefix: "several statistics have been defined before."
          suffix: "Considering the likelihood in cosmological parameter space, constructed from the COSEBIs, we study their information content."
        location:
          page: 1
      - id: ev2
        doi: "10.1051/0004-6361/200913577"
        quote:
          exact: |
            For example, for ξ_± on the interval 1' ≤ θ ≤ 400',
            the asymptotic limit for the parameter pair (Ω_m,
            σ_8) is reached for ~25 modes in the linear case,
            but already for 5 modes in the logarithmic case.
          prefix: "We show that this limit is reached the earlier (i.e., for a smaller number of modes considered) the narrower the angular range is over which ξ_± are measured, and it is reached much earlier for logarithmic weight functions."
          suffix: "The COSEBIs form a natural discrete set of quantities, which we suggest as method of choice in future cosmic shear likelihood analyses."
        location:
          page: 1
    scope: "Cosmic-shear ξ_± on a finite interval (Schneider, Eifler & Krause 2010, A&A 520, A116)"
    notes: |
      Underwrites the logarithmic basis of the
      [cosebis sub-analysis](#analyses.data_vectors.analyses.cosebis).

  hybrideb_filter_optimisation_alternative:
    id: hybrideb_filter_optimisation_alternative
    claim: |
      The HybridEB estimator separates E and B modes into Fourier
      band powers built as linear combinations of binned ξ_±(θ) on a
      finite range. Like pure-mode correlation functions and
      COSEBIs it is a linear functional of ξ_± that projects out the
      ambiguous modes, but it optimises filter compactness in ℓ
      rather than θ.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/stv3018"
        quote:
          exact: |
            We introduce new Fourier band-power estimators for
            cosmic shear data analysis and E/B-mode separation.
          prefix: "ABSTRACT"
          suffix: "We consider both the case where one performs E/B-mode separation and the case where one does not."
        location:
          page: 1
      - id: ev2
        doi: "10.1093/mnras/stv3018"
        quote:
          exact: |
            ambiguous modes which cannot uniquely be classified
            as either E- or B-modes on a finite patch of sky.
          prefix: "Project out, as vectors, the quantities F_+a and F_+b from F_+. Note that these vectors correspond to"
          suffix: "We denote the component of F_+ orthogonal to the ambiguous modes as F̃_+."
        location:
          page: 2
    scope: "Becker & Rozo 2016, MNRAS 457, 304, abstract and §2"
    notes: |
      In the Jefferson et al. 2025 reanalysis HybridEB finds B-mode
      failures in specific tomographic bins of DES-Y3 and HSC-Y3 not
      seen with the estimators originally used.

  planck18_fiducial_cosmology:
    id: planck18_fiducial_cosmology
    claim: |
      The Planck 2018 baseline ΛCDM cosmology (Ω_m = 0.315 ± 0.007,
      σ_8 = 0.811 ± 0.006, H_0 = 67.4 ± 0.5 km s⁻¹ Mpc⁻¹,
      Ω_b h² = 0.0224 ± 0.0001, n_s = 0.965 ± 0.004) is the community
      reference for late-Universe parameters.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201833910"
        quote:
          exact: |
            Assuming the base-ΛCDM cosmology, the inferred
            (model-dependent) late-Universe parameters are:
            Hubble constant H_0 = (67.4 ± 0.5) km s⁻¹ Mpc⁻¹;
            matter density parameter Ω_m = 0.315 ± 0.007; and
            matter fluctuation amplitude σ_8 = 0.811 ± 0.006.
          prefix: "These results are only weakly dependent on the cosmological model and remain stable, with somewhat increased errors, in many commonly considered extensions."
          suffix: "We find no compelling evidence for extensions to the base-ΛCDM model."
        location:
          page: 1
    scope: "Base ΛCDM (Planck Collaboration VI 2020, A&A 641, A6)"
    notes: |
      The covariance uses the Planck 2018 + BAO parameters of astropy
      `Planck18` (Ω_m = 0.30966, σ_8 = 0.8102, h = 0.6766), which sit
      within 1.7% of these central values.

  wolz25_catalog_based_pseudo_cl:
    id: wolz25_catalog_based_pseudo_cl
    claim: |
      Catalog-based pseudo-Cℓ evaluates spherical-harmonic
      transforms directly at the source positions, with an analytic
      subtraction of the discrete mask's shot noise. The estimator
      is immune to pixelization and aliasing and unbiased against
      noise uncorrelated between sources.
    created_at: "2026-04-25T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            We present a formalism to extract the angular
            power spectrum of fields sampled at a finite
            number of points with arbitrary positions -- a
            common situation for several catalog-based
            astrophysical probes -- through a simple extension
            of the standard pseudo-$C_\ell$ algorithm.
          prefix: "Abstract."
          suffix: "A key complication in this case is the need to handle the shot noise component of the associated discrete angular mask"
        location:
          page: 1
      - id: ev2
        doi: "10.1088/1475-7516/2025/01/028"
        quote:
          exact: |
            The resulting estimator is immune to small-scale
            pixelization effects and aliasing, and, more
            interestingly, unbiased against the contribution
            from measurement noise uncorrelated between
            different sources.
          prefix: "We show that this problem can be solved easily by estimating this contribution analytically and subtracting it."
          suffix: "We demonstrate the validity of the method in the context of cosmic shear datasets"
        location:
          page: 1
    scope: "Fields sampled at catalog positions (Wolz, Alonso & Nicola 2025, JCAP 01, 028)"
    notes: |
      The basis of the [harmonic_space sub-analysis](#analyses.data_vectors.analyses.harmonic_space)'s
      Cℓ^EB / Cℓ^BB bandpowers and their shot-noise correction,
      following Paper IV's implementation (spin-2 transforms via
      `ducc`, NaMaster mode-coupling decoupling).

  efstathiou04_nka_narrow_window_condition:
    id: efstathiou04_nka_narrow_window_condition
    claim: |
      The analytic pseudo-Cℓ covariance behind the narrow-kernel
      approximation assumes mask windows narrow compared with the
      scale over which C_ℓ varies; where that fails, as for a small,
      fragmented footprint at low ℓ, the covariance carries no
      accuracy guarantee.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.astro-ph/0307515"
        quote:
          exact: "derived under the assumption that the window functions are narrow compared to variations in"
        location:
          page: 18
    scope: "Deconvolved pseudo-Cℓ covariance with noise (Efstathiou 2004, MNRAS 349, 603)"
    notes: |
      The origin of the approximation NaMaster's
      `gaussian_covariance` implements.

  alonso19_unpurified_bb_variance_dominated_by_leaked_e:
    id: alonso19_unpurified_bb_variance_dominated_by_leaked_e
    claim: |
      Without map-level E/B purification, the variance of the
      pseudo-Cℓ BB estimator is dominated by the variance of
      mask-leaked E modes, making that term the dominant and most
      fragile part of an unpurified Cℓ^BB error budget at low ℓ.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "produces a sub-optimal estimator in which the variance in the"
          prefix: "removing the leakage at the power spectrum level"
          suffix: "power spectrum is dominated by the variance of the leaked"
        location:
          page: 6
      - id: ev2
        doi: "10.1093/mnras/stz093"
        quote:
          exact: "very significant gains can be obtained for the"
          prefix: "the improvement is only mild for the"
          suffix: "power spectrum, reducing uncertainties by up to a factor of"
        location:
          page: 17
    scope: "Unpurified pseudo-Cℓ (Alonso, Sanchez & Slosar 2019, MNRAS 484, 4127, §2.4, §4.4.2)"
    notes: |
      In NaMaster's CMB validation, purification cuts the large-scale
      BB uncertainties by up to ~10× with essentially no gain for EE.
      That factor is for a CMB-like mask and spectrum, not
      transferable to UNIONS; it establishes the mechanism and its
      scale dependence. The Cℓ^BB here is unpurified.

  gg19_nka_bb_covariance_unreliable:
    id: gg19_nka_bb_covariance_unreliable
    claim: |
      The narrow-kernel approximation mis-describes the pseudo-Cℓ
      covariance of any spectrum involving B modes: mask-leaked E
      modes enter the B-mode variance, and since C_ℓ^EE ≫ C_ℓ^BB
      (especially at ℓ ≲ 200), mis-modelling that leakage
      mis-estimates σ(C_ℓ^BB) directly. The authors conclude it
      cannot reliably estimate B-mode power-spectrum uncertainties.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "on the covariance matrix elements, with the analyticial prediction underestimating the error bars overall"
          prefix: "In this case we find significant differences, at the level of"
          suffix: "This is expected and can be understood as follows: the presence of a sky mask mixes"
        location:
          page: 17
      - id: ev2
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "the leaked modes contribute to the variance. This is particularly significant for power spectra involving"
          prefix: "Although this mixing can be accounted for at the level of the power spectrum through the pseudo-"
          suffix: "modes, since the"
        location:
          page: 17
      - id: ev3
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "modes differs significantly from the true sample covariance, and, therefore, this approach cannot be used to reliably estimate the uncertainties of"
          prefix: "Due to the imperfect treatment of the"
          suffix: "-mode power spectra."
        location:
          page: 25
    scope: "Standard NKA on an LSST-like footprint (García-García, Alonso & Bellini 2019, JCAP 11, 043, §4.2, §5)"
    notes: |
      On 20,000 Gaussian simulations with uncoupled input spectra
      and no purification, the standard NKA errs by 30–50% on BB
      covariance elements, underpredicting the uncertainties. That
      sign is specific to the configuration; the improved NKA the
      UNIONS Cℓ^BB covariance uses flips the dominant residual (see
      [nicola21_inka_lowest_bandpower_overestimate](#prior_insights.nicola21_inka_lowest_bandpower_overestimate)).

  gg19_nka_inaccurate_at_largest_scales:
    id: gg19_nka_inaccurate_at_largest_scales
    claim: |
      The NKA pseudo-Cℓ covariance is also inaccurate on the
      largest scales (ℓ ≲ 50), where the recommended remedy is fast
      low-resolution Gaussian simulations or the exact O(ℓ_max^6)
      calculation.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "we find that the NKA estimator yields inaccurate estimates of the power spectrum uncertainties on the largest scales"
          prefix: "-mode power spectra. Likewise,"
          suffix: "Although these modes carry a substantially smaller statistical weight"
        location:
          page: 25
      - id: ev2
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "they can be easily computed making use of fast low-resolution simulations or exactly following Refs."
          prefix: "if more accurate covariances are needed on these large scales,"
        location:
          page: 23
      - id: ev3
        doi: "10.1088/1475-7516/2019/11/043"
        quote:
          exact: "a more sophisticated approach would be needed in order to obtain a precise estimate of the uncertainties for components involving"
          prefix: "with high accuracy,"
          suffix: "-modes. This is not a major concern, since"
        location:
          page: 18
    scope: "LSST-like mask (García-García, Alonso & Bellini 2019, JCAP 11, 043, §4.2, §5)"
    notes: |
      The ℓ ≲ 50 threshold is for their mask, with no scaling given
      for f_sky or mask complexity; for UNIONS it transfers only as
      the expectation of a low-ℓ failure, not as a number.

  nicola21_inka_lowest_bandpower_overestimate:
    id: nicola21_inka_lowest_bandpower_overestimate
    claim: |
      The improved NKA (iNKA), which uses mode-coupled input
      spectra as NaMaster's `gaussian_covariance` does, still
      overestimates the analytic uncertainties at the lowest
      bandpower and is least accurate for spectra built from E/B
      mixing, because the spin-2 NKA neglects derivatives of the
      weight map. The authors expect the NKA to break down for
      complicated weight maps and recommend fast low-resolution
      Gaussian simulations at large scales.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2010.09717"
        quote:
          exact: "we find that the analytical uncertainties are always overestimated for the lowest bandpower"
          prefix: "improves the agreement with the simulated covariance on large, signal-dominated scales. Nevertheless,"
        location:
          page: 21
      - id: ev2
        doi: "10.48550/arXiv.2010.09717"
        quote:
          exact: "This is due to the specific form of the NKA for spin-2 fields, which neglects the spatial derivatives of the weight map"
          prefix: "we find the largest differences between analytic and simulated covariance for the case of the"
        location:
          page: 21
      - id: ev3
        doi: "10.48550/arXiv.2010.09717"
        quote:
          exact: "the standard NKA over-estimates the signal contribution to the covariance by more than a factor of 2"
          suffix: "The improved NKA on the other hand recovers the power spectrum uncertainties obtained from the simulations to within"
        location:
          page: 23
      - id: ev4
        doi: "10.48550/arXiv.2010.09717"
        quote:
          exact: "The NKA is likely to break down for sufficiently complicated weight maps where the coupling coefficients"
        location:
          page: 12
      - id: ev5
        doi: "10.48550/arXiv.2010.09717"
        quote:
          exact: "these problems could potentially be overcome by using fast, low-resolution Gaussian simulations to estimate covariances at large angular scales, while using analytic estimates in the small-scale regime"
          prefix: "As the inaccuracies shown in Figures"
        location:
          page: 22
    scope: "HSC and DES Y1 footprints (Nicola et al. 2021, JCAP 03, 067, §2.3.3, §4.2.2)"
    notes: |
      iNKA recovers the signal covariance to ~10% where the standard
      NKA overestimates it by more than 2× (noiseless HSC-like
      simulations). The lowest-bandpower overestimate is reported
      for DES, not HSC. The E/B problem is quantified through the EB
      spectrum, judged "sufficiently accurate to use EB correlations
      as a null test"; the paper does not quantify σ(C_ℓ^BB)
      accuracy for a small or fragmented footprint or predict the
      size of a low-ℓ BB overestimate.

  namaster26_catalog_inka_bb_low_ell_limit:
    id: namaster26_catalog_inka_bb_low_ell_limit
    claim: |
      For catalogue-based pseudo-Cℓ, the estimator family of the
      UNIONS Cℓ, the analytic iNKA covariance matches 1000
      simulations on all scales for E modes but only for ℓ ≳ 10
      for B modes, the kind of low-ℓ B-mode failure the UNIONS mocks
      show below ℓ ≈ 100. The authors note the NKA may hold less well
      for sparse masks.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2607.14843"
        quote:
          exact: "We find that the analytical covariance accurately describes the sample covariance on all scales for"
          suffix: "-modes and on scales"
        location:
          page: 13
      - id: ev2
        doi: "10.48550/arXiv.2607.14843"
        quote:
          exact: "The Narrow Kernel Approximation, which may hold less well for very sparse masks"
        location:
          page: 10
    scope: "DES-Y3-like 4000 deg² footprint (Alonso et al. 2026, arXiv 2607.14843, §4.1–4.2)"
    notes: |
      DES Y3 bin 3, ~2.5e7 sources (f_sky ≈ 0.1), Gaussian shear
      with and without shape noise, bandpowers to ℓ_max = 10,000.
      The paper does not say how the ℓ ≳ 10 floor moves with f_sky
      or fragmentation, nor the sign or size of the BB covariance
      error below it.


  stebbins96_scalar_perturbations_give_no_bmodes:
    id: stebbins96_scalar_perturbations_give_no_bmodes
    claim: |
      In the weak-lensing limit, scalar (density) perturbations
      produce only scalar (E-mode) shear; vector and tensor
      perturbations could source pseudo-scalar (B-mode) shear but
      are expected to be very small, so no significant B-mode shear
      is expected from lensing. This is the premise of testing the
      measured B modes against zero.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.astro-ph/9609149"
        quote:
          exact: "Nevertheless it is true that 3-d scalar perturbations will only produce 2-d scalar shear, at least in the weak lensing limit."
        location:
          page: 3
      - id: ev2
        doi: "10.48550/arXiv.astro-ph/9609149"
        quote:
          exact: "Thus we really do not expect there to be any significant pseudo-scalar shear."
        location:
          page: 3
    scope: "Weak-lensing limit (Stebbins 1996, astro-ph/9609149, §2)"

  higher_order_lensing_bmodes_negligible:
    id: higher_order_lensing_bmodes_negligible
    claim: |
      Lensing B modes beyond first order (Born corrections,
      lens–lens coupling, source-redshift clustering) are at least
      two orders of magnitude below the E-mode power, and the
      clustering term is very small above a few arcminutes. At the
      scales tested here a detected B mode points to systematics, so
      the null model C^BB = 0 needs no theory template.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.astro-ph/0202411"
        quote:
          exact: "We show all these corrections are at least two orders of magnitude below the convergence or E-mode power and hence relevant only to future ultra high precision measurements."
        location:
          page: 1
      - id: ev2
        doi: "10.48550/arXiv.astro-ph/0202411"
        quote:
          exact: "validate the use of current large scale structure weak lensing predictions for cosmological studies and future use of B-modes as a monitor of systematic effects."
        location:
          page: 1
      - id: ev3
        doi: "10.48550/arXiv.astro-ph/0112441"
        quote:
          exact: "the resulting B-mode is very small on angular scales larger than a few arcminutes, but its relative contribution rises quickly towards smaller angular scales"
        location:
          page: 1
    scope: "Lensing-induced B modes (Cooray & Hu 2002; Schneider, van Waerbeke & Mellier 2002)"
    notes: |
      Intrinsic alignments (Crittenden et al. 2002) are a further
      B-mode source not bounded by these papers.

  asgari19a_bmode_subtraction_insufficient:
    id: asgari19a_bmode_subtraction_insufficient
    claim: |
      Different systematics contaminate E and B modes by different
      amounts: most produce a significant E-mode contamination on the
      same scales as their B modes, but a repeating additive pattern
      does not. Correcting the data by subtracting the B modes from
      the E modes is therefore not sufficient; the B-mode amplitude
      alone does not determine the E-mode contamination.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "For this reason we have shown that it is not sufficient to correct data by simply subtracting the B-modes from the E-modes."
          prefix: "In contrast the COSEBIs B-modes detect systematics that can affect E and B-modes differently."
        location:
          page: 22
      - id: ev2
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "Comparing the right and left panels we see that all systematics affect both E and B-modes, but not equally."
        location:
          page: 16
      - id: ev3
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "The repeating additive pattern forms a clear exception to this rule though."
          prefix: "In general a significant B-mode signal translates to a significant contamination to the E-modes on the same scales."
        location:
          page: 16
    scope: "Mock systematics on COSEBIs (Asgari et al. 2019a, A&A 624, A134, §5.2)"

  asgari19a_bmode_verdict_depends_on_statistic:
    id: asgari19a_bmode_verdict_depends_on_statistic
    claim: |
      A shear catalogue can formally pass one B-mode statistic and
      fail another computed from the same data, because each weights
      the B modes differently (KiDS-450 passes COSEBIs but shows a
      2.7σ B mode in compressed COSEBIs). The recommendation is to
      require every statistic to be consistent with zero, which is
      the logic behind taking the minimum PTE over all six B-mode
      statistics as the test statistic.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "Here the COSEBIs B-modes that are insignificant overall are weighted in such a way that the resulting CCOSEBIs signal becomes significant."
        location:
          page: 22
      - id: ev2
        doi: "10.1051/0004-6361/201834379"
        quote:
          exact: "We therefore recommend measuring both CCOSEBIs and COSEBIs B-modes in future analyses, ensuring that both are consistent with zero."
        location:
          page: 22
    scope: "COSEBIs vs compressed COSEBIs (Asgari et al. 2019a, Conclusions)"
    notes: |
      Paper II extends the recommendation to pure-mode ξ_±, COSEBIs
      and Cℓ^BB.

  jefferson25_estimators_disagree_on_same_data:
    id: jefferson25_estimators_disagree_on_same_data
    claim: |
      In a uniform reanalysis of KiDS-1000, DES-Y3 and HSC-Y3, the
      same tomographic bins can pass a pseudo-Cℓ B-mode test and fail
      the HybridEB one: the B-mode verdict depends on the estimator,
      so passing a single null test does not validate a catalogue.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.33232/001c.144668"
        quote:
          exact: "also reveals that it is possible for one of the estimators to pass while the other fails."
        location:
          page: 18
      - id: ev2
        doi: "10.33232/001c.144668"
        quote:
          exact: "the signal may be significantly different when estimated with the"
        location:
          page: 21
    scope: "Stage-III reanalysis (Jefferson et al. 2025, OJAp, §5)"

  guerrini25_psf_errors_contaminate_xi:
    id: guerrini25_psf_errors_contaminate_xi
    claim: |
      PSF-model errors add systematics to the shear two-point
      correlation function; galaxy–PSF (τ) and PSF–PSF (ρ)
      correlations with a semi-analytic covariance quantify that
      leakage on UNIONS data, and frame the assessment of the
      catalogs' PSF-leakage correction.
    created_at: "2026-10-31T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.1051/0004-6361/202453512"
        quote:
          exact: "The latter can be a source of systematics that affect the shear two-point correlation function."
          prefix: "precise measurements of galaxy shapes and therefore an accurate knowledge of the PSF model."
        location:
          page: 1
      - id: ev2
        doi: "10.1051/0004-6361/202453512"
        quote:
          exact: "They provide fast and accurate diagnostics on PSF systematics that are crucial to understand in the context of cosmic shear studies."
        location:
          page: 1
    scope: "PSF systematics in UNIONS (Guerrini et al. 2025, A&A)"
    notes: |
      The correction itself is Paper I's; Guerrini et al. supply the
      diagnostic.

