  namaster26_catalog_inka_bb_low_ell_limit:
    id: namaster26_catalog_inka_bb_low_ell_limit
    claim: |
      In NaMaster's own validation of the catalogue-based iNKA
      Gaussian covariance — the estimator family Paper II's
      Cℓ measurement belongs to — the analytic covariance
      matches the sample covariance of 1000 simulations on all
      scales for E modes, but only for ℓ ≳ 10 for B modes, on a
      DES-Y3-like 4000 deg² footprint. The asymmetry between
      the E-mode and B-mode verdicts, and the restriction of the
      B-mode failure to low ℓ, are exactly the pattern the
      UNIONS mocks exhibit; the authors also flag that the NKA
      may hold less well for sparse masks.
    created_at: "2026-09-13T00:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2607.14843"
        quote:
          exact: "We find that the analytical covariance accurately describes the sample covariance on all scales for"
          suffix: "-modes and on scales"
        location:
