id: submitted
description: |
  The selection the paper was submitted to A&A with (arXiv 2604.03227;
  v1 and v2 report the same null-test results): adaptive-quadrature pointwise pure
  E/B modes with a Monte Carlo covariance and the nominal 0.05 PTE
  threshold. The accepted paper is `baseline`. Both universes use
  the v1.4.6.3_v2 mocks, so the mock-based outputs here are the
  submitted choices on that suite rather than the submitted paper's
  v1.4.6 mocks.

  Its pure-mode fiducial window is the declared 12'–83' (seven reporting
  bins). The submitted paper's printed fiducial pure-mode PTEs read an
  eighth bin, 9.1'–83' (ξ_tot^B 0.18 there, 0.16 here); its full-range
  PTEs are the same.

decisions:
  fiducial_catalog: size_cut
  leakage_correction: applied
  fiducial_blind: blind_a
  fiducial_scale_cuts: adopted
  # Edges 9 and 16 of geomspace(1', 250', 21), which the text prints rounded.
  scale_cut_convention: grid_bin_edges
  scale_cut_pair_grid: production_grid
  # Each statistic tested against the nominal 0.05. The threshold sets the PTE
  # heatmap colour scale and the quoted threshold value.
  pte_threshold: nominal_0p05
  integration_grid: bins_1000
  # cosmo_numba's get_pure_EB_modes, integrated with QUADPACK dqags.
  pure_eb_integration_method: adaptive_dqags
  # The pointwise chain evaluates the transform at the 20 reporting bin centres,
  # so nothing is rebinned; the only selection consistent with adaptive_dqags.
  pure_eb_rebinning_weights: none
  # The transform limits [1', 250'].
  pure_eb_integration_limits: reporting_extent
  # 2000 draws, with the Hartlap factor on the inverse at χ² time.
  pure_eb_covariance_method: monte_carlo
  harmonic_validation_binning: bins_96
  mc_samples: n_2000
  pte_definition: chi2_tail
  fiducial_cosmology: planck18
  bandpower_binning: bandpowers_32_powspace
  noise_bias_correction: analytic_shot_noise
  pte_blind_strategy: blind_a_for_paper
  reporting_binning: bins_20
  decomposition_method: schneider22_integral_transform
  mode_count: n_max_20

analyses:
  covariances:
    universe: submitted
  data_vectors:
    universe: submitted
  validation:
    universe: submitted
  null_tests:
    universe: submitted
