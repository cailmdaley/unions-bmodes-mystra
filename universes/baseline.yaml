id: baseline
description: |
  The selection the accepted paper (A&A, 2026) was computed with:
  the exactly linear fixed-quadrature Schneider-2022 operator in the
  single-grid transform-averaged geometry (fine-grid evaluation,
  `[θ_min, θ_max]` at the fine-grid extent), with the
  pair-count-weighted mean from the 1000 fine nodes into the 20
  reporting bins, the exact linear covariance, and the mock-calibrated
  threshold on the minimum PTE. The selection it revises is the
  `submitted` universe, which differs in quadrature, geometry,
  covariance and threshold together.

decisions:
  fiducial_catalog: size_cut
  leakage_correction: applied
  fiducial_blind: blind_a
  fiducial_scale_cuts: adopted
  scale_cut_convention: grid_bin_edges
  scale_cut_pair_grid: production_grid
  pte_threshold: calibrated_0p01
  integration_grid: bins_1000
  # The operator and its geometry are described on the root decision's option.
  pure_eb_integration_method: fixed_operator
  # Pair-count weighting: the averaged local term is the reporting-bin ξ.
  pure_eb_rebinning_weights: npairs
  # Wide [grid floor, 300'] window: retain support below the 1' reporting floor.
  pure_eb_integration_limits: fine_grid_extent
  # Exact M C_ξ Mᵀ of the linear operator; no Hartlap factor.
  pure_eb_covariance_method: exact_linear
  harmonic_validation_binning: bins_96
  mc_samples: n_2000
  pte_definition: chi2_tail
  fiducial_cosmology: planck18
  bandpower_binning: bandpowers_32_powspace
  noise_bias_correction: analytic_shot_noise
  pte_blind_strategy: blind_a_for_paper
  reporting_binning: bins_20
  decomposition_method: schneider22_integral_transform
  mode_count: n_max_20
  reference_covariance: mockmatched
  mock_suite: v1_4_6_3_v2
  bb_blind_check_version: size_cut_v1463

analyses:
  covariances:
    universe: baseline
  data_vectors:
    universe: baseline
  validation:
    universe: baseline
  null_tests:
    universe: baseline
